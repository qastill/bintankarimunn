5.4,"c":[[1.0739,103.9786],[1.0728,103.9758],[1.0715,103.9723],[1.0709,103.9709],[1.07,103.9686],[1.0691,103.9663],[1.0678,103.9631],[1.0668,103.9605],[1.0655,103.9572],[1.0648,103.9554],[1.0632,103.9528],[1.0617,103.9503],[1.0603,103.9481],[1.0593,103.9466],[1.059,103.9437],[1.0588,103.942],[1.0586,103.94],[1.0583,103.9373],[1.0582,103.9356],[1.0577,103.9331]]}], QA=[{"c":"U","conf":"V","loc":"bin","q":"Siapa sebenarnya yang memasok listrik di Bintan dan Karimun, dan apa bedanya dengan Batam?","a":"Ada tiga lapis. (1) Bintan (Kota Tanjungpinang + Kab. Bintan) dan Karimun Zona 3 dilayani PLN (Persero) lewat UID Riau & Kepri, UP3 Tanjungpinang. RUPTL 2025–2034 menyebut wilayah usaha PLN di Sumatera mencakup \"Kepulauan Riau kecuali pulau Batam\". (2) Batam dilayani PT PLN Batam, anak usaha dengan RUPTL dan tarif sendiri. (3) Kawasan tertentu punya wilayah usaha atau captive sendiri: Karimun Zona 1 (PT Soma Daya Utama) dan Zona 2 (PT Karimun Power Plant), KEK Galang Batang (captive PLTU), serta Lagoi/Lobam. Secara fisik, jaringan Bintan tersambung 150 kV ke Batam dan dioperasikan sebagai satu sistem Batam–Bintan.","f":["RUPTL 2025–2034 Bab I: wilayah usaha Sumatera = termasuk Kepri kecuali Pulau Batam, dilayani UID Riau dan Kepri","Karimun punya 3 zona: Zona 1 SDU, Zona 2 KPP, Zona 3 PLN (detik, 2019)","PLN Batam melaporkan beban \"Batam–Bintan\" sebagai satu sistem (~780 MW, Okt 2026)"],"src":"RUPTL 2025–2034 Bab I; detik Finance 2019; PLN Batam/InfoPublik Okt 2026","isl":"U"},{"c":"U","conf":"V","loc":"karint","q":"Apakah Karimun sudah tersambung ke jaringan listrik yang lebih besar?","a":"Belum. Sistem Tanjung Balai Karimun (TBK) masih isolated, ±40 MW kapasitas eksisting (RUPTL Lampiran E), dari PLTU TBK di Tanjung Sebatak 2×7 MW dan PLTD Bukit Carok. RUPTL merencanakan interkoneksi 150 kV Sumatera → Selat Panjang → Pulau Rangsang → TBK (SKLT 6 kms + SUTT 120 kms + SKLT 70 kms + 14 kms ke GI TBK), dengan GI TBK 150/20 kV baru 2×30 MVA COD 2026 berstatus Committed dan extension 1×60 MVA pada 2032. Namun Bab V.11.2 menyebut segmen Selat Panjang–TBK \"masih tahap perencanaan\" dan Lampiran E menulis 2028. Asumsi wajar: 2027–2028.","f":["GI TBK 2×30 MVA, COD 2026 (Committed) di tabel transmisi","V.11.2: \"masih tahap perencanaan\"; Lampiran E: 2028","Total ±210 kms termasuk ±76 km kabel laut"],"src":"RUPTL 2025–2034 Lampiran A4, V.11.2, Lampiran E","isl":"K"},{"c":"U","conf":"V","loc":"bin","q":"Apa saja subsistem kelistrikan utama di Kepulauan Riau yang perlu diperhatikan?","a":"Pertama, sistem Batam–Bintan: interkoneksi 150 kV, dioperasikan PLN Batam, ±780 MW puncak. Kedua, sistem Tanjung Balai Karimun: isolated ±40 MW, menunggu kabel dari Sumatera. Ketiga, sistem kecil tersebar: Kundur/Tanjung Batu, Dabo/Lingga, Natuna, Anambas, dan ratusan PLTD pulau. Satu catatan penting: semua tabel provinsi RUPTL berlabel \"Kepulauan Riau tanpa Batam\" dan tidak memecah angka per sistem Bintan vs Karimun. Angka Kepri tanpa Batam (144,0 MW terpasang, 109,8 MW DMN, 293 unit, 284 di antaranya PLTD PLN) sudah termasuk Karimun, Natuna, Lingga, dan lainnya.","f":["RUPTL Tabel A4.3: 144,0 MW terpasang / 109,8 MW DMN","284 unit PLTD PLN = 122,8 MW terpasang","UP3 Tanjungpinang mengelola >100 pembangkit kecil"],"src":"RUPTL Tabel A4.3; Ombudsman Kepri Jan 2026","isl":"U"},{"c":"U","conf":"V","loc":null,"q":"Dokumen perencanaan apa yang mengatur penambahan kapasitas di Bintan dan Karimun?","a":"RUPTL PT PLN (Persero) 2025–2034 (Kepmen ESDM, 26 Mei 2025), Lampiran A4 Provinsi Kepulauan Riau. Batam punya dokumen terpisah: RUPTL PT PLN Batam 2023–2032. Karena Bintan tersambung ke Batam, sebagian besar solusi pasokan Bintan justru ada di RUPTL PLN Batam (PLTGU/PLTMG di Batam). RUPTL juga wajib dilaporkan progresnya ke Menteri ESDM setiap triwulan.","f":["RUPTL 2025–2034 disahkan Kepmen ESDM 26 Mei 2025","Diktum KELIMA: laporan progres tiap 3 bulan (Apr, Jul, Okt, Jan)","RUPTL PLN Batam 2023–2032 disahkan Mei 2023"],"src":"RUPTL 2025–2034 (Kepmen); ESDM Mei 2023","isl":"U"},{"c":"U","conf":"V","loc":null,"q":"Apa angka-angka utama nasional dalam RUPTL 2025–2034?","a":"Pertumbuhan kebutuhan rata-rata 5,3%/tahun. Tambahan pembangkit 69.512 MW: EBT 42.569 MW, storage 10.256 MW, fosil 16.687 MW. Target bauran EBT 34,3% pada akhir 2034. Transmisi 47.758 kms, GI 107.950 MVA, distribusi 197.998 kms, gardu distribusi 18.407 MVA. Ini angka nasional. Porsi Kepri harus dibaca di Lampiran A4.","f":["Angka dari Diktum KEDUA Kepmen RUPTL 2025–2034"],"src":"RUPTL 2025–2034, Diktum KEDUA","isl":"U"},{"c":"U","conf":"V","loc":null,"q":"Seberapa tinggi rasio elektrifikasi Kepulauan Riau, dan seberapa besar jaringan distribusinya?","a":"Rasio elektrifikasi Kepri 99,99% (RE PLN 99,49%), dengan target RE PLN 100% pada 2027. Aset distribusi Kepri tanpa Batam (realisasi s.d. Okt 2024, RUPTL A4.5 & A4.22): JTM 2.702 kms, JTR 2.343 kms, gardu distribusi 355 MVA. Tambahan per tahun sangat kecil: ±24–26 kms JTM, ±26–28 kms JTR, 4 MVA gardu, ±6 ribu pelanggan baru. Akses sudah tuntas. Masalahnya keandalan dan biaya pasokan.","f":["A4.5 & A4.22"],"src":"RUPTL Tabel A4.5, A4.22","isl":"B"},{"c":"U","conf":"V","loc":"kar","q":"Mengapa Karimun memiliki tiga wilayah usaha listrik yang terpisah?","a":"Berdasarkan regulasi wilayah usaha dan rekomendasi Pemda, Karimun dibagi tiga: Zona 1 (PT Soma Daya Utama), Zona 2 (PT Karimun Power Plant, izin 2015, ±7.326 ha ≈75% pulau), Zona 3 (PLN). Tujuannya menarik investasi kawasan industri FTZ. Konsekuensinya fragmentasi: tiga operator kecil, tidak ada economy of scale, dan PLN tidak bisa melayani wilayah usaha pihak lain. Ini salah satu akar masalah keandalan Karimun.","f":["KPP: izin wilayah usaha Zona II 2015, 7.326 ha","SDU merencanakan PLTU 2×25 MW (2019)","PLN tidak dapat masuk wilayah usaha industri pihak lain (detik 2019)"],"src":"detik Finance 2019; Kontan 2015","isl":"K"},{"c":"U","conf":"E","loc":null,"q":"Dalam satu menit, bagaimana penilaian Anda tentang kondisi kelistrikan Bintan dan Karimun?","a":"Bintan cukup daya secara sistem (Batam–Bintan ±930 MW pasok vs ±780 MW puncak), tetapi rapuh secara topologi. Sekitar dua per tiga beban Bintan dipasok lewat satu koridor 150 kV dari Batam, dan pembangkit lokal hanya 30–35 MW. Blackout 12 Okt 2026 membuktikannya: gangguan satu GI di Batam memadamkan Bintan 15–16 jam. Karimun sebaliknya: tidak ada masalah topologi, tetapi kekurangan kapasitas firm. Cadangan ±4,5 MW lebih kecil dari unit terbesar 7 MW, sehingga satu trip saja memicu padam, sampai kabel 150 kV dari Sumatera (RUPTL: GI TBK 2026, realistis 2027–28) masuk. Pertumbuhan industri dan data center menjadi beban tambahan di atas sistem yang sudah tipis.","f":["Bintan: beban est. ±105 MW (resmi terakhir 65,1 MW, 2016); lokal ±30–35 MW","Karimun: ±40 MW sistem TBK; cadangan ±4,5 MW (Nov 2026)","Blackout 12 Okt 2026: 15–16 jam, >411 ribu pelanggan"],"src":"PLN Batam; ESDM Kepri Okt 2026; Tribun Batam Nov 2026","isl":"U"},{"c":"K","conf":"V","loc":"kar","q":"Berapa kapasitas terpasang, daya mampu, dan beban puncak Karimun saat ini?","a":"Data publik terakhir (17 Nov 2026): daya mampu 40,6 MW vs beban puncak 36,1 MW, cadangan 4,5 MW (≈12%). Sepanjang 2026 angkanya naik-turun mengikuti status PLTU: Mei 2026 32 MW vs 34,5 MW (defisit), Okt 2026 42,6 MW vs ±33 MW, awal Nov 2026 36,7 MW saat PLTU dipelihara. Kapasitas terpasang lebih besar dari daya mampu karena mesin PLTD tua derating.","f":["17 Nov 2026: 40,6 / 36,1 MW","Mei 2026: 32 / 34,5 MW","2019: 35 / 28,2 MW — beban tumbuh ±3,6%/thn"],"src":"Tribun Batam 17 Nov 2026; Kepri Headline Mei 2026; detik 2019","isl":"K"},{"c":"K","conf":"V","loc":"kar","q":"Apakah Karimun memenuhi kriteria cadangan daya PLN sendiri?","a":"Tidak. RUPTL 2025–2034 (II.2.2) menetapkan sistem isolated direncanakan secara deterministik dengan kriteria maksimal N-2: cadangan harus lebih besar dari unit terbesar pertama dan kedua, dengan reserve margin minimal 35%. Untuk beban 36,1 MW dan unit terbesar 7 MW: N-2 butuh daya mampu ≥ 36,1 + 7 + 7 = 50,1 MW, dan RM 35% butuh ≥ 48,7 MW. Daya mampu 40,6 MW berarti kurang ±8–10 MW. Bahkan N-1 (≥ 43,1 MW) pun belum terpenuhi.","f":["RUPTL II.2.2: \"kriteria maksimal N-2 … reserve margin … minimal 35%\"","Cadangan aktual 4,5 MW < unit terbesar 7 MW","Gap N-1: 2,5 MW; gap RM35%: 8,1 MW; gap N-2: 9,5 MW"],"src":"RUPTL 2025–2034 Bab II.2.2; perhitungan penyusun","isl":"K"},{"c":"K","conf":"V","loc":"bin","q":"Pembangkit apa saja yang secara fisik berada di Pulau Bintan?","a":"Untuk grid PLN hanya tersisa sedikit: PLTD Air Raja dan Suka Berenang (UP3 Tanjungpinang), serta PLTMG 9 MW Kuala Lobam berbahan CNG yang dikirim dari Panaran (Batam). ESDM Kepri (Okt 2026) menyebut kapasitas lokal ±30–35 MW dan mengusulkan pembangkit baru di Bintan. Di luar PLN ada PLTU captive Galang Batang (±180–200 MW, khusus KEK alumina) dan utilitas kawasan Lagoi/Lobam. Jadi kapasitas besar ada di pulau, tetapi tidak tersedia untuk grid umum dan tidak bisa membantu islanding saat Batam gangguan.","f":["PLTMG Kuala Lobam 9 MW, CNG dari Panaran","Jan 2023: cadangan hanya 12 MW dari PLTD Air Raja"],"src":"Briefing RUPTL/ESDM 2018; IQPlus Okt 2026; Jawapos 2023","isl":"B"},{"c":"K","conf":"E","loc":"bin","q":"Berapa beban puncak Bintan dan seberapa besar bagiannya yang bergantung pada Batam?","a":"Angka resmi terakhir yang publik: beban puncak Bintan 65,1 MW (2016), saat interkoneksi menyalurkan 20 lalu ±34 MW. RUPTL 2025–2034 tidak memecah beban Bintan. Dari prinsip dasar: 65,1 MW × pertumbuhan 5%/tahun selama 10 tahun ≈ 106 MW, konsisten dengan estimasi publik ±100–110 MW. Pembangkit lokal tersisa kecil (PLTD Air Raja/Suka Berenang, PLTMG 9 MW Kuala Lobam berbahan CNG dari Panaran; ESDM Kepri menyebut ±30–35 MW), sehingga dua per tiga atau lebih beban Bintan datang dari Batam.","f":["Setkab 2016: beban Bintan 65,1 MW","Ekstrapolasi 5%/thn → ±106 MW (2026)"],"src":"Setkab 2016; ESDM Kepri Okt 2026; estimasi penyusun","isl":"B"},{"c":"K","conf":"V","loc":"batam","q":"Bagaimana neraca daya sistem interkoneksi Batam–Bintan?","a":"Tiga titik data. Des 2025 (siaga Nataru, Ombudsman): daya mampu 844,2 MW, cadangan 79,2 MW, prediksi puncak 755 MW. Okt 2026 (PLN Batam): daya pasok ±930 MW vs puncak ±780 MW, cadangan ±19%, pertumbuhan beban >15%/tahun. Studi UI (Purba & Garniwa, IJECBE 2025): 871 MW kapasitas vs 675 MW beban puncak. Target PLN Batam: daya pasok 1.200–1.300 MW pada akhir 2027. Cadangan nominal hampir 20%, tetapi blackout Okt 2026 menunjukkan cadangan MW tidak sama dengan keamanan sistem; proteksi dan topologi juga menentukan.","f":["Des 2025: 844,2 MW / cadangan 79,2 MW","Okt 2026: 930 / 780 MW","UI 2025: 871 / 675 MW"],"src":"Ombudsman Kepri Des 2025; InfoPublik Okt 2026; IJECBE 2025","isl":"B"},{"c":"K","conf":"V","loc":"batam","q":"Seperti apa bauran pembangkit yang memasok Bintan melalui Batam?","a":"Didominasi gas: PLTGU Panaran (±164 MW, Mitra Energi Batam), PLTGU Tanjung Uncang (Medco, total 109 MW setelah add-on 39 MW COD 8 Nov 2025), PLTG Batamindo (±114 MW), PLTMG Baloi, PLTMG Maxpower Sagulung 60 MW + Sekupang 40 MW (COD 6 Mar 2026), plus batubara PLTU Tanjung Kasam (±130 MW, TJK Power), yang juga titik awal koridor ke Bintan. EBT hampir nol: pasokan Batam praktis 100% fosil.","f":["Mongabay 2024: pasokan Batam seluruhnya fosil","Tanjung Kasam = ujung Batam dari koridor kabel ke Bintan"],"src":"OSM/peta-kelistrikan; Medco; Petromindo; Mongabay Des 2024","isl":"B"},{"c":"K","conf":"V","loc":null,"q":"Bagaimana PLN mendefinisikan reserve margin, dan berapa yang dianggap optimal?","a":"RUPTL mendefinisikan RM sebagai cadangan daya pembangkit terhadap beban puncak (kapasitas/beban − 1). Untuk sistem besar dipakai metode probabilistik (LOLP). Kajian PLN menyebut RM optimal sekitar 33–38% untuk Jawa–Bali, dan benchmark negara lain 15–40%. Untuk sistem isolated dipakai deterministik N-2 dengan RM minimal 35%. Pembangkit EBT intermiten tidak dihitung dalam cadangan kecuali memberi firm capacity (capacity credit).","f":["RUPTL Bab II: RM optimal ±33–38%","Benchmark internasional 15–40%","EBT intermiten tidak dihitung ke reserve tanpa capacity credit"],"src":"RUPTL 2025–2034 Bab II.2","isl":"U"},{"c":"K","conf":"E","loc":"kar","q":"Berapa kapasitas firm yang dibutuhkan Karimun hingga 2030?","a":"Tergantung kabel Sumatera. Tanpa kabel: beban ±44 MW (2030) × kriteria isolated RUPTL (RM ≥35% / N-2) ≈ ±59–60 MW daya mampu, artinya tambahan ±18–20 MW firm. Dengan kabel 150 kV (GI TBK 2×30 MVA) masuk 2027–28: Karimun tidak lagi isolated, dan kebutuhan lokal berubah menjadi backup N-1 untuk kabel tunggal itu, yaitu pembangkit lokal ± beban prioritas (±25–30 MW), yang kurang lebih sudah ada. Implikasinya: sampai kabel masuk, Karimun butuh jembatan 2–3 tahun (sewa + BESS). Setelah itu, aset lokal menjadi cadangan.","f":["Kabel TBK juga tunggal → N-1 baru terpenuhi dengan backup lokal"],"src":"RUPTL II.2.2 & A4; estimasi penyusun","isl":"K"},{"c":"K","conf":"V","loc":"kar","q":"Apa yang terjadi pada pasokan listrik Karimun sepanjang 2026?","a":"Kronologi 2026: 26 Mar–13 Apr pemeliharaan PLTU unit 1 (18 hari) dengan padam bergilir. 2–4 Mei PLTU unit 2 gangguan, 32 vs 34,5 MW. 20 Jul unit 2 rusak (traveling grate), kembali 24 Jul (daya mampu 32 MW), padam saat beban puncak 17.30–22.00. Jun–Agt penambahan PLTD 6 MW Bukit Carok dan kontrak genset 7 MW (PEB × PLN Nusa Daya, 15 Jun). Okt blackout total akibat under-frequency. Nov daya mampu kembali 40,6 MW.","f":["Pola sama terjadi 2022 (padam ±25 hari) dan Feb 2025 (defisit 2–3 MW)"],"src":"Warta Kepri; Kepri Headline; Ulasan; Tribun Batam 2026","isl":"K"},{"c":"K","conf":"V","loc":"kar","q":"Mengapa PLTU 2×7 MW menjadi masalah bagi sistem 36 MW?","a":"Dari sisi prinsip dasar: unit terbesar 7 MW = ±19% beban puncak. Ketika satu unit trip, sistem kehilangan hampir seperlima daya sekaligus. Inersia sistem kecil rendah sehingga frekuensi jatuh cepat, under-frequency relay bekerja, dan bisa berujung blackout total (terjadi Okt 2026). PLTU kecil berbahan batubara low-rank juga punya availability rendah (masalah traveling grate, boiler) dan ramp lambat. Untuk sistem 36 MW, ukuran unit ideal ±3–5 MW modular (PLTMG/PLTD) plus BESS grid-forming untuk respons frekuensi.","f":["UFR blackout Okt 2026","Unit 2 gangguan berulang 2022, 2025, Mei & Jul 2026"],"src":"Analisis penyusun; laporan gangguan 2026","isl":"U"},{"c":"K","conf":"E","loc":"bin","q":"Seperti apa pasokan Bintan yang \"aman\" menurut kriteria N-1?","a":"N-1 berarti Bintan bertahan saat kehilangan satu elemen terbesar, yaitu koridor kabel atau satu sirkit. Ada dua jalan. (a) Jalur kedua dengan kapasitas penuh. Di RUPTL ini baru muncul jangka panjang lewat ekstensi 500 kV (2032, bersyarat). (b) Pembangkit firm lokal yang cukup untuk menahan beban saat koridor putus. PLTMG 100 MW (2027) dalam skema wilus PLN Batam, bila dibangun di Pulau Bintan, praktis memenuhi kebutuhan itu untuk beban ±100–110 MW. Jadi pertanyaan kuncinya: di mana PLTMG 100 MW itu ditempatkan? Di Bintan, ia menyelesaikan N-1 Bintan. Di Batam, ia hanya menambah kapasitas sistem.","f":["RUPTL II.3.1: transmisi direncanakan N-1 statis & dinamis","Lokasi PLTMG wilus belum dipublikasikan"],"src":"RUPTL II.3.1, hlm A-52; analisis penyusun","isl":"B"},{"c":"K","conf":"V","loc":"batam","q":"Kapasitas baru apa yang akan masuk ke sistem Batam–Bintan pada 2025–2030?","a":"Sisi Batam: Medco add-on Tanjung Uncang +39 MW (COD Nov 2025). Amandemen sewa MaxPower 50→150 MW (Sagulung 60 MW dengan free governor dan black start, Sekupang 40 MW). PLTGU Batam #1 120 MW (EPC konsorsium PP Rp3,35 T, Okt 2025). PJBTL PLTGU Batam 3 & 4 2×150 MW (16 Jul 2026). Rencana BESS. Untuk Bintan (wilus PLN Batam): PLTMG 100 MW (2027) + 50 MW (2031), PLTS 25 MW (2028) + 25 MW (2030). Jaringan: GI Tanjung Sauh (9 Nov 2026). Setelah 2030: ISBB 1.200 MW dari Sumatera (2031).","f":["MaxPower 50→150 MW","Batam #1 120 MW; Batam 3&4 300 MW"],"src":"Bisnis Okt 2025; RRI Jul 2026; RUPTL hlm A-52; Listrik Indonesia Nov 2026","isl":"B"},{"c":"K","conf":"E","loc":"batam","q":"Apakah reserve margin Batam–Bintan akan bertahan hingga 2030?","a":"Ketat. Dengan beban tumbuh 12%/tahun (konservatif dibanding >15% aktual), puncak 2030 ±1.230 MW. Kalau semua proyek gas tepat waktu, pasok ±1.650 MW (RM ±35%). Namun satu keterlambatan (mis. Batam 3&4) menurunkan RM ke ±10–15%. Data center bisa menambah ratusan MW dalam 2–3 tahun (DayOne saja 450 MW), lebih cepat dari siklus pembangunan pembangkit gas (3–4 tahun).","f":["DayOne PJBTL 511 MVA (17 Apr 2026)","Pipeline data center Batam 1,47 GW"],"src":"Estimasi penyusun; ESDM Okt 2026; PLN Batam","isl":"B"},{"c":"K","conf":"V","loc":"bin","q":"Apa yang ditunjukkan RUPTL 2025–2034 tentang neraca daya Kepulauan Riau?","a":"RUPTL hanya menyajikan \"Kepulauan Riau tanpa Batam\". Eksisting (Tabel A4.3): 293 unit, 144,0 MW terpasang, 109,8 MW DMN. Rinciannya PLTD PLN 284 unit 122,8/92,5 MW; PLTU PLN 2 unit (TBK) 14/10,2 MW; PLTS PLN 0,8/0,7 MW; PLTBm IPP 0,9/0,9 MW; PLTD sewa 5,5/5,5 MW. Beban puncak (A4.8) 189 MW pada 2025 menjadi 241 MW pada 2030, lalu melonjak ke 980 MW pada 2031. Karena DMN lokal (109,8 MW) jauh di bawah 189 MW, selisihnya ditutup impor dari Batam (untuk Bintan). Tidak ada pemecahan Bintan vs Karimun.","f":["DMN 109,8 MW vs puncak 189 MW → ±79 MW impor (implisit)","Lonjakan 241 → 980 MW di 2031"],"src":"RUPTL Tabel A4.3, A4.8","isl":"U"},{"c":"K","conf":"E","loc":"kar","q":"Berapa biaya mempertahankan Karimun dengan pembangkit diesel?","a":"PLTD BBM mengonsumsi ±0,25–0,28 liter/kWh. Pada harga solar industri, biaya bahan bakar saja bisa Rp3.000–4.000/kWh, jauh di atas tarif I-3 Rp1.114,74/kWh. Selisihnya ditutup kompensasi pemerintah ke PLN. Itu sebabnya RUPTL memilih interkoneksi Sumatera untuk Karimun (dedieselisasi pola 3): biaya kabel dibayar oleh penghematan BBM. Setiap tahun keterlambatan kabel berarti diesel Karimun bertahan dan biaya kompensasi naik. Angka BPP resmi per wilayah ditetapkan melalui Kepmen ESDM.","f":["Estimasi; konsumsi spesifik PLTD ±0,25–0,28 L/kWh","RUPTL II.2.5 dedieselisasi pola 3 = interkoneksi"],"src":"Estimasi penyusun; RUPTL II.2.5","isl":"K"},{"c":"K","conf":"V","loc":"inc1","q":"Bagaimana kondisi Bintan saat blackout Oktober 2026?","a":"Gangguan mulai 06.37 WIB, 12 Okt 2026, di sistem Batam (indikasi awal hewan liar, disebut kelelawar, masuk GI Sungai Harapan) dan merembet ke Bintan dan Tanjungpinang. Padam 15–16 jam, lebih dari 411 ribu pelanggan terdampak, termasuk PDAM, Bandara Hang Nadim, dan data center. Laporan menyebut 578,2 MW beban terdampak. Bintan dipulihkan bertahap setelah Batam (PLN menyatakan Batam pulih 100%, \"Bintan menyusul\"). Bintan tidak bisa bertahan karena hampir tidak punya pembangkit lokal untuk islanding. ESDM belum mengeluarkan kesimpulan final per 23 Okt 2026.","f":["06.37 WIB; GI Sungai Harapan; >411 ribu pelanggan","Kompensasi di tagihan Nov 2026"],"src":"Bloomberg Technoz; Listrik Indonesia 23 Okt 2026; Jakarta Post; RCTI+","isl":"B"},{"c":"K","conf":"E","loc":"kar","q":"Apakah padam bergilir di Karimun masalah pembangkitan atau jaringan?","a":"Hampir seluruhnya pembangkitan. Karimun tidak punya transmisi, dan gangguan besar 2022–2026 selalu dipicu PLTU unit trip/pemeliharaan atau PLTD derating sehingga daya mampu < beban. Masalah jaringan (penyulang 20 kV panjang, petir, pohon) memberi gangguan lokal, tetapi bukan penyebab padam sistem. Prioritas investasi jadi jelas: kapasitas firm + BESS dulu, baru penguatan distribusi.","f":["UFR blackout Okt 2026 = masalah frekuensi/pembangkit"],"src":"Analisis dari log gangguan publik 2022–2026","isl":"K"},{"c":"D","conf":"E","loc":"bin","q":"Bagaimana proyeksi kebutuhan listrik Bintan hingga 2030?","a":"RUPTL tidak memisahkan Bintan. Angka resminya Kepri tanpa Batam: 189 MW (2025) ke 241 MW (2030), atau ±5%/tahun, lalu 980 MW pada 2031 karena KTT besar. Untuk Bintan sendiri saya pakai ±5–6%/tahun organik: ±105 MW (2026) menjadi ±128–135 MW (2030). Ini baseline. Upside-nya step-load: BAI/Data Center Bintan 1.500 MVA (confidence rendah, mulai 2032), MoU SOS ±500 MW di Galang Batang, KTT Bintan Resort Cakrawala (SUTT 2030), dan DCI >1 GW. Satu anchor load saja bisa melipatgandakan beban Bintan.","f":["RUPTL A4.8: 189 → 241 → 980 MW","BAI/DC Bintan 1.500 MVA, confidence rendah 2032"],"src":"RUPTL Tabel A4.8, Lampiran E; estimasi penyusun","isl":"B"},{"c":"D","conf":"E","loc":"kar","q":"Bagaimana proyeksi kebutuhan listrik Karimun hingga 2030?","a":"Organik ±4–6%/tahun (historis 2019→2026: 28,2→36,1 MW ≈3,6%/tahun, tertahan karena supply-constrained). Base: ±44 MW (2030), high ±48 MW. Demand tersembunyi signifikan: pelanggan menunda tambah daya dan industri memakai genset sendiri karena PLN tidak andal. Kalau keandalan pulih, beban yang selama ini ditekan akan muncul (suppressed demand).","f":["2017: 25,4 MW; 2019: 28,2 MW; 2026: 36,1 MW"],"src":"detik 2017/2019; Tribun Nov 2026; estimasi","isl":"K"},{"c":"D","conf":"V","loc":"gb","q":"Apa saja beban industri utama (anchor load) di Bintan?","a":"(1) KEK Galang Batang: PT Bintan Alumina Indonesia (Nanshan), refinery alumina dengan PLTU captive. MoU PLN–BAI (Sep 2022) untuk suplai hingga 2050, BAI menyebut kebutuhan kawasan 2.850 MW untuk rencana smelter aluminium; laporan 2026 menyebut tahapan 300→500→1.300 MW. Pada 15 Sep 2026, SOS menandatangani kerja sama tidak mengikat untuk kampus data center AI ±500 MW di KEK Galang Batang. (2) Lobam (Bintan Inti Industrial Estate) dan Lagoi (Bintan Resorts): PLN menyalurkan 160 MVA (2017). (3) KEK Tanjung Sauh (di antara Batam–Bintan), PLTU sendiri 300 MW tahap 1.","f":["BAI: kebutuhan 2.850 MW (MoU 2022)","SOS DC ±500 MW (15 Sep 2026, non-binding)","160 MVA ke Lagoi/Lobam (detik 2017)"],"src":"VOI/Alcircle 2022; Petromindo Jan 2026; Bisnis 2026; detik 2017","isl":"B"},{"c":"D","conf":"V","loc":"batam","q":"Seberapa besar gelombang data center, dan apakah menjangkau Bintan dan Karimun?","a":"Batam sudah menjadi hub: kapasitas data center tersedia/committed/dalam pengembangan ±1,47 GW. PJBTL besar: DayOne Kabil 511 MVA (±450 MW, 17 Apr 2026), Altiva Nongsa 690 MVA, Equator Gate Nongsa. Pada 19 Okt 2026 Menteri ESDM Bahlil menyebut Batam–Karimun–Bintan sebagai hub data center baru dan kebutuhan listrik data center nasional ±20 GW, dengan rencana PLTS ±100 GWp. Pemprov menyiapkan AI zone 3.000 ha di Bintan, dan KEK Digital Bintan disebut sudah sold out. Untuk Karimun, isu geopolitik (dekat Selat Malaka) dan air ikut disorot.","f":["20 GW kebutuhan DC nasional (Bahlil, 19 Okt 2026)","AI DC 100 MW–1 GW per fasilitas vs cloud 10–30 MW","IDPRO: 5 syarat, termasuk listrik andal & air"],"src":"ESDM 19 Okt 2026; Katadata; Bisnis 21–22 Okt 2026; Jakarta Post Apr 2026","isl":"U"},{"c":"D","conf":"E","loc":"gb","q":"Apakah jaringan Bintan mampu melayani data center 100–500 MW?","a":"Tidak dengan jaringan sekarang. Total trafo GI di Bintan 310 MVA (RUPTL A4.4), beban organik ±105 MW, dan pasokan datang lewat satu koridor yang kapasitas transfernya tidak dipublikasikan. Data center hyperscale butuh pasokan ganda (N-1 atau 2N) dan kualitas tegangan tinggi. Opsinya: (a) pembangkit dedicated di/dekat kawasan (gas/PLTU captive, PLTS+BESS) dengan skema wilayah usaha atau PJBTL khusus, (b) ISBB 1.200 MW (2031) + ekstensi 500 kV ke GITET Bintan/KTT (2032, bersyarat) — beban ≥30 MVA (I-4) praktis menunggu ini, atau (c) penguatan koridor Batam–Bintan dengan sirkit kedua. Realistisnya, 100+ MW baru di Bintan butuh 3–5 tahun.","f":["GI Bintan total 300 MVA","Data center menuntut redundansi minimal N-1"],"src":"Analisis penyusun; RUPTL GI table","isl":"B"},{"c":"D","conf":"V","loc":"kar","q":"Apa pendorong kebutuhan listrik industri di Karimun?","a":"Karimun adalah FTZ (BBK). Penggerak industrinya galangan kapal dan fabrikasi offshore (antara lain yard Saipem), terminal penyimpanan minyak, tambang/olah granit, dan logistik maritim. Banyak beban industri ada di Zona 1–2 (SDU, KPP) atau memakai genset sendiri, sehingga tidak tercermin di beban PLN Zona 3. Pemerintah juga menyebut Karimun bagian hub data center BBK (Okt 2026), dan ada penjajakan PLTS+BESS skala GW di Pulau Belat.","f":["Zona 1 SDU, Zona 2 KPP","Pulau Belat: Gotion × Oriens s.d. 2 GW (MoU Jan 2026)"],"src":"detik 2019; Bisnis Okt 2026; laporan Belat 2026","isl":"K"},{"c":"D","conf":"V","loc":null,"q":"Berapa porsi kebutuhan industri dari total kebutuhan listrik di Bintan dan Karimun?","a":"Di buku PLN sangat kecil. RUPTL Tabel A4.6: penjualan industri Kepri tanpa Batam hanya 47 GWh (2025) menjadi 58 GWh (2030). Sebagai pembanding, 189 MW beban puncak pada load factor ±0,6 ≈ ±1.000 GWh total, jadi industri hanya ±5%. Lalu ada lompatan ke 4.442 GWh pada 2031, tabel berlabel \"tanpa KTT confidence rendah\". Itu setara beban rata-rata ±500 MW dari satu atau beberapa KTT yang tidak disebut namanya. Industri besar riil (alumina, galangan, Lagoi/Lobam, zona Karimun) sebagian besar captive atau di wilayah usaha sendiri.","f":["A4.6: 47 → 58 → 4.442 GWh","4.442 GWh / 8.760 h ≈ 507 MW rata-rata"],"src":"RUPTL Tabel A4.6; perhitungan penyusun","isl":"U"},{"c":"D","conf":"V","loc":"gb","q":"Apakah Bintan Alumina akan beralih dari PLTU captive ke PLN?","a":"Ada niat, tetapi skemanya belum final, dan RUPTL sendiri tidak konsisten. Lampiran E: kebutuhan BAI 1.529 MVA dengan PLTA kuota 900 MW + PLTGU 600 MW. Tabel A4.10: BESS 100 MW + PLTA 161 MW. RUPTL menyebut BAI/Data Center Bintan 1.500 MVA sebagai KTT confidence rendah, mulai 2032, dan pasokannya butuh ekstensi 500 kV dari ISBB ke GITET KTT BAI. MoU PLN–BAI (Sep 2022) mencakup suplai hingga 2050. Realistisnya hybrid: captive tetap jalan, PLN masuk setelah ISBB (≥2031–32).","f":["Lampiran E: 1.529 MVA; PLTA kuota 900 + PLTGU 600","A4.10: BESS 100 MW + PLTA 161 MW"],"src":"RUPTL Lampiran E, Tabel A4.10; VOI/Alcircle 2022","isl":"B"},{"c":"D","conf":"V","loc":"tsauh","q":"Bagaimana dengan KEK Tanjung Sauh?","a":"KEK Tanjung Sauh (PP 24/2024, PSN, Panbil Group) berada di antara Batam dan Bintan, tepat di lintasan koridor kabel. Fokusnya elektronik dan logistik. Kawasan merencanakan PLTU tahap 1 ±300 MW sendiri. GI 150 kV Tanjung Sauh milik PLN Batam energize 9 Nov 2026, dan MoU BP Batam–Panbil–PLN Batam (Jul 2026) mendukung pasokan. Artinya koridor Batam–Bintan sekarang juga memasok kawasan industri baru di tengah jalan.","f":["GI Tanjung Sauh energize 9 Nov 2026","PLTU kawasan ±300 MW (konstruksi 2026)"],"src":"PP 24/2024; Listrik Indonesia 19 Nov 2026; MoU Jul 2026","isl":"B"},{"c":"D","conf":"E","loc":null,"q":"Bagaimana menyusun proyeksi kebutuhan listrik pulau-pulau ini dari prinsip dasar?","a":"Pisahkan menjadi tiga blok. (1) Organik: jumlah pelanggan × konsumsi per pelanggan, didorong PDRB, populasi, dan pariwisata (elastisitas ±1,0–1,3 terhadap PDRB). (2) Spot load: daftar proyek kawasan dengan probabilitas (MoU 10–20%, PJBTL 70–90%, konstruksi ≥90%) dan profil ramp (data center biasanya 20–30% beban kontrak di tahun pertama). (3) Suppressed demand: tambahan saat keandalan pulih (genset pelanggan pindah ke PLN). Lalu ubah energi ke MW dengan load factor (data center ±0,8–0,9, residensial ±0,6). Jangan menjumlahkan MoU begitu saja.","f":["Data center: beban aktual awal ±20–30% dari kontrak","Load factor DC tinggi (0,8–0,9)"],"src":"Metodologi umum perencanaan PLN/konsultan","isl":"U"},{"c":"D","conf":"V","loc":"lagoi","q":"Bagaimana pasokan listrik kawasan Lagoi/Bintan Resorts?","a":"Kawasan wisata Lagoi (Bintan Resorts) dan kawasan industri Lobam memiliki utilitas sendiri dan sejak 2017 juga menerima pasokan PLN 160 MVA lewat GI dan jaringan 150 kV dari interkoneksi. Ini menambah beban di sisi utara koridor (Tanjung Uban–Sri Bintan). RUPTL menjadwalkan SUTT 150 kV 2 cct Sri Bintan → KTT Bintan Resort Cakrawala 10 kms + ext GI Sri Bintan 2 LB (2030). Resort adalah beban premium yang sensitif keandalan (tarif B-3).","f":["detik 2017: PLN salurkan 160 MVA ke kawasan industri & pariwisata Bintan"],"src":"detik Finance 2017","isl":"B"},{"c":"D","conf":"E","loc":null,"q":"Apa ketidakpastian terbesar dalam proyeksi kebutuhan listrik?","a":"Timing dan konversi anchor load. Pengumuman (MoU, wacana >1 GW) jauh lebih banyak daripada yang mencapai PJBTL. Hambatan konversi: kepastian pasokan listrik dan air, lahan, izin, konektivitas internasional, serta ketersediaan energi hijau yang diminta hyperscaler. Lalu ada risiko kebalikan: sekali satu hyperscaler commit, beban bisa naik ratusan MW dalam 2–3 tahun, lebih cepat dari pembangunan pembangkit dan transmisi. Jadi ketidakpastian dua arah.","f":["IDPRO: 5 syarat hub DC Karimun/Bintan"],"src":"Bisnis 22 Okt 2026; analisis penyusun","isl":"U"},{"c":"D","conf":"V","loc":"gb","q":"Apa penyebab lonjakan dari 241 MW ke 980 MW pada 2031?","a":"Beban puncak Kepri tanpa Batam naik dari 241 MW (2030) ke 980 MW (2031), dan penjualan industri dari 58 ke 4.442 GWh, padahal tabel A4.6 berlabel \"tanpa KTT confidence rendah\". Artinya ada KTT besar (±500 MW rata-rata) berstatus confidence lebih tinggi yang masuk 2031 dan tidak disebut namanya. BAI/Data Center Bintan 1.500 MVA justru dicatat confidence rendah mulai 2032. Waktunya bersamaan dengan COD ISBB 2031, yang memang dirancang melayani hingga ±3 GW di Batam–Bintan. Identitas KTT ini menentukan kebutuhan jaringan Bintan setelah 2031.","f":["A4.6 & A4.8","ISBB COD 2031, kapasitas transfer 1.200 MW"],"src":"RUPTL Tabel A4.6, A4.8, V.11.2","isl":"B"},{"c":"D","conf":"V","loc":null,"q":"Apakah regulasi mengizinkan PLN membangun khusus untuk kebutuhan industri?","a":"Ya. Diktum KETIGA Kepmen RUPTL 2025–2034: untuk konsumen industri hilirisasi, prioritas pembangunan daerah, atau Proyek Strategis Nasional, PLN dapat membangun tambahan pembangkitan dan penyaluran setelah persetujuan Menteri ESDM, lalu dimasukkan ke perubahan RUPTL. Ini membuka jalan bagi pasokan dedicated ke KEK/PSN seperti Galang Batang atau Tanjung Sauh tanpa menunggu revisi RUPTL penuh. Alternatifnya, kawasan memakai wilayah usaha sendiri atau captive.","f":["Diktum KETIGA Kepmen RUPTL 2025–2034"],"src":"RUPTL 2025–2034, Diktum KETIGA","isl":"B"},{"c":"D","conf":"E","loc":null,"q":"Apakah ada kebutuhan listrik yang tertahan (suppressed demand) di Karimun dan Bintan?","a":"Ya, terutama di Karimun. Indikatornya: padam bergilir berulang, industri dan UMKM memakai genset, serta permintaan tambah daya yang tertunda. Ketika PLN tidak bisa melayani, beban tidak tercatat di statistik PLN. Begitu kapasitas firm masuk, pertumbuhan tercatat bisa melonjak 1–2 tahun di atas tren. Untuk forecast, saya akan menambahkan ±5–10% beban dasar sebagai suppressed demand di Karimun.","f":["Pola padam bergilir 2022, 2025, 2026"],"src":"Analisis penyusun","isl":"U"},{"c":"D","conf":"V","loc":null,"q":"Apa prasyarat agar Bintan/Karimun benar-benar menjadi hub data center?","a":"Yang disebut asosiasi dan pengamat (Okt 2026): (1) listrik andal dengan redundansi dan opsi energi hijau, (2) air untuk pendinginan, (3) lahan siap dan kepastian izin, (4) konektivitas kabel laut internasional, dan (5) insentif/kepastian regulasi. Untuk Karimun ada tambahan isu geopolitik karena dekat Selat Malaka. Dari sisi kelistrikan, prasyarat paling berat adalah redundansi pasokan, yang saat ini belum dimiliki Bintan maupun Karimun.","f":["IDPRO 5 syarat","IKTII: isu geopolitik Karimun"],"src":"Bisnis 21–22 Okt 2026","isl":"U"},{"c":"D","conf":"E","loc":null,"q":"Bagaimana skenario dasar, rendah, dan tinggi kebutuhan listrik pada 2030?","a":"Acuan resmi: Kepri tanpa Batam 241 MW pada 2030 (RUPTL A4.8). Estimasi saya per sistem: Bintan grid PLN low ±120 MW, base ±130 MW, high ±300 MW (dengan ±150 MW anchor KTT/DC sebelum 2031). Karimun TBK low ±42 MW, base ±44 MW, high ±55 MW (suppressed demand + industri FTZ setelah kabel masuk). Batam–Bintan total: base ±1.230 MW, high ±1.500 MW+ bila data center Batam ramp cepat. Setelah 2031, RUPTL sendiri sudah melonjak (980 MW Kepri tanpa Batam).","f":["Lihat grafik skenario di panel Demand"],"src":"RUPTL A4.8; estimasi penyusun","isl":"U"},{"c":"P","conf":"V","loc":"karint","q":"Proyek pembangkit apa saja yang tercantum di RUPTL 2025–2034 untuk Karimun?","a":"Strategi RUPTL untuk Karimun bukan pembangkit lokal besar, tetapi interkoneksi 150 kV dari Sumatera (GI TBK 2×30 MVA, COD 2026 di tabel; realistis 2027–28). Lampiran E (KI Karimun Maritime Industrial Complex) menyebut kapasitas eksisting TBK 40 MW dan tambahan PLTMG. EBT lokal yang tercatat sebagai potensi: PLTBm Kundur (Kab. Karimun) 2,5 MW dan Tanjung Batu 2+2 MW. Di lapangan: PLTD +6 MW Bukit Carok dan genset sewa 7 MW (2026), serta pilot gasifikasi biomassa PLN EPI × KPP 1 MW (±35 ton biomassa/hari, MoU Apr 2026). Begitu kabel masuk, bauran Karimun ikut grid Sumatera.","f":["Lampiran E: TBK 40 MW + PLTMG","Potensi PLTBm Kundur 2,5 MW; Tanjung Batu 2+2 MW","Pilot biomassa 1 MW, ±35 t/hari"],"src":"RUPTL Lampiran A4, E; Listrik Indonesia Apr 2026; Kepri Headline 2026","isl":"K"},{"c":"P","conf":"V","loc":"bin","q":"Proyek apa saja yang tercantum di RUPTL untuk Bintan/Tanjungpinang?","a":"Pembangkit lewat kerja sama wilus PLN Batam: PLTMG 100 MW (2027) + 50 MW (2031), PLTS 25 MW (2028) + 25 MW (2030). Transmisi: SUTT 150 kV 2 cct Sri Bintan → KTT Bintan Resort Cakrawala (Lagoi) 10 kms + extension GI Sri Bintan 2 LB (2030); extension trafo GI Air Raja 1×60 MVA (2030); rekonduktoring Tanjung Uban–Sri Bintan 2 cct 32 kms (2031). Jangka panjang: ekstensi 500 kV Rempang → Ngenang → Tanjung Taloh → GITET Bintan 500/150 kV 1×250 MVA → GITET KTT BAI/Data Center (162 kms, 2032), hanya bila demand pasti. PLN memprioritaskan pengembang yang juga menciptakan demand, dengan skema take-or-pay.","f":["RUPTL hlm A-52; tabel transmisi A4","500 kV ke Bintan: \"untuk KTT confidence rendah\""],"src":"RUPTL 2025–2034 Lampiran A4","isl":"B"},{"c":"P","conf":"V","loc":"batam","q":"Apa isi RUPTL PLN Batam yang berpengaruh ke Bintan?","a":"RUPTL PLN Batam 2023–2032 (Mei 2023) menambah pasokan 860 MW, termasuk 400 MW kerja sama antarwilayah dengan PLN Persero, serta PLTS, PLTG/PLTGU, dan PLTMG. Target bauran EBT naik ke 35% pada 2032. RUPTL PLN Persero 2025–2034 sendiri mencatat sebagian besar energi Bintan berasal dari Sistem Batam sebagai \"impor\" kerja sama antar-wilus. RUPTL juga memuat pembangkit untuk Bintan yang dibangun di wilus PLN Batam: PLTMG 100 MW (2027) + 50 MW (2031) dan PLTS 25 MW (2028) + 25 MW (2030). Ini menggantikan \"PLT EBT Base Bintan 200 MW\" di RUPTL lama.","f":["RUPTL hlm A-52","PLN Batam RUPTL: 860 MW, 400 MW antarwilayah"],"src":"RUPTL 2025–2034 hlm A-52; ESDM Mei 2023","isl":"B"},{"c":"P","conf":"V","loc":"batam","q":"Bagaimana status PLTGU Batam #1 serta Batam 3 & 4?","a":"PLTGU Batam #1 / \"Batam Bintan 1\" 120 MW: milik PLN Batam, EPC PTPP, nilai ±Rp3,35 triliun, target 2028. PLTGU Batam 3 & 4 2×150 MW: IPP Dalle Energy, PJBTL difinalisasi 16 Jul 2026, COD estimasi 2029–2030 (pembangkit gas siklus kombinasi butuh ±30–36 bulan). Keduanya kunci untuk menjaga reserve Batam–Bintan di atas 15% saat data center masuk.","f":["RRI Jul 2026: \"Batam secures 300 MW power boost\""],"src":"Kontan; RRI Jul 2026; PTPP","isl":"B"},{"c":"P","conf":"V","loc":"tsauh","q":"Proyek transmisi apa yang sedang berjalan di sekitar Bintan?","a":"GI 150 kV Tanjung Sauh energize 9 Nov 2026, disebut PLN Batam sebagai tonggak penguatan jaringan Batam–Bintan. Dibarengi peningkatan kemampuan PLTMG Maxpower Sagulung 60 MW. SUTT Bintan (Tanjung Uban–Sri Bintan 28 kmr, Sri Bintan–Air Raja 38 kmr, Air Raja–Kijang 20 kmr) beroperasi sejak 2015–2016. RUPTL: ext GI Air Raja 1×60 MVA (2030), SUTT Sri Bintan–KTT Bintan Resort (2030), rekonduktoring Tanjung Uban–Sri Bintan 32 kms (2031), GI Rempang–Panaran 40 kms (2031), ekstensi 500 kV ke Bintan (2032, bersyarat). Tidak ada kabel 150 kV kedua Batam–Bintan.","f":["Sumber tunggal untuk tanggal 9 Nov 2026 (Listrik Indonesia)"],"src":"Listrik Indonesia 19 Nov 2026; RUPTL GI table","isl":"B"},{"c":"P","conf":"V","loc":"kar","q":"Langkah jangka pendek apa yang sudah dilakukan PLN di Karimun?","a":"(1) PLTD 6 MW baru di Bukit Carok (target Agt 2026). (2) Kontrak genset 7 MW PLN × PT PEB / PLN Nusa Daya (15 Jun 2026). (3) Percepatan perbaikan PLTU unit 2. (4) Manajemen beban dengan prioritas fasilitas vital (RS, pelabuhan). Ombudsman Kepri meminta percepatan recovery pembangkit dan kejelasan kompensasi pelanggan. Ini tambal sulam: menutup defisit, tetapi tidak menyelesaikan kriteria N-2/RM 35%.","f":["Ombudsman: 3 permintaan ke PLN (krisis Karimun)"],"src":"Kepri Headline; Warta Kepri Jul 2026; Ombudsman Kepri","isl":"K"},{"c":"P","conf":"V","loc":"belat","q":"Apa itu proyek Pulau Belat?","a":"Penjajakan PLTS + BESS skala besar (hingga ±2 GW pembangkit) di Pulau Belat, Karimun, oleh Gotion bersama Oriens (MoU Jan 2026). Horizon 3–5 tahun. Orientasinya ekspor ke Singapura dan/atau anchor load industri/data center, bukan grid kota Karimun yang hanya ±36 MW. Status: tahap awal, belum ada PJBTL atau izin ekspor final.","f":["MoU Jan 2026","Skala pembangkit s.d. 2 GW"],"src":"Laporan Jan 2026 (Gotion × Oriens)","isl":"K"},{"c":"P","conf":"E","loc":null,"q":"Proyek mana yang paling berisiko terlambat?","a":"(1) Interkoneksi: ISBB 1.200 MW (2031, AC/DC belum diputuskan) dan kabel 150 kV Karimun (tabel 2026, narasi 2028); impor 400 MW di RUPTL PLN Batam sudah meleset dari 2026. (2) Proyek PLTS ekspor: menunggu terms ekspor RI–Singapura (laporan Mar 2026 menyebut negosiasi tersendat). (3) PLTGU Batam 3&4: pendanaan dan pasokan gas. (4) Proyek Karimun skala menengah: keekonomian sistem kecil dan fragmentasi wilayah usaha. Paling kecil risikonya: unit modular gas/diesel dan BESS, karena cepat dan tidak butuh transmisi.","f":["RUPTL II.2: keterlambatan proyek dikompensasi RM tambahan ±5%"],"src":"Kontan 2023; laporan Mar 2026; analisis","isl":"U"},{"c":"P","conf":"V","loc":"kar","q":"Apa yang dikerjakan PLN EPI di Karimun?","a":"PLN Energi Primer Indonesia (EPI) bersama PT Karimun Power Plant memulai pilot dedieselisasi lewat biomassa/syngas di Karimun Zona 2 (MoU 6 Apr 2026), mulai ±1 MW dan berpotensi 2–5 MW. Karimun disebut pilot dedieselisasi nasional. Nilainya lebih besar sebagai model rantai pasok biomassa untuk pulau kecil daripada kontribusi MW-nya.","f":["Metro TV: Karimun pilot dedieselisasi nasional"],"src":"Listrik Indonesia; Metro TV 2026","isl":"K"},{"c":"P","conf":"V","loc":"bin","q":"Di mana peluang masuk bagi IPP dan pengembang?","a":"(1) Kuota wilus Bintan: PLTMG 100+50 MW dan PLTS 25+25 MW bisa dibangun PLN Batam atau mitranya. (2) Kuota surya \"Sumatera–Bintan tersebar\" adalah kuota bersama Batam–Bintan, juga terbuka untuk mitra PLN Batam. (3) EBT Kepri tanpa Batam (A4.15): PLTS Dedieselisasi 15,6 MW (2027, IPP), PLTS+BESS 4+4 MW (2027, 2032), PLTBio 4+2,4 MW (2029), PLTS isolated tersebar. (4) Setelah ISBB tersambung, PLTS+BESS dan BESS Sumatera juga bisa ditempatkan di Bintan. Syaratnya: PLN memprioritaskan pengembang yang juga membawa demand, dengan skema take-or-pay, karena ketidakpastian demand Bintan tinggi.","f":["RUPTL hlm A-51/A-52, Tabel A4.15"],"src":"RUPTL Lampiran A4","isl":"B"},{"c":"P","conf":"V","loc":null,"q":"Apa kata RUPTL tentang dedieselisasi untuk pulau-pulau seperti ini?","a":"RUPTL 2025–2034 II.2.5 membagi Program Dedieselisasi menjadi tiga pola: (1) konversi PLTD ke EBT hybrid dengan baterai untuk sistem isolated yang tidak mungkin diinterkoneksi, (2) gasifikasi/pembangkit gas non-BBM, (3) interkoneksi sistem isolated ke grid. Untuk isolated, RUPTL menyebut opsi PLTMG dual fuel, EBT hybrid dengan PLTD/BESS, dan biofuel. Karimun relevan untuk pola 1 dan 2, Bintan untuk pola 3 (sudah terinterkoneksi).","f":["RUPTL II.2.5"],"src":"RUPTL 2025–2034 Bab II.2.5","isl":"U"},{"c":"P","conf":"E","loc":"kar","q":"Jika Anda PLN, apa prioritas untuk Karimun dalam 24 bulan ke depan?","a":"Pertama, amankan jembatan sampai kabel Sumatera masuk (2027–28). Langkahnya: BESS grid-forming 5–10 MW untuk respons frekuensi, karena satu unit PLTU ±20% beban puncak dan UFR blackout terjadi; sewa firm tambahan 10–15 MW; overhaul PLTU unit 1–2. Kedua, percepat jalur kritis kabel: segmen Selat Panjang–Rangsang–TBK, terutama SKLT 70 km dan lahan SUTT 120 kms. Ketiga, siapkan GI TBK 2×30 MVA dan skema pelepasan beban bertahap. Keempat, pertahankan pembangkit lokal sebagai backup N-1 kabel tunggal. Kelima, pooling cadangan dengan zona swasta (SDU, KPP).","f":[],"src":"Rekomendasi penyusun berbasis RUPTL A4","isl":"K"},{"c":"P","conf":"V","loc":null,"q":"Seberapa kredibel jadwal RUPTL mengingat rekam jejak pelaksanaannya?","a":"Perlu didiskon. Realisasi tambahan transmisi nasional 2025 hanya ±37% dari target RUPTL, terutama karena lahan dan perizinan (Kontan, Jul 2026). Di dokumen yang sama ada inkonsistensi COD: interkoneksi Karimun 2026 vs \"masih perencanaan\" vs 2028; ISBB 2031 vs 2028. Rencana impor 400 MW di RUPTL PLN Batam juga meleset dari 2026. Aturan praktis saya: tambahkan 1–2 tahun untuk transmisi dan kabel laut, 0–1 tahun untuk PLTMG/sewa, dan anggap proyek berstatus \"perlu studi\" atau \"confidence rendah\" sebagai opsi, bukan rencana.","f":["Kontan Jul 2026: 37%","Inkonsistensi COD internal RUPTL"],"src":"Kontan Jul 2026; RUPTL","isl":"U"},{"c":"P","conf":"V","loc":null,"q":"Inkonsistensi internal apa dalam RUPTL yang perlu diketahui pembaca?","a":"Empat. (1) COD interkoneksi 150 kV Karimun: tabel transmisi Riau 2026 Committed; Bab V.11.2 \"masih tahap perencanaan\"; Lampiran E 2028. (2) COD Sumatera–Batam–Bintan: neraca & tabel transmisi 2031; Lampiran E (KI Tanjung Sauh) dan hlm A-51 2028; kajian AC/DC belum selesai. (3) Lonjakan industri 2031: A4.6 (tanpa KTT confidence rendah) naik 58→4.442 GWh, tetapi KTT yang disebut (BAI/DC Bintan 1.500 MVA) confidence rendah mulai 2032, jadi ada KTT ±500 MW tak bernama. (4) Infrastruktur BAI: Lampiran E 1.529 MVA + PLTA kuota 900 MW + PLTGU 600 MW vs A4.10 BESS 100 MW + PLTA 161 MW. Pembaca yang hanya melihat tabel provinsi akan melewatkan ini.","f":[],"src":"RUPTL A4, V.11.2, Lampiran E","isl":"U"},{"c":"E","conf":"V","loc":null,"q":"Berapa porsi energi terbarukan di Bintan dan Karimun saat ini?","a":"Sangat rendah. Pasokan Batam–Bintan praktis 100% fosil (gas + batubara Tanjung Kasam), dan Karimun bertumpu pada PLTU batubara + PLTD. EBT yang ada skala kecil: PLTS Karimun ±5 MW milik KPP (Zona 2, tercatat OSM, status perlu konfirmasi), PLTS terapung Tembesi di Batam (PLN NP × TBS, tersambung 20 kV), PLTS hybrid di pulau kecil. Pangsa EBT di grid PLN Bintan/Karimun di bawah 2–3% (estimasi).","f":["Mongabay 2024: Batam seluruhnya fosil","Potensi EBT Batam dominan surya"],"src":"Mongabay Des 2024; OSM; PLN NP","isl":"U"},{"c":"E","conf":"V","loc":null,"q":"Sumber energi terbarukan apa yang realistis di sini?","a":"Surya adalah sumber utama: iradiasi ekuator ±4,3–4,8 kWh/m²/hari dan tersedia sepanjang tahun, tetapi ada tutupan awan tropis. Angin lemah (rata-rata rendah di Selat Singapura/Malaka). Tidak ada hidro berarti, geotermal tidak ada. Biomassa terbatas (sisa kayu, kelapa). Laut (arus) masih riset. Jadi strategi realistis: PLTS (darat, terapung di waduk, atap) + BESS, dan gas sebagai firm capacity.","f":["Potensi EBT Batam terbatas terutama surya (Mongabay)"],"src":"Mongabay 2024; Global Solar Atlas (umum)","isl":"U"},{"c":"E","conf":"V","loc":null,"q":"Apa saja rencana energi terbarukan untuk kawasan ini?","a":"Sampai 2030, EBT lokal Kepri tanpa Batam hanya ±40 MW (33,5 MW PLTS + 6,4 MW PLTBio). Rinciannya (A4.15): PLTS lisdes PLN 2,2+0,63+0,74+0,94 MW (2025–27), PLTS Dedieselisasi 15,6 MW (2027, IPP), PLTS+BESS 4+4 MW (2027, 2032), PLTBio kuota 4+2,4 MW (2029), PLTS isolated tersebar 4,77/2,07/3,45 MW (2029/2030/2033). Ditambah PLTS Bintan via wilus PLN Batam 25+25 MW (2028, 2030). Lompatan EBT baru datang setelah 2031 lewat ISBB dari Sumatera (pangsa EBT Sumatera >30,5%). Di luar RUPTL: proyek ekspor ke Singapura skala GW.","f":["Rekap RE Base = ARED identik: total 44,8 MW hingga 2034","Potensi tambahan: PLTS komunal 24 MW, PLTBm Natuna/Tanjung Batu/Dabo/Lingga/Kundur, PLTGL Natuna 2,2 MW"],"src":"RUPTL Tabel A4.13, A4.15","isl":"B"},{"c":"E","conf":"V","loc":null,"q":"Proyek PLTS ekspor ke Singapura mana saja yang berlokasi di Kepulauan Riau?","a":"Yang publik: Vena Energy (dengan Shell) PLTS+BESS ±2 GW di Kepri, target konstruksi 2026. Equator Renewables Asia ±900 MW PLTS + 1,2 GWh BESS di Kepri (ekspor 400 MW AC, target 2029). Singa Renewables (TotalEnergies–RGE) 1 GW dari Riau. Sembcorp ±1 GW BBK. Pacific Medco di Pulau Bulan (Batam). Gotion × Oriens Pulau Belat (Karimun) hingga 2 GW. EMA telah memberi conditional approval/licence ke 13 proyek impor dari beberapa negara. Target Singapura ±6 GW pada 2035.","f":["Mar 2026: negosiasi terms ekspor RI–SG tersendat","EMA: 13 proyek impor berlisensi/conditional"],"src":"EMA; pv magazine Okt 2025; Enerdata; ESDM; laporan Mar 2026","isl":"U"},{"c":"E","conf":"V","loc":null,"q":"Apa hambatan utama energi terbarukan di sini?","a":"(1) Ukuran grid: Karimun ±36 MW hanya bisa menyerap PLTS ±4–7 MW tanpa baterai sebelum masalah stabilitas/curtailment. (2) RUPTL tidak menghitung EBT intermiten sebagai cadangan tanpa firm capacity, jadi PLTS tidak menyelesaikan masalah RM. (3) Lahan: pulau kecil, mangrove, konflik masyarakat (contoh isu Rempang/Tanjung Sauh). (4) Regulasi ekspor: prioritas domestik, kewajiban manufaktur lokal/TKDN, terms ekspor belum final. (5) Harga: tarif EBT (Perpres 112/2022) vs BPP lokal. (6) Kabel laut: izin, biaya, rute. (7) Kapasitas offtaker PLN dan risiko over-supply siang hari.","f":["RUPTL: EBT intermiten tidak dihitung reserve tanpa capacity credit","Perpres 112/2022: harga patokan EBT"],"src":"RUPTL Bab II; Perpres 112/2022; laporan 2026","isl":"K"},{"c":"E","conf":"E","loc":"kar","q":"Berapa banyak PLTS yang dapat diserap sistem Karimun?","a":"Aturan praktis untuk sistem isolated tanpa penyimpanan: penetrasi PV instan ±10–20% beban minimum siang. Dengan beban siang Karimun ±25–30 MW, itu ±4–7 MW PLTS. Dengan BESS grid-forming dan kontrol, penetrasi bisa 30–50% energi siang, jadi ±10–15 MW PLTS + 10–20 MWh BESS. Lebih dari itu perlu penyimpanan multi-jam atau beban terkendali (desalinasi, pendingin, hidrogen kecil).","f":["Estimasi teknis; studi grid PLN dapat mempertajam angka ini"],"src":"Praktik umum hybrid isolated","isl":"K"},{"c":"E","conf":"V","loc":null,"q":"Apakah PLTS membantu masalah keandalan Karimun?","a":"Tidak langsung. Menurut RUPTL, EBT intermiten tidak masuk perhitungan cadangan kecuali memberi firm capacity (capacity credit), termasuk jika di-hybrid dengan PLTD. PLTS mengurangi solar/batubara di siang hari, tetapi puncak Karimun malam (18.00–22.00). Yang menolong keandalan adalah BESS (respons frekuensi, cadangan putar) dan kapasitas firm. Jadi urutannya BESS + firm dulu, PLTS sebagai penghemat bahan bakar.","f":["Padam bergilir Karimun terjadi 17.30–22.00"],"src":"RUPTL II.2.2; Warta Kepri Jul 2026","isl":"K"},{"c":"E","conf":"V","loc":null,"q":"Bagaimana aturan PLTS atap dan captive memengaruhi pengguna industri di sini?","a":"Pelanggan PLN di Bintan/Karimun mengikuti aturan PLTS atap nasional (Permen ESDM 2/2024): tidak ada lagi net-metering ekspor ke PLN dan ada kuota per sistem. PLTS atap kini bernilai untuk konsumsi sendiri siang hari. Di wilayah usaha swasta/kawasan, operator kawasan bisa membangun PLTS sendiri. Data center dan industri yang mengejar RE100 bisa memakai REC PLN, PLTS kawasan, atau skema power wheeling (masih diperdebatkan regulasinya).","f":["Permen ESDM 2/2024 PLTS atap"],"src":"Permen ESDM 2/2024","isl":"U"},{"c":"E","conf":"V","loc":null,"q":"Potensi energi terbarukan apa yang diidentifikasi RUPTL untuk Kepulauan Riau?","a":"Potensi tambahan yang tercatat di RUPTL: PLTS komunal tersebar 24 MW; PLTBm Natuna 4 MW, Tanjung Batu 2+2 MW, Dabo 4 MW, Lingga 2 MW, Kundur (Kab. Karimun) 2,5 MW; PLTS Kepri tersebar 1,8 MW; PLTGL (gelombang) Natuna 2,2 MW. Semuanya kecil, karena RUPTL melihat Kepri sebagai kumpulan sistem pulau kecil. Potensi besar (PLTS skala ratusan MW–GW) ada di proyek ekspor dan di kuota Batam–Bintan, bukan di tabel Kepri tanpa Batam.","f":["RUPTL Lampiran A4 potensi EBT"],"src":"RUPTL Lampiran A4","isl":"U"},{"c":"E","conf":"V","loc":null,"q":"Apa isu ekonomi-politik ekspor listrik hijau ke Singapura?","a":"Ada empat. (1) Prioritas domestik: pemerintah ingin listrik hijau juga menarik industri/data center ke Kepri, bukan hanya diekspor. Karena itu Bahlil (Okt 2026) mengaitkan PLTS dengan hub data center BBK. (2) Syarat manufaktur lokal panel/baterai: ada pabrik panel di Kepri seperti Xinyi di Rempang. (3) Harga dan pembagian manfaat: negosiasi terms tersendat (Mar 2026). (4) Isu sosial-lingkungan: lahan pulau, masyarakat pesisir, kritik \"raiding Riau\".","f":["ESDM: RI–Singapura matangkan rencana ekspor listrik bersih"],"src":"ESDM 2026; Antara; JOM","isl":"U"},{"c":"E","conf":"E","loc":null,"q":"Apa peran penyimpanan energi baterai (BESS)?","a":"Besar dan cepat. Tiga fungsi: (1) Keandalan: respons frekuensi dan cadangan putar untuk sistem kecil (Karimun) dan untuk menahan islanding Bintan saat koridor gangguan. (2) Integrasi PLTS: menggeser energi siang ke puncak malam. (3) Penundaan investasi jaringan. PLN Batam sudah menyebut rencana BESS 2027–2032 pasca-blackout. RUPTL nasional memuat 10,3 GW storage. Harga BESS turun tajam sehingga kini kompetitif dibanding PLTD untuk layanan cadangan.","f":["RUPTL: 10.256 MW storage","PLN Batam: rencana BESS"],"src":"RUPTL; Listrik Indonesia Okt 2026","isl":"U"},{"c":"E","conf":"V","loc":"kar","q":"Mengapa biomassa dan syngas diuji coba di Karimun?","a":"Karena bisa menghasilkan daya firm (bukan intermiten) dan menggantikan BBM di sistem isolated, sesuai pola dedieselisasi RUPTL. Kendalanya kontinuitas bahan baku (kayu/serbuk/limbah pertanian di pulau kecil terbatas), biaya logistik, dan skala kecil (1–5 MW). Pilot PLN EPI × KPP menguji model rantai pasok.","f":["MoU 6 Apr 2026, 1→2–5 MW"],"src":"Listrik Indonesia 2026","isl":"K"},{"c":"E","conf":"E","loc":null,"q":"Berapa porsi energi terbarukan yang realistis di Bintan dan Karimun pada 2030?","a":"Rendah, sampai interkoneksi masuk. Kepri tanpa Batam: ±40 MW EBT lokal vs ±241 MW beban (2030); dalam energi, PLTS ±18–20% CF, jadi pangsa ±5%. Bintan bergantung bauran Batam yang hampir 100% fosil, ditambah PLTS 50 MW wilus, menjadi ±5–10%. Karimun berbeda: begitu kabel 150 kV dari Sumatera masuk (2027–28), bauran Karimun ikut grid Sumatera, sehingga diesel tergeser tanpa banyak EBT lokal. Itu cara tercepat menaikkan pangsa EBT Karimun.","f":["Sumatera: tambahan EBT 11 GW (66,3%) hingga 2034"],"src":"RUPTL A4.15, Bab V; estimasi penyusun","isl":"U"},{"c":"T","conf":"V","loc":null,"q":"Berapa tarif industri bagi pelanggan PLN di Bintan dan Karimun?","a":"Bintan dan Karimun Zona 3 adalah wilayah PLN Persero, jadi tarifnya nasional. Q4 2026 (Okt–Des) tidak berubah dari Q3. I-3/TM (>200 kVA s.d. <30.000 kVA): Rp1.114,74/kWh LWBP, WBP = K × LWBP. I-4/TT (≥30.000 kVA): Rp996,74/kWh. B-3/TM (bisnis besar, mis. resort, >200 kVA): Rp1.114,74/kWh. B-2/TR (6.600 VA–200 kVA): Rp1.444,70/kWh. Dasar hukum: Permen ESDM 7/2024 (tariff adjustment). Penting: pelanggan Bintan tetap ditagih tarif PLN Persero walaupun energinya dibeli dari PLN Batam.","f":["Permen ESDM 7/2024","Faktor K WBP berkisar 1,4–2 (lampiran Permen)"],"src":"Metro TV 29 Okt 2026; Permen ESDM 7/2024","isl":"U"},{"c":"T","conf":"V","loc":"batam","q":"Bagaimana perbandingannya dengan Batam?","a":"PT PLN Batam menetapkan tarif terpisah lewat ESDM dan tidak menerima subsidi maupun kompensasi, sehingga selisih BPP dan tarif ditanggung PLN Batam. Juli 2025 adalah penyesuaian pertama sejak 2017, hanya untuk rumah tangga mampu, bisnis, pemerintah, dan KSO; sebagian golongan Batam masih di bawah BPP. Ada juga transaksi antar-wilus: PLN Persero membeli energi untuk Bintan dari PLN Batam dengan harga kontrak yang tidak publik. Harga transfer ini menentukan siapa yang menanggung biaya pasokan Bintan.","f":["Penyesuaian Jul 2025 = pertama sejak 2017","Harga jual PLN Batam → PLN Persero: tidak publik"],"src":"ESDM Jun 2025; Pasardana 2022","isl":"B"},{"c":"T","conf":"V","loc":"kar","q":"Berapa tarif yang dibayar pengguna industri di Zona 1–2 Karimun atau kawasan captive?","a":"Tarif di wilayah usaha non-PLN (SDU, KPP, kawasan Lagoi/Lobam, KEK) ditetapkan melalui persetujuan pemerintah (ESDM/Pemda) per wilayah usaha dan biasanya B2B, tidak dipublikasikan. Captive (Galang Batang) bersifat biaya sendiri. Biasanya lebih tinggi dari tarif PLN karena skala kecil dan tanpa kompensasi, tetapi kawasan menawarkan keandalan/layanan khusus. Data tarif aktual perlu diperoleh dari pengelola kawasan.","f":[],"src":"Kerangka UU 30/2009 jo. perubahan; praktik wilayah usaha","isl":"K"},{"c":"T","conf":"E","loc":null,"q":"Apakah tarif yang diatur pemerintah mencerminkan biaya pasokan di pulau-pulau ini?","a":"Tidak. Tarif seragam nasional (~Rp1.115/kWh I-3) jauh di bawah biaya pokok penyediaan di sistem isolated berbasis diesel/PLTU kecil, yang bisa 2–3× lipat. Selisihnya ditutup kompensasi pemerintah ke PLN. Konsekuensinya: setiap kWh tambahan di Karimun menambah kerugian PLN, sehingga insentif investasi PLN lemah, dan IPP sulit masuk tanpa jaminan. Di sisi lain, tarif ini menarik bagi industri dibanding membangun genset sendiri.","f":["BPP per wilayah ditetapkan Kepmen ESDM"],"src":"Analisis penyusun","isl":"K"},{"c":"T","conf":"V","loc":null,"q":"Bagaimana struktur tarif waktu beban puncak untuk industri I-3?","a":"Pelanggan I-3/TM membayar tarif LWBP Rp1.114,74/kWh di luar jam puncak dan WBP = K × LWBP saat waktu beban puncak (umumnya 17.00–22.00), dengan faktor K 1,4 ≤ K ≤ 2 ditetapkan PLN per sistem. Ada juga biaya kelebihan kVArh bila power factor di bawah ketentuan (0,85). Industri dengan beban malam (shift malam, cold storage) membayar efektif lebih tinggi. Ini relevan untuk BESS behind-the-meter.","f":["Nilai K ditetapkan per sistem"],"src":"Lampiran Permen ESDM tarif tenaga listrik","isl":"U"},{"c":"T","conf":"V","loc":null,"q":"Apakah tarif listrik akan naik pada 2027?","a":"Ada risiko. Tarif dievaluasi tiap triwulan dari kurs, ICP, inflasi, dan HBA (Permen ESDM 7/2024). Asumsi Q3 2026 memakai kurs Rp16.959/US$ dan ICP US$96,12/bbl, yang menurut ESDM seharusnya mendorong kenaikan, tetapi tarif ditahan demi daya beli, termasuk Q4 2026. Untuk pemodelan: base flat nominal, dengan skenario kenaikan bertahap 2027 bila beban kompensasi APBN membesar.","f":["Kurs Rp16.959; ICP US$96,12 (asumsi Q3 2026)"],"src":"Bloomberg Technoz; Metro TV Okt 2026","isl":"U"},{"c":"T","conf":"V","loc":null,"q":"Insentif apa yang tersedia bagi pelanggan industri besar atau data center?","a":"Opsi yang ada: (1) tarif I-4 untuk ≥30 MVA (Rp996,74). (2) Layanan premium dan \"Electrifying\" bundling dari PLN. (3) Renewable Energy Certificate (REC) PLN untuk klaim hijau. (4) Diskon tambah daya musiman. (5) Untuk KEK: fasilitas fiskal, dan PLN bisa membangun infrastruktur dedicated (Diktum KETIGA RUPTL). Data center di Batam menegosiasikan PJBTL dengan PLN Batam yang memuat jadwal ramp dan kualitas layanan.","f":[],"src":"PLN; RUPTL Diktum KETIGA","isl":"B"},{"c":"T","conf":"E","loc":null,"q":"Berapa biaya total pembangkit sendiri dibanding listrik PLN bagi industri di Karimun?","a":"Genset diesel sendiri: bahan bakar ±Rp3.000–4.000/kWh + O&M + capex, jadi ±Rp4.000+/kWh. Tarif PLN I-3 ±Rp1.115–1.600/kWh (rata-rata dengan WBP). PLTS atap untuk konsumsi siang ±Rp800–1.200/kWh LCOE. Jadi pelanggan ingin PLN; mereka memakai genset hanya karena keandalan. Ini argumen kuat bahwa investasi keandalan PLN langsung menurunkan biaya industri lokal.","f":["Estimasi; sensitif harga solar industri"],"src":"Estimasi penyusun","isl":"K"},{"c":"T","conf":"E","loc":null,"q":"Bagaimana memperkirakan tarif yang akan dibayar data center di Bintan?","a":"Tiga skenario: (1) Pelanggan PLN Persero I-4/TT ±Rp997/kWh + biaya premium/REC, paling murah tetapi tergantung kemampuan grid. (2) Pasokan kawasan/wilayah usaha (mis. KEK Galang Batang) dengan tarif B2B yang mencerminkan biaya pembangkit dedicated (gas/PLTS+BESS), kemungkinan USD 8–12 sen/kWh. (3) Hybrid: PLN baseload + PLTS kawasan. Hyperscaler biasanya peduli tiga hal: kepastian pasokan, jalur hijau, dan harga stabil jangka panjang.","f":[],"src":"Estimasi penyusun","isl":"B"},{"c":"R","conf":"V","loc":"corr","q":"Apa kendala utama keandalan transmisi di Bintan?","a":"Pertama, satu koridor 150 kV dari Batam: PLTU Tanjung Kasam → Pulau Tanjung Sauh → Pulau Ngenang (kabel laut 3,45 km + kabel tanah 1 km) → kabel laut 6,55 km → Tanjung Taloh (Bintan). Kedua, satu operator sistem di Batam: gangguan satu GI di Batam (Sungai Harapan, Okt 2026) menjatuhkan Bintan. Ketiga, SUTT Bintan radial: Tanjung Uban–Sri Bintan 28 kmr, Sri Bintan–Air Raja 38 kmr, Air Raja–Kijang 20 kmr. Keempat, pembangkit lokal terlalu kecil untuk islanding. Kelima, kabel laut butuh waktu lama untuk diperbaiki. Studi UI (Purba & Garniwa, IJECBE 2025) menyebut ketergantungan pada kabel laut + SUTT 150 kV dari Batam sebagai systemic weak point. Rating termal dan jumlah sirkit kabel tidak publik.","f":["RUPTL II.3.1: transmisi direncanakan N-1","IJECBE 2025: systemic weak point"],"src":"ESDM 2013; detik 2016; IJECBE 2025; laporan Okt 2026","isl":"B"},{"c":"R","conf":"V","loc":"kar","q":"Apa masalah keandalan distribusi di Karimun dan Tanjungpinang?","a":"Distribusi 20 kV saluran udara panjang di daerah berbukit dan pesisir: gangguan pohon, petir (isokeraunik tinggi di khatulistiwa), hewan (kelelawar, monyet; disebut juga dalam versi penyebab blackout Batam), korosi garam. Di Karimun ditambah masalah frekuensi akibat pembangkitan. UP3 Tanjungpinang juga mengelola >100 pembangkit kecil, sehingga sumber daya O&M tersebar. SAIDI/SAIFI per ULP tidak dipublikasikan.","f":["Ombudsman Jan 2026: geografi kepulauan kendala utama"],"src":"Ombudsman Kepri 2026; laporan gangguan","isl":"K"},{"c":"R","conf":"V","loc":null,"q":"Apakah ada angka SAIDI/SAIFI untuk Bintan dan Karimun?","a":"Tidak ada angka per UP3/UID di RUPTL maupun publik. Yang tersedia nasional (RUPTL Tabel 4.51): SAIDI 19,0 jam/pelanggan dan SAIFI 11,5 kali (2019), 7,7/5,6 (2022), 5,6/4,3 (2023), 4,5/2,7 (2024 s.d. Okt). Tren nasional membaik tajam, tetapi Bintan dan Karimun kemungkinan jauh di atas rata-rata: blackout 15–16 jam (Okt 2026) saja sudah melebihi SAIDI nasional setahun, dan padam bergilir Karimun 2022 berlangsung ±25 hari. Untuk angka resmi, minta ke PLN UID Riau & Kepri.","f":["RUPTL Tabel 4.51","Okt 2026: 15–16 jam > SAIDI nasional 4,5 jam"],"src":"RUPTL Tabel 4.51; laporan gangguan","isl":"U"},{"c":"R","conf":"V","loc":"bin","q":"Seberapa tinggi pembebanan gardu induk di Bintan?","a":"RUPTL Tabel A4.4: GI 150/20 kV di Bintan Ngenang 10, Tanjung Uban 60, Sri Bintan 60, Air Raja 120, Kijang 60 MVA, total 310 MVA (9 trafo). Dengan beban Bintan ±105 MW (±117 MVA pada pf 0,9), pembebanan rata-rata ±38%. RUPTL memicu extension di 70–80%, dan Air Raja (Tanjungpinang, beban terbesar) memang dijadwalkan extension 1×60 MVA pada 2030. Jadi trafo bukan kendala utama. Kendalanya pasokan ke GI (satu koridor) dan SUTT Tanjung Uban–Sri Bintan yang dijadwalkan rekonduktoring 2031.","f":["A4.4: 310 MVA, 9 trafo","Air Raja +60 MVA (2030); rekonduktoring TU–SB 32 kms (2031)"],"src":"RUPTL Tabel A4.4 & tabel transmisi A4","isl":"B"},{"c":"R","conf":"V","loc":"tsauh","q":"Investasi apa yang direncanakan untuk memperbaiki keandalan Bintan?","a":"Sudah berjalan: GI Tanjung Sauh (9 Nov 2026) untuk konektivitas dan fleksibilitas dispatch Batam–Bintan. PLTMG MaxPower Sagulung 60 MW dengan free governor dan black start. Rencana BESS PLN Batam. Di RUPTL: PLTMG 100 MW untuk Bintan (2027), GI Air Raja +60 MVA (2030), SUTT Sri Bintan–KTT Bintan Resort (2030), rekonduktoring Tanjung Uban–Sri Bintan (2031), ISBB (2031), dan ekstensi 500 kV ke Bintan (2032, bersyarat). Yang belum ada: kabel kedua Batam–Bintan berkomitmen dan kajian proteksi/islanding pasca-blackout.","f":["Realisasi transmisi nasional 2025 hanya ±37% target"],"src":"Listrik Indonesia Nov 2026; RUPTL A4; Kontan Jul 2026","isl":"B"},{"c":"R","conf":"E","loc":"bin","q":"Apa satu investasi keandalan paling efektif untuk Bintan?","a":"Dari prinsip dasar: hilangkan single point of failure. Dua jalur setara: (a) sirkit kedua/kabel laut kedua di rute berbeda, atau (b) pembangkit firm lokal 60–80 MW (mis. PLTMG di Kijang/Air Raja) + BESS untuk ride-through. Opsi (b) lebih cepat (18–30 bulan), tidak bergantung izin kabel laut, dan juga menjadi blackstart lokal. Opsi (a) lebih murah per MW jangka panjang. RUPTL sudah punya kendaraannya: PLTMG 100 MW (2027) via wilus PLN Batam. Bila ditempatkan di Pulau Bintan dengan BESS dan skema islanding, single point of failure hilang sebelum 500 kV (2032).","f":[],"src":"Rekomendasi penyusun","isl":"B"},{"c":"R","conf":"V","loc":null,"q":"Apa kata standar perencanaan PLN tentang pasokan sirkit tunggal?","a":"RUPTL 2025–2034 II.3.1: transmisi dan GI direncanakan dengan kontingensi N-1 statis (satu sirkit/trafo padam, sisanya harus menyalurkan seluruh beban) dan dinamis (gangguan + kehilangan satu sirkit tidak boleh menyebabkan hilang sinkron). Bila N-1 belum terpenuhi karena kendala proyek, dilakukan mitigasi jangka pendek (pola operasi). Untuk kondisi khusus yang bisa menyebabkan blackout meluas, dipakai kriteria credible contingency. Bintan adalah contoh di mana mitigasi jangka pendek ternyata tidak cukup.","f":["RUPTL II.3.1 butir 1"],"src":"RUPTL 2025–2034 II.3.1","isl":"B"},{"c":"R","conf":"E","loc":"kar","q":"Investasi apa yang Anda sarankan untuk distribusi dan jaringan Karimun?","a":"Setelah kapasitas firm: (1) BESS + skema UFLS bertahap supaya gangguan pembangkit tidak jadi blackout total. (2) Otomasi penyulang (recloser, sectionalizer, FDIR) di penyulang panjang. (3) Program right-of-way pohon dan arrester petir. (4) Kabel bawah tanah di pusat Tanjung Balai. (5) Interkoneksi 20 kV/150 kV antar-zona (PLN–KPP–SDU) untuk pooling cadangan. (6) Percepat interkoneksi 150 kV Sumatera–Selat Panjang–Rangsang–TBK (RUPTL) dan GI TBK 2×30 MVA; setelah masuk, pertahankan PLTU/PLTD sebagai backup kabel tunggal.","f":[],"src":"Rekomendasi penyusun","isl":"K"},{"c":"R","conf":"V","loc":"inc1","q":"Apa penyebab blackout Oktober 2026?","a":"Penyebab resmi belum final per 23 Okt 2026 (ESDM masih mengumpulkan data). Indikasi awal: hewan liar, disebut kelelawar, masuk GI Sungai Harapan di Batam. Gangguan mulai 06.37 WIB lalu merembet ke seluruh sistem. PLN Batam menegaskan tidak terkait uji data center. PLN mengakui perawatan infrastruktur perlu dibenahi. Dari sisi sistem: gangguan satu GI bisa menjatuhkan seluruh sistem walaupun cadangan ±19–20%. Masalahnya ada di proteksi dan pemisahan sistem, bukan kekurangan MW.","f":[],"src":"Bloomberg Technoz; Listrik Indonesia 23 Okt 2026; w.media","isl":"B"},{"c":"R","conf":"E","loc":null,"q":"Seberapa rentan kabel laut di kawasan ini?","a":"Selat di sekitar Batam–Bintan adalah salah satu jalur pelayaran tersibuk di dunia dengan banyak kapal labuh. Risiko utama kabel laut: jangkar dan alat tangkap, arus kuat, serta erosi. Perbaikan kabel laut bisa butuh minggu–bulan (kapal khusus, sambungan). Karena itu kabel laut tunggal untuk ±70 MW beban kritis adalah risiko tinggi. Mitigasinya: rute kedua, proteksi (burial, armour), zona larangan labuh, dan stok suku cadang.","f":["Kabel laut Batam–Bintan total ±10 km (3,45 + 6,55)"],"src":"ESDM 2013; analisis","isl":"B"},{"c":"R","conf":"E","loc":null,"q":"Apakah ledakan data center berisiko bagi keandalan pelanggan rumah tangga?","a":"Bisa, bila pembangkitan tidak mengikuti. Data center mengambil kapasitas firm besar dengan load factor tinggi, sehingga reserve untuk sistem berkurang. Setelah blackout Okt 2026 muncul kecurigaan publik, meskipun PLN Batam membantah keterkaitannya. Data center juga bisa membantu: membawa investasi GI baru, UPS/BESS besar yang bisa memberi layanan grid, dan PJBTL jangka panjang yang membiayai pembangkit. Kuncinya sekuensing: pembangkit dan GI harus datang sebelum beban.","f":[],"src":"Analisis penyusun","isl":"B"},{"c":"R","conf":"E","loc":null,"q":"Indikator kinerja (KPI) apa yang dipantau untuk menilai kemajuan keandalan?","a":"(1) Reserve margin per sistem vs kriteria RUPTL (Karimun ≥35%/N-2; Batam–Bintan ≥25–35%). (2) Jumlah dan durasi padam bergilir per bulan. (3) SAIDI/SAIFI per ULP. (4) Waktu pemulihan Bintan setelah gangguan Batam (target < 1 jam dengan islanding). (5) EAF/EFOR PLTU Tanjung Sebatak. (6) Pembebanan GI dan penyulang (<70–80%). (7) Energi tidak tersalurkan (ENS, MWh).","f":[],"src":"Praktik perencanaan","isl":"U"},{"c":"I","conf":"V","loc":"corr","q":"Jelaskan interkoneksi Batam–Bintan.","a":"Kontrak 21 Mar 2013. Koridor barat: PLTU Tanjung Kasam (Batam) → Pulau Tanjung Sauh → Pulau Ngenang, kabel laut 3,45 km + kabel tanah 1 km, 150 kV. Koridor timur: Ngenang → Tanjung Taloh (Bintan), kabel laut 6,55 km. Energize 10 Nov 2015 bersamaan dengan GI Tanjung Uban 30 MVA dan GI Ngenang 10 MVA. SUTT Bintan selesai s.d. Agt 2016: Tanjung Uban–Sri Bintan 28 kmr, Sri Bintan–Air Raja 38 kmr, Air Raja–Kijang 20 kmr. Transfer awal 20 MW lalu ±34 MW (2016), saat beban puncak Bintan 65,1 MW. Sejak itu Batam–Bintan menjadi satu sistem yang dioperasikan PLN Batam, sementara PLN Persero menjual ke pelanggan Bintan. Penghematan awal ±Rp11,46 miliar/bulan.","f":["GI saat ini 310 MVA (A4.4)","Energi Bintan dicatat sebagai impor antar-wilus"],"src":"ESDM 2013; Setkab 2016; detik 2016; RUPTL A4","isl":"B"},{"c":"I","conf":"V","loc":"corr","q":"Berapa kapasitas transfer interkoneksi Batam–Bintan?","a":"Tidak dipublikasikan, termasuk di RUPTL. Rating termal dan jumlah sirkit kabel laut serta status N-1-nya tidak ada di dokumen publik. Yang diketahui: 150 kV, GI hilir total 310 MVA, transfer awal 20→34 MW (2016), dan beban yang dipasok kini ±70 MW atau lebih. Angka MW tidak dapat dipastikan dari data publik. Poinnya: hari ini kendala bukan kapasitas termal, melainkan redundansi dan proteksi. RUPTL juga tidak menjadwalkan penambahan sirkit kabel laut 150 kV, dan penguatan berikutnya baru ekstensi 500 kV (2032, bersyarat).","f":["Data gap: rating termal, jumlah sirkit, status N-1"],"src":"RUPTL A4; Setkab 2016","isl":"B"},{"c":"I","conf":"V","loc":"isbb","q":"Apakah ada rencana menyambungkan Sumatera ke Batam dan Bintan?","a":"Ya, Interkoneksi Sumatera–Batam (ISBB). Peranap → LP Sungai Guntung OHL HVDC 360 kms; Sungai Guntung → Rempang kabel laut HVDC 156 kms; konverter 1.500 MW + GITET 500/150 kV 3×500 MVA. COD 2031, transfer awal 1.200 MW (neraca Sumatera mencatat \"Transfer ke Sistem Batam −1.200 MW\" 2031–2034), bersumber dari EBT Sumatera. Opsi AC/DC masih dikaji. Tahap 2 (2032): sirkit kedua + konverter 1.500 MW. ISBB disebut bisa melayani pertumbuhan hingga ±3 GW di Batam–Bintan, termasuk data center, dan membuka opsi ekspor Sumatera–(Batam)–Singapura 0,6–1,1 GW (AIMS III). RUPTL menyarankan ISBB dipercepat.","f":["RUPTL hlm V-107, V-324","hlm A-51 & Lampiran E menulis 2028 — inkonsisten"],"src":"RUPTL 2025–2034 Bab V.5.7, V.11.2, Lampiran A4/E","isl":"B"},{"c":"I","conf":"V","loc":"karint","q":"Kapan Karimun realistis tersambung interkoneksi?","a":"RUPTL sudah merencanakannya: 150 kV Sumatera → Selat Panjang → Pulau Rangsang → TBK (SKLT 6 kms + SUTT 120 kms + SKLT 70 kms + 14 kms), GI TBK 2×30 MVA. Tanggalnya tidak konsisten. Tabel transmisi Riau menulis 2026, Committed; Bab V.11.2 menyebut segmen Selat Panjang–TBK \"masih tahap perencanaan\"; Lampiran E menulis 2028. Realisasi transmisi nasional 2025 hanya ±37% target (lahan, izin). Penilaian saya: 2027–2028, dengan kabel laut 70 km sebagai jalur kritis. Implikasinya, diesel Karimun bertahan lebih lama dari angka di tabel.","f":["Tiga versi COD dalam satu dokumen","Kontan Jul 2026: realisasi transmisi 2025 ±37%"],"src":"RUPTL A4, V.11.2, Lampiran E; Kontan Jul 2026","isl":"K"},{"c":"I","conf":"V","loc":"corr","q":"Bagaimana interkoneksi mengubah Bintan sejak 2016?","a":"Positifnya: menggantikan PLTD/PLTMG sewa, menghemat ±Rp11,46 miliar/bulan, memungkinkan beban tumbuh dari 65,1 MW (2016) ke ±100+ MW, dan memasok kawasan Lagoi/Lobam (160 MVA). Negatifnya: Bintan kehilangan pembangkit lokal dan sepenuhnya bergantung pada sistem Batam. Energinya dicatat sebagai impor antar-wilus, operatornya PLN Batam, dan gangguan di Batam memadamkan Bintan (1 Jan 2023, 12 Okt 2026). RUPTL bahkan mengganti rencana \"PLT EBT Base Bintan 200 MW\" dengan kerja sama PLTMG di wilus PLN Batam, yang memperkuat ketergantungan itu.","f":["Padam ikut Batam: 1 Jan 2023, 12 Okt 2026"],"src":"Setkab 2016; RUPTL hlm A-52; Jawapos 2023","isl":"B"},{"c":"I","conf":"V","loc":"isbb","q":"Penguatan interkoneksi Batam–Bintan apa yang direncanakan RUPTL?","a":"Tidak ada kabel laut 150 kV kedua dalam RUPTL. Yang ada adalah ekstensi 500 kV ke Bintan (2032), hanya bila demand pasti: Rempang → LP Sabang Mas → LP Ngenang → Ngenang → LP Tanjung Taloh → GITET Bintan (500/150 kV 1×250 MVA) → GITET KTT BAI/Data Center, total 162 kms. Ini akan menjadi jalur kedua yang sesungguhnya ke Bintan, tetapi terikat pada KTT confidence rendah. Ada juga SUTT 150 kV GI Rempang/Tanjung Gundap → GI Panaran 40 kms (2031, perlu studi) di sisi Batam. Jadi sampai 2032, Bintan tetap satu koridor. Opsi alternatif: kabel 150 kV paralel di rute berbeda (±USD 2–4 juta/km) atau PLTMG 100 MW ditempatkan di Bintan.","f":["500 kV ext 162 kms, 2032, bersyarat"],"src":"RUPTL Lampiran A4, V.11.2","isl":"B"},{"c":"I","conf":"V","loc":"isbb","q":"Bagaimana posisi ASEAN Power Grid dan interkoneksi ke Singapura?","a":"ISBB membuka koridor Sumatera–(Batam)–Singapura dengan opsi ekspor 0,6–1,1 GW (AIMS III). Kepri berada di antara Sumatera dan Singapura, sehingga menjadi koridor alami ASEAN Power Grid. Proyek ekspor PLTS (Vena, Equator, Singa Renewables, Sembcorp, Gotion–Oriens Belat) butuh kabel ke Singapura. Untuk grid lokal, kalau kabel ekspor dibangun, pemerintah ingin ada porsi domestik untuk menarik industri/data center ke BBK. Target impor Singapura ±6 GW pada 2035.","f":["AIMS III: 0,6–1,1 GW","EMA: 13 proyek impor berlisensi/conditional"],"src":"RUPTL V.11.2; EMA; Enerdata","isl":"U"},{"c":"I","conf":"V","loc":"bin","q":"Siapa yang membiayai penyambungan beban baru di Bintan, dan apa ganjalan komersialnya?","a":"RUPTL menyebut PLN membuka connection hub di Bintan selama ada kesepakatan \"sharing recovery investment yang adil\" dengan PLN Batam. Ini titik negosiasi antar-wilus: PLN Persero melayani pelanggan Bintan, tetapi pasokan dan sebagian pembangkit ada di wilus PLN Batam. Ditambah syarat take-or-pay untuk pengembang. Model yang realistis: anchor customer (KTT/DC) menjamin utilisasi lewat take-or-pay, PLN Persero dan PLN Batam membagi investasi dan recovery, dan ISBB/500 kV dibiayai dari demand besar. Harga transfer PLN Batam ke PLN Persero tidak publik.","f":["RUPTL: connection hub Bintan, sharing recovery investment"],"src":"RUPTL Lampiran A4","isl":"B"},{"c":"I","conf":"E","loc":null,"q":"Jika bisa mengubah satu hal dalam RUPTL untuk Bintan dan Karimun, apa itu?","a":"Memperlakukan keandalan sebagai kebutuhan eksplisit, bukan sisa dari neraca energi. Untuk Bintan: masukkan proyek N-1 (jalur kedua atau firm lokal + BESS) dengan COD pasti sebelum 2029. Untuk Karimun: jalankan kriteria isolated RUPTL sendiri (N-2/RM 35%) dengan blok firm modular + BESS dalam 24 bulan dan pooling dengan wilayah usaha swasta. Lalu kaitkan pembangunan dengan anchor load (data center, KEK) supaya biaya kabel/pembangkit dibagi.","f":[],"src":"Pendapat penyusun","isl":"U"},{"c":"I","conf":"E","loc":null,"q":"Apa yang perlu dipantau investor atau konsultan dalam 12 bulan ke depan?","a":"(1) Hasil resmi investigasi blackout 12 Okt 2026 dan respons PLN (proyek sirkit kedua/pembangkit Bintan). (2) Revisi RUPTL/RUPTL PLN Batam yang memasukkan beban data center BBK. (3) COD PLTGU Batam #1 dan financial close Batam 3&4. (4) Konversi MoU data center (SOS Galang Batang, DCI) ke PJBTL. (5) Keputusan terms ekspor listrik RI–Singapura. (6) Status kapasitas firm dan padam bergilir di Karimun. (7) Kebij     s+=`<rect class="gx" style="animation-delay:${i*.08}s" x="${x0}" y="${y}" width="${Math.max(4,x1-x0)}" height="${bh}" rx="${bh/2}" fill="${r.c}" ${sty}><title>${esc(r.l)}: ${esc(r.t||fmt(r.v)+' '+unit)}</title></rect>`;
    s+=`<text class="lb fd" x="${W-m.r+8}" y="${y+bh/2+4}">${esc(r.t||fmt(r.v,r.v%1?1:0)+' '+unit)}</text>`});

}
function gauge(o){ // v,max,label,sub,c, mark{v,t}
  const cx=W/2,cy=H-40,r=Math.min(150,H-70),a0=Math.PI,ang=v=>a0-(v/o.max)*Math.PI,pt=(v,rr)=>[cx+rr*Math.cos(ang(v)),cy-rr*Math.sin(ang(v))];
  const arc=(v0,v1,rr)=>{const p0=pt(v0,rr),p1=pt(v1,rr);return `M${p0[0]},${p0[1]}A${rr},${rr} 0 ${(v1-v0)/o.max>.5?1:0} 1 ${p1[0]},${p1[1]}`};
  let s=`<path d="${arc(0,o.max,r)}" stroke="#eef3f7" stroke-width="26" fill="none" stroke-linecap="round"/>`;
  (o.zones||[]).forEach(z=>s+=`<path d="${arc(z[0],z[1],r+20)}" stroke="${z[2]}" stroke-width="5" fill="none" opacity=".55"/>`);
  s+=`<path class="dl" pathLength="1" d="${arc(0,o.v,r)}" stroke="${o.c}" stroke-width="26" fill="none" stroke-linecap="round"/>`;
  if(o.mark){const p=pt(o.mark.v,r+34),q=pt(o.mark.v,r-16);s+=`<line class="fd" x1="${q[0]}" y1="${q[1]}" x2="${pt(o.mark.v,r+16)[0]}" y2="${pt(o.mark.v,r+16)[1]}" stroke="${C.ink}" stroke-width="2.5"/><text class="fd lb" x="${p[0]}" y="${p[1]}" text-anchor="middle">${esc(o.mark.t)}</text>`}
  s+=`<text class="lb" x="${cx}" y="${cy-18}" text-anchor="middle" style="font-size:38px;fill:${o.c}">${esc(o.label)}</text><text x="${cx}" y="${cy+6}" text-anchor="middle" style="font-family:var(--f);font-weight:700;font-size:12px">${esc(o.sub)}</text>`;
  s+=`<text x="${cx-r}" y="${cy+22}" text-anchor="middle">0</text><text x="${cx+r}" y="${cy+22}" text-anchor="middle">${fmt(o.max)}${o.u||''}</text>`;
  return svg(s);
}
function timeline(items){ // [{y,t,c,ic}]
  const m={l:24,r:24},w=W-m.l-m.r,n=items.length,X=i=>m.l+(n===1?w/2:i/(n-1)*w),cy=H/2;let s=`<line class="dl" pathLength="1" x1="${m.l}" x2="${W-m.r}" y1="${cy}" y2="${cy}" stroke="#c9d6df" stroke-width="3"/>`;
  const fi=items.findIndex(it=>it.f);if(fi>0)s+=`<line x1="${(X(fi-1)+X(fi))/2}" x2="${W-m.r}" y1="${cy}" y2="${cy}" stroke="#fff" stroke-width="4" stroke-dasharray="6 5"/><text x="${(X(fi-1)+X(fi))/2+4}" y="${cy-8}" style="font-family:var(--f);font-weight:800;font-size:9px;fill:#2b5fa8;letter-spacing:.05em">RENCANA ⇢</text>`;
  items.forEach((it,i)=>{const up=i%2===0,x=X(i);s+=`<g class="fd" style="animation-delay:${.3+i*.12}s"><line x1="${x}" x2="${x}" y1="${cy}" y2="${up?cy-36:cy+36}" stroke="${it.c}" stroke-width="2" ${it.f?'stroke-dasharray="3 3"':''}/><circle cx="${x}" cy="${cy}" r="9" fill="${it.f?'#fff':it.c}" stroke="${it.c}" stroke-width="3" ${it.f?'stroke-dasharray="4 3"':''}/>
   <text x="${x}" y="${up?cy-70:cy+56}" text-anchor="middle" class="lb" style="fill:${it.c};font-size:12px">${esc(it.y)}</text>${wrap(it.t,x,up?cy-56:cy+70,15)}</g>`});
  return svg(s);
}
function wrap(t,x,y,max){const words=t.split(' '),ls=[];let cur='';words.forEach(w=>{if((cur+' '+w).trim().length>max&&cur){ls.push(cur);cur=w}else cur=(cur+' '+w).trim()});if(cur)ls.push(cur);return ls.slice(0,3).map((l,i)=>`<text x="${x}" y="${y+i*12}" text-anchor="middle" style="font-family:var(--f);font-size:10.5px;font-weight:600;fill:var(--ink)">${esc(l)}</text>`).join('')}
function svg(s,vb){return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${s}</svg>`}
/* infographic: flow diagram nodes → nodes */
function flow(o){ // nodes[{x,y,t,v,c,ic,r}], links[{a,b,c,w,t,dash}]
  let s='';
  o.links.forEach(l=>{const a=o.nodes[l.a],b=o.nodes[l.b],mx=(a.x+b.x)/2,my=(a.y+b.y)/2-(l.bend||0);
   s+=`<path d="M${a.x},${a.y}Q${mx},${my} ${b.x},${b.y}" fill="none" stroke="${l.c}" stroke-width="${l.w||4}" opacity=".2"/><path class="flowl" d="M${a.x},${a.y}Q${mx},${my} ${b.x},${b.y}" fill="none" stroke="${l.c}" stroke-width="${l.w||4}" stroke-dasharray="${l.dash||'8 10'}" style="animation:dash ${l.sp||1.1}s linear infinite"/>`;
   if(l.t)s+=`<text class="fd" x="${mx}" y="${my+(l.ty||-6)}" text-anchor="middle" style="fill:${l.c};font-weight:700;font-size:10.5px">${esc(l.t)}</text>`});
  o.nodes.forEach((n,i)=>{const r=n.r||30;s+=`<g class="fd" style="animation-delay:${i*.1}s"><circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${n.bg||'#fff'}" stroke="${n.c}" stroke-width="3"/>${n.ring?`<circle class="ring" cx="${n.x}" cy="${n.y}" r="${r}" fill="none" stroke="${n.c}"/>`:''}
   <g transform="translate(${n.x-11},${n.y-(n.v?20:11)})" style="color:${n.c}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IP[n.ic]||''}</svg></g>
   ${n.v?`<text x="${n.x}" y="${n.y+16}" text-anchor="middle" class="lb" style="font-size:12px;fill:${n.c}">${esc(n.v)}</text>`:''}<text x="${n.x}" y="${n.y+r+15}" text-anchor="middle" style="font-family:var(--f);font-weight:700;font-size:11.5px;fill:var(--ink)">${esc(n.t)}</text>${n.s?`<text x="${n.x}" y="${n.y+r+28}" text-anchor="middle" style="font-size:9.5px">${esc(n.s)}</text>`:''}</g>`});
  return svg(s);
}
