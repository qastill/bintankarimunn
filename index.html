29/2030/2033). Ditambah PLTS Bintan via wilus PLN Batam 25+25 MW (2028, 2030). Lompatan EBT baru datang setelah 2031 lewat ISBB dari Sumatera (pangsa EBT Sumatera >30,5%). Di luar RUPTL: proyek ekspor ke Singapura skala GW.","s":"Only about 40 MW of local renewables ex-Batam by 2030 against ~240 MW load; the real green step comes through the Sumatra link after 2031.","f":["Rekap RE Base = ARED identik: total 44,8 MW hingga 2034","Potensi tambahan: PLTS komunal 24 MW, PLTBm Natuna/Tanjung Batu/Dabo/Lingga/Kundur, PLTGL Natuna 2,2 MW"],"src":"RUPTL Tabel A4.13, A4.15"},{"c":"E","conf":"V","loc":null,"q":"Which Singapore-export solar projects are located in the Riau Islands?","a":"Yang publik: Vena Energy (dengan Shell) PLTS+BESS ±2 GW di Kepri, target konstruksi 2026. Equator Renewables Asia ±900 MW PLTS + 1,2 GWh BESS di Kepri (ekspor 400 MW AC, target 2029). Singa Renewables (TotalEnergies–RGE) 1 GW dari Riau. Sembcorp ±1 GW BBK. Pacific Medco di Pulau Bulan (Batam). Gotion × Oriens Pulau Belat (Karimun) hingga 2 GW. EMA telah memberi conditional approval/licence ke 13 proyek impor dari beberapa negara. Target Singapura ±6 GW pada 2035.","s":"Several GW-scale solar-plus-storage export projects target the Riau Islands, but none has reached financial close yet.","f":["Mar 2026: negosiasi terms ekspor RI–SG tersendat","EMA: 13 proyek impor berlisensi/conditional"],"src":"EMA; pv magazine Okt 2025; Enerdata; ESDM; laporan Mar 2026"},{"c":"E","conf":"V","loc":null,"q":"What are the main hindrances to renewables here?","a":"(1) Ukuran grid: Karimun ±36 MW hanya bisa menyerap PLTS ±4–7 MW tanpa baterai sebelum masalah stabilitas/curtailment. (2) RUPTL tidak menghitung EBT intermiten sebagai cadangan tanpa firm capacity, jadi PLTS tidak menyelesaikan masalah RM. (3) Lahan: pulau kecil, mangrove, konflik masyarakat (contoh isu Rempang/Tanjung Sauh). (4) Regulasi ekspor: prioritas domestik, kewajiban manufaktur lokal/TKDN, terms ekspor belum final. (5) Harga: tarif EBT (Perpres 112/2022) vs BPP lokal. (6) Kabel laut: izin, biaya, rute. (7) Kapasitas offtaker PLN dan risiko over-supply siang hari.","s":"Small grids, solar not counting as firm capacity, land constraints and unresolved export terms — in that order.","f":["RUPTL: EBT intermiten tidak dihitung reserve tanpa capacity credit","Perpres 112/2022: harga patokan EBT"],"src":"RUPTL Bab II; Perpres 112/2022; laporan 2026"},{"c":"E","conf":"E","loc":"kar","q":"How much solar can Karimun absorb?","a":"Aturan praktis untuk sistem isolated tanpa penyimpanan: penetrasi PV instan ±10–20% beban minimum siang. Dengan beban siang Karimun ±25–30 MW, itu ±4–7 MW PLTS. Dengan BESS grid-forming dan kontrol, penetrasi bisa 30–50% energi siang, jadi ±10–15 MW PLTS + 10–20 MWh BESS. Lebih dari itu perlu penyimpanan multi-jam atau beban terkendali (desalinasi, pendingin, hidrogen kecil).","s":"About 4–7 MW without storage; 10–15 MW with a grid-forming battery.","f":["Estimasi teknis penyusun; cek studi grid PLN"],"src":"Praktik umum hybrid isolated"},{"c":"E","conf":"V","loc":null,"q":"Does solar help Karimun's reliability problem?","a":"Tidak langsung. Menurut RUPTL, EBT intermiten tidak masuk perhitungan cadangan kecuali memberi firm capacity (capacity credit), termasuk jika di-hybrid dengan PLTD. PLTS mengurangi solar/batubara di siang hari, tetapi puncak Karimun malam (18.00–22.00). Yang menolong keandalan adalah BESS (respons frekuensi, cadangan putar) dan kapasitas firm. Jadi urutannya BESS + firm dulu, PLTS sebagai penghemat bahan bakar.","s":"Solar saves fuel but doesn't fix reliability — the peak is at night and PLN doesn't count it as reserve; batteries and firm capacity do.","f":["Padam bergilir Karimun terjadi 17.30–22.00"],"src":"RUPTL II.2.2; Warta Kepri Jul 2026"},{"c":"E","conf":"V","loc":null,"q":"How do rooftop and captive solar rules affect industrial users here?","a":"Pelanggan PLN di Bintan/Karimun mengikuti aturan PLTS atap nasional (Permen ESDM 2/2024): tidak ada lagi net-metering ekspor ke PLN dan ada kuota per sistem. PLTS atap kini bernilai untuk konsumsi sendiri siang hari. Di wilayah usaha swasta/kawasan, operator kawasan bisa membangun PLTS sendiri. Data center dan industri yang mengejar RE100 bisa memakai REC PLN, PLTS kawasan, atau skema power wheeling (masih diperdebatkan regulasinya).","s":"Rooftop solar is self-consumption only now, no export credit; serious green supply goes through PLN RECs, zone-level plants or future wheeling.","f":["Permen ESDM 2/2024 PLTS atap"],"src":"Permen ESDM 2/2024"},{"c":"E","conf":"V","loc":null,"q":"What renewable potential does the RUPTL identify for the Riau Islands?","a":"Potensi tambahan yang tercatat di RUPTL: PLTS komunal tersebar 24 MW; PLTBm Natuna 4 MW, Tanjung Batu 2+2 MW, Dabo 4 MW, Lingga 2 MW, Kundur (Kab. Karimun) 2,5 MW; PLTS Kepri tersebar 1,8 MW; PLTGL (gelombang) Natuna 2,2 MW. Semuanya kecil, karena RUPTL melihat Kepri sebagai kumpulan sistem pulau kecil. Potensi besar (PLTS skala ratusan MW–GW) ada di proyek ekspor dan di kuota Batam–Bintan, bukan di tabel Kepri tanpa Batam.","s":"RUPTL's local RE potential list is tiny — tens of MW of biomass and community solar; the big solar sits in the Batam–Bintan and export pipelines.","f":["RUPTL Lampiran A4 potensi EBT"],"src":"RUPTL Lampiran A4"},{"c":"E","conf":"V","loc":null,"q":"What are the political-economy issues with exporting green power to Singapore?","a":"Ada empat. (1) Prioritas domestik: pemerintah ingin listrik hijau juga menarik industri/data center ke Kepri, bukan hanya diekspor. Karena itu Bahlil (Okt 2026) mengaitkan PLTS dengan hub data center BBK. (2) Syarat manufaktur lokal panel/baterai: ada pabrik panel di Kepri seperti Xinyi di Rempang. (3) Harga dan pembagian manfaat: negosiasi terms tersendat (Mar 2026). (4) Isu sosial-lingkungan: lahan pulau, masyarakat pesisir, kritik \"raiding Riau\".","s":"Indonesia wants the green electrons to anchor industry at home, not just flow to Singapore — that's the core tension.","f":["ESDM: RI–Singapura matangkan rencana ekspor listrik bersih"],"src":"ESDM 2026; Antara; JOM"},{"c":"E","conf":"E","loc":null,"q":"What role will battery storage play?","a":"Besar dan cepat. Tiga fungsi: (1) Keandalan: respons frekuensi dan cadangan putar untuk sistem kecil (Karimun) dan untuk menahan islanding Bintan saat koridor gangguan. (2) Integrasi PLTS: menggeser energi siang ke puncak malam. (3) Penundaan investasi jaringan. PLN Batam sudah menyebut rencana BESS 2027–2032 pasca-blackout. RUPTL nasional memuat 10,3 GW storage. Harga BESS turun tajam sehingga kini kompetitif dibanding PLTD untuk layanan cadangan.","s":"Batteries are the fastest reliability fix here — frequency response for Karimun, ride-through for Bintan, and solar shifting.","f":["RUPTL: 10.256 MW storage","PLN Batam: rencana BESS"],"src":"RUPTL; Listrik Indonesia Okt 2026"},{"c":"E","conf":"V","loc":"kar","q":"Why are biomass and syngas being tried in Karimun?","a":"Karena bisa menghasilkan daya firm (bukan intermiten) dan menggantikan BBM di sistem isolated, sesuai pola dedieselisasi RUPTL. Kendalanya kontinuitas bahan baku (kayu/serbuk/limbah pertanian di pulau kecil terbatas), biaya logistik, dan skala kecil (1–5 MW). Pilot PLN EPI × KPP menguji model rantai pasok.","s":"Biomass gives firm, dispatchable renewables — the constraint is feedstock on a small island.","f":["MoU 6 Apr 2026, 1→2–5 MW"],"src":"Listrik Indonesia 2026"},{"c":"E","conf":"E","loc":null,"q":"What is the realistic RE share for Bintan and Karimun by 2030?","a":"Rendah, sampai interkoneksi masuk. Kepri tanpa Batam: ±40 MW EBT lokal vs ±241 MW beban (2030); dalam energi, PLTS ±18–20% CF, jadi pangsa ±5%. Bintan bergantung bauran Batam yang hampir 100% fosil, ditambah PLTS 50 MW wilus, menjadi ±5–10%. Karimun berbeda: begitu kabel 150 kV dari Sumatera masuk (2027–28), bauran Karimun ikut grid Sumatera, sehingga diesel tergeser tanpa banyak EBT lokal. Itu cara tercepat menaikkan pangsa EBT Karimun.","s":"Single digits for Bintan until 2031; Karimun jumps the moment it plugs into Sumatra's mix.","f":["Sumatera: tambahan EBT 11 GW (66,3%) hingga 2034"],"src":"RUPTL A4.15, Bab V; estimasi penyusun"},{"c":"T","conf":"V","loc":null,"q":"What is the industrial tariff for PLN customers in Bintan and Karimun?","a":"Bintan dan Karimun Zona 3 adalah wilayah PLN Persero, jadi tarifnya nasional. Q4 2026 (Okt–Des) tidak berubah dari Q3. I-3/TM (>200 kVA s.d. <30.000 kVA): Rp1.114,74/kWh LWBP, WBP = K × LWBP. I-4/TT (≥30.000 kVA): Rp996,74/kWh. B-3/TM (bisnis besar, mis. resort, >200 kVA): Rp1.114,74/kWh. B-2/TR (6.600 VA–200 kVA): Rp1.444,70/kWh. Dasar hukum: Permen ESDM 7/2024 (tariff adjustment). Penting: pelanggan Bintan tetap ditagih tarif PLN Persero walaupun energinya dibeli dari PLN Batam.","s":"National PLN tariff applies: Rp1,114.74 per kWh off-peak for I-3, Rp996.74 for I-4 — flat through Q4 2026, even though Bintan's energy is bought from PLN Batam.","f":["Permen ESDM 7/2024","Faktor K WBP 1,4–2: cek lampiran Permen sebelum dikutip"],"src":"Metro TV 29 Okt 2026; Permen ESDM 7/2024"},{"c":"T","conf":"V","loc":"batam","q":"How does that compare with Batam?","a":"PT PLN Batam menetapkan tarif terpisah lewat ESDM dan tidak menerima subsidi maupun kompensasi, sehingga selisih BPP dan tarif ditanggung PLN Batam. Juli 2025 adalah penyesuaian pertama sejak 2017, hanya untuk rumah tangga mampu, bisnis, pemerintah, dan KSO; sebagian golongan Batam masih di bawah BPP. Ada juga transaksi antar-wilus: PLN Persero membeli energi untuk Bintan dari PLN Batam dengan harga kontrak yang tidak publik. Harga transfer ini menentukan siapa yang menanggung biaya pasokan Bintan.","s":"Batam has its own unsubsidised tariff; Bintan pays the national rate, and the inter-licence transfer price in between isn't public.","f":["Penyesuaian Jul 2025 = pertama sejak 2017","Harga jual PLN Batam → PLN Persero: tidak publik"],"src":"ESDM Jun 2025; Pasardana 2022"},{"c":"T","conf":"V","loc":"kar","q":"What tariff do industrial users in Karimun Zones 1–2 or captive estates pay?","a":"Tarif di wilayah usaha non-PLN (SDU, KPP, kawasan Lagoi/Lobam, KEK) ditetapkan melalui persetujuan pemerintah (ESDM/Pemda) per wilayah usaha dan biasanya B2B, tidak dipublikasikan. Captive (Galang Batang) bersifat biaya sendiri. Biasanya lebih tinggi dari tarif PLN karena skala kecil dan tanpa kompensasi, tetapi kawasan menawarkan keandalan/layanan khusus. Untuk studi klien, minta data langsung dari pengelola kawasan.","s":"Private licence-area tariffs are bilateral and unpublished — usually above PLN's regulated rate.","f":[],"src":"Kerangka UU 30/2009 jo. perubahan; praktik wilayah usaha"},{"c":"T","conf":"E","loc":null,"q":"Is the regulated tariff cost-reflective for these islands?","a":"Tidak. Tarif seragam nasional (~Rp1.115/kWh I-3) jauh di bawah biaya pokok penyediaan di sistem isolated berbasis diesel/PLTU kecil, yang bisa 2–3× lipat. Selisihnya ditutup kompensasi pemerintah ke PLN. Konsekuensinya: setiap kWh tambahan di Karimun menambah kerugian PLN, sehingga insentif investasi PLN lemah, dan IPP sulit masuk tanpa jaminan. Di sisi lain, tarif ini menarik bagi industri dibanding membangun genset sendiri.","s":"No — the uniform tariff is well below island supply cost, which is exactly why investment in places like Karimun lags.","f":["BPP per wilayah: Kepmen ESDM (cek nilai Kepri)"],"src":"Analisis penyusun"},{"c":"T","conf":"V","loc":null,"q":"How does the time-of-use structure work for I-3 industry?","a":"Pelanggan I-3/TM membayar tarif LWBP Rp1.114,74/kWh di luar jam puncak dan WBP = K × LWBP saat waktu beban puncak (umumnya 17.00–22.00), dengan faktor K 1,4 ≤ K ≤ 2 ditetapkan PLN per sistem. Ada juga biaya kelebihan kVArh bila power factor di bawah ketentuan (0,85). Industri dengan beban malam (shift malam, cold storage) membayar efektif lebih tinggi. Ini relevan untuk BESS behind-the-meter.","s":"I-3 pays a peak multiplier of 1.4 to 2 times during the evening peak — that creates a case for behind-the-meter storage.","f":["K ditetapkan per sistem — cek nilai UP3"],"src":"Lampiran Permen ESDM tarif tenaga listrik"},{"c":"T","conf":"V","loc":null,"q":"Will tariffs rise in 2027?","a":"Ada risiko. Tarif dievaluasi tiap triwulan dari kurs, ICP, inflasi, dan HBA (Permen ESDM 7/2024). Asumsi Q3 2026 memakai kurs Rp16.959/US$ dan ICP US$96,12/bbl, yang menurut ESDM seharusnya mendorong kenaikan, tetapi tarif ditahan demi daya beli, termasuk Q4 2026. Untuk model klien: base flat nominal, dengan skenario kenaikan bertahap 2027 bila beban kompensasi APBN membesar.","s":"The formula already points up — Rp16,959 per dollar and ICP above $96 — but government has held tariffs; model flat with upside risk in 2027.","f":["Kurs Rp16.959; ICP US$96,12 (asumsi Q3 2026)"],"src":"Bloomberg Technoz; Metro TV Okt 2026"},{"c":"T","conf":"V","loc":null,"q":"What incentives exist for large industrial or data-centre customers?","a":"Opsi yang ada: (1) tarif I-4 untuk ≥30 MVA (Rp996,74). (2) Layanan premium dan \"Electrifying\" bundling dari PLN. (3) Renewable Energy Certificate (REC) PLN untuk klaim hijau. (4) Diskon tambah daya musiman. (5) Untuk KEK: fasilitas fiskal, dan PLN bisa membangun infrastruktur dedicated (Diktum KETIGA RUPTL). Data center di Batam menegosiasikan PJBTL dengan PLN Batam yang memuat jadwal ramp dan kualitas layanan.","s":"Big users get the I-4 rate, premium service, RECs and — in SEZs — dedicated infrastructure under the RUPTL clause.","f":[],"src":"PLN; RUPTL Diktum KETIGA"},{"c":"T","conf":"E","loc":null,"q":"What is the all-in cost of self-generation vs PLN for an industrial user in Karimun?","a":"Genset diesel sendiri: bahan bakar ±Rp3.000–4.000/kWh + O&M + capex, jadi ±Rp4.000+/kWh. Tarif PLN I-3 ±Rp1.115–1.600/kWh (rata-rata dengan WBP). PLTS atap untuk konsumsi siang ±Rp800–1.200/kWh LCOE. Jadi pelanggan ingin PLN; mereka memakai genset hanya karena keandalan. Ini argumen kuat bahwa investasi keandalan PLN langsung menurunkan biaya industri lokal.","s":"Self-generation costs about three times PLN's tariff — users only run gensets because PLN isn't reliable.","f":["Estimasi; sensitif harga solar industri"],"src":"Estimasi penyusun"},{"c":"T","conf":"E","loc":null,"q":"How should we think about the tariff a data centre in Bintan would pay?","a":"Tiga skenario: (1) Pelanggan PLN Persero I-4/TT ±Rp997/kWh + biaya premium/REC, paling murah tetapi tergantung kemampuan grid. (2) Pasokan kawasan/wilayah usaha (mis. KEK Galang Batang) dengan tarif B2B yang mencerminkan biaya pembangkit dedicated (gas/PLTS+BESS), kemungkinan USD 8–12 sen/kWh. (3) Hybrid: PLN baseload + PLTS kawasan. Hyperscaler biasanya peduli tiga hal: kepastian pasokan, jalur hijau, dan harga stabil jangka panjang.","s":"Somewhere between PLN's I-4 rate if the grid can carry it and a cost-reflective 8–12 US cents in a dedicated zone supply.","f":[],"src":"Estimasi penyusun"},{"c":"R","conf":"V","loc":"corr","q":"What are the main constraints on transmission reliability in Bintan?","a":"Pertama, satu koridor 150 kV dari Batam: PLTU Tanjung Kasam → Pulau Tanjung Sauh → Pulau Ngenang (kabel laut 3,45 km + kabel tanah 1 km) → kabel laut 6,55 km → Tanjung Taloh (Bintan). Kedua, satu operator sistem di Batam: gangguan satu GI di Batam (Sungai Harapan, Okt 2026) menjatuhkan Bintan. Ketiga, SUTT Bintan radial: Tanjung Uban–Sri Bintan 28 kmr, Sri Bintan–Air Raja 38 kmr, Air Raja–Kijang 20 kmr. Keempat, pembangkit lokal terlalu kecil untuk islanding. Kelima, kabel laut butuh waktu lama untuk diperbaiki. Studi UI (Purba & Garniwa, IJECBE 2025) menyebut ketergantungan pada kabel laut + SUTT 150 kV dari Batam sebagai systemic weak point. Rating termal dan jumlah sirkit kabel tidak publik.","s":"One cable corridor, one system operator in Batam, radial lines on the island — a UI study calls it a systemic weak point.","f":["RUPTL II.3.1: transmisi direncanakan N-1","IJECBE 2025: systemic weak point"],"src":"ESDM 2013; detik 2016; IJECBE 2025; laporan Okt 2026"},{"c":"R","conf":"V","loc":"kar","q":"What are the distribution reliability issues in Karimun and Tanjungpinang?","a":"Distribusi 20 kV saluran udara panjang di daerah berbukit dan pesisir: gangguan pohon, petir (isokeraunik tinggi di khatulistiwa), hewan (kelelawar, monyet; disebut juga dalam versi penyebab blackout Batam), korosi garam. Di Karimun ditambah masalah frekuensi akibat pembangkitan. UP3 Tanjungpinang juga mengelola >100 pembangkit kecil, sehingga sumber daya O&M tersebar. SAIDI/SAIFI per ULP tidak dipublikasikan.","s":"Long 20 kV overhead feeders through vegetation and lightning-prone terrain, plus salt corrosion — classic tropical island distribution.","f":["Ombudsman Jan 2026: geografi kepulauan kendala utama"],"src":"Ombudsman Kepri 2026; laporan gangguan"},{"c":"R","conf":"V","loc":null,"q":"Do you have SAIDI/SAIFI figures for Bintan and Karimun?","a":"Tidak ada angka per UP3/UID di RUPTL maupun publik. Yang tersedia nasional (RUPTL Tabel 4.51): SAIDI 19,0 jam/pelanggan dan SAIFI 11,5 kali (2019), 7,7/5,6 (2022), 5,6/4,3 (2023), 4,5/2,7 (2024 s.d. Okt). Tren nasional membaik tajam, tetapi Bintan dan Karimun kemungkinan jauh di atas rata-rata: blackout 15–16 jam (Okt 2026) saja sudah melebihi SAIDI nasional setahun, dan padam bergilir Karimun 2022 berlangsung ±25 hari. Untuk angka resmi, minta ke PLN UID Riau & Kepri.","s":"Only national figures exist — about 4.5 hours SAIDI in 2024; a single October blackout gave Bintan more than three times that.","f":["RUPTL Tabel 4.51","Okt 2026: 15–16 jam > SAIDI nasional 4,5 jam"],"src":"RUPTL Tabel 4.51; laporan gangguan"},{"c":"R","conf":"V","loc":"bin","q":"How loaded are the Bintan substations?","a":"RUPTL Tabel A4.4: GI 150/20 kV di Bintan Ngenang 10, Tanjung Uban 60, Sri Bintan 60, Air Raja 120, Kijang 60 MVA, total 310 MVA (9 trafo). Dengan beban Bintan ±105 MW (±117 MVA pada pf 0,9), pembebanan rata-rata ±38%. RUPTL memicu extension di 70–80%, dan Air Raja (Tanjungpinang, beban terbesar) memang dijadwalkan extension 1×60 MVA pada 2030. Jadi trafo bukan kendala utama. Kendalanya pasokan ke GI (satu koridor) dan SUTT Tanjung Uban–Sri Bintan yang dijadwalkan rekonduktoring 2031.","s":"About 310 MVA of transformers at roughly 40% loading — the constraint is upstream supply, not substations.","f":["A4.4: 310 MVA, 9 trafo","Air Raja +60 MVA (2030); rekonduktoring TU–SB 32 kms (2031)"],"src":"RUPTL Tabel A4.4 & tabel transmisi A4"},{"c":"R","conf":"V","loc":"tsauh","q":"What investments are planned to fix Bintan's reliability?","a":"Sudah berjalan: GI Tanjung Sauh (9 Nov 2026) untuk konektivitas dan fleksibilitas dispatch Batam–Bintan. PLTMG MaxPower Sagulung 60 MW dengan free governor dan black start. Rencana BESS PLN Batam. Di RUPTL: PLTMG 100 MW untuk Bintan (2027), GI Air Raja +60 MVA (2030), SUTT Sri Bintan–KTT Bintan Resort (2030), rekonduktoring Tanjung Uban–Sri Bintan (2031), ISBB (2031), dan ekstensi 500 kV ke Bintan (2032, bersyarat). Yang belum ada: kabel kedua Batam–Bintan berkomitmen dan kajian proteksi/islanding pasca-blackout.","s":"The planned fixes are mostly capacity and upgrades; a committed second corridor or an islanding scheme for Bintan isn't in the plan yet.","f":["Realisasi transmisi nasional 2025 hanya ±37% target"],"src":"Listrik Indonesia Nov 2026; RUPTL A4; Kontan Jul 2026"},{"c":"R","conf":"E","loc":"bin","q":"What is the single most effective reliability investment for Bintan?","a":"Dari prinsip dasar: hilangkan single point of failure. Dua jalur setara: (a) sirkit kedua/kabel laut kedua di rute berbeda, atau (b) pembangkit firm lokal 60–80 MW (mis. PLTMG di Kijang/Air Raja) + BESS untuk ride-through. Opsi (b) lebih cepat (18–30 bulan), tidak bergantung izin kabel laut, dan juga menjadi blackstart lokal. Opsi (a) lebih murah per MW jangka panjang. RUPTL sudah punya kendaraannya: PLTMG 100 MW (2027) via wilus PLN Batam. Bila ditempatkan di Pulau Bintan dengan BESS dan skema islanding, single point of failure hilang sebelum 500 kV (2032).","s":"Local firm generation plus a battery on Bintan is the fastest way to remove the single point of failure; a second cable is the long-term fix.","f":[],"src":"Rekomendasi penyusun"},{"c":"R","conf":"V","loc":null,"q":"What does PLN's planning standard say about single-circuit supply?","a":"RUPTL 2025–2034 II.3.1: transmisi dan GI direncanakan dengan kontingensi N-1 statis (satu sirkit/trafo padam, sisanya harus menyalurkan seluruh beban) dan dinamis (gangguan + kehilangan satu sirkit tidak boleh menyebabkan hilang sinkron). Bila N-1 belum terpenuhi karena kendala proyek, dilakukan mitigasi jangka pendek (pola operasi). Untuk kondisi khusus yang bisa menyebabkan blackout meluas, dipakai kriteria credible contingency. Bintan adalah contoh di mana mitigasi jangka pendek ternyata tidak cukup.","s":"PLN's own standard is N-1 static and dynamic; Bintan is operating on \"short-term mitigation\" — and October showed its limits.","f":["RUPTL II.3.1 butir 1 (file Anda)"],"src":"RUPTL 2025–2034 II.3.1"},{"c":"R","conf":"E","loc":"kar","q":"What would you invest in for Karimun distribution and network?","a":"Setelah kapasitas firm: (1) BESS + skema UFLS bertahap supaya gangguan pembangkit tidak jadi blackout total. (2) Otomasi penyulang (recloser, sectionalizer, FDIR) di penyulang panjang. (3) Program right-of-way pohon dan arrester petir. (4) Kabel bawah tanah di pusat Tanjung Balai. (5) Interkoneksi 20 kV/150 kV antar-zona (PLN–KPP–SDU) untuk pooling cadangan. (6) Percepat interkoneksi 150 kV Sumatera–Selat Panjang–Rangsang–TBK (RUPTL) dan GI TBK 2×30 MVA; setelah masuk, pertahankan PLTU/PLTD sebagai backup kabel tunggal.","s":"Battery-backed under-frequency scheme first, feeder automation second, and inter-zone ties to pool the three operators' reserves.","f":[],"src":"Rekomendasi penyusun"},{"c":"R","conf":"V","loc":"inc1","q":"What caused the October 2026 blackout?","a":"Penyebab resmi belum final per 23 Okt 2026 (ESDM masih mengumpulkan data). Indikasi awal: hewan liar, disebut kelelawar, masuk GI Sungai Harapan di Batam. Gangguan mulai 06.37 WIB lalu merembet ke seluruh sistem. PLN Batam menegaskan tidak terkait uji data center. PLN mengakui perawatan infrastruktur perlu dibenahi. Dari sisi sistem: gangguan satu GI bisa menjatuhkan seluruh sistem walaupun cadangan ±19–20%. Masalahnya ada di proteksi dan pemisahan sistem, bukan kekurangan MW.","s":"Preliminary cause is an animal intrusion at Sungai Harapan substation; the lesson is protection and islanding, not megawatts.","f":["Jangan spekulasi melebihi versi publik"],"src":"Bloomberg Technoz; Listrik Indonesia 23 Okt 2026; w.media"},{"c":"R","conf":"E","loc":null,"q":"How exposed are subsea cables in this area?","a":"Selat di sekitar Batam–Bintan adalah salah satu jalur pelayaran tersibuk di dunia dengan banyak kapal labuh. Risiko utama kabel laut: jangkar dan alat tangkap, arus kuat, serta erosi. Perbaikan kabel laut bisa butuh minggu–bulan (kapal khusus, sambungan). Karena itu kabel laut tunggal untuk ±70 MW beban kritis adalah risiko tinggi. Mitigasinya: rute kedua, proteksi (burial, armour), zona larangan labuh, dan stok suku cadang.","s":"These are some of the busiest anchorages in the world — a single subsea cable is a high-consequence asset.","f":["Kabel laut Batam–Bintan total ±10 km (3,45 + 6,55)"],"src":"ESDM 2013; analisis"},{"c":"R","conf":"E","loc":null,"q":"Is the data-centre boom a reliability risk for residential users?","a":"Bisa, bila pembangkitan tidak mengikuti. Data center mengambil kapasitas firm besar dengan load factor tinggi, sehingga reserve untuk sistem berkurang. Setelah blackout Okt 2026 muncul kecurigaan publik, meskipun PLN Batam membantah keterkaitannya. Data center juga bisa membantu: membawa investasi GI baru, UPS/BESS besar yang bisa memberi layanan grid, dan PJBTL jangka panjang yang membiayai pembangkit. Kuncinya sekuensing: pembangkit dan GI harus datang sebelum beban.","s":"It's a risk if load arrives before generation; it's an opportunity if their contracts fund the capacity first.","f":[],"src":"Analisis penyusun"},{"c":"R","conf":"E","loc":null,"q":"What KPIs would you track to judge reliability progress?","a":"(1) Reserve margin per sistem vs kriteria RUPTL (Karimun ≥35%/N-2; Batam–Bintan ≥25–35%). (2) Jumlah dan durasi padam bergilir per bulan. (3) SAIDI/SAIFI per ULP. (4) Waktu pemulihan Bintan setelah gangguan Batam (target < 1 jam dengan islanding). (5) EAF/EFOR PLTU Tanjung Sebatak. (6) Pembebanan GI dan penyulang (<70–80%). (7) Energi tidak tersalurkan (ENS, MWh).","s":"Track reserve margin against RUPTL criteria, load-shedding hours, SAIDI/SAIFI, and how fast Bintan recovers after a Batam event.","f":[],"src":"Praktik perencanaan"},{"c":"I","conf":"V","loc":"corr","q":"Describe the Batam–Bintan interconnection.","a":"Kontrak 21 Mar 2013. Koridor barat: PLTU Tanjung Kasam (Batam) → Pulau Tanjung Sauh → Pulau Ngenang, kabel laut 3,45 km + kabel tanah 1 km, 150 kV. Koridor timur: Ngenang → Tanjung Taloh (Bintan), kabel laut 6,55 km. Energize 10 Nov 2015 bersamaan dengan GI Tanjung Uban 30 MVA dan GI Ngenang 10 MVA. SUTT Bintan selesai s.d. Agt 2016: Tanjung Uban–Sri Bintan 28 kmr, Sri Bintan–Air Raja 38 kmr, Air Raja–Kijang 20 kmr. Transfer awal 20 MW lalu ±34 MW (2016), saat beban puncak Bintan 65,1 MW. Sejak itu Batam–Bintan menjadi satu sistem yang dioperasikan PLN Batam, sementara PLN Persero menjual ke pelanggan Bintan. Penghematan awal ±Rp11,46 miliar/bulan.","s":"Two short subsea legs — 3.45 and 6.55 km — via Tanjung Sauh and Ngenang, energised November 2015; since then Batam and Bintan run as one system under PLN Batam.","f":["GI saat ini 310 MVA (A4.4)","Energi Bintan dicatat sebagai impor antar-wilus"],"src":"ESDM 2013; Setkab 2016; detik 2016; RUPTL A4"},{"c":"I","conf":"V","loc":"corr","q":"What is the transfer capacity of the Batam–Bintan link?","a":"Tidak dipublikasikan, termasuk di RUPTL. Rating termal dan jumlah sirkit kabel laut serta status N-1-nya tidak ada di dokumen publik. Yang diketahui: 150 kV, GI hilir total 310 MVA, transfer awal 20→34 MW (2016), dan beban yang dipasok kini ±70 MW atau lebih. Saya tidak akan menyebut angka MW. Poinnya: hari ini kendala bukan kapasitas termal, melainkan redundansi dan proteksi. RUPTL juga tidak menjadwalkan penambahan sirkit kabel laut 150 kV, dan penguatan berikutnya baru ekstensi 500 kV (2032, bersyarat).","s":"Not published anywhere — I wouldn't quote a number; the issue is redundancy, not thermal rating.","f":["Data gap: rating termal, jumlah sirkit, status N-1"],"src":"RUPTL A4; Setkab 2016"},{"c":"I","conf":"V","loc":"isbb","q":"Is there a plan to connect Sumatra to Batam and Bintan?","a":"Ya, Interkoneksi Sumatera–Batam (ISBB). Peranap → LP Sungai Guntung OHL HVDC 360 kms; Sungai Guntung → Rempang kabel laut HVDC 156 kms; konverter 1.500 MW + GITET 500/150 kV 3×500 MVA. COD 2031, transfer awal 1.200 MW (neraca Sumatera mencatat \"Transfer ke Sistem Batam −1.200 MW\" 2031–2034), bersumber dari EBT Sumatera. Opsi AC/DC masih dikaji. Tahap 2 (2032): sirkit kedua + konverter 1.500 MW. ISBB disebut bisa melayani pertumbuhan hingga ±3 GW di Batam–Bintan, termasuk data center, dan membuka opsi ekspor Sumatera–(Batam)–Singapura 0,6–1,1 GW (AIMS III). RUPTL menyarankan ISBB dipercepat.","s":"Yes — a 1.2 GW Sumatra–Batam HVDC link for 2031, scalable for ~3 GW of Batam–Bintan demand, though AC versus DC is still under study.","f":["RUPTL hlm V-107, V-324","hlm A-51 & Lampiran E menulis 2028 — inkonsisten"],"src":"RUPTL 2025–2034 Bab V.5.7, V.11.2, Lampiran A4/E"},{"c":"I","conf":"V","loc":"karint","q":"When will Karimun be interconnected, realistically?","a":"RUPTL sudah merencanakannya: 150 kV Sumatera → Selat Panjang → Pulau Rangsang → TBK (SKLT 6 kms + SUTT 120 kms + SKLT 70 kms + 14 kms), GI TBK 2×30 MVA. Tanggalnya tidak konsisten. Tabel transmisi Riau menulis 2026, Committed; Bab V.11.2 menyebut segmen Selat Panjang–TBK \"masih tahap perencanaan\"; Lampiran E menulis 2028. Realisasi transmisi nasional 2025 hanya ±37% target (lahan, izin). Penilaian saya: 2027–2028, dengan kabel laut 70 km sebagai jalur kritis. Implikasinya, diesel Karimun bertahan lebih lama dari angka di tabel.","s":"On paper 2026, in the narrative 2028 — I'd plan for 2027–28, with the 70 km subsea leg on the critical path.","f":["Tiga versi COD dalam satu dokumen","Kontan Jul 2026: realisasi transmisi 2025 ±37%"],"src":"RUPTL A4, V.11.2, Lampiran E; Kontan Jul 2026"},{"c":"I","conf":"V","loc":"corr","q":"How has the interconnection changed Bintan since 2016?","a":"Positifnya: menggantikan PLTD/PLTMG sewa, menghemat ±Rp11,46 miliar/bulan, memungkinkan beban tumbuh dari 65,1 MW (2016) ke ±100+ MW, dan memasok kawasan Lagoi/Lobam (160 MVA). Negatifnya: Bintan kehilangan pembangkit lokal dan sepenuhnya bergantung pada sistem Batam. Energinya dicatat sebagai impor antar-wilus, operatornya PLN Batam, dan gangguan di Batam memadamkan Bintan (1 Jan 2023, 12 Okt 2026). RUPTL bahkan mengganti rencana \"PLT EBT Base Bintan 200 MW\" dengan kerja sama PLTMG di wilus PLN Batam, yang memperkuat ketergantungan itu.","s":"It made Bintan cheaper and let it grow, but turned it into an extension of the Batam system.","f":["Padam ikut Batam: 1 Jan 2023, 12 Okt 2026"],"src":"Setkab 2016; RUPTL hlm A-52; Jawapos 2023"},{"c":"I","conf":"V","loc":"isbb","q":"What reinforcement of the Batam–Bintan link does the RUPTL contemplate?","a":"Tidak ada kabel laut 150 kV kedua dalam RUPTL. Yang ada adalah ekstensi 500 kV ke Bintan (2032), hanya bila demand pasti: Rempang → LP Sabang Mas → LP Ngenang → Ngenang → LP Tanjung Taloh → GITET Bintan (500/150 kV 1×250 MVA) → GITET KTT BAI/Data Center, total 162 kms. Ini akan menjadi jalur kedua yang sesungguhnya ke Bintan, tetapi terikat pada KTT confidence rendah. Ada juga SUTT 150 kV GI Rempang/Tanjung Gundap → GI Panaran 40 kms (2031, perlu studi) di sisi Batam. Jadi sampai 2032, Bintan tetap satu koridor. Opsi alternatif: kabel 150 kV paralel di rute berbeda (±USD 2–4 juta/km) atau PLTMG 100 MW ditempatkan di Bintan.","s":"The RUPTL has no second 150 kV cable — Bintan's second path is a 500 kV extension in 2032 that only happens if a big industrial load commits.","f":["500 kV ext 162 kms, 2032, bersyarat"],"src":"RUPTL Lampiran A4, V.11.2"},{"c":"I","conf":"V","loc":"isbb","q":"How does the ASEAN Power Grid / Singapore link fit in?","a":"ISBB membuka koridor Sumatera–(Batam)–Singapura dengan opsi ekspor 0,6–1,1 GW (AIMS III). Kepri berada di antara Sumatera dan Singapura, sehingga menjadi koridor alami ASEAN Power Grid. Proyek ekspor PLTS (Vena, Equator, Singa Renewables, Sembcorp, Gotion–Oriens Belat) butuh kabel ke Singapura. Untuk grid lokal, kalau kabel ekspor dibangun, pemerintah ingin ada porsi domestik untuk menarik industri/data center ke BBK. Target impor Singapura ±6 GW pada 2035.","s":"ISBB doubles as the first leg of a Sumatra–Singapore corridor — 0.6 to 1.1 GW of export in AIMS III.","f":["AIMS III: 0,6–1,1 GW","EMA: 13 proyek impor berlisensi/conditional"],"src":"RUPTL V.11.2; EMA; Enerdata"},{"c":"I","conf":"V","loc":"bin","q":"Who pays for connecting new loads in Bintan, and what is the commercial friction?","a":"RUPTL menyebut PLN membuka connection hub di Bintan selama ada kesepakatan \"sharing recovery investment yang adil\" dengan PLN Batam. Ini titik negosiasi antar-wilus: PLN Persero melayani pelanggan Bintan, tetapi pasokan dan sebagian pembangkit ada di wilus PLN Batam. Ditambah syarat take-or-pay untuk pengembang. Model yang realistis: anchor customer (KTT/DC) menjamin utilisasi lewat take-or-pay, PLN Persero dan PLN Batam membagi investasi dan recovery, dan ISBB/500 kV dibiayai dari demand besar. Harga transfer PLN Batam ke PLN Persero tidak publik.","s":"New loads in Bintan sit between two PLN licence holders — the RUPTL requires a \"fair investment recovery\" deal between them, plus take-or-pay from the customer.","f":["RUPTL: connection hub Bintan, sharing recovery investment"],"src":"RUPTL Lampiran A4"},{"c":"I","conf":"E","loc":null,"q":"If you could change one thing in the RUPTL for Bintan and Karimun, what would it be?","a":"Memperlakukan keandalan sebagai kebutuhan eksplisit, bukan sisa dari neraca energi. Untuk Bintan: masukkan proyek N-1 (jalur kedua atau firm lokal + BESS) dengan COD pasti sebelum 2029. Untuk Karimun: jalankan kriteria isolated RUPTL sendiri (N-2/RM 35%) dengan blok firm modular + BESS dalam 24 bulan dan pooling dengan wilayah usaha swasta. Lalu kaitkan pembangunan dengan anchor load (data center, KEK) supaya biaya kabel/pembangkit dibagi.","s":"Make reliability an explicit, dated project — N-1 for Bintan, PLN's own N-2 rule for Karimun — and let anchor loads co-fund it.","f":[],"src":"Pendapat penyusun"},{"c":"I","conf":"E","loc":null,"q":"What should an investor or consultant watch over the next 12 months?","a":"(1) Hasil resmi investigasi blackout 12 Okt 2026 dan respons PLN (proyek sirkit kedua/pembangkit Bintan). (2) Revisi RUPTL/RUPTL PLN Batam yang memasukkan beban data center BBK. (3) COD PLTGU Batam #1 dan financial close Batam 3&4. (4) Konversi MoU data center (SOS Galang Batang, DCI) ke PJBTL. (5) Keputusan terms ekspor listrik RI–Singapura. (6) Status kapasitas firm dan padam bergilir di Karimun. (7) Kebijakan tarif 2027. (8) Keputusan AC/DC dan pendanaan ISBB, serta progres kabel 150 kV Karimun (segmen SKLT 70 km).","s":"Watch the blackout report, RUPTL revisions for data centres, Batam gas CODs, MoU-to-PPA conversions, and the Singapore export terms.","f":[],"src":"Ringkasan penyusun"}];

function bars(o){ // o:{cats,series:[{n,v:[],c}],max,unit,refs:[{v,n,c}],h}
  const W=400,H=o.h||170,m={l:34,r:8,t:20,b:30},w=W-m.l-m.r,h=H-m.t-m.b;
  const n=o.cats.length,gw=w/n,bw=Math.min(22,(gw-8)/o.series.length);
  const Y=v=>m.t+h-(v/o.max)*h;let s='';
  const ticks=o.ticks||[0,o.max/2,o.max];
  ticks.forEach(t=>{s+=`<line class="gridl" x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l-4}" y="${Y(t)+3}" text-anchor="end">${fmt(t)}</text>`});
  o.cats.forEach((c,i)=>{const x0=m.l+i*gw+(gw-bw*o.series.length)/2;
    o.series.forEach((se,j)=>{const v=se.v[i];if(v==null)return;const x=x0+j*bw;s+=`<rect x="${x}" y="${Y(v)}" width="${bw-2}" height="${Math.max(0,m.t+h-Y(v))}" class="f-${se.c}" opacity="${se.o||1}"><title>${esc(se.n)} ${esc(c)}: ${fmt(v,v%1?1:0)} ${o.unit}</title></rect>`;
      if(o.vlab)s+=`<text x="${x+(bw-2)/2}" y="${Y(v)-3}" text-anchor="middle" class="lbl" style="font-size:9px">${fmt(v,v%1?1:0)}</text>`});
    s+=`<text x="${m.l+i*gw+gw/2}" y="${H-m.b+13}" text-anchor="middle">${esc(c)}</text>`;
    if(o.sub&&o.sub[i])s+=`<text x="${m.l+i*gw+gw/2}" y="${H-m.b+24}" text-anchor="middle" style="font-size:9px">${esc(o.sub[i])}</text>`});
  (o.refs||[]).forEach(r=>{s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(r.v)}" y2="${Y(r.v)}" class="s-${r.c}" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-m.r}" y="${Y(r.v)-4}" text-anchor="end" class="f-${r.c}" style="fill:var(--${r.c==='alarm'?'alarm':r.c})">${esc(r.n)}</text>`});
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${m.t+h}" y2="${m.t+h}"/><text x="2" y="8">${esc(o.unit)}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'grafik')}">${s}</svg></div>`+legend(o.series.map(x=>[x.n,x.c]).concat((o.refs||[]).map(r=>[r.n,r.c,1])));
}
function lines(o){ // o:{xs,series:[{n,v,c,dash,pts}],max,unit,h}
  const W=400,H=o.h||170,m={l:34,r:40,t:20,b:22},w=W-m.l-m.r,h=H-m.t-m.b;
  const X=i=>m.l+i/(o.xs.length-1)*w,Y=v=>m.t+h-(v/o.max)*h;let s='';
  (o.ticks||[0,o.max/2,o.max]).forEach(t=>{s+=`<line class="gridl" x1="${m.l}" x2="${m.l+w}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l-4}" y="${Y(t)+3}" text-anchor="end">${fmt(t)}</text>`});
  o.xs.forEach((x,i)=>{s+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${esc(x)}</text>`});
  o.series.forEach(se=>{const pts=se.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    s+=`<polyline fill="none" class="s-${se.c}" stroke-width="2.2" ${se.dash?`stroke-dasharray="${se.dash}"`:''} points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
    se.v.forEach((v,i)=>{if(v==null)return;if(se.dots||i===se.v.length-1)s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.2" class="f-${se.c}"><title>${esc(se.n)} ${o.xs[i]}: ${fmt(v)} ${o.unit}</title></circle>`});
    const lv=se.v[se.v.length-1];if(lv!=null)s+=`<text x="${X(se.v.length-1)+6}" y="${Y(lv)+3}" class="lbl" style="font-size:9.5px">${fmt(lv)}</text>`;});
  s+=`<line class="ax" x1="${m.l}" x2="${m.l+w}" y1="${m.t+h}" y2="${m.t+h}"/><text x="2" y="8">${esc(o.unit)}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'grafik')}">${s}</svg></div>`+legend(o.series.map(x=>[x.n,x.c,x.dash?1:0]));
}
function legend(items){return '<div class="legend">'+items.map(([n,c,d])=>`<span><i style="background:var(--${c});${d?'height:3px;vertical-align:3px':''}"></i>${esc(n)}</span>`).join('')+'</div>'}
function hbars(rows,max,unit){return '<div class="hb">'+rows.map(r=>`<span>${esc(r.l)}</span><div class="tr"><span style="width:${Math.max(1,(r.lo!=null?(r.hi-r.lo):r.v)/max*100)}%;left:${r.lo!=null?r.lo/max*100:0}%;background:var(--${r.c})"></span></div><span class="v">${esc(r.t||fmt(r.v,r.v%1?1:0)+' '+unit)}</span>`).join('')+'</div>'}

 cap:{t:'Kapasitas',num:1,lay:['sys','gen','gi','tx','corr','plan'],z:'bbk',map:['1 · Kapasitas pembangkit 2025–2030','Ukuran titik = MW. Bintan hanya ±30–35 MW lokal'],
  html:()=>`<div class="eyebrow">Topik 1 · Power generation capacity 2025–2030</div><h2>Kapasitas lokal hampir semuanya diesel; tambahan besar datang dari Batam dan Sumatera</h2>
  <div class="lead"><b>Jawaban 30 detik</b>Kepri tanpa Batam punya 144 MW terpasang / 109,8 MW DMN, dan 284 dari 293 unitnya PLTD. Tambahan lokal sampai 2030 sangat kecil. Untuk Bintan, kapasitas baru dicatat lewat kerja sama wilus PLN Batam (PLTMG 100 MW 2027 + 50 MW 2031, PLTS 25+25 MW). Untuk Karimun, lewat kabel 150 kV dari Sumatera.<div class="say">"Local capacity barely grows to 2030 — Bintan's additions are booked through PLN Batam, Karimun's through the Sumatra cable."</div></div>
  <h3>Eksisting Kepri tanpa Batam (A4.3), DMN MW</h3>
  ${hbars([{l:'PLTD PLN (284 unit)',v:92.5,c:'alarm'},{l:'PLTU PLN TBK (2)',v:10.2,c:'ink'},{l:'PLTD sewa (3)',v:5.5,c:'amber'},{l:'PLTBm IPP (1)',v:0.9,c:'ok'},{l:'PLTS PLN (3)',v:0.7,c:'amber'}],100,'MW')}
  <p style="font-size:12px;color:var(--mut);margin-top:6px">Total 293 unit · 144,0 MW terpasang · 109,8 MW DMN</p>
  <h3>Batam–Bintan: pasok vs beban puncak, MW</h3>
  ${bars({cats:['Des 2025','Okt 2026','2027 target','2030 est.'],series:[{n:'Daya mampu/pasok',v:[844.2,930,1250,1650],c:'grid'},{n:'Beban puncak',v:[755,780,874,1228],c:'alarm'}],max:1800,ticks:[0,600,1200,1800],unit:'MW',vlab:1,title:'Batam Bintan'})}
  <h3>Karimun: daya mampu vs kriteria RUPTL, MW</h3>
  ${bars({cats:['2019','Mei 26','Okt 26','Nov 26'],series:[{n:'Daya mampu',v:[35,32,42.6,40.6],c:'grid'},{n:'Beban puncak',v:[28.2,34.5,33,36.1],c:'alarm'}],max:55,ticks:[0,25,50],unit:'MW',vlab:1,refs:[{v:50.1,n:'N-2 (36,1+7+7)',c:'amber'}],title:'Karimun'})}
  <ul class="facts" style="margin-top:8px"><li class="w">Karimun Nov 2026: cadangan 4,5 MW &lt; unit PLTU 7 MW → gagal N-1; kriteria isolated RUPTL (N-2, RM ≥35%) butuh ±49–50 MW.</li><li>Batam: PLTGU Batam #1 120 MW (2028), Batam 3&amp;4 2×150 MW (PJBTL Jul 2026), MaxPower 50→150 MW, BESS.</li><li class="e">Proyeksi 2027–2030 Batam = target PLN Batam & estimasi penyusun.</li></ul>
  <h3>Pertanyaan terkait</h3>${qref([findQ('What is Karimun\'s current'),findQ('Does Karimun meet'),findQ('What does RUPTL 2025–2034 show'),findQ('What new capacity is coming'),findQ('What generation is physically')])}
  <div class="src">RUPTL A4.3, II.2.2, hlm A-52; PLN Batam; Ombudsman Des 2025; Tribun Batam Nov 2026.</div>`},
 dem:{t:'Demand',num:2,lay:['sys','load','gi','tx'],z:'bbk',map:['2 · Demand & beban industri','Ungu = anchor load (KEK, kawasan, data center)'],
  html:()=>`<div class="eyebrow">Topik 2 · Demand forecast 2025–2030, esp. industry</div><h2>Demand organik ±5%/th; industri PLN kecil sampai lompatan 2031</h2>
  <div class="lead"><b>Jawaban 30 detik</b>RUPTL: beban puncak Kepri tanpa Batam 189 MW (2025) → 241 MW (2030), lalu 980 MW (2031). Penjualan industri hanya 47 → 58 GWh, lalu melompat ke 4.442 GWh pada 2031, setara ±500 MW rata-rata dari KTT yang tidak disebut namanya. Industri besar (alumina, galangan, Lagoi/Lobam) sebagian besar captive atau di wilayah usaha sendiri.<div class="say">"Industry is ~5% of PLN sales ex-Batam until one unnamed ~500 MW load lands in 2031 — timed with the Sumatra link."</div></div>
  <h3>Beban puncak Kepri tanpa Batam (RUPTL A4.8), MW</h3>
  ${lines({xs:['2025','2026','2027','2028','2029','2030','2031'],series:[{n:'RUPTL (titik resmi: 2025, 2030, 2031)',v:[189,null,null,null,null,241,980],c:'grid',dots:1},{n:'Interpolasi ±5%/th',v:[189,199,209,219,230,241,null],c:'mut',dash:'4 4'}],max:1000,ticks:[0,500,1000],unit:'MW',title:'Beban Kepri'})}

  <tr><td>KTT Bintan Resort Cakrawala (Lagoi)</td><td class="n">SUTT 2 cct</td><td>RUPTL 2030</td></tr>

  <div class="src">RUPTL A4.6, A4.8, Lampiran E; ESDM 19 Okt 2026; Bisnis Sep–Okt 2026; Kontan/RRI 2026. Skenario = estimasi penyusun.</div>`},
 ebt:{t:'EBT',num:3,lay:['re','plan','tx','gi'],z:'bbk',map:['3 · Pertumbuhan EBT','Kuning = PLTS/biomassa (ukuran log MW)'],
  html:()=>`<div class="eyebrow">Topik 3 · Renewable energy growth</div><h2>EBT lokal ±40 MW sampai 2030; lompatan baru datang lewat Sumatera</h2>
  <div class="lead"><b>Jawaban 30 detik</b>RUPTL: tambahan EBT Kepri tanpa Batam 2025–2030 hanya 33,5 MW PLTS + 6,4 MW PLTBio, kecil dibanding beban ±240 MW. Ditambah PLTS Bintan 25+25 MW via wilus PLN Batam. Lompatan EBT baru setelah 2031 ketika ISBB mengalirkan listrik Sumatera (pangsa EBT Sumatera >30,5%). Karimun ikut bauran Sumatera begitu kabel 150 kV masuk.<div class="say">"Local renewables are tens of megawatts; the green step-change is imported from Sumatra after 2031."</div></div>
  <h3>Tambahan EBT Kepri tanpa Batam (RE Base = ARED), MW</h3>
  ${bars({cats:['2025','2026','2027','2028','2029','2030','31–34'],series:[{n:'PLTS PLN (lisdes)',v:[2.83,0.74,0.94,0,0,0,0],c:'amber'},{n:'PLTS IPP',v:[0,0,19.6,0,4.77,2.07,7.45],c:'grid'},{n:'PLTBio IPP',v:[0,0,0,0,6.4,0,0],c:'ok'}],max:22,ticks:[0,10,20],unit:'MW',title:'EBT'})}
  <p style="font-size:12px;color:var(--mut)">Total 44,8 MW s.d. 2034. Tidak termasuk PLTS Bintan wilus 25 MW (2028) + 25 MW (2030).</p>
  <h3>Pipeline skala ekspor (di luar RUPTL), MW</h3>
  ${hbars([{l:'Vena–Shell Kepri',v:2000,c:'violet'},{l:'Gotion–Oriens Belat',v:2000,c:'violet'},{l:'Singa Ren. (Total–RGE)',v:1000,c:'violet'},{l:'Sembcorp BBK',v:1000,c:'violet'},{l:'Equator Renewables',v:900,c:'violet'},{l:'Kuota RUPTL lokal',v:44.8,c:'amber'}],2000,'MW')}
  <h3>Hambatan</h3><ul class="facts"><li class="w">Grid kecil: Karimun ±36 MW hanya menyerap ±4–7 MW PLTS tanpa BESS (est.).</li><li class="w">RUPTL: EBT intermiten tidak dihitung sebagai cadangan tanpa firm capacity.</li><li>Terms ekspor RI–Singapura belum final; prioritas domestik; TKDN; lahan pulau; izin kabel laut.</li><li>Entry point IPP: kuota surya "Sumatera–Bintan tersebar" (bersama Batam–Bintan), PLTS Dedieselisasi 15,6 MW (2027).</li></ul>
  <h3>Pertanyaan terkait</h3>${qref([findQ('What are the renewable plans'),findQ('What are the main hindrances'),findQ('What renewable potential'),findQ('Which Singapore-export'),findQ('Where are the entry points')])}
  <div class="src">RUPTL A4.13, A4.15, Bab II.2.2; EMA; pv magazine; Enerdata; laporan Jan & Mar 2026.</div>`},
 tar:{t:'Tarif',num:4,lay:['sys','load'],z:'bbk',map:['4 · Tarif industri','Bintan & Karimun Zona 3 = tarif nasional PLN Persero'],
  html:()=>`<div class="eyebrow">Topik 4 · Tariff for industry</div><h2>Tarif nasional, jauh di bawah biaya pasok pulau</h2>
  <div class="lead"><b>Jawaban 30 detik</b>Bintan dan Karimun Zona 3 adalah wilayah PLN Persero, jadi industri membayar tarif nasional yang sama dengan Jawa: I-3/TM Rp1.114,74/kWh (LWBP), I-4/TT Rp996,74/kWh, tidak berubah di Q4 2026. BPP diesel Karimun jauh lebih tinggi; selisihnya ditutup kompensasi pemerintah. Batam berbeda: PLN Batam tanpa subsidi/kompensasi.<div class="say">"Same tariff as Java — about Rp1,115 per kWh off-peak for I-3 — even though Bintan's energy is bought from PLN Batam."</div></div>
  <h3>Tarif Q4 2026 (Permen ESDM 7/2024)</h3><table class="t"><thead><tr><th>Golongan</th><th>Batas daya</th><th class="n">Rp/kWh</th></tr></thead><tbody>
  <tr><td>I-3/TM</td><td>&gt;200 kVA s.d. &lt;30 MVA</td><td class="n">1.114,74 (LWBP)</td></tr><tr><td>I-4/TT</td><td>≥30.000 kVA</td><td class="n">996,74</td></tr><tr><td>B-3/TM (resort)</td><td>&gt;200 kVA</td><td class="n">1.114,74</td></tr><tr><td>B-2/TR</td><td>6.600 VA–200 kVA</td><td class="n">1.444,70</td></tr></tbody></table>
  <h3>Perbandingan biaya, Rp/kWh</h3>
  ${hbars([{l:'I-4/TT',v:996.74,c:'grid',t:'996,74'},{l:'I-3 LWBP',v:1114.74,c:'grid',t:'1.114,74'},{l:'I-3 WBP (K 1,4–2)',lo:1560,hi:2229,c:'amber',t:'±1.560–2.230'},{l:'Genset diesel sendiri',lo:3000,hi:4000,c:'alarm',t:'±3.000–4.000 est.'}],4200,'')}
  <ul class="facts" style="margin-top:8px"><li>Tarif dievaluasi triwulanan (kurs, ICP, inflasi, HBA). Asumsi Q3 2026: Rp16.959/US$, ICP US$96,12 → seharusnya naik; ditahan → risiko naik 2027.</li><li class="e">Faktor K WBP 1,4–2: cek lampiran Permen sebelum dikutip.</li><li>Batam: penyesuaian Jul 2025 pertama sejak 2017; sebagian golongan masih di bawah BPP. Harga jual PLN Batam → PLN Persero untuk Bintan tidak publik.</li><li>Zona swasta Karimun, Lagoi/Lobam, KEK captive: tarif B2B, tidak dipublikasikan.</li></ul>
  <h3>Pertanyaan terkait</h3>${qref([findQ('What is the industrial tariff'),findQ('How does that compare with Batam'),findQ('Will tariffs rise'),findQ('Is the regulated tariff'),findQ('How should we think about the tariff')])}
  <div class="src">Metro TV 29 Okt 2026; Bloomberg Technoz; ESDM Jun 2025; Permen ESDM 7/2024. Genset = estimasi penyusun.</div>`},
 rel:{t:'Keandalan T&D',num:5,lay:['corr','tx','gi','inc','sys'],z:'bbk',map:['5 · Keandalan transmisi & distribusi','Merah putus-putus = koridor tunggal; pin = gangguan'],
  html:()=>`<div class="eyebrow">Topik 5 · Transmission & distribution reliability</div><h2>Risikonya struktural: satu kabel, satu operator, satu PLTU kecil</h2>
  <div class="lead"><b>Jawaban 30 detik</b>Risiko terbesar tidak ada di distribusi Bintan. Bintan bergantung pada satu jalur kabel laut 150 kV dan satu operator sistem di Batam; gangguan satu GI (Sungai Harapan, 12 Okt 2026) memadamkan Bintan 15–16 jam. Karimun bergantung pada satu PLTU kecil (1 unit ≈ 20% beban) sampai kabel dari Sumatera masuk.<div class="say">"One cable, one system operator, one small coal unit — the reliability problem is structural, not in the feeders."</div></div>
  <h3>SAIDI / SAIFI nasional (RUPTL Tabel 4.51)</h3>
  ${bars({cats:['2019','2022','2023','2024*'],series:[{n:'SAIDI (jam/plg)',v:[19,7.7,5.6,4.5],c:'grid'},{n:'SAIFI (kali/plg)',v:[11.5,5.6,4.3,2.7],c:'amber'}],max:20,ticks:[0,10,20],unit:'',vlab:1,refs:[{v:15.5,n:'Blackout Bintan 12 Okt: 15–16 jam',c:'alarm'}],h:160,title:'SAIDI'})}
  <p style="font-size:11.5px;color:var(--mut)">*s.d. Okt 2024. Tidak ada angka per UP3/ULP di RUPTL.</p>
  <h3>Koridor Batam–Bintan</h3>${corridorSvg()}
  <ul class="facts"><li class="w">Satu kejadian blackout Okt 2026 (15–16 jam) &gt; 3× SAIDI nasional setahun.</li><li class="w">Karimun Mei 2022: padam bergilir saat PLTU unit 2 rusak, beban naik 28–29 → 36 MW.</li><li>Studi UI (Purba &amp; Garniwa, IJECBE 2025): kabel laut + SUTT 150 kV dari Batam = systemic weak point; 871 MW vs 675 MW puncak.</li><li>Distribusi Kepri tanpa Batam: JTM 2.702 kms, JTR 2.343 kms, gardu 355 MVA; tambahan ±25 kms/th.</li><li>Mitigasi: GI Tanjung Sauh (9 Nov 2026), MaxPower Sagulung black start, BESS PLN Batam, rekonduktoring TU–SB 2031.</li><li class="e">Eksekusi: realisasi transmisi nasional 2025 hanya ±37% target.</li></ul>
  <h3>Pertanyaan terkait</h3>${qref([findQ('What are the main constraints on transmission'),findQ('Do you have SAIDI'),findQ('What caused the October'),findQ('How loaded are the Bintan'),findQ('What is the single most effective')])}
  <div class="src">RUPTL Tabel 4.51, A4.4, A4.5, A4.22; Bloomberg Technoz; Listrik Indonesia; IJECBE 2025; Kontan Jul 2026.</div>`},
 int:{t:'Interkoneksi',num:6,lay:['corr','tx','gi','plan','sys'],z:'sum',map:['6 · Interkoneksi Batam–Bintan & Sumatera','Hijau putus-putus = rencana RUPTL (rute skematis)'],
  html:()=>`<div class="eyebrow">Topik 6 · Batam–Bintan interconnection (prioritas)</div><h2>Satu sistem sejak 2015; jalur kedua baru 2032, dan bersyarat</h2>
  <div class="lead"><b>Jawaban 30 detik</b>Sejak kabel laut 150 kV beroperasi (10 Nov 2015), Batam–Bintan menjadi satu sistem. Operatornya PLN Batam, sementara PLN Persero menjual ke pelanggan Bintan; energinya dicatat sebagai "impor" antar-wilus. RUPTL tidak menambah kabel 150 kV kedua. Penguatan berikutnya adalah ISBB 1.200 MW dari Sumatera (2031) dan ekstensi 500 kV ke Bintan (2032, hanya jika demand pasti).<div class="say">"Bintan has been an extension of the Batam system since 2015; its second path is a 500 kV extension in 2032 that only happens if a big load commits."</div></div>
  <h3>Kronologi</h3><div class="scroll"><table class="t"><tbody>
  ${[['21 Mar 2013','Kontrak kabel laut (barat 3,45 km + 1 km tanah; timur 6,55 km)'],['10 Nov 2015','Energize + GI Tanjung Uban 30 MVA & Ngenang 10 MVA; transfer 20 MW'],['Agt 2016','SUTT TU–SB 28 · SB–AR 38 · AR–Kijang 20 kmr; transfer ±34 MW, beban Bintan 65,1 MW'],['12 Okt 2026','Blackout dari GI Sungai Harapan merembet ke Bintan'],['9 Nov 2026','GI Tanjung Sauh 150 kV beroperasi'],['2026 / 2028','Kabel 150 kV Karimun (tabel vs Lampiran E)'],['2027','PLTMG Bintan 100 MW (wilus PLN Batam)'],['2030','GI Air Raja +60 MVA; SUTT Sri Bintan–KTT Bintan Resort'],['2031','ISBB 1.200 MW; rekonduktoring TU–SB; Rempang–Panaran 40 kms'],['2032','ISBB tahap 2; ekstensi 500 kV ke GITET Bintan (bersyarat)']].map(r=>`<tr><td class="mono" style="white-space:nowrap;font-size:11.5px">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>
  <h3>ISBB (Sumatera–Batam)</h3><ul class="facts"><li>Peranap → Sungai Guntung OHL HVDC 360 kms; Sungai Guntung → Rempang kabel laut 156 kms; konverter 1.500 MW + GITET 500/150 kV 3×500 MVA.</li><li>Neraca Sumatera: "Transfer ke Sistem Batam −1.200 MW" 2031–2034, dari EBT Sumatera; bisa melayani hingga ±3 GW Batam–Bintan.</li><li>Opsi ekspor Sumatera–(Batam)–Singapura 0,6–1,1 GW (AIMS III).</li><li class="e">Connection hub Bintan dibuka bila ada "sharing recovery investment yang adil" dengan PLN Batam — titik negosiasi antar-wilus.</li><li class="w">Data gap: rating termal, jumlah sirkit & status N-1 kabel; harga jual PLN Batam ke PLN Persero.</li></ul>
  <h3>Pertanyaan terkait</h3>${qref([findQ('Describe the Batam–Bintan'),findQ('What is the transfer capacity'),findQ('Is there a plan to connect Sumatra'),findQ('What reinforcement'),findQ('When will Karimun be interconnected')])}
  <div class="src">ESDM 2013; Setkab 2016; detik 2016; RUPTL A4, V.5.7, V.11.2 (hlm V-107, V-324), Lampiran E; Listrik Indonesia Nov 2026.</div>`},
 ins:{t:'Insight RUPTL',lay:['plan','sys','load'],z:'sum',map:['Insight: inkonsistensi RUPTL','Bahan bernilai untuk klien yang hanya membaca tabel provinsi'],
  html:()=>`<div class="eyebrow">Insight expert</div><h2>Empat angka RUPTL yang saling bertentangan</h2>
  <p>Klien kemungkinan hanya membaca tabel provinsi. Angkat poin ini sebagai nilai tambah expert.</p>
  <div class="scroll"><table class="t"><thead><tr><th>Isu</th><th>Versi A</th><th>Versi B</th><th>Implikasi</th></tr></thead><tbody>
  <tr><td><b>COD kabel 150 kV Karimun</b></td><td>Tabel transmisi Riau: 2026, Committed</td><td>V.11.2: "masih tahap perencanaan"; Lampiran E: 2028</td><td>Asumsi 2027–2028; diesel Karimun bertahan lebih lama</td></tr>
  <tr><td><b>COD Sumatera–Batam–Bintan</b></td><td>Neraca & tabel transmisi: 2031 (1.200 MW)</td><td>Lampiran E (KI Tanjung Sauh) & hlm A-51: 2028</td><td>AC/DC belum selesai dikaji → realistis ≥2031</td></tr>
  <tr><td><b>Lonjakan industri 2031</b></td><td>A4.6 (tanpa KTT confidence rendah): 58 → 4.442 GWh</td><td>BAI/DC Bintan 1.500 MVA confidence rendah, mulai 2032</td><td>Ada KTT ±500 MW rata-rata tak bernama di 2031 — tanyakan</td></tr>
  <tr><td><b>Infrastruktur BAI</b></td><td>Lampiran E: 1.529 MVA + PLTA kuota 900 MW + PLTGU 600 MW</td><td>A4.10: BESS 100 MW + PLTA 161 MW</td><td>Skema pasokan smelter belum final</td></tr></tbody></table></div>
  <h3>Aturan praktis jadwal</h3><ul class="facts"><li>Transmisi/kabel laut: +1–2 tahun (realisasi transmisi 2025 hanya ±37% target).</li><li>PLTMG/sewa: +0–1 tahun.</li><li>"Perlu studi" / "confidence rendah" = opsi, bukan rencana.</li></ul>
  <h3>Pertanyaan terkait</h3>${qref([findQ('What internal inconsistencies'),findQ('What is behind the jump'),findQ('How credible are the RUPTL'),findQ('Will Bintan Alumina')])}
  <div class="src">RUPTL A4, V.11.2, Lampiran E; Kontan Jul 2026.</div>`},
 prep:{t:'Persiapan call',lay:['sys','corr','plan','load'],z:'bbk',map:['Persiapan call','Survei vetting, pertanyaan balik, data yang jangan diklaim'],
  html:()=>`<div class="eyebrow">Persiapan</div><h2>Sebelum dan selama call</h2>
  <div class="lead"><b>Penting</b>Survei Arches meminta jawaban vetting tidak memakai teks yang dihasilkan AI. Gunakan poin di bawah sebagai pengingat fakta, lalu tulis dengan kata-kata Anda sendiri. Saat call, bagikan hanya informasi publik dan keahlian Anda sendiri; hindari informasi rahasia (kontrak, data internal) dari pemberi kerja atau klien Anda.</div>
  <h3>5 pertanyaan vetting → poin fakta</h3>
  <table class="t"><tbody>
  <tr><td><b>1. Demand, kapasitas, DMN, reserve</b></td><td>Batam–Bintan 930/780 MW (±19%); Kepri tanpa Batam 144 MW terpasang / 109,8 DMN vs 189 MW puncak; Karimun 40,6/36,1 MW, cadangan 4,5 &lt; unit 7 MW; kriteria isolated N-2 / RM ≥35%.</td></tr>
  <tr><td><b>2. Proyeksi 2030–2035 + industri/DC</b></td><td>189 → 241 MW (2030) → 980 MW (2031); industri 47 → 58 → 4.442 GWh; BAI/DC Bintan 1.500 MVA (2032, low confidence); DayOne 511, Altiva 690 MVA; hub DC BBK.</td></tr>
  <tr><td><b>3. Proyek RUPTL</b></td><td>PLTMG Bintan 100 (2027) + 50 (2031); PLTS 25 + 25; GI TBK 2×30 MVA + kabel 150 kV Karimun; ISBB 1.200 MW (2031); 500 kV ke Bintan (2032); EBT lokal 44,8 MW.</td></tr>
  <tr><td><b>4. Kendala & investasi</b></td><td>Satu koridor + satu operator (blackout 12 Okt); PLTU kecil Karimun; eksekusi transmisi 37%; mitigasi: GI Tanjung Sauh, BESS, black start Sagulung, rekonduktoring, ISBB.</td></tr>
  <tr><td><b>5. EBT & hambatan</b></td><td>±40 MW lokal s.d. 2030; post-2031 via Sumatera; grid kecil, EBT bukan firm, terms ekspor SG, lahan, kabel laut; kuota "Sumatera–Bintan tersebar".</td></tr></tbody></table>
  <h3>Pertanyaan balik ke klien</h3><ul class="facts"><li>Kepentingan di sisi mana: investor industri/DC (kepastian pasokan & tarif), IPP (kuota PLTS/PLTMG wilus), atau lender/infrastruktur (ISBB)?</li><li>Lokasi: Bintan barat (Lobam/BIIE, Tanjung Uban, dekat titik masuk kabel) atau timur/Galang Batang? Jarak ke GI menentukan biaya sambung.</li><li>Skala: &lt;30 MVA (I-3, dari GI 150/20 kV eksisting) atau ≥30 MVA (I-4, butuh SUTT/GI baru, mungkin menunggu ISBB)?</li><li>Perlu skenario tarif khusus (KEK, captive, PPA langsung/power wheeling)?</li></ul>
  <h3>Jangan diklaim (data belum ada)</h3><ul class="facts"><li class="w">Beban puncak Bintan 2025–2026 (resmi terakhir 65,1 MW, 2016).</li><li class="w">Rating termal, jumlah sirkit, dan status N-1 kabel Batam–Bintan.</li><li class="w">Harga jual PLN Batam → PLN Persero untuk energi Bintan.</li><li class="w">SAIDI/SAIFI UP3 Tanjungpinang dan ULP Tanjung Balai Karimun.</li><li class="w">Penyebab final blackout 12 Okt 2026.</li></ul>`}
};
const ORDER=['ov','cap','dem','ebt','tar','rel','int','ins','prep'];

/* tabs + kpis */
const tabsEl=document.getElementById('tabs');
tabsEl.innerHTML=ORDER.map(k=>`<button class="tab" role="tab" type="button" data-t="${k}" aria-selected="false">${TOP[k].num?`<i>${TOP[k].num}</i>`:''}${esc(TOP[k].t)}</button>`).join('');
tabsEl.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)go(b.dataset.t)});
const KPI=[
 ['Batam–Bintan','930 / 780 MW','pasok / puncak · ±19%','md','cap'],
 ['Kepri tanpa Batam','109,8 MW DMN','vs 189 MW puncak (2025)','md','cap'],
 ['Karimun cadangan','4,5 MW','< unit PLTU 7 MW · gagal N-1','hi','rel'],
 ['Beban 2030 → 2031','241 → 980 MW','RUPTL A4.8, lompatan KTT','','dem'],
 ['EBT lokal 2025–30','≈40 MW','33,5 PLTS + 6,4 PLTBio','','ebt'],
 ['Tarif I-3 / I-4','Rp1.114,74','I-4 Rp996,74 · Q4 2026 tetap','','tar'],
 ['ISBB Sumatera','1.200 MW · 2031','Karimun 150 kV: 2026→2028?','md','int']];
document.getElementById('kpis').innerHTML=KPI.map(k=>`<button class="kpi" type="button" data-t="${k[4]}" ${k[3]?`data-sev="${k[3]}"`:''}><span class="lab">${esc(k[0])}</span><span class="val">${esc(k[1])}</span><span class="sub">${esc(k[2])}</span></button>`).join('');
document.getElementById('kpis').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)go(b.dataset.t)});

const side=document.getElementById('side');let cur='ov',selHtml='';
function showSel(n,rows){selHtml=`<div class="sel"><header><h4>${esc(n)}</h4><button class="x" type="button" aria-label="Tutup detail">×</button></header><dl class="kv">${(rows||[]).map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl></div>`;render(false)}
function render(scrollTop){side.innerHTML=selHtml+TOP[cur].html();if(scrollTop!==false)side.scrollTop=0;else if(selHtml)side.scrollTop=0}
side.addEventListener('click',e=>{if(e.target.closest('.x')){selHtml='';render()}const q=e.target.closest('[data-q]');if(q)openQA(+q.dataset.q)});
function go(k,fly=true){if(!TOP[k])k='ov';cur=k;selHtml='';
  tabsEl.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===k));
  LAYERS.forEach(x=>setLayer(x.k,TOP[k].lay.includes(x.k)));
  document.getElementById('mapTitle').innerHTML=esc(TOP[k].map[0])+'<small>'+esc(TOP[k].map[1])+'</small>';
  if(fly)map.flyToBounds(BOUNDS[TOP[k].z],{duration:.6});render();
  try{history.replaceState(null,'','#'+k)}catch(e){}
}

/* ---------- Q&A drawer ---------- */
const drawer=document.getElementById('drawer'),qlist=document.getElementById('qlist'),qs=document.getElementById('qs'),qcats=document.getElementById('qcats'),qcount=document.getElementById('qcount');
let qcat='all',qconf='all';
const cnt={};QA.forEach(q=>cnt[q.c]=(cnt[q.c]||0)+1);
qcats.innerHTML=`<button class="chip" type="button" data-c="all" aria-pressed="true">Semua<span class="num">100</span></button>`+Object.keys(CAT).map(c=>`<button class="chip" type="button" data-c="${c}" aria-pressed="false">${esc(CAT[c])}<span class="num">${cnt[c]||0}</span></button>`).join('')+`<span style="width:10px"></span><button class="chip" type="button" data-f="V" aria-pressed="false">Terverifikasi</button><button class="chip" type="button" data-f="E" aria-pressed="false">Estimasi / opini</button>`;
qcats.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.c){qcat=b.dataset.c;qcats.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x===b))}
  if(b.dataset.f){qconf=qconf===b.dataset.f?'all':b.dataset.f;qcats.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.f===qconf))}
  drawQ()});
const hl=(t,re)=>re?esc(t).replace(re,m=>'<mark>'+m+'</mark>'):esc(t);
function drawQ(openId){
  const term=qs.value.trim();const re=term?new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'):null;
  const items=QA.map((q,i)=>({...q,i:i+1})).filter(q=>(qcat==='all'||q.c===qcat)&&(qconf==='all'||q.conf===qconf)&&(!re||re.test([q.q,q.a,q.s,(q.f||[]).join(' '),q.src].join(' '))&&(re.lastIndex=0,true)));
  qcount.textContent=items.length+' dari 100';
  qlist.innerHTML=items.length?items.map(q=>`<details class="q" id="q${q.i}" ${openId===q.i||(re&&items.length<=6)?'open':''}><summary><span class="no">#${String(q.i).padStart(3,'0')}</span><span class="qt">${hl(q.q,re)}</span><span class="meta"><span class="tag">${esc(CAT[q.c])}</span><span class="tag ${q.conf==='V'?'v':'e'}">${q.conf==='V'?'Terverifikasi':'Estimasi'}</span></span></summary>
   <div class="qbody"><div>${hl(q.a,re)}</div><div class="say"><b>SAY IT (EN)</b>${hl(q.s,re)}</div>${q.f&&q.f.length?`<ul class="facts">${q.f.map(f=>`<li>${hl(f,re)}</li>`).join('')}</ul>`:''}<div style="font-size:11.5px;color:var(--mut)">Sumber: ${esc(q.src)}</div>${q.loc&&REG[q.loc]?`<button class="go" type="button" data-loc="${q.loc}">Lihat di peta →</button>`:''}</div></details>`).join(''):'<div class="empty">Tidak ada pertanyaan yang cocok. Coba kata lain, misalnya "kabel" atau "PLTMG".</div>';
  if(openId){const el=document.getElementById('q'+openId);if(el)el.scrollIntoView({block:'start'})}
}
qs.addEventListener('input',()=>drawQ());
qlist.addEventListener('click',e=>{const b=e.target.closest('[data-loc]');if(!b)return;const r=REG[b.dataset.loc];closeQA();
  const lay=r.p&&r.p.l?r.p.l:(b.dataset.loc==='corr'?'corr':'plan');setLayer(lay,true);
  map.flyTo(r.ll,Math.max(map.getZoom(),b.dataset.loc==='isbb'||b.dataset.loc==='karint'?8.5:10),{duration:.6});setTimeout(()=>{r.m.openPopup&&r.m.openPopup(r.ll);showSel(r.p.n,r.rows)},650)});
function openQA(id){drawer.hidden=false;if(id){qcat='all';qconf='all';qs.value='';qcats.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c==='all'));qcats.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed','false'))}drawQ(id);if(!id)qs.focus()}
function closeQA(){drawer.hidden=true;document.getElementById('openQA').focus()}
document.getElementById('openQA').addEventListener('click',()=>drawer.hidden?openQA():closeQA());
document.getElementById('closeQA').addEventListener('click',closeQA);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!drawer.hidden)closeQA();if(e.key==='/'&&drawer.hidden&&document.activeElement.tagName!=='INPUT'){e.preventDefault();openQA()}});

/* theme change → restyle vector features */
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>location.reload())}catch(e){}

const h=(location.hash||'').slice(1);
go(TOP[h]?h:'ov',false);
const fitNow=()=>{map.invalidateSize();map.fitBounds(BOUNDS[TOP[cur].z])};
fitNow();setTimeout(fitNow,250);
window.addEventListener('hashchange',()=>{const k=(location.hash||'').slice(1);if(TOP[k]&&k!==cur)go(k)});
})();
</script>
