 segs.forEach(([g,k])=>{const v=g.v[ci],pc=Math.round(v/tot*100);s+=`<g class="exr" data-ck="${ci}|${k}" style="cursor:pointer"><rect x="${lx-6}" y="${y-rh/2+1}" width="${W-lx}" height="${rh-2}" rx="6" fill="transparent"/><rect x="${lx}" y="${y-5}" width="10" height="10" rx="3" fill="${g.c}"${g.nf?' opacity=".5"':''}/><text x="${lx+16}" y="${y+4}" style="font-family:var(--f);font-weight:700;font-size:11px;fill:var(--ink)">${esc((n=>n.length>24?n.slice(0,23)+'…':n)(g.n.replace('NEW ','')))}</text><text x="${W-8}" y="${y+4}" text-anchor="end" style="font-size:11px"><tspan class="lb">${o.unit==='%'?'':fmt(v,v%1?1:0)}</tspan>${o.unit==='%'?'':' · '}${pc}%</text></g>`;y+=rh});
 if(extra){y+=rh*.3;extra.forEach(e=>{s+=`<g class="exr" ${e[3]?`data-ck="${ci}|${e[3]}"`:''} style="cursor:${e[3]?'pointer':'default'}"><line x1="${lx}" x2="${lx+10}" y1="${y}" y2="${y}" stroke="${e[2]}" stroke-width="3" stroke-dasharray="4 2"/><text x="${lx+16}" y="${y+4}" style="font-family:var(--f);font-weight:700;font-size:11px;fill:${e[2]}">${esc(e[0])}</text><text x="${W-8}" y="${y+4}" text-anchor="end" class="lb" style="font-size:11px;fill:${e[2]}">${esc(e[1])}</text></g>`;y+=rh})}
 return svg(s)}

$('#body').addEventListener('click',e=>{const sy=e.target.closest('[data-sys]');if(sy){sysMode=sy.dataset.sys;show(topic);return}const ck=e.target.closest('.cv [data-ck], .olr [data-ck], .okp [data-ck]');if(ck){const [a,c]=ck.dataset.ck.split('|');chartDetail(+a,isNaN(+c)?c:+c,ck);return}const b=e.target.closest('[data-go]');if(b){show(b.dataset.go);return}if(e.target.closest('[data-pj]')){openPJ();return}const pw=e.target.closest('[data-pjw]');if(pw){pjS.k=pjS.k===pw.dataset.pjw?'none':pw.dataset.pjw;pjRender();return}if(e.target.closest('[data-ppx]')){pjS.k='none';pjRender();return}if(e.target.closest('[data-pjx]')){unexplain();return}const ps=e.target.closest('[data-psc]');if(ps){pjS.si=+ps.dataset.psc;pjS.k='none';pjRender();return}const pb=e.target.closest('[data-pb]');if(pb){pjS.y=+pb.dataset.py;pjS.k='bar';pjS.sk=+pb.dataset.pb;pjRender();return}const pm=e.target.closest('[data-pm]');if(pm){pjS.y=+pm.dataset.pm;pjS.k='metric';pjRender();return}const py=e.target.closest('[data-py]');if(py){pjS.y=+py.dataset.py;pjS.k='year';pjRender();return}const cd=e.target.closest('.icd[data-card]');if(cd){if(cd.classList.contains('on'))unexplain();else cardDetail(+cd.dataset.card);return}const k=e.target.closest('.kpi[data-x]');if(k){if(k.classList.contains('on'))unexplain();else explain(+k.dataset.x);return}if(e.target.closest('.xx')){unexplain();return}const g=e.target.closest('.exp [data-loc]');if(g)focusLoc(g.dataset.loc)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#exp')&&!$('#exp').hidden&&$('#qa').hidden)unexplain()});
$('#seg').addEventListener('click',e=>{const b=e.target.closest('[data-isl]');if(b&&b.dataset.isl!==isl)open(b.dataset.isl,topic)});
$('#home').onclick=home;
function countUp(root){root.querySelectorAll('[data-c]').forEach(el=>{const raw=el.dataset.c,m=raw.match(/^([±~]?)([\d,]+)(\.\d+)?$/);if(!m||/^(19|20)\d\d$/.test(raw)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const small=el.querySelector('small');const target=parseFloat(m[2].replace(/,/g,'')+(m[3]||''));const dec=m[3]?m[3].length-1:0;const t0=performance.now();
 const step=n=>{const p=Math.min(1,(n-t0)/700),e=1-Math.pow(1-p,3);el.firstChild.nodeValue=m[1]+fmt(target*e,dec);if(p<1)requestAnimationFrame(step)};el.firstChild.nodeValue=m[1]+fmt(0,dec);requestAnimationFrame(step)})}
function setHash(h){try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){}}

/* landing */
function silPath(k){return `<svg class="sil" viewBox="0 0 100 100" aria-hidden="true"><path d="${SIL[k]}"/></svg>`}
$('#land').innerHTML=`<div class="hero"><span class="k">${ic('bolt')} Riau Islands, Indonesia · RUPTL 2025–2034</span><h1>Bintan &amp; Karimun power systems</h1><p>Select an island.</p></div>
 <div class="cards">${['karimun','bintan'].map(k=>{const I=ISL[k];return `<button class="icard ${I.cls}" type="button" data-open="${k}"><header>${silPath(k)}<div><h2>${I.name}</h2><span class="badge ${I.cls}">${ic(k==='bintan'?'cable':'island')}${esc(I.badge)}</span></div></header>
  <div class="stats">${I.land.stats.map(s=>`<div class="stat ${s[3]?'hot':''}"><b data-c="${esc(s[0])}">${esc(s[0])}${s[1]?`<small>${esc(s[1])}</small>`:''}</b><span>${esc(s[2])}</span></div>`).join('')}</div>
  <div class="key">${ic('alert')}<span>${esc(I.land.key)}</span></div><span class="cta">View ${I.name} ${ic('arrow')}</span></button>`}).join('')}</div>
 <div class="strip"><span class="pill">${ic('bolt')} Batam–Bintan <b>930/780 MW</b></span><span class="pill">${ic('plant')} Riau Is. excl. Batam <b>109.8 MW</b> dependable</span><span class="pill">${ic('cable')} ISBB <b>1,200 MW</b> · 2031</span><span class="pill">${ic('tag')} I-3 <b>IDR 1,114.74</b>/kWh (≈6.6 US¢)</span></div>`;
$('#land').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)open(b.dataset.open,'ins')});
countUp($('#land'));

/* ---------- Q&A ---------- */
const CAT={U:['Structure & players','grid'],K:['Capacity & reserve','plant'],D:['Demand & industry','trend'],P:['Projects & RUPTL','cal'],E:['Renewables','sun'],T:['Tariff','tag'],R:['T&D reliability','shield'],I:['Interconnection','cable']};
let qc='all',qisl='all',qv='all';
const qa=$('#qa'),qs=$('#qs'),ql=$('#qlist');
function qaCounts(){const f=QA.filter(q=>qisl==='all'||q.isl===qisl||(qisl!=='U'&&q.isl==='U'&&false));return f}
function drawCats(){const inI=q=>qisl==='all'||q.isl===qisl||(qisl!=='U'&&q.isl==='U');const base=QA.filter(inI);const c={};base.forEach(q=>c[q.c]=(c[q.c]||0)+1);
 $('#qcats').innerHTML=`<button class="qcat" type="button" data-c="all" aria-pressed="${qc==='all'}">${ic('grid')}All topics<em>${base.length}</em></button>`+Object.keys(CAT).map(k=>`<button class="qcat" type="button" data-c="${k}" aria-pressed="${qc===k}">${ic(CAT[k][1])}${CAT[k][0]}<em>${c[k]||0}</em></button>`).join('')}
function drawFil(){const c={B:0,K:0,U:0};QA.forEach(q=>c[q.isl]++);
 $('#qfil').innerHTML=[['all','All areas',100,''],['B','Bintan',c.B+c.U,'isl'],['K','Karimun',c.K+c.U,'isl k'],['U','General only',c.U,'']].map(([v,n,k,cl])=>`<button class="chip ${cl}" type="button" data-i="${v}" aria-pressed="${qisl===v}">${n}<em>${k}</em></button>`).join('')+'<span class="vsep"></span>'+[['all','All verdicts','',QA.length],['p','Positive','vp',0],['m','Mixed','vm',0],['n','Caution','vn',0]].map(([v,n,cl,k])=>`<button class="chip ${cl}" type="button" data-v="${v}" aria-pressed="${qv===v}">${v==='all'?'':ic(VD[v][1])}${n}<em>${QA.filter(q=>(qisl==='all'||q.isl===qisl||(qisl!=='U'&&q.isl==='U'))&&(v==='all'||q.v[0]===v)).length}</em></button>`).join('')}
const hl=(t,re)=>re?esc(t).replace(re,m=>`<mark>${m}</mark>`):esc(t);
/* --- Q&A visual helpers --- */
const ABB=[['s.d.','s․d․'],['Kab.','Kab․'],['hlm.','hlm․'],['No.','No․'],['dkk.','dkk․'],['Tbk.','Tbk․'],['dll.','dll․']];
function splitSent(a){let t=a;ABB.forEach(([x,y])=>t=t.split(x).join(y));return t.split(/(?<=[.!?])\s+(?=[A-ZÀ-Ý(“"0-9±])/).map(s=>{ABB.forEach(([x,y])=>s=s.split(y).join(x));return s.trim()}).filter(Boolean)}
const NRE=/(Rp\s?[\d.,]+(?:[–-][\d.,]+)?(?:\/kWh)?|[±~≈]?\d[\d.,]*(?:\s?[–-]\s?\d[\d.,]*)?\s?(?:GWh|TWh|GW|MVA|MW|kms|km|%|jam|ribu|hari|kali))(?![\w])/g;
const clean=t=>t.filter(w=>!/[\d()+→×=:–\/]/.test(w)&&!/^(yang|dari|ke|di|untuk|sebesar|hanya|sekitar|menjadi|naik|lalu|atau|dengan|pada|dan|vs|saat|lebih|kurang|hampir|menyebut|MW|MVA|km|kms|GW|GWh|kV)$/i.test(w));
function stats(a){const out=[],seen=new Set();for(const s of splitSent(a)){let m;NRE.lastIndex=0;while((m=NRE.exec(s))&&out.length<3){const v=m[1].replace(/\s+/g,' ').trim();if(seen.has(v))continue;
 const before=s.slice(0,m.index).split(/[,;:(+=]|\bvs\b|→/).pop().trim().split(/\s+/);let lab=clean(before).slice(-3).join(' ');
 const after=s.slice(m.index+m[0].length);const par=after.match(/^\s*\(([^)]{2,24})\)/);if(par)lab=(lab?lab+' · ':'')+par[1];
 if(!lab){lab=clean(after.split(/[,;.:]/)[0].trim().split(/\s+/)).slice(0,3).join(' ')}
 if(!lab)continue;seen.add(v);out.push([v,lab])}if(out.length>=3)break}return out}

const CATC={U:C.navy,K:C.ocean,D:C.violet,P:'#2b5fa8',E:'#d48a00',T:C.leaf,R:C.coral,I:C.ocean2};
function bIcon(t){const x=t.toLowerCase();
 if(/padam|blackout|gagal|kurang|defisit|risiko|rentan|rawan|tidak cukup|terganggu|single point|tunggal|rugi|tertahan|terlambat|meleset|inkonsisten|bertentangan/.test(x))return['alert','w'];
 if(/pulih|beroperasi|berhasil|cukup|memenuhi|solusi|menyelesaikan|hemat|turun tajam|membaik/.test(x))return['check','g'];
 if(/rp|tarif|biaya|harga|kompensasi|usd|investasi|pendanaan/.test(x))return['money',''];
 if(/kabel|interkoneksi|sutt|transmisi|koridor|hvdc|kv\b|gi |gardu/.test(x))return['cable',''];
 if(/plts|surya|ebt|terbarukan|biomassa|hijau/.test(x))return['sun','s'];
 if(/data center|kek|industri|smelter|kawasan|pabrik/.test(x))return['factory',''];
 if(/pltu|pltd|pltmg|pltgu|pembangkit|mesin|genset/.test(x))return['plant',''];
 if(/\b20[23]\d\b|cod|jadwal|tahun/.test(x))return['cal',''];
 return['info','']}
const VD={p:['g','check','Positive for investors'],n:['w','alert','Caution · high risk'],m:['m','scale','Mixed · conditional']};
function kVal(v){const mm=v.match(/^((?:Rp|IDR)\s?)?([±~]?\d{1,3}(?:,\d{3})*(?:\.\d+)?)(\s.*|[%×k]|)$/);return mm?`<b data-c="${esc(mm[2])}">${esc((mm[1]||'')+mm[2])}<small>${esc(mm[3].trim())}</small></b>`:`<b class="tx">${esc(v)}</b>`}
function qBody(q,re){const V=VD[q.v[0]],P=q.p,ng=P.filter(p=>p[0]==='g').length,nw=P.filter(p=>p[0]==='w').length,ns=P.length-ng-nw;
 const seg=(n,c,l)=>n?`<i class="${c}" style="flex:${n}" title="${n} ${l}"></i>`:'';
 return `<div class="qa-a v-${V[0]}"><div class="vd" style="--i:0">${ic(V[1])}<div><small>${V[2]}</small>${hl(q.v[1],re)}</div></div>
 <div class="kst" style="--i:1">${q.k.map((k,j)=>`<div class="kc" style="--i:${j+1}">${kVal(k[0])}<span>${hl(k[1],re)}</span></div>`).join('')}</div>
 <div class="bal" style="--i:2"><div class="bar">${seg(ng,'g','upside(s)')}${seg(ns,'s','neutral')}${seg(nw,'w','risk(s)')}</div><div class="lg"><span class="g">${ic('check')}${ng} upside(s)</span>${ns?`<span class="s">${ic('info')}${ns} note(s)</span>`:''}<span class="w">${ic('alert')}${nw} risk(s)</span></div></div>
 <ul class="pts">${P.map((x,j)=>`<li class="${x[0]}" style="--i:${j+3}">${ic(x[0]==='g'?'check':x[0]==='w'?'alert':'info')}<span>${hl(x[1],re)}</span></li>`).join('')}</ul>
 <div class="adv" style="--i:${P.length+3}">${ic('target')}<div><small>Recommendation</small>${hl(q.r,re)}</div></div>
 <details class="more" style="--i:${P.length+4}"><summary>${ic('info')}Full explanation &amp; supporting data</summary><p>${hl(q.a,re)}</p>${q.f&&q.f.length?`<div class="fchips">${q.f.map(f=>`<span>${ic('check')}${hl(f,re)}</span>`).join('')}</div>`:''}</details>
 <div class="qfoot" style="--i:${P.length+5}"><span class="s">${ic('info')}Source: ${esc(q.src)} · ${q.conf==='V'?'verified data':'our analysis'}</span>${q.loc&&REG[mapLoc(q.loc)]?`<button class="go" type="button" data-loc="${q.loc}" data-isl="${q.isl}">${ic('arrow')} Show on map</button>`:''}</div></div>`}
function drawQ(openId){const term=qs.value.trim();const re=term?new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'):null;
 const it=QA.map((q,i)=>Object.assign({i:i+1},q)).filter(q=>(qv==='all'||q.v[0]===qv)&&(qisl==='all'||q.isl===qisl||(qisl!=='U'&&q.isl==='U'))&&(qc==='all'||q.c===qc)&&(!re||(re.lastIndex=0,re.test([q.q,q.a,(q.f||[]).join(' '),q.src,q.v[1],q.r,q.p.map(p=>p[1]).join(' '),q.k.map(k=>k.join(' ')).join(' ')].join(' ')))));
 $('#qn').textContent=it.length+' of 100 questions';
 const IT={B:['b','Bintan'],K:['k','Karimun'],U:['u','General']};
 ql.innerHTML=it.length?it.map(q=>`<details class="qi" id="q${q.i}" ${openId===q.i||(re&&it.length<=5)?'open':''}><summary><span class="qic" style="--cc:${CATC[q.c]}">${ic(CAT[q.c][1])}<em>${String(q.i).padStart(2,'0')}</em></span><span class="q">${hl(q.q,re)}<span class="sub2"><i class="idot ${IT[q.isl][0]}"></i>${IT[q.isl][1]} · ${esc(CAT[q.c][0])}</span></span><span class="tags"><span class="tg v${q.v[0]}">${ic(VD[q.v[0]][1])}${{p:'Positive',n:'Caution',m:'Mixed'}[q.v[0]]}</span><span class="chev">${ic('arrow')}</span></span></summary>
  ${qBody(q,re)}</details>`).join(''):`<div class="none">No match for "${esc(term)}". Try another word, e.g. "cable", "PLTMG" or "tariff".</div>`;
 if(openId){const el=document.getElementById('q'+openId);if(el)el.scrollIntoView({block:'center'})}}
function mapLoc(l){return ({bin:'sys_b',kar:'sys_k',batam:'sys_bt',inc1:'inc1',corr:'ce',karint:'karint',isbb:'isbb',tsauh:'tsauh',gb:'gb',lagoi:'lagoi',belat:'belat'})[l]||l}
qs.addEventListener('input',()=>drawQ());
ql.addEventListener('toggle',e=>{const d=e.target;if(d.open&&d.classList.contains('qi'))countUp(d.querySelector('.kst')||d)},true);
$('#qcats').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;qc=b.dataset.c;drawCats();drawQ()});
$('#qfil').addEventListener('click',e=>{const bv=e.target.closest('[data-v]');if(bv){qv=bv.dataset.v;drawFil();drawQ();return}const b=e.target.closest('[data-i]');if(!b)return;qisl=b.dataset.i;drawFil();drawCats();drawQ()});
ql.addEventListener('click',e=>{const b=e.target.closest('[data-loc]');if(!b)return;const id=mapLoc(b.dataset.loc),r=REG[id];closeQA();
 const target=['karint','sys_k','belat','inc2'].includes(id)||b.dataset.isl==='K'?'karimun':'bintan';if(isl!==target)open(target,'ring');
 setLayer(r.k,true);setTimeout(()=>{map.flyTo(r.ll,['isbb','karint'].includes(id)?8.5:10.5,{duration:.7});setTimeout(()=>{if(r.pop)r.pop();else if(r.l.openPopup)r.l.openPopup();else r.l.eachLayer&&r.l.eachLayer(x=>x.getPopup&&x.getPopup()&&x.openPopup())},800)},300)});
function openQA(){qisl=isl==='bintan'?'B':isl==='karimun'?'K':'all';drawFil();drawCats();qa.hidden=false;drawQ();setTimeout(()=>qs.focus(),50)}
function closeQA(){qa.hidden=true;$('#qaOpen').focus()}
$('#qaOpen').onclick=openQA;$('#qaClose').onclick=closeQA;
qa.addEventListener('click',e=>{if(e.target===qa)closeQA()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!qa.hidden)closeQA();else if(e.key==='/'&&qa.hidden&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();openQA()}});

snapGroups();
/* boot */
const h=(location.hash||'').slice(1).split('-');
if(ISL[h[0]])open(h[0],ISL[h[0]].T[h[1]]?h[1]:'ring');else home();
setTimeout(()=>{map.invalidateSize();if(isl)fitIsl()},250);
window.addEventListener('resize',()=>map.invalidateSize());
})();
</script>
