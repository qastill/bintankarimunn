ve, load does not appear in PLN statistics. Once firm capacity arrives, recorded growth can spike above trend for 1–2 years. For forecasting, we would add ±5–10% to Karimun's base load as suppressed demand.","f":["Rolling-blackout pattern in 2022, 2025, 2026"],"src":"Our analysis","isl":"U","v":["m","Yes, especially on Karimun: industry runs gensets because PLN is unreliable."],"p":[["w","Rolling blackouts recur."],["g","Latent demand is a market once reliability recovers."],["s","Add 5–10% to base load."],["g","Opportunity for sellers of \"reliable power\"."]],"k":[["5–10%","hidden demand"],["gensets","alternative supply"]],"r":"Reliable power can be sold at a premium to local industry."},{"c":"D","conf":"V","loc":null,"q":"What would it take for Bintan/Karimun to become a real data-center hub?","a":"As cited by industry associations and observers (Oct 2026): (1) reliable power with redundancy and green-energy options, (2) water for cooling, (3) ready land and permit certainty, (4) international subsea-cable connectivity, and (5) incentives/regulatory certainty. Karimun adds a geopolitical issue given its proximity to the Malacca Strait. On the power side, the hardest prerequisite is supply redundancy, which neither Bintan nor Karimun currently has.","f":["IDPRO's 5 requirements","IKTII: Karimun geopolitical issue"],"src":"Bisnis 21–22 Oct 2026","isl":"U","v":["n","The hardest prerequisite, power redundancy, is missing on both Bintan and Karimun."],"p":[["w","Needs reliable power + a green pathway."],["w","Needs water for cooling."],["g","Land available and low population density."],["g","Close to international cables and Singapore."]],"k":[["5","IDPRO requirements"],["0","N-1 systems today"]],"r":"Choose a site near an existing substation and a water source, then build your own redundancy."},{"c":"D","conf":"E","loc":null,"q":"What are the low, base and high demand scenarios for 2030?","a":"Official reference: Riau Islands excl. Batam 241 MW in 2030 (RUPTL A4.8). Our estimates by system: Bintan PLN grid low ±120 MW, base ±130 MW, high ±300 MW (with ±150 MW of HV-customer/DC anchor load before 2031). Karimun TBK low ±42 MW, base ±44 MW, high ±55 MW (suppressed demand + FTZ industry after the cable arrives). Batam–Bintan total: base ±1,230 MW, high ±1,500 MW+ if Batam data centers ramp quickly. After 2031, RUPTL itself already jumps (980 MW for the Riau Islands excl. Batam).","f":["See the scenario chart in the Demand panel"],"src":"RUPTL A4.8; our estimate","isl":"U","v":["m","Bintan 120 / 130 / 300 MW; Karimun 42 / 44 / 55 MW (low / base / high)."],"p":[["s","RUPTL reference for the Riau Islands excl. Batam: 241 MW (2030)."],["g","The high scenario is driven by anchor loads."],["w","The grid is ready only for the base scenario."],["s","Our estimate."]],"k":[["130 MW","Bintan base"],["44 MW","Karimun base"]],"r":"Stress-test investment feasibility on the low scenario."},{"c":"P","conf":"V","loc":"karint","q":"Which generation projects does RUPTL 2025–2034 list for Karimun?","a":"RUPTL's strategy for Karimun is not large local generation but a 150 kV interconnection from Sumatra (TBK substation 2×30 MVA, COD 2026 in the table; realistically 2027–28). Appendix E (Karimun Maritime Industrial Complex) cites 40 MW of existing TBK capacity plus additional gas-engine capacity. Local renewables listed as potential: Kundur biomass plant (Karimun Regency) 2.5 MW and Tanjung Batu 2+2 MW. On the ground: +6 MW of diesel at Bukit Carok and 7 MW of rented gensets (2026), plus a 1 MW PLN EPI × KPP biomass-gasification pilot (±35 tonnes of biomass/day, MoU Apr 2026). Once the cable arrives, Karimun's mix follows the Sumatra grid.","f":["Appendix E: TBK 40 MW + gas-engine plant","Potential: Kundur biomass 2.5 MW; Tanjung Batu 2+2 MW","Biomass pilot 1 MW, ±35 t/day"],"src":"RUPTL Appendices A4, E; Listrik Indonesia Apr 2026; Kepri Headline 2026","isl":"K","v":["m","RUPTL relies on the Sumatra cable for Karimun, not on large local generation."],"p":[["g","150 kV cable + 2×30 MVA TBK substation."],["s","Additional gas-engine plant (Appendix E)."],["s","Short term: diesel +6 MW, rental 7 MW, biomass 1 MW."],["w","Cable timing is uncertain."]],"k":[["2×30 MVA","TBK substation"],["2027–28","cable arrival"]],"r":"Align your Karimun entry plan with cable energisation."},{"c":"P","conf":"V","loc":"bin","q":"Which projects does RUPTL list for Bintan/Tanjungpinang?","a":"Generation via the PLN Batam licence-area partnership: gas-engine plant 100 MW (2027) + 50 MW (2031), solar PV 25 MW (2028) + 25 MW (2030). Transmission: 10 kms double-circuit 150 kV line Sri Bintan → Bintan Resort Cakrawala HV customer (Lagoi) + a 2-bay extension at Sri Bintan substation (2030); a 1×60 MVA transformer extension at Air Raja substation (2030); reconductoring of Tanjung Uban–Sri Bintan, double circuit, 32 kms (2031). Long term: a 500 kV extension Rempang → Ngenang → Tanjung Taloh → Bintan 500/150 kV substation 1×250 MVA → 500 kV substation for the BAI/Data Center HV customer (162 kms, 2032), only if demand is firm. PLN prioritises developers that also create demand, on a take-or-pay basis.","f":["RUPTL p. A-52; A4 transmission table","500 kV to Bintan: \"for low-confidence HV customers\""],"src":"RUPTL 2025–2034 Appendix A4","isl":"B","v":["p","150 MW of gas engines, 50 MW of solar PV, 150 kV reinforcement, and conditional 500 kV."],"p":[["g","Gas-engine plant 100 MW (2027) + 50 MW (2031)."],["g","Air Raja substation +60 MVA (2030), reconductoring in 2031."],["s","500 kV to Bintan in 2032 only if demand is firm."],["w","Developers must bring demand (take-or-pay)."]],"k":[["150 MW","gas-engine plants"],["162 kms","500 kV extension"]],"r":"Investors with real demand have leverage to trigger these projects."},{"c":"P","conf":"V","loc":"batam","q":"What in the PLN Batam RUPTL affects Bintan?","a":"RUPTL PLN Batam 2023–2032 (May 2023) adds 860 MW of supply, including 400 MW of inter-regional cooperation with PLN Persero, plus solar PV, gas turbines/CCGTs and gas-engine plants. The RE mix target rises to 35% by 2032. RUPTL PLN Persero 2025–2034 itself records most of Bintan's energy as an \"import\" from the Batam System under inter-licence-area cooperation. RUPTL also includes plants for Bintan built in the PLN Batam licence area: gas-engine plant 100 MW (2027) + 50 MW (2031) and solar PV 25 MW (2028) + 25 MW (2030). These replace the \"Bintan RE Base Plant 200 MW\" in the previous RUPTL.","f":["RUPTL p. A-52","PLN Batam RUPTL: 860 MW, 400 MW inter-regional"],"src":"RUPTL 2025–2034 p. A-52; ESDM May 2023","isl":"B","v":["m","860 MW added, including a 400 MW import from Sumatra; 35% RE target by 2032."],"p":[["g","Large capacity additions."],["w","The 400 MW import missed its 2026 target."],["s","Plants for Bintan are booked as inter-licence-area cooperation."],["g","RE share is rising."]],"k":[["860 MW","additions"],["35%","2032 RE target"]],"r":"Track delivery, not targets."},{"c":"P","conf":"V","loc":"batam","q":"What is the status of the Batam #1 and Batam 3 & 4 CCGTs?","a":"Batam #1 / \"Batam Bintan 1\" CCGT, 120 MW: owned by PLN Batam, EPC by PTPP, ±IDR 3.35 trillion, target 2028. Batam 3 & 4 CCGT, 2×150 MW: IPP Dalle Energy, PJBTL finalised 16 Jul 2026, estimated COD 2029–2030 (combined-cycle gas plants take ±30–36 months). Both are key to keeping the Batam–Bintan reserve above 15% as data centers come online.","f":["RRI Jul 2026: \"Batam secures 300 MW power boost\""],"src":"Kontan; RRI Jul 2026; PTPP","isl":"B","v":["p","Batam #1 120 MW (2028) and Batam 3&4 2×150 MW (PJBTL Jul 2026) are the backbone."],"p":[["g","EPC by a PP-led consortium worth IDR 3.35 trillion."],["g","PJBTL already signed."],["w","Batam 3&4 COD around 2029–2030."],["w","Dependent on gas supply."]],"k":[["120 MW","Batam #1, 2028"],["300 MW","Batam 3&4"]],"r":"This schedule determines when spare capacity opens up for new DCs."},{"c":"P","conf":"V","loc":"tsauh","q":"Which transmission projects are under way around Bintan?","a":"The 150 kV Tanjung Sauh substation was energised on 9 Nov 2026, described by PLN Batam as a milestone in reinforcing the Batam–Bintan network. It came alongside a capability upgrade of the 60 MW Maxpower Sagulung gas-engine plant. Bintan's 150 kV lines (Tanjung Uban–Sri Bintan 28 route-km, Sri Bintan–Air Raja 38 route-km, Air Raja–Kijang 20 route-km) have operated since 2015–2016. RUPTL: Air Raja substation extension 1×60 MVA (2030), Sri Bintan–Bintan Resort HV customer line (2030), Tanjung Uban–Sri Bintan reconductoring 32 kms (2031), Rempang–Panaran substation link 40 kms (2031), 500 kV extension to Bintan (2032, conditional). There is no second 150 kV Batam–Bintan cable.","f":["Single source for the 9 Nov 2026 date (Listrik Indonesia)"],"src":"Listrik Indonesia 19 Nov 2026; RUPTL substation table","isl":"B","v":["m","Tanjung Sauh substation is online; other reinforcements only in 2030–2032."],"p":[["g","Tanjung Sauh substation (Nov 2026)."],["g","Air Raja substation +60 MVA and Lagoi 150 kV line (2030)."],["w","No second 150 kV cable."],["s","500 kV in 2032 is conditional."]],"k":[["Nov 2026","Tanjung Sauh substation"],["0","second cable"]],"r":"Sites near Tanjung Uban or Sri Bintan substations get connected faster."},{"c":"P","conf":"V","loc":"kar","q":"What short-term steps has PLN already taken on Karimun?","a":"(1) A new 6 MW diesel plant at Bukit Carok (target Aug 2026). (2) A 7 MW genset contract, PLN × PT PEB / PLN Nusa Daya (15 Jun 2026). (3) Accelerated repair of coal unit 2. (4) Load management prioritising vital facilities (hospitals, ports). Ombudsman Kepri has called for faster generation recovery and clarity on customer compensation. This is a patch-up: it closes the deficit but does not meet the N-2/35% RM criteria.","f":["Ombudsman: 3 demands to PLN (Karimun crisis)"],"src":"Kepri Headline; Warta Kepri Jul 2026; Ombudsman Kepri","isl":"K","v":["m","A patch-up: new diesel and rentals close the deficit but do not meet the criteria."],"p":[["g","Diesel +6 MW and 7 MW of rented gensets."],["g","Dependable capacity restored to 40.6 MW."],["w","Still below the N-2 criterion."],["w","High fuel costs."]],"k":[["+13 MW","additions"],["9.5 MW","gap to N-2"]],"r":"An opportunity to offer leased BESS or solar PV + BESS to PLN."},{"c":"P","conf":"V","loc":"belat","q":"What is the Belat Island project?","a":"An early-stage study of large-scale solar PV + BESS (up to ±2 GW of generation) on Belat Island, Karimun, by Gotion with Oriens (MoU Jan 2026). Horizon: 3–5 years. It targets exports to Singapore and/or industrial/data-center anchor loads, not Karimun's ±36 MW town grid. Status: early stage, with no PJBTL or final export permit yet.","f":["MoU Jan 2026","Generation scale up to 2 GW"],"src":"Reports Jan 2026 (Gotion × Oriens)","isl":"K","v":["m","Solar PV + batteries up to 2 GW for export or anchor loads, not for the town grid."],"p":[["g","GW scale, MoU Jan 2026."],["g","Could become a green source for Karimun DCs."],["w","Indonesia–Singapore export terms not yet final."],["s","Still at an early stage."]],"k":[["2 GW","scale"],["MoU","status"]],"r":"Explore green-power offtake from Belat if building a DC on Karimun."},{"c":"P","conf":"E","loc":null,"q":"Which projects are most at risk of delay?","a":"(1) Interconnections: ISBB 1,200 MW (2031, AC/DC not yet decided) and the Karimun 150 kV cable (2026 in the table, 2028 in the narrative); the 400 MW import in the PLN Batam RUPTL has already missed 2026. (2) Export solar PV projects: awaiting Indonesia–Singapore export terms (Mar 2026 reports say negotiations have stalled). (3) Batam 3&4 CCGT: financing and gas supply. (4) Mid-size Karimun projects: small-system economics and licence-area fragmentation. Lowest risk: modular gas/diesel units and BESS, because they are fast and need no transmission.","f":["RUPTL II.2: project delays offset by an extra ±5% RM"],"src":"Kontan 2023; reports Mar 2026; analysis","isl":"U","v":["n","Transmission and subsea cables (ISBB, Karimun cable) are most at risk of delay."],"p":[["w","National transmission delivery in 2025 was only 37%."],["w","ISBB: AC or DC not yet decided."],["w","Export solar PV awaits terms."],["g","Modular gas engines and BESS are fastest."]],"k":[["37%","transmission delivery"],["+1–2 yrs","schedule buffer"]],"r":"Dependence on new transmission = schedule risk; choose modular solutions."},{"c":"P","conf":"V","loc":"kar","q":"What is PLN EPI doing in Karimun?","a":"PLN Energi Primer Indonesia (EPI) and PT Karimun Power Plant have launched a de-dieselisation pilot using biomass/syngas in Karimun Zone 2 (MoU 6 Apr 2026), starting at ±1 MW with potential to reach 2–5 MW. Karimun has been named the national de-dieselisation pilot. Its value lies more in serving as a biomass supply-chain model for small islands than in its MW contribution.","f":["Metro TV: Karimun is the national de-dieselisation pilot"],"src":"Listrik Indonesia; Metro TV 2026","isl":"K","v":["p","1 MW biomass pilot: small, but a model for island de-dieselisation."],"p":[["g","MoU Apr 2026 with PT Karimun Power Plant."],["g","Firm supply, not intermittent."],["w","Requires ±35 tonnes of biomass per day."],["s","Scaling from 1 MW to 2–5 MW."]],"k":[["1 MW","pilot"],["35 t/day","biomass"]],"r":"Attractive for small-scale bioenergy investors."},{"c":"P","conf":"V","loc":"bin","q":"Where are the entry points for IPPs and developers?","a":"(1) Bintan licence-area quota: gas-engine plants (PLTMG) of 100+50 MW and solar PV of 25+25 MW, which PLN Batam or its partners can build. (2) The \"Sumatra–Bintan distributed\" solar quota is shared between Batam and Bintan and is also open to PLN Batam partners. (3) Riau Islands RE excluding Batam (A4.15): 15.6 MW de-dieselisation solar PV (2027, IPP), 4+4 MW solar PV + BESS (2027, 2032), 4+2.4 MW bioenergy plants (2029), and distributed isolated solar PV. (4) Once ISBB is connected, Sumatra solar PV + BESS and BESS can also be sited in Bintan. The condition: PLN prioritises developers who also bring demand, under take-or-pay terms, because Bintan demand is highly uncertain.","f":["RUPTL pp. A-51/A-52, Table A4.15"],"src":"RUPTL Appendix A4","isl":"B","v":["p","Gas-engine and solar quotas exist for Bintan via PLN Batam and Riau Islands RE, provided developers bring demand."],"p":[["g","150 MW gas-engine and 50 MW solar PV (PLN Batam licence area)."],["g","15.6 MW de-dieselisation solar PV (2027)."],["w","Must bring demand and a take-or-pay contract."],["g","A DC plus a dedicated solar/gas-engine plant is the most attractive combination."]],"k":[["150 MW","gas-engine quota"],["15.6 MW","de-dieselisation solar PV"]],"r":"A \"demand + supply\" package is the strongest negotiating position."},{"c":"P","conf":"V","loc":null,"q":"What does the RUPTL say about de-dieselisation for islands like these?","a":"RUPTL 2025–2034 II.2.5 splits the De-dieselisation Programme into three approaches: (1) converting diesel plants to RE hybrids with batteries for isolated systems that cannot be interconnected, (2) gasification/non-oil gas-fired generation, and (3) interconnecting isolated systems to the grid. For isolated systems, the RUPTL lists dual-fuel gas-engine plants, RE hybrids with diesel/BESS, and biofuel. Karimun fits approaches 1 and 2; Bintan fits approach 3 (already interconnected).","f":["RUPTL II.2.5"],"src":"RUPTL 2025–2034 Ch. II.2.5","isl":"U","v":["p","Three paths: battery hybrid, gas, or interconnection; Karimun is heading for interconnection."],"p":[["g","Clear policy to cut oil-fuel use."],["g","Solar PV + BESS opportunities on the islands."],["s","Karimun: Sumatra cable."],["w","Slow execution."]],"k":[["3","de-dieselisation approaches"],["BESS","key technology"]],"r":"Hybrid project opportunities on the small Riau Islands."},{"c":"P","conf":"E","loc":"kar","q":"If you were PLN, what would be the priorities for Karimun over the next 24 months?","a":"First, secure a bridge until the Sumatra cable arrives (2027–28): 5–10 MW of grid-forming BESS for frequency response, since a single coal unit is ±20% of peak load and under-frequency (UFR) blackouts have occurred; an extra 10–15 MW of rented firm capacity; and an overhaul of coal units 1–2. Second, accelerate the cable's critical path: the Selat Panjang–Rangsang–TBK segment, especially the 70 km subsea cable and land for the 120 kms 150 kV overhead line. Third, prepare the TBK 2×30 MVA substation and a staged load-shedding scheme. Fourth, keep local generation as N-1 backup for the single cable. Fifth, pool reserves with the private zones (SDU, KPP).","f":[],"src":"Our recommendation based on RUPTL A4","isl":"K","v":["m","BESS for frequency, rented firm capacity, faster cable delivery and reserve pooling with private zones."],"p":[["g","5–10 MW BESS: fastest impact."],["g","10–15 MW of rented firm capacity."],["w","The 70 km subsea cable is the critical path."],["g","SDU–KPP–PLN reserve pooling."]],"k":[["5–10 MW","BESS"],["70 km","critical subsea cable"]],"r":"BESS and rental-power investors have a real market in Karimun today."},{"c":"P","conf":"V","loc":null,"q":"How credible is the RUPTL timeline, given its delivery track record?","a":"It should be discounted. National transmission additions in 2025 reached only ±37% of the RUPTL target, mainly due to land and permitting (Kontan, Jul 2026). The same document has inconsistent CODs: Karimun interconnection 2026 vs \"still in planning\" vs 2028; ISBB 2031 vs 2028. The 400 MW import plan in PLN Batam's RUPTL also slipped from 2026. Our rule of thumb: add 1–2 years for transmission and subsea cables and 0–1 year for gas-engine plants/rentals, and treat projects marked \"study required\" or \"low confidence\" as options, not plans.","f":["Kontan Jul 2026: 37%","Internal COD inconsistencies in the RUPTL"],"src":"Kontan Jul 2026; RUPTL","isl":"U","v":["n","Discount it: 2025 transmission delivery was only 37% of target."],"p":[["w","Karimun cable COD: 2026 vs 2028."],["w","ISBB COD: 2031 vs 2028."],["w","PLN Batam 400 MW import missed."],["s","Add 1–2 years for cables and transmission."]],"k":[["37%","delivery rate"],["+1–2 yr","buffer"]],"r":"Do not use RUPTL CODs as base-case decision assumptions."},{"c":"P","conf":"V","loc":null,"q":"What internal inconsistencies in the RUPTL should readers be aware of?","a":"Four. (1) Karimun 150 kV interconnection COD: the Riau transmission table says 2026, Committed; Ch. V.11.2 says \"still in planning\"; Appendix E says 2028. (2) Sumatra–Batam–Bintan COD: the balance and transmission tables say 2031; Appendix E (Tanjung Sauh Industrial Estate) and p. A-51 say 2028; the AC/DC study is not complete. (3) The 2031 industrial jump: A4.6 (excluding low-confidence HV customers) rises from 58 to 4,442 GWh, yet the named HV customers (BAI/Bintan DC, 1,500 MVA) are low-confidence from 2032, implying an unnamed ±500 MW HV customer. (4) BAI infrastructure: Appendix E lists 1,529 MVA + a 900 MW hydro quota + 600 MW CCGT vs 100 MW BESS + 161 MW hydro in A4.10. Readers who look only at the provincial tables will miss this.","f":[],"src":"RUPTL A4, V.11.2, Appendix E","isl":"U","v":["n","Four sets of RUPTL figures contradict each other: a source of schedule and supply-scheme risk."],"p":[["w","Karimun cable COD."],["w","ISBB COD."],["w","Unnamed 2031 HV customer."],["w","BAI supply scheme."]],"k":[["4","inconsistencies"],["2026–32","schedule range"]],"r":"Ask PLN to clarify the items relevant to your site."},{"c":"E","conf":"V","loc":null,"q":"What share of power comes from renewables in Bintan and Karimun today?","a":"Very low. Batam–Bintan supply is practically 100% fossil (gas + Tanjung Kasam coal), and Karimun relies on coal and diesel plants. Existing RE is small-scale: KPP's ±5 MW solar PV in Karimun (Zone 2, recorded in OSM, status to be confirmed), the Tembesi floating solar PV in Batam (PLN NP × TBS, connected at 20 kV), and hybrid solar PV on small islands. The RE share of the PLN Bintan/Karimun grid is below 2–3% (estimate).","f":["Mongabay 2024: Batam is entirely fossil-fuelled","Batam's RE potential is mainly solar"],"src":"Mongabay Dec 2024; OSM; PLN NP","isl":"U","v":["n","Near zero: Batam–Bintan runs on gas + coal, Karimun on coal + diesel."],"p":[["w","RE share of the grid below 2–3%."],["s","KPP 5 MW solar PV and Tembesi floating solar PV."],["w","Green-power claims are hard to make."],["g","Ample headroom for new solar PV."]],"k":[["<3%","RE share"],["5 MW","KPP solar PV"]],"r":"Green claims must be self-built (solar PV + BESS, RECs)."},{"c":"E","conf":"V","loc":null,"q":"Which renewable sources are realistic here?","a":"Solar is the main resource: equatorial irradiation of ±4.3–4.8 kWh/m²/day, available year-round, though with tropical cloud cover. Wind is weak (low averages in the Singapore/Malacca Straits). There is no meaningful hydro and no geothermal. Biomass is limited (wood residues, coconut). Ocean (current) energy is still at research stage. The realistic strategy: solar PV (ground-mounted, floating on reservoirs, rooftop) + BESS, with gas as firm capacity.","f":["Batam's RE potential is limited, mainly solar (Mongabay)"],"src":"Mongabay 2024; Global Solar Atlas (general)","isl":"U","v":["p","Solar: ±4.3–4.8 kWh/m²/day of irradiation year-round."],"p":[["g","Ground-mounted, floating and rooftop solar PV."],["w","Weak wind; no hydro or geothermal."],["s","Limited biomass."],["g","BESS complements solar PV."]],"k":[["4.3–4.8","kWh/m²/day"],["Solar PV + BESS","main solution"]],"r":"Plan solar PV + BESS as the main green source."},{"c":"E","conf":"V","loc":null,"q":"What renewable energy is planned for the region?","a":"To 2030, local RE in the Riau Islands excluding Batam is only ±40 MW (33.5 MW solar PV + 6.4 MW bioenergy). Breakdown (A4.15): PLN rural-electrification solar PV of 2.2+0.63+0.74+0.94 MW (2025–27), 15.6 MW de-dieselisation solar PV (2027, IPP), 4+4 MW solar PV + BESS (2027, 2032), a 4+2.4 MW bioenergy quota (2029), and distributed isolated solar PV of 4.77/2.07/3.45 MW (2029/2030/2033). Plus Bintan solar PV via the PLN Batam licence area, 25+25 MW (2028, 2030). The step change in RE comes only after 2031 via ISBB from Sumatra (Sumatra RE share >30.5%). Outside the RUPTL: GW-scale export projects to Singapore.","f":["RE Base summary = ARED (identical): 44.8 MW in total to 2034","Additional potential: 24 MW community solar PV; biomass plants at Natuna/Tanjung Batu/Dabo/Lingga/Kundur; 2.2 MW Natuna wave power"],"src":"RUPTL Tables A4.13, A4.15","isl":"B","v":["m","Local RE is small (±40 MW by 2030); scale lies in export projects and ISBB."],"p":[["s","Riau Islands excl. Batam: 33.5 MW solar PV + 6.4 MW bioenergy."],["g","Bintan solar PV: 50 MW."],["g","Government plans ±100 GWp of solar PV for DCs."],["w","Slow delivery."]],"k":[["±40 MW","local RE 2030"],["100 GWp","national plan"]],"r":"Align the DC with the government's 100 GWp solar agenda."},{"c":"E","conf":"V","loc":null,"q":"Which solar export projects to Singapore are located in the Riau Islands?","a":"Publicly known: Vena Energy (with Shell), ±2 GW of solar PV + BESS in the Riau Islands, targeting construction in 2026. Equator Renewables Asia, ±900 MW solar PV + 1.2 GWh BESS (400 MW AC export, target 2029). Singa Renewables (TotalEnergies–RGE), 1 GW from Riau. Sembcorp, ±1 GW in BBK. Pacific Medco on Pulau Bulan (Batam). Gotion × Oriens on Pulau Belat (Karimun), up to 2 GW. EMA has granted conditional approvals/licences to 13 import projects from several countries. Singapore targets ±6 GW by 2035.","f":["Mar 2026: Indonesia–Singapore export-terms negotiations stalled","EMA: 13 import projects licensed/conditionally approved"],"src":"EMA; pv magazine Oct 2025; Enerdata; ESDM; Mar 2026 reports","isl":"U","v":["p","Several GW-scale projects in the Riau Islands: Vena–Shell 2 GW (+±4,400 MWh battery), Sembcorp 1 GW, Equator 900 MW."],"p":[["g","Singapore targets 6 GW of imports by 2035."],["g","EMA has granted conditional licences."],["w","No financial close yet."],["w","Export terms delayed."]],"k":[["2 GW","Vena–Shell"],["6 GW","Singapore 2035 target"]],"r":"Export projects could become green-supply partners for local DCs if a domestic share is allocated."},{"c":"E","conf":"V","loc":null,"q":"What are the main barriers to renewables here?","a":"(1) Grid size: Karimun's ±36 MW system can absorb only ±4–7 MW of solar PV without batteries before stability/curtailment issues arise. (2) The RUPTL does not count intermittent RE as reserve without firm capacity, so solar PV does not solve the reserve-margin problem. (3) Land: small islands, mangroves, community conflict (e.g. Rempang/Tanjung Sauh). (4) Export regulation: domestic priority, local-manufacturing/local-content (TKDN) requirements, export terms not yet final. (5) Price: RE tariffs (Presidential Reg. 112/2022) vs local cost of supply. (6) Subsea cables: permits, cost, routing. (7) PLN offtake capacity and the risk of midday oversupply.","f":["RUPTL: intermittent RE not counted as reserve without capacity credit","Presidential Reg. 112/2022: RE benchmark prices"],"src":"RUPTL Ch. II; Presidential Reg. 112/2022; 2026 reports","isl":"K","v":["n","Small grids, solar not counted as reserve, land, and export terms."],"p":[["w","Karimun absorbs only ±4–7 MW of solar PV without batteries."],["w","The RUPTL does not count solar PV as reserve."],["w","Limited island land and social issues."],["g","BESS solves part of the problem."]],"k":[["4–7 MW","Karimun solar PV limit"],["0","solar reserve credit"]],"r":"Always package solar PV with BESS."},{"c":"E","conf":"E","loc":"kar","q":"How much solar PV can the Karimun system absorb?","a":"Rule of thumb for isolated systems without storage: instantaneous PV penetration of ±10–20% of minimum daytime load. With Karimun's daytime load at ±25–30 MW, that is ±4–7 MW of solar PV. With grid-forming BESS and controls, penetration can reach 30–50% of daytime energy, i.e. ±10–15 MW of solar PV + 10–20 MWh of BESS. Going further requires multi-hour storage or controllable loads (desalination, cooling, small-scale hydrogen).","f":["Technical estimate; a PLN grid study could refine these figures"],"src":"Common practice for isolated hybrid systems","isl":"K","v":["m","±4–7 MW without batteries; 10–15 MW with grid-forming BESS."],"p":[["s","Daytime load ±25–30 MW."],["g","BESS raises solar PV penetration."],["w","Beyond that needs multi-hour storage."],["g","A real solar PV + BESS market."]],"k":[["4–7 MW","without BESS"],["10–15 MW","with BESS"]],"r":"The right solar project size for Karimun: ±10–15 MW + BESS."},{"c":"E","conf":"V","loc":null,"q":"Does solar PV help with Karimun's reliability problems?","a":"Not directly. Under the RUPTL, intermittent RE is not counted as reserve unless it provides firm capacity (capacity credit), including when hybridised with diesel plants. Solar PV cuts diesel/coal use during the day, but Karimun's peak is in the evening (18:00–22:00). What improves reliability is BESS (frequency response, spinning reserve) and firm capacity. So the sequence is BESS + firm capacity first, with solar PV as a fuel saver.","f":["Karimun rolling blackouts occur 17:30–22:00"],"src":"RUPTL II.2.2; Warta Kepri Jul 2026","isl":"K","v":["n","Not directly: peak load is in the evening and solar PV is not counted as reserve."],"p":[["w","Karimun outages occur 17:30–22:00."],["g","Solar PV saves fuel during the day."],["g","BESS is what improves reliability."],["s","Sequence: BESS + firm capacity, then solar PV."]],"k":[["17:30–22:00","outage hours"],["BESS","key to reliability"]],"r":"Sell BESS as a reliability product and solar PV as a cost saver."},{"c":"E","conf":"V","loc":null,"q":"How do rooftop solar and captive rules affect industrial users here?","a":"PLN customers in Bintan/Karimun follow the national rooftop solar rules (ESDM Reg. 2/2024): no more net-metering exports to PLN, and a quota per system. Rooftop solar is now valuable for daytime self-consumption. In private licence areas/estates, estate operators can build their own solar PV. Data centers and industries pursuing RE100 can use PLN RECs, estate solar PV, or power wheeling (whose regulation is still being debated).","f":["ESDM Reg. 2/2024 on rooftop solar"],"src":"ESDM Reg. 2/2024","isl":"U","v":["m","Rooftop solar is now for self-consumption only; green claims via RECs or estate solar PV."],"p":[["s","ESDM Reg. 2/2024: no net-metering."],["g","PLN RECs are available."],["g","Estates may build their own solar PV."],["w","Power-wheeling scheme still unclear."]],"k":[["0","net-metering"],["REC","fast green option"]],"r":"Rooftop solar + RECs is the fastest route to early green targets."},{"c":"E","conf":"V","loc":null,"q":"What renewable potential does the RUPTL identify for the Riau Islands?","a":"Additional potential recorded in the RUPTL: 24 MW of distributed community solar PV; biomass plants at Natuna 4 MW, Tanjung Batu 2+2 MW, Dabo 4 MW, Lingga 2 MW and Kundur (Karimun Regency) 2.5 MW; 1.8 MW of distributed Riau Islands solar PV; and 2.2 MW of Natuna wave power. All small, because the RUPTL views the Riau Islands as a collection of small island systems. The large potential (hundreds of MW to GW of solar PV) sits in export projects and the Batam–Bintan quota, not in the Riau Islands-excluding-Batam tables.","f":["RUPTL Appendix A4, RE potential"],"src":"RUPTL Appendix A4","isl":"U","v":["n","Local potential in the RUPTL is small: tens of MW of biomass and community solar PV."],"p":[["s","24 MW community solar PV; 2–4 MW biomass per site."],["s","2.2 MW Natuna wave power."],["w","Not relevant for DC loads."],["g","Relevant for island de-dieselisation."]],"k":[["24 MW","community solar PV"],["2.2 MW","Natuna wave power"]],"r":"Large-scale potential lies in private projects, not the RUPTL list."},{"c":"E","conf":"V","loc":null,"q":"What are the political-economy issues around exporting green power to Singapore?","a":"Four. (1) Domestic priority: the government wants green power to also attract industry/data centers to the Riau Islands, not just be exported. Hence Bahlil (Oct 2026) linked solar PV to a BBK data-centre hub. (2) Local manufacturing requirements for panels/batteries: there are panel factories in the Riau Islands, such as Xinyi on Rempang. (3) Pricing and benefit-sharing: terms negotiations stalled (Mar 2026). (4) Social and environmental issues: island land, coastal communities, and \"raiding Riau\" criticism.","f":["ESDM: Indonesia and Singapore firm up clean-power export plans"],"src":"ESDM 2026; Antara; JOM","isl":"U","v":["m","The government wants green power to draw industry to the Riau Islands, not just be exported."],"p":[["g","Benefits local DCs through a domestic share."],["w","Terms negotiations delayed."],["w","Local manufacturing requirements."],["w","Land-related social issues."]],"k":[["6 GW","Singapore target"],["Mar 2026","negotiations stalled"]],"r":"Position your DC as a domestic offtaker for green projects, in line with policy."},{"c":"E","conf":"E","loc":null,"q":"What role does battery energy storage (BESS) play?","a":"Large and fast. Three functions: (1) Reliability: frequency response and spinning reserve for small systems (Karimun), and holding Bintan in island mode when the corridor trips. (2) Solar integration: shifting daytime energy to the evening peak. (3) Deferring grid investment. PLN Batam has already flagged BESS plans for 2027–2032 after the blackout. The national RUPTL includes 10.3 GW of storage. BESS prices have fallen sharply, making it competitive with diesel plants for reserve services.","f":["RUPTL: 10,256 MW of storage","PLN Batam: BESS plans"],"src":"RUPTL; Listrik Indonesia Oct 2026","isl":"U","v":["p","Large and fast: holds frequency, rides through disturbances, shifts solar energy."],"p":[["g","Fastest solution for Karimun."],["g","PLN Batam is planning BESS."],["g","RUPTL: 10.3 GW of storage."],["g","Battery prices have fallen sharply."]],"k":[["10.3 GW","RUPTL storage"],["6–12 mo","installation time"]],"r":"BESS is the most investment-ready opportunity in the region."},{"c":"E","conf":"V","loc":"kar","q":"Why are biomass and syngas being piloted in Karimun?","a":"Because they can deliver firm (not intermittent) power and replace oil fuel in isolated systems, in line with the RUPTL de-dieselisation approach. The constraints are feedstock continuity (wood/sawdust/agricultural waste is limited on small islands), logistics costs, and small scale (1–5 MW). The PLN EPI × KPP pilot is testing the supply-chain model.","f":["MoU 6 Apr 2026, 1→2–5 MW"],"src":"Listrik Indonesia 2026","isl":"K","v":["m","Firm and renewable, but small-scale due to limited feedstock."],"p":[["g","Firm supply."],["w","Limited feedstock on the island."],["s","1–5 MW scale."],["g","A model for small islands."]],"k":[["1–5 MW","scale"],["35 t/day","per MW"]],"r":"Not a solution for large loads."},{"c":"E","conf":"E","loc":null,"q":"What renewable share is realistic for Bintan and Karimun by 2030?","a":"Low, until interconnection arrives. Riau Islands excluding Batam: ±40 MW of local RE vs ±241 MW of load (2030); in energy terms, with solar PV at a ±18–20% capacity factor, the share is ±5%. Bintan depends on Batam's mix, which is almost 100% fossil; adding the 50 MW licence-area solar PV brings it to ±5–10%. Karimun is different: once the 150 kV cable from Sumatra arrives (2027–28), Karimun's mix follows the Sumatra grid, displacing diesel without much local RE. That is the fastest way to raise Karimun's RE share.","f":["Sumatra: 11 GW of RE additions (66.3%) to 2034"],"src":"RUPTL A4.15, Ch. V; our estimate","isl":"U","v":["n","Single digits for Bintan; Karimun rises once connected to Sumatra."],"p":[["w","Bintan ±5–10%."],["g","Karimun follows the Sumatra mix (RE >30.5%)."],["w","PLN Batam targets exceed delivery."],["g","After 2031, ISBB changes the picture."]],"k":[["5–10%","Bintan 2030"],[">30.5%","Sumatra RE"]],"r":"Do not promise grid green power before 2031."},{"c":"T","conf":"V","loc":null,"q":"What industrial tariff do PLN customers in Bintan and Karimun pay?","a":"Bintan and Karimun Zone 3 are PLN Persero territory, so national tariffs apply. Q4 2026 (Oct–Dec) is unchanged from Q3. I-3/MV (>200 kVA to <30,000 kVA): IDR 1,114.74/kWh off-peak (≈6.6 US¢); peak = K × off-peak. I-4/HV (≥30,000 kVA): IDR 996.74/kWh (≈5.9 US¢). B-3/MV (large business, e.g. resorts, >200 kVA): IDR 1,114.74/kWh. B-2/LV (6,600 VA–200 kVA): IDR 1,444.70/kWh. Legal basis: ESDM Reg. 7/2024 (tariff adjustment). Importantly, Bintan customers are still billed PLN Persero tariffs even though the energy is bought from PLN Batam.","f":["ESDM Reg. 7/2024","Peak K-factor ranges from 1.4 to 2 (regulation appendix)"],"src":"Metro TV 29 Oct 2026; ESDM Reg. 7/2024","isl":"U","v":["p","Competitive national tariffs: I-3 at IDR 1,114.74 and I-4 at IDR 996.74 per kWh."],"p":[["g","Same as Java; the cost gap is covered by government compensation."],["g","No increase in Q4 2026."],["w","Peak hours are multiplied by a K-factor of 1.4–2."],["w","Risk of a 2027 increase."]],"k":[["IDR 1,114.74","I-3 per kWh"],["IDR 996.74","I-4 per kWh"]],"r":"Low tariffs are the main draw where PLN supply is available."},{"c":"T","conf":"V","loc":"batam","q":"How does this compare with Batam?","a":"PT PLN Batam sets its own tariffs through ESDM and receives neither subsidies nor compensation, so PLN Batam absorbs the gap between cost of supply and tariff. July 2025 was the first adjustment since 2017, covering only better-off households, business, government and KSO (joint-operation) customers; some Batam tariff classes remain below cost of supply. There is also an inter-licence-area transaction: PLN Persero buys Bintan's energy from PLN Batam at a contract price that is not public. This transfer price determines who bears the cost of supplying Bintan.","f":["Jul 2025 adjustment = first since 2017","PLN Batam → PLN Persero sale price: not public"],"src":"ESDM Jun 2025; Pasardana 2022","isl":"B","v":["m","Batam has its own unsubsidised tariff; Bintan stays on the national tariff."],"p":[["w","Batam has no compensation; industry has paid more."],["g","Bintan enjoys the national tariff."],["s","The PLN Batam-to-PLN Persero transfer price is not public."],["s","Batam tariff adjustment in Jul 2025."]],"k":[["National","Bintan tariff"],["Jul 2025","Batam adjustment"]],"r":"On tariffs, Bintan can be more attractive than Batam."},{"c":"T","conf":"V","loc":"kar","q":"What tariff do industrial users in Karimun Zones 1–2 or captive estates pay?","a":"Tariffs in non-PLN licence areas (SDU, KPP, the Lagoi/Lobam estates, SEZs) are set through government approval (ESDM/local government) for each licence area and are usually B2B and unpublished. Captive supply (Galang Batang) is at own cost. They are usually higher than PLN tariffs because of small scale and no compensation, but estates offer special reliability/services. Actual tariff data must be obtained from estate operators.","f":[],"src":"Law 30/2009 framework as amended; licence-area practice","isl":"K","v":["m","Unpublished B2B schemes; usually above PLN tariffs."],"p":[["w","More expensive due to small scale."],["g","Negotiable, including premium services."],["s","Captive means own cost."],["s","Data available only from estate operators."]],"k":[["B2B","scheme"],[">PLN","estimated price"]],"r":"Compare estate tariffs with the cost of your own captive plant."},{"c":"T","conf":"E","loc":null,"q":"Do regulated tariffs reflect the cost of supply on these islands?","a":"No. The uniform national tariff (~IDR 1,115/kWh for I-3) is far below the cost of supply in isolated systems based on diesel/small coal plants, which can be 2–3 times higher. The gap is covered by government compensation to PLN. As a result, every additional kWh in Karimun adds to PLN's losses, weakening PLN's incentive to invest, and IPPs struggle to enter without guarantees. On the other hand, the tariff is attractive for industry compared with running its own gensets.","f":["Cost of supply per region set by ESDM ministerial decree"],"src":"Our analysis","isl":"K","v":["n","No: tariffs are far below the cost of supply on the islands."],"p":[["w","Diesel cost is 2–3× the tariff."],["w","Weak incentive for PLN to build."],["g","Customers enjoy low tariffs."],["w","IPPs struggle to enter without guarantees."]],"k":[["2–3×","cost vs tariff"],["Compensation","covers the gap"]],"r":"Do not expect PLN to build quickly for you; prepare a co-investment."},{"c":"T","conf":"V","loc":null,"q":"How is the peak-time tariff structured for I-3 industrial customers?","a":"I-3/MV customers pay the off-peak rate of IDR 1,114.74/kWh outside peak hours and peak = K × off-peak during peak hours (generally 17:00–22:00), with a K-factor of 1.4 ≤ K ≤ 2 set by PLN for each system. There is also an excess kVArh charge if the power factor falls below the threshold (0.85). Industries with evening loads (night shifts, cold storage) pay a higher effective rate. This is relevant for behind-the-meter BESS.","f":["K value set per system"],"src":"Appendix to the ESDM electricity tariff regulation","isl":"U","v":["m","During peak hours (17:00–22:00) the I-3 tariff is multiplied by a K-factor of 1.4–2."],"p":[["w","Evening loads pay more."],["g","Customer-side BESS can cut costs."],["s","Excess kVArh is charged if power factor is <0.85."],["s","K value set per system."]],"k":[["1.4–2","K-factor"],["17–22","peak hours"]],"r":"A DC with a flat load is exposed to peak tariffs; consider I-4 (≥30 MVA)."},{"c":"T","conf":"V","loc":null,"q":"Will electricity tariffs rise in 2027?","a":"There is a risk. Tariffs are reviewed quarterly based on the exchange rate, ICP (Indonesian crude price), inflation and HBA (coal reference price) under ESDM Reg. 7/2024. Q3 2026 assumptions used IDR 16,959/USD and an ICP of USD 96.12/bbl, which according to ESDM should have triggered an increase, but tariffs were held to protect purchasing power, including in Q4 2026. For modelling: a flat nominal base case, with a phased 2027 increase scenario if the state-budget compensation burden grows.","f":["Exchange rate IDR 16,959/USD; ICP USD 96.12 (Q3 2026 assumptions)"],"src":"Bloomberg Technoz; Metro TV Oct 2026","isl":"U","v":["n","Upside risk: the formula points up, but the government is holding tariffs."],"p":[["w","Assumptions: IDR 16,959/USD and ICP USD 96."],["s","Held throughout 2026."],["s","Reviewed every quarter."],["g","Stable in the short term."]],"k":[["IDR 16,959","FX assumption"],["USD 96","ICP"]],"r":"Model flat tariffs, plus a 5–10% increase scenario."},{"c":"T","conf":"V","loc":null,"q":"What incentives are available for large industrial customers or data centers?","a":"Available options: (1) the I-4 tariff for ≥30 MVA (IDR 996.74). (2) PLN premium services and \"Electrifying\" bundling. (3) PLN Renewable Energy Certificates (RECs) for green claims. (4) Seasonal discounts on added capacity. (5) For SEZs: fiscal incentives, and PLN can build dedicated infrastructure (RUPTL Third Dictum). Data centers in Batam negotiate PPA-type supply contracts (PJBTL) with PLN Batam that include ramp schedules and service quality.","f":[],"src":"PLN; RUPTL Third Dictum","isl":"B","v":["p","I-4 tariff, premium services, RECs and dedicated supply in SEZs."],"p":[["g","I-4 tariff of IDR 996.74/kWh."],["g","RECs for green claims."],["g","SEZ: fiscal incentives + dedicated infrastructure."],["s","A PJBTL can include a load ramp schedule."]],"k":[["IDR 996.74","I-4 tariff"],["SEZ","incentives"]],"r":"Use SEZ status to speed up supply and lower its cost."},{"c":"T","conf":"E","loc":null,"q":"What is the all-in cost of self-generation versus PLN power for industry in Karimun?","a":"Own diesel gensets: fuel at ±IDR 3,000–4,000/kWh + O&M + capex, i.e. ±IDR 4,000+/kWh. PLN I-3 tariff: ±IDR 1,115–1,600/kWh (averaged with peak hours). Rooftop solar for daytime use: ±IDR 800–1,200/kWh LCOE. So customers want PLN; they run gensets only for reliability. This is a strong argument that PLN reliability investment directly lowers local industrial costs.","f":["Estimate; sensitive to industrial diesel prices"],"src":"Our estimate","isl":"K","v":["n","Own gensets cost ±IDR 4,000+/kWh, about 3× the PLN tariff."],"p":[["w","Diesel is expensive."],["g","Rooftop solar ±IDR 800–1,200/kWh."],["g","PLN is cheapest when reliable."],["w","Industry runs gensets because PLN is not yet reliable."]],"k":[["IDR 4,000+","genset per kWh"],["3×","vs PLN"]],"r":"Reliability is highly valuable; grid reliability investments pay back quickly."},{"c":"T","conf":"E","loc":null,"q":"How should we estimate the tariff a data center in Bintan would pay?","a":"Three scenarios: (1) PLN Persero I-4/HV customer at ±IDR 997/kWh plus premium/REC charges: the cheapest, but dependent on grid capability. (2) Estate/licence-area supply (e.g. Galang Batang SEZ) at a B2B tariff reflecting dedicated generation costs (gas or solar PV + BESS), likely USD 8–12 cents/kWh. (3) Hybrid: PLN baseload + estate solar PV. Hyperscalers typically care about three things: supply certainty, a green pathway, and long-term price stability.","f":[],"src":"Our estimate","isl":"B","v":["m","Between PLN I-4 (±IDR 997/kWh) if the grid can cope, and ±USD 8–12 cents/kWh for dedicated supply."],"p":[["g","I-4 is the cheapest."],["w","The grid cannot yet accommodate the load."],["s","Estate supply under a B2B scheme."],["g","Hybrid: PLN + estate solar PV."]],"k":[["IDR 997","I-4 per kWh"],["8–12¢","USD/kWh dedicated"]],"r":"Calculate TCO assuming dedicated supply, not the PLN tariff."},{"c":"R","conf":"V","loc":"corr","q":"What are the main transmission reliability constraints in Bintan?","a":"First, a single 150 kV corridor from Batam: Tanjung Kasam coal plant → Tanjung Sauh Island → Ngenang Island (3.45 km subsea cable + 1 km underground cable) → 6.55 km subsea cable → Tanjung Taloh (Bintan). Second, a single system operator in Batam: a fault at one Batam substation (Sungai Harapan, Oct 2026) took Bintan down. Third, Bintan's 150 kV overhead lines are radial: Tanjung Uban–Sri Bintan 28 route-km, Sri Bintan–Air Raja 38 route-km, Air Raja–Kijang 20 route-km. Fourth, local generation is too small for island-mode operation. Fifth, subsea cables take a long time to repair. A UI study (Purba & Garniwa, IJECBE 2025) identifies reliance on the subsea cable + 150 kV overhead line from Batam as a systemic weak point. Cable thermal ratings and circuit counts are not public.","f":["RUPTL II.3.1: transmission planned to N-1","IJECBE 2025: systemic weak point"],"src":"ESDM 2013; detik 2016; IJECBE 2025; Oct 2026 reports","isl":"B","v":["n","One corridor, one operator, radial lines: a systemic weak point."],"p":[["w","Subsea cables of 3.45 + 6.55 km."],["w","Faults in Batam black out Bintan."],["w","Small local generation."],["s","A 2025 UI study calls it a \"systemic weak point\"."]],"k":[["1","corridor"],["15–16 hrs","Oct 2026 blackout"]],"r":"Design the DC with two independent supply sources."},{"c":"R","conf":"V","loc":"kar","q":"What distribution reliability issues affect Karimun and Tanjungpinang?","a":"Long 20 kV overhead distribution lines across hilly and coastal terrain: tree contact, lightning (high keraunic levels at the equator), animals (bats, monkeys; also cited in one account of the Batam blackout cause), and salt corrosion. Karimun also has generation-driven frequency problems. UP3 Tanjungpinang (the PLN district unit) also manages >100 small power plants, spreading O&M resources thin. SAIDI/SAIFI per ULP (service unit) is not published.","f":["Ombudsman Jan 2026: island geography is the main constraint"],"src":"Ombudsman Riau Islands 2026; outage reports","isl":"K","v":["n","Long 20 kV overhead lines: prone to trees, lightning, animals and salt corrosion."],"p":[["w","Frequent local outages."],["w","SAIDI/SAIFI not published."],["g","Feeder automation can help."],["s","UP3 manages >100 small plants."]],"k":[["20 kV","overhead lines"],[">100","small plants"]],"r":"A direct high-voltage connection to a substation is more reliable than 20 kV."},{"c":"R","conf":"V","loc":null,"q":"Are SAIDI/SAIFI figures available for Bintan and Karimun?","a":"There are no figures per UP3/UID, either in the RUPTL or in the public domain. What is available nationally (RUPTL Table 4.51): SAIDI of 19.0 hrs/customer and SAIFI of 11.5 times (2019), 7.7/5.6 (2022), 5.6/4.3 (2023), 4.5/2.7 (2024 to Oct). The national trend has improved sharply, but Bintan and Karimun are likely far above average: the 15–16 hour blackout (Oct 2026) alone exceeds a full year of national SAIDI, and Karimun's 2022 rolling blackouts lasted ±25 days. For official figures, request them from PLN UID Riau & Kepri.","f":["RUPTL Table 4.51","Oct 2026: 15–16 hrs > national SAIDI of 4.5 hrs"],"src":"RUPTL Table 4.51; outage reports","isl":"U","v":["n","Not published per unit; one Bintan blackout exceeds a year of national SAIDI."],"p":[["s","National SAIDI 4.5 hrs (2024)."],["w","Bintan: 15–16 hrs in one event."],["w","Karimun outages lasting days."],["g","National trend improving."]],"k":[["4.5 hrs","national SAIDI"],["15.5 hrs","Bintan Oct 2026"]],"r":"Make official UID Riau & Kepri data a due-diligence requirement."},{"c":"R","conf":"V","loc":"bin","q":"How heavily loaded are Bintan's substations?","a":"RUPTL Table A4.4: the 150/20 kV substations in Bintan are Ngenang 10, Tanjung Uban 60, Sri Bintan 60, Air Raja 120 and Kijang 60 MVA, totalling 310 MVA (9 transformers). With Bintan's load at ±105 MW (±117 MVA at 0.9 pf), average loading is ±38%. The RUPTL triggers extensions at 70–80%, and Air Raja (Tanjungpinang, the largest load) is indeed scheduled for a 1×60 MVA extension in 2030. So transformers are not the main constraint. The constraints are supply to the substations (one corridor) and the Tanjung Uban–Sri Bintan line, scheduled for reconductoring in 2031.","f":["A4.4: 310 MVA, 9 transformers","Air Raja +60 MVA (2030); TU–SB reconductoring 32 kms (2031)"],"src":"RUPTL Table A4.4 & A4 transmission tables","isl":"B","v":["p","Transformers have headroom (±38% loaded); the constraint is supply to the substations."],"p":[["g","310 MVA installed."],["g","Air Raja substation +60 MVA (2030)."],["w","Supply to substations remains a single corridor."],["s","Large DC loads need a new substation."]],"k":[["310 MVA","substation transformers"],["38%","loading"]],"r":"Loads <30 MVA can connect to existing substations; larger loads need their own."},{"c":"R","conf":"V","loc":"tsauh","q":"What investments are planned to improve Bintan's reliability?","a":"Under way: the Tanjung Sauh substation (9 Nov 2026) for Batam–Bintan connectivity and dispatch flexibility; the 60 MW MaxPower Sagulung gas-engine plant with free governor and black start; and PLN Batam's BESS plans. In the RUPTL: a 100 MW gas-engine plant for Bintan (2027), Air Raja substation +60 MVA (2030), a 150 kV line from Sri Bintan to the Bintan Resort HV customer (2030), Tanjung Uban–Sri Bintan reconductoring (2031), ISBB (2031), and a 500 kV extension to Bintan (2032, conditional). Still missing: a committed second Batam–Bintan cable and a post-blackout protection/islanding study.","f":["2025 national transmission delivery only ±37% of target"],"src":"Listrik Indonesia Nov 2026; RUPTL A4; Kontan Jul 2026","isl":"B","v":["m","Capacity is improving, but a second path is not committed."],"p":[["g","Tanjung Sauh substation and Sagulung gas-engine black start."],["g","PLN Batam BESS."],["w","No second 150 kV cable."],["s","500 kV in 2032 is conditional."]],"k":[["Nov 2026","Tanjung Sauh substation"],["2032","second path"]],"r":"Reliability is improving gradually, but not enough for critical loads before 2030."},{"c":"R","conf":"E","loc":"bin","q":"What is the single most effective reliability investment for Bintan?","a":"From first principles: eliminate the single point of failure. Two equivalent paths: (a) a second circuit/subsea cable on a different route, or (b) 60–80 MW of local firm generation (e.g. a gas-engine plant at Kijang/Air Raja) + BESS for ride-through. Option (b) is faster (18–30 months), does not depend on subsea cable permits, and also provides local black start. Option (a) is cheaper per MW in the long run. The RUPTL already has the vehicle: the 100 MW gas-engine plant (2027) via the PLN Batam licence area. If it is sited on Bintan Island with BESS and an islanding scheme, the single point of failure disappears before 500 kV arrives (2032).","f":[],"src":"Our recommendation","isl":"B","v":["p","A 100 MW gas-engine plant on Bintan Island + BESS + islanding scheme."],"p":[["g","Eliminates the single point of failure."],["g","Faster (18–30 months) than a new cable."],["s","A second cable remains the long-term solution."],["w","Gas-engine plant location not yet fixed."]],"k":[["100 MW","gas-engine plant"],["18–30 mo","build time"]],"r":"Push for the gas-engine plant to be built on Bintan; there is a co-investment opportunity."},{"c":"R","conf":"V","loc":null,"q":"What do PLN planning standards say about single-circuit supply?","a":"RUPTL 2025–2034 II.3.1: transmission and substations are planned to static N-1 (with one circuit/transformer out, the rest must carry the full load) and dynamic N-1 (a fault plus loss of one circuit must not cause loss of synchronism). Where N-1 is not yet met due to project constraints, short-term mitigation (operating patterns) applies. For special conditions that could cause widespread blackouts, credible-contingency criteria are used. Bintan is a case where short-term mitigation proved insufficient.","f":["RUPTL II.3.1 item 1"],"src":"RUPTL 2025–2034 II.3.1","isl":"B","v":["n","PLN requires N-1, but Bintan runs on short-term mitigation."],"p":[["w","Static and dynamic N-1 not yet met."],["w","Operating-pattern mitigation was insufficient (Oct 2026)."],["g","A clear standard can be used to press PLN."],["s","Credible-contingency criteria for special conditions."]],"k":[["N-1","PLN standard"],["0","met in Bintan"]],"r":"Use PLN's own standard as a reliability negotiating argument."},{"c":"R","conf":"E","loc":"kar","q":"What investments would you recommend for Karimun's distribution and network?","a":"After firm capacity: (1) BESS + a staged UFLS scheme so that generation faults do not become total blackouts. (2) Feeder automation (reclosers, sectionalisers, FDIR) on long feeders. (3) A tree right-of-way programme and lightning arresters. (4) Underground cables in central Tanjung Balai. (5) 20 kV/150 kV inter-zone interconnection (PLN–KPP–SDU) for reserve pooling. (6) Accelerate the 150 kV Sumatra–Selat Panjang–Rangsang–TBK interconnection (RUPTL) and the TBK 2×30 MVA substation; once in service, keep the coal/diesel plants as backup for the single cable.","f":[],"src":"Our recommendation","isl":"K","v":["m","BESS + staged load shedding first, then feeder automation and the Sumatra cable."],"p":[["g","BESS and staged UFLS: quick to install."],["g","Reclosers, sectionalisers and FDIR."],["g","Inter-zone reserve pooling."],["w","The Sumatra cable remains the critical path."]],"k":[["2×30 MVA","TBK substation"],["BESS","priority"]],"r":"A BESS + automation package is an opportunity for vendors and IPPs."},{"c":"R","conf":"V","loc":"inc1","q":"What caused the October 2026 blackout?","a":"The official cause was not final as of 23 Oct 2026 (ESDM was still collecting data). Early indications: a wild animal, reportedly a bat, entered the Sungai Harapan substation in Batam. The disturbance began at 06:37 WIB and cascaded through the whole system. PLN Batam stressed that it was unrelated to data-centre testing. PLN acknowledged that infrastructure maintenance needs improvement. From a system perspective: a fault at one substation brought down the entire system despite a ±19–20% reserve. The problem lies in protection and system separation, not a shortage of MW.","f":[],"src":"Bloomberg Technoz; Listrik Indonesia 23 Oct 2026; w.media","isl":"B","v":["n","A single-substation fault (likely an animal) brought down the whole system: a protection problem, not a MW shortfall."],"p":[["w","A ±19% reserve did not prevent the blackout."],["s","ESDM investigation not yet final."],["g","PLN Batam denies any link to data centers."],["w","Protection and islanding need fixing."]],"k":[["06:37","fault onset"],["19%","reserve at the time"]],"r":"Reliability is not just about capacity; review the protection design."},{"c":"R","conf":"E","loc":null,"q":"How vulnerable are subsea cables in this area?","a":"The straits around Batam–Bintan are among the world's busiest shipping lanes, with many anchored vessels. The main subsea cable risks are anchors and fishing gear, strong currents, and erosion. Repairs can take weeks to months (specialist vessels, jointing). A single subsea cable serving ±70 MW of critical load is therefore high risk. Mitigation: a second route, protection (burial, armouring), no-anchoring zones, and a stock of spare parts.","f":["Batam–Bintan subsea cable totals ±10 km (3.45 + 6.55)"],"src":"ESDM 2013; our analysis","isl":"B","v":["n","High: dense shipping lanes, and repairs can take weeks to months."],"p":[["w","Ship-anchor risk."],["w","Single ±10 km cable."],["g","Mitigation: second route and cable protection."],["s","Spare-parts stock needed."]],"k":[["10 km","subsea cable"],["weeks–months","repair time"]],"r":"Include a prolonged cable-outage scenario in your business continuity plan."},{"c":"R","conf":"E","loc":null,"q":"Does the data-centre boom put household reliability at risk?","a":"It can, if generation does not keep pace. Data centers take large blocks of firm capacity at high load factors, reducing system reserve. After the Oct 2026 blackout, public suspicion arose, although PLN Batam denied any link. Data centers can also help: they bring new substation investment, large UPS/BESS that can provide grid services, and long-term PJBTL contracts that finance generation. The key is sequencing: generation and substations must arrive before the load.","f":[],"src":"Our analysis","isl":"B","v":["m","Risky if load arrives before generation; beneficial if DC contracts finance capacity."],"p":[["w","DCs absorb firm capacity."],["g","Long-term PJBTL contracts finance generation."],["g","DC-owned UPS/BESS can provide grid services."],["s","Build sequencing is key."]],"k":[["450 MW","DayOne"],["2026–27","load ramp"]],"r":"Offer grid services (DC BESS) to PLN as added value."},{"c":"R","conf":"E","loc":null,"q":"Which KPIs should be tracked to gauge progress on reliability?","a":"(1) Reserve margin per system vs RUPTL criteria (Karimun ≥35%/N-2; Batam–Bintan ≥25–35%). (2) Number and duration of rolling blackouts per month. (3) SAIDI/SAIFI per ULP. (4) Bintan restoration time after a Batam fault (target <1 hour with islanding). (5) EAF/EFOR of the Tanjung Sebatak coal plant. (6) Substation and feeder loading (<70–80%). (7) Energy not supplied (ENS, MWh).","f":[],"src":"Planning practice","isl":"U","v":["m","Track reserves vs RUPTL criteria, outage hours, SAIDI/SAIFI and Bintan restoration time."],"p":[["s","Reserve margin per system."],["s","Bintan restoration time (target <1 hour)."],["s","TBK coal plant availability."],["s","Substation loading below 70–80%."]],"k":[["<1 hr","restoration target"],["70–80%","substation loading limit"]],"r":"Make these KPIs conditions in the contract/PJBTL."},{"c":"I","conf":"V","loc":"corr","q":"How does the Batam–Bintan interconnection work?","a":"Contract signed 21 Mar 2013. Western section: Tanjung Kasam coal plant (Batam) → Tanjung Sauh Island → Ngenang Island, 3.45 km subsea cable + 1 km underground cable, 150 kV. Eastern section: Ngenang → Tanjung Taloh (Bintan), 6.55 km subsea cable. Energised on 10 Nov 2015 together with the 30 MVA Tanjung Uban and 10 MVA Ngenang substations. Bintan's 150 kV overhead lines were completed by Aug 2016: Tanjung Uban–Sri Bintan 28 route-km, Sri Bintan–Air Raja 38 route-km, Air Raja–Kijang 20 route-km. Transfer started at 20 MW, then ±34 MW (2016), when Bintan's peak load was 65.1 MW. Since then Batam–Bintan has been a single system operated by PLN Batam, while PLN Persero sells to Bintan customers. Initial savings were ±IDR 11.46 bn/month.","f":["Substations now total 310 MVA (A4.4)","Bintan's energy is recorded as an inter-licence-area import"],"src":"ESDM 2013; Setkab 2016; detik 2016; RUPTL A4","isl":"B","v":["m","A 150 kV cable since 2015: made Bintan cheaper, but dependent on Batam."],"p":[["g","Saves ±IDR 11.46 bn per month."],["g","Replaced rented diesel plants."],["w","Only one path."],["s","Operated by PLN Batam."]],"k":[["2015","energised"],["IDR 11.46 bn","monthly savings"]],"r":"From an investor's perspective, Bintan is part of the Batam system."},{"c":"I","conf":"V","loc":"corr","q":"What is the transfer capacity of the Batam–Bintan interconnection?","a":"Not published, including in the RUPTL. The thermal rating, number of subsea cable circuits and their N-1 status are not in public documents. What is known: 150 kV, 310 MVA of downstream substations, initial transfer of 20→34 MW (2016), and the load now supplied is ±70 MW or more. The MW figure cannot be confirmed from public data. The point: today the constraint is not thermal capacity but redundancy and protection. The RUPTL also schedules no additional 150 kV subsea cable circuit; the next reinforcement is the 500 kV extension (2032, conditional).","f":["Data gap: thermal rating, circuit count, N-1 status"],"src":"RUPTL A4; Setkab 2016","isl":"B","v":["n","Not published; the main issue is redundancy, not capacity."],"p":[["s","Initial transfer 20 → 34 MW."],["s","Downstream substations: 310 MVA."],["w","Rating and circuit count not public."],["w","No second circuit in the RUPTL."]],"k":[["±70 MW","current flow"],["?","cable rating"]],"r":"Ask PLN for the cable rating before planning loads above 30 MVA."},{"c":"I","conf":"V","loc":"isbb","q":"Are there plans to connect Sumatra to Batam and Bintan?","a":"Yes, the Sumatra–Batam Interconnection (ISBB). Peranap → Sungai Guntung landing point, 360 kms HVDC overhead line; Sungai Guntung → Rempang, 156 kms HVDC subsea cable; a 1,500 MW converter + a 500/150 kV substation of 3×500 MVA. COD 2031, initial transfer 1,200 MW (the Sumatra balance shows \"Transfer to Batam System −1,200 MW\" for 2031–2034), sourced from Sumatra RE. AC/DC options are still under study. Phase 2 (2032): a second circuit + a 1,500 MW converter. ISBB is said to be able to serve growth of up to ±3 GW in Batam–Bintan, including data centers, and opens a Sumatra–(Batam)–Singapore export option of 0.6–1.1 GW (AIMS III). The RUPTL recommends accelerating ISBB.","f":["RUPTL pp. V-107, V-324","p. A-51 & Appendix E state 2028 — inconsistent"],"src":"RUPTL 2025–2034 Ch. V.5.7, V.11.2, Appendices A4/E","isl":"B","v":["p","Yes: ISBB, 1,200 MW (2031), able to serve up to ±3 GW."],"p":[["g","HVDC Peranap–Sungai Guntung–Rempang."],["g","Powered by Sumatra RE."],["w","AC or DC not yet decided."],["w","Schedule: 2028 vs 2031."]],"k":[["1,200 MW","initial transfer"],["3 GW","service capacity"]],"r":"ISBB is a game changer for large DCs; plan phase 2 for after 2031."},{"c":"I","conf":"V","loc":"karint","q":"When can Karimun realistically be interconnected?","a":"The RUPTL already plans it: 150 kV Sumatra → Selat Panjang → Rangsang Island → TBK (6 kms subsea + 120 kms overhead line + 70 kms subsea + 14 kms), with a TBK 2×30 MVA substation. The dates are inconsistent. The Riau transmission table says 2026, Committed; Ch. V.11.2 says the Selat Panjang–TBK segment is \"still in planning\"; Appendix E says 2028. National transmission delivery in 2025 was only ±37% of target (land, permits). Our assessment: 2027–2028, with the 70 km subsea cable as the critical path. The implication: Karimun's diesel will last longer than the table suggests.","f":["Three COD versions in one document","Kontan Jul 2026: 2025 transmission delivery ±37%"],"src":"RUPTL A4, V.11.2, Appendix E; Kontan Jul 2026","isl":"K","v":["n","Realistically 2027–2028; the 2026 date in the RUPTL table is too optimistic."],"p":[["w","Three schedule versions."],["w","The 70 km subsea cable is the critical path."],["g","TBK 2×30 MVA substation already planned."],["s","Total ±210 kms."]],"k":[["2027–28","realistic"],["70 km","subsea cable"]],"r":"Plan large Karimun loads for after 2028."},{"c":"I","conf":"V","loc":"corr","q":"How has interconnection changed Bintan since 2016?","a":"On the plus side: it replaced rented diesel/gas-engine plants, saves ±IDR 11.46 bn/month, allowed load to grow from 65.1 MW (2016) to ±100+ MW, and supplies the Lagoi/Lobam estates (160 MVA). On the minus side: Bintan lost local generation and became fully dependent on the Batam system. Its energy is recorded as an inter-licence-area import, its operator is PLN Batam, and faults in Batam black out Bintan (1 Jan 2023, 12 Oct 2026). The RUPTL has even replaced the planned \"RE Base Bintan 200 MW\" plant with gas-engine cooperation in the PLN Batam licence area, reinforcing that dependence.","f":["Outages following Batam: 1 Jan 2023, 12 Oct 2026"],"src":"Setkab 2016; RUPTL p. A-52; Jawapos 2023","isl":"B","v":["m","Cheaper and growing, but highly dependent on Batam."],"p":[["g","Load grew from 65 to ±105 MW."],["g","Lower supply costs."],["w","Local generation has shrunk."],["w","Blacks out when Batam fails (2023, 2026)."]],"k":[["65 MW","2016 load"],["±105 MW","2026 load"]],"r":"Batam risk = Bintan risk; assess them together."},{"c":"I","conf":"V","loc":"isbb","q":"What Batam–Bintan interconnection reinforcements does the RUPTL plan?","a":"There is no second 150 kV subsea cable in the RUPTL. What exists is a 500 kV extension to Bintan (2032), only if demand is firm: Rempang → Sabang Mas landing point → Ngenang landing point → Ngenang → Tanjung Taloh landing point → Bintan 500 kV substation (500/150 kV, 1×250 MVA) → BAI/Data Centre HV-customer 500 kV substation, 162 kms in total. This would be a true second path to Bintan, but it is tied to low-confidence HV customers. On the Batam side there is also a 40 kms 150 kV line from the Rempang/Tanjung Gundap substation to the Panaran substation (2031, study required). So until 2032, Bintan remains on one corridor. Alternatives: a parallel 150 kV cable on a different route (±USD 2–4 million/km) or siting the 100 MW gas-engine plant in Bintan.","f":["500 kV extension: 162 kms, 2032, conditional"],"src":"RUPTL Appendix A4, V.11.2","isl":"B","v":["n","No second 150 kV cable; the only second path is 500 kV in 2032, and it is conditional."],"p":[["w","Depends on firm HV-customer demand."],["g","162 kms and a 250 MVA Bintan 500 kV substation."],["s","Rempang–Panaran substation link in 2031."],["g","Another option: a gas-engine plant in Bintan."]],"k":[["2032","500 kV"],["162 kms","length"]],"r":"Your large load could trigger the 500 kV line; negotiate the cost sharing."},{"c":"I","conf":"V","loc":"isbb","q":"Where do the ASEAN Power Grid and interconnection with Singapore stand?","a":"ISBB opens a Sumatra–(Batam)–Singapore corridor with an export option of 0.6–1.1 GW (AIMS III). The Riau Islands sit between Sumatra and Singapore, making them a natural ASEAN Power Grid corridor. Solar export projects (Vena, Equator, Singa Renewables, Sembcorp, Gotion–Oriens Belat) need cables to Singapore. For the local grid, if export cables are built, the government wants a domestic share to attract industry/data centers to BBK. Singapore's import target is ±6 GW by 2035.","f":["AIMS III: 0.6–1.1 GW","EMA: 13 import projects licensed/conditionally approved"],"src":"RUPTL V.11.2; EMA; Enerdata","isl":"U","v":["p","The Riau Islands bridge Sumatra and Singapore; 0.6–1.1 GW of exports (AIMS III)."],"p":[["g","Export cables could bring local benefits."],["g","Singapore targets 6 GW of imports."],["w","Tension between domestic priority and exports."],["s","Terms not yet final."]],"k":[["0.6–1.1 GW","AIMS III exports"],["6 GW","Singapore target"]],"r":"DC sites near export cable routes could gain access to green power."},{"c":"I","conf":"V","loc":"bin","q":"Who pays to connect new loads in Bintan, and what is the commercial sticking point?","a":"The RUPTL says PLN will open a connection hub in Bintan provided there is an agreement on \"fair sharing of investment recovery\" with PLN Batam. This is an inter-licence-area negotiation point: PLN Persero serves Bintan customers, but supply and some generation sit in the PLN Batam licence area. On top of that comes the take-or-pay requirement for developers. The realistic model: an anchor customer (HV customer/DC) guarantees utilisation via take-or-pay, PLN Persero and PLN Batam share investment and recovery, and ISBB/500 kV is financed by large demand. The PLN Batam-to-PLN Persero transfer price is not public.","f":["RUPTL: Bintan connection hub, sharing of investment recovery"],"src":"RUPTL Appendix A4","isl":"B","v":["n","Complicated: two PLN entities must agree on investment sharing, plus a take-or-pay requirement."],"p":[["w","Inter-licence-area negotiation."],["w","Take-or-pay for developers."],["s","Transfer price not public."],["g","An anchor customer can trigger investment."]],"k":[["2","PLN entities"],["take-or-pay","requirement"]],"r":"Connection lead times and who funds the substation often matter more than the tariff; negotiate early."},{"c":"I","conf":"E","loc":null,"q":"If you could change one thing in the RUPTL for Bintan and Karimun, what would it be?","a":"Treat reliability as an explicit requirement, not a by-product of the energy balance. For Bintan: include an N-1 project (a second path or local firm generation + BESS) with a firm COD before 2029. For Karimun: apply the RUPTL's own isolated-system criteria (N-2/35% reserve margin) with modular firm blocks + BESS within 24 months and pooling with private licence areas. Then link the build-out to anchor loads (data centers, SEZs) so that cable/generation costs are shared.","f":[],"src":"Our view","isl":"U","v":["m","Make reliability an explicit, scheduled project: N-1 for Bintan, N-2 for Karimun."],"p":[["g","A second path or local generation for Bintan before 2029."],["g","Firm blocks + BESS for Karimun within 24 months."],["g","Involve anchor loads in financing."],["w","Reliability is not currently an explicit project."]],"k":[["2029","Bintan N-1 target"],["24 mo","Karimun target"]],"r":"Large investors can help push for this change."},{"c":"I","conf":"E","loc":null,"q":"What should investors or consultants monitor over the next 12 months?","a":"(1) The official findings of the 12 Oct 2026 blackout investigation and PLN's response (second circuit/Bintan generation project). (2) Revisions to the RUPTL/PLN Batam RUPTL that include BBK data-centre load. (3) COD of Batam CCGT #1 and financial close of Batam 3&4. (4) Conversion of data-centre MoUs (SOS Galang Batang, DCI) into PJBTL contracts. (5) The decision on Indonesia–Singapore power export terms. (6) Firm capacity and rolling-blackout status in Karimun. (7) 2027 tariff policy. (8) The ISBB AC/DC decision and financing, and progress on the Karimun 150 kV cable (70 km subsea segment).","f":[],"src":"Our summary","isl":"U","v":["m","Track the blackout report, RUPTL revisions for DCs, Batam gas-plant CODs, MoU conversions and export terms."],"p":[["s","Blackout investigation findings."],["s","RUPTL revision including BBK DC load."],["s","COD of Batam CCGT #1 and 3&4."],["s","ISBB AC/DC decision and Karimun cable progress."]],"k":[["5","key indicators"],["12 mo","horizon"]],"r":"Build a monitoring dashboard for go/no-go decisions."}], SIL={"bintan":"M92.1,35.8L92.1,39.1L95.0,49.3L91.3,53.8L90.7,56.3L92.1,60.4L92.1,66.4L92.7,67.9L93.6,68.5L92.7,70.6L91.3,72.4L88.4,73.5L85.3,73.9L83.8,75.1L83.8,77.0L83.2,79.7L80.9,89.8L74.1,90.9L56.3,85.1L57.8,81.6L56.3,77.6L54.0,74.9L49.7,73.5L49.7,72.0L54.9,72.0L57.1,71.6L57.8,70.6L57.1,68.5L54.9,68.3L49.7,67.9L45.1,66.0L43.7,64.8L43.7,62.3L45.1,60.9L52.6,59.2L51.1,57.1L51.1,55.3L52.6,52.2L53.4,5  ['Peak load of Tanjungpinang + Bintan Regency. The latest official figure is 65.1 MW (2016); at ±5% growth a year this becomes ±106 MW in 2026. An estimate, as RUPTL does not break figures down by island.','sys_b'],
 ['Base case: 5.3% growth a year (RUPTL national average) from ±105 MW. Low case ±120 MW (4%/yr); high case ±300 MW if large loads such as data centers or the SEZ connect to the grid.',null],
 ['PT Bintan Alumina Indonesia (Galang Batang SEZ) and the planned Bintan data center are listed in RUPTL with a requirement of 1,500 MVA from 2032, rated low confidence. Supplying them requires a 500 kV extension from ISBB.','gb'],
 ['Non-binding cooperation memorandum (15 Sep 2026) for a ±500 MW AI data-centre campus in the Galang Batang SEZ. This single facility is ±5× Bintan’s current load.','gb']],
'bintan.ebt':[
 ['RUPTL lists 25 MW (2028) + 25 MW (2030) of solar PV for Bintan via the PLN Batam licence-area partnership. Solar saves fuel during the day but does not count as evening reserve.','re_bin'],
 ['Bintan draws power from the Batam system, which is almost entirely gas (CCGT/gas engines) and coal (Tanjung Kasam coal plant). The renewables share of the Batam–Bintan grid is still very small.',null],
 ['ISBB = Sumatra–Batam Interconnection. RUPTL plan: an HVDC cable from Peranap (Riau) to Rempang (Batam), transferring 1,200 MW from 2031, sourced from renewable plants in Sumatra. This is the main route to greening Batam–Bintan supply.','isbb']],
'bintan.tar':[
 ['Medium-voltage industrial class (>200 kVA to <30 MVA). IDR 1,114.74/kWh (≈6.6 US¢) applies off-peak (LWBP). During peak hours (WBP, typically 17:00–22:00) the tariff is multiplied by a K-factor of 1.4–2. The Q4 2026 tariff is unchanged.',null],
 ['High-voltage industrial class, contracts ≥30 MVA (30,000 kVA). Suited to smelters or large data centers; requires a 150 kV connection to a substation.',null],
 ['Medium-voltage business class (>200 kVA), e.g. hotels and resorts in Lagoi. Same rate as I-3 off-peak. Q4 2026 unchanged from Q3.','lagoi']],
'bintan.rel':[
 ['12 Oct 2026, 06:37 WIB: a fault at Sungai Harapan substation, Batam (initial indication: an animal/bat) tripped the Batam–Bintan system. Bintan and Tanjungpinang also blacked out because local generation was insufficient. ESDM is still investigating the final cause.','inc1'],
 ['More than 411k PLN Batam customers were affected, including PDAM (water utility), Hang Nadim Airport and data centers. Compensation was applied to November 2026 bills.','inc1'],
 ['Total 150/20 kV transformer capacity on Bintan: Ngenang 10, Tanjung Uban 60, Sri Bintan 60, Air Raja 120, Kijang 60 MVA (9 transformers). A load of ±117 MVA means ±38% utilisation. Transformers are not the constraint; the supply path to the substations is.','gi_ar']],
'bintan.int':[
 ['Two 150 kV subsea cable sections: west 3.45 km (Tanjung Sauh–Ngenang, plus 1 km of underground cable) and east 6.55 km (Ngenang–Tanjung Taloh). In operation since 10 Nov 2015. Rating and number of circuits are not published.','ce'],
 ['ISBB = Sumatra–Batam Interconnection: HVDC cable Peranap → Sungai Guntung (360 kms onshore) → Rempang (156 kms subsea), 1,500 MW converter. 1,200 MW transfer from 2031; can serve up to ±3 GW of Batam–Bintan load.','isbb'],
 ['500 kV extension from Rempang via Ngenang to the Bintan 500 kV substation (500/150 kV, 250 MVA) and the 500 kV substation for the BAI/data-centre bulk customers, 162 kms in total. Built only once large demand is firm. This is the real candidate for a second supply path to Bintan.','ext500']],
'karimun.ring':[
 ['Dependable capacity = what can actually be generated after machine derating, as of 17 Nov 2026. Breakdown: TBK coal plant ±10.2 MW + old Bukit Carok diesel plant ±17.4 MW + new diesel 6 MW + rented gensets 7 MW = 40.6 MW. See the Capacity tab for the chart.','sys_k'],
 ['Peak load of the Tanjung Balai Karimun system (PLN zone), typically 17:30–22:00. Up from 25.4 MW (2017) and 28.2 MW (2019).','sys_k'],
 ['Reserve = 40.6 − 36.1 = 4.5 MW. The largest unit (7 MW coal) exceeds the reserve, so if one unit trips, load cannot be met and rolling blackouts follow. RUPTL requires isolated systems to withstand the loss of the two largest units (N-2), with a reserve of ≥35%.',null],
 ['RUPTL plans a 150 kV cable Sumatra → Selat Panjang → Rangsang Island → Tanjung Balai Karimun substation (±210 kms). The RUPTL table says 2026, Annex E says 2028; with the 70 km subsea cable as the critical path, a realistic estimate is 2027–2028.','karint']],
'karimun.kap':[
 ['Total dependable capacity of the Karimun system (PLN Zone 3) as of 17 Nov 2026 is 40.6 MW, from four sources: TBK coal plant ±10.2 MW, old Bukit Carok diesel plant ±17.4 MW, new diesel 6 MW (2026), and rented gensets 7 MW (contracted Jun 2026). The old diesel figure is derived as a residual (estimate). Peak load is 36.1 MW, so the reserve is only 4.5 MW.','sys_k'],
 ['Tanjung Sebatak coal plant: 2 units × 7 MW installed, but net dependable capacity (DMN, RUPTL Table A4.3) is only 10.2 MW, or ±5 MW per unit. Unit 2 has failed repeatedly (2022, May and Jul 2026), and every outage leads straight to rolling blackouts.','g_tbk'],
 ['The rest of dependable capacity comes from diesel: the old Bukit Carok plant (25 MW installed plus seventeen 1 MW engines added in 2017, now ±17.4 MW after derating), new 6 MW diesel engines (2026), and 7 MW of rented gensets (PLN Nusa Daya). Diesel is quick to install, but its fuel cost is ±3× the tariff.','g_bc'],
 ['RUPTL criterion for isolated systems: the reserve must exceed the first and second largest units (N-2), with a minimum reserve of 35%. Load 36.1 + 7 + 7 = 50.1 MW. Current dependable capacity is 40.6 MW, a shortfall of ±9.5 MW.',null]],
'karimun.dem':[
 ['Peak load of the PLN Karimun system as of Nov 2026. Up from 25.4 MW (2017) and 28.2 MW (2019), or ±3.6% a year.','sys_k'],
 ['Base case ±5% a year. Historical growth is low because supply is constrained; once reliability recovers, suppressed demand (customers running gensets) will emerge. High case ±55 MW.',null],
 ['Karimun is split into three electricity licence areas: Zone 1 (PT Soma Daya Utama), Zone 2 (PT Karimun Power Plant, ±75% of the island), Zone 3 (PLN). FTZ industry (shipyards, oil & gas, granite) sits largely in the private zones or runs its own gensets, so it does not appear in PLN load.','kftz']],
'karimun.ebt':[
 ['Solar PV planned by the Karimun Regency government (±2.6 MW). Cuts diesel use during the day but does not help the evening peak.','re_tbk'],
 ['Biomass gasification pilot by PLN EPI with PT Karimun Power Plant (MoU Apr 2026): 1 MW, requiring ±35 tonnes of biomass a day. Karimun has been named a national de-dieselisation pilot.','re_bio'],
 ['Large-scale solar + battery plan (up to ±2 GW) on Belat Island by Gotion and Oriens (MoU Jan 2026). Aimed at export to Singapore or at industry/data centers, not the Karimun town grid of only ±36 MW.','belat']],
'karimun.tar':[
 ['Medium-voltage industrial class (>200 kVA to <30 MVA). IDR 1,114.74/kWh (≈6.6 US¢) applies off-peak (LWBP); during peak hours it is multiplied by a K-factor of 1.4–2. Same as the tariff in Java.',null],
 ['Estimated diesel-plant fuel cost: ±0.25–0.28 litres of diesel per kWh. At industrial diesel prices, this is ±IDR 3,000–4,000/kWh, about 3× the tariff. The gap is covered by government compensation to PLN.',null],
 ['Customers in the private zones (Soma Daya Utama, Karimun Power Plant) pay tariffs set per licence area through commercial contracts. These tariffs are not published.','kftz']],
'karimun.rel':[
 ['May 2022: coal unit 2 failed just as load jumped from 28–29 → 36 MW after Eid. A ±5 MW deficit forced rolling blackouts for about 25 days.','inc2'],
 ['Mar–Apr: coal unit 1 under maintenance for 18 days. May: unit 2 outage (32 vs 34.5 MW). 20–24 Jul: unit 2 travelling grate failed. Oct: blackout caused by falling frequency (under-frequency).','inc2'],
 ['A UFR (under-frequency relay) sheds load when frequency drops below a threshold. In a small system, losing one unit makes frequency fall fast; if load shedding is not staged, the whole system blacks out. A battery (BESS) can hold frequency within milliseconds.',null]],
'karimun.int':[
 ['RUPTL route: 6 kms subsea cable (SKLT) Sumatra → Selat Panjang, 120 kms overhead line (SUTT) across Tebing Tinggi and Rangsang islands, 70 kms SKLT Rangsang → Karimun, then 14 kms to TBK substation.','karint'],
 ['New 150/20 kV substation at Tanjung Balai Karimun: 2 transformers × 30 MVA (enough for ±36–50 MW of load), plus 1×60 MVA in 2032.','gi_tbk'],
 ['Three versions in RUPTL: transmission table 2026 (Committed), Chapter V.11.2 "still at planning stage", Annex E 2028. Nationally, transmission build-out in 2025 reached only ±37% of target.','karint']]
};

 const r=Math.min(H*.36,78),cx=r+26,cy=H/2,CF=2*Math.PI*r;let acc=0,s='';
 s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#edf2f6" stroke-width="30"/>`;
 segs.forEach(([g,k],q)=>{const l=CF*g.v[ci]/tot,st=acc;acc+=l;s+=`<circle class="sg" data-ck="${ci}|${k}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${g.c}" stroke-width="30" stroke-dasharray="${Math.max(l-1.5,.5)} ${CF}" stroke-dashoffset="${-st}" transform="rotate(-90 ${cx} ${cy})" style="animation-delay:${.1+q*.08}s;cursor:pointer"${g.nf?' opacity=".5"':''}><title>${esc(g.n)}: ${fmt(g.v[ci],g.v[ci]%1?1:0)} ${o.unit} — click</title></circle>`});
 s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" class="lb" style="font-size:22px">${fmt(tot,tot%1?1:0)}${o.unit==='%'?'%':''}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" style="font-size:10px;font-family:var(--f);font-weight:700">${o.unit==='%'?'of energy':o.unit+' · 2026'}</text>`;
