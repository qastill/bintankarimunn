<style>
/* LAYOUT: one screen, no page scroll. Landing = two island cards over the map (Karimun west, Bintan east).
   Island view = animated map left + infographic panel right with 7 topic tabs; Q&A opens from the top-right corner. */
:root{
  --bg:#f6f9fb; --card:#ffffff; --ink:#0d2238; --mut:#5d7084; --line:#e2e9ef; --soft:#eef4f8;
  --ocean:#0e7c9b; --ocean2:#13a3c4; --navy:#14365c; --sun:#f2a516; --coral:#ef5b4c; --leaf:#22a06b; --violet:#7a5af5; --gas:#3b82c4;
  --sea:#dbeef4; --sand:#fbf7ee; --coast:#b9cfd6;
  --sh:0 10px 30px rgba(13,34,56,.10),0 2px 6px rgba(13,34,56,.06);
  --r:16px;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 clamp(12px,1.5vh,15px)/1.45 var(--f);overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
svg.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:1px solid var(--line);z-index:1100;position:relative}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.logo .mk{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ocean),var(--navy));display:grid;place-items:center;color:#fff}
.logo b{display:block;font-weight:800;font-size:clamp(14px,1.9vh,17px);letter-spacing:-.01em}
.logo span{display:block;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.02em}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px;margin-left:8px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 16px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(13,34,56,.12)}
.seg button .dot{width:8px;height:8px;border-radius:50%}
.sp{flex:1}
.stamp{font-size:11.5px;color:var(--mut);font-weight:600}
.qa-open{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 16px 9px 12px;background:var(--ink);color:#fff;font-weight:700;box-shadow:var(--sh)}
.qa-open kbd{font-family:var(--fm);font-size:11px;background:rgba(255,255,255,.18);border-radius:5px;padding:1px 6px}

/* stage */
.stage{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{font:500 13px/1.4 var(--f);background:var(--sea)}

/* landing */
.land{position:absolute;inset:0;z-index:900;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(16px,3vh,36px) max(18px,env(safe-area-inset-right,0px)) clamp(14px,2.5vh,28px) max(18px,env(safe-area-inset-left,0px));pointer-events:none;background:radial-gradient(ellipse at 50% 30%,rgba(246,249,251,.0) 0%,rgba(246,249,251,.55) 70%)}
.land>*{pointer-events:auto}
.hero{text-align:center;max-width:860px;margin:0 auto;animation:rise .7s ease both}
.hero .k{display:inline-flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--ocean);box-shadow:var(--sh)}
.hero h1{margin:12px 0 4px;font-weight:800;font-size:clamp(26px,4.6vh,46px);line-height:1.05;letter-spacing:-.025em;text-wrap:balance}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--ocean),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 auto;color:var(--mut);font-size:clamp(13px,1.8vh,16px);max-width:60ch}
.cards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,6vw,140px);align-items:center;max-width:1180px;width:100%;margin:0 auto}
.icard{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:24px;box-shadow:0 24px 60px rgba(13,34,56,.16);padding:clamp(14px,2.4vh,26px);display:grid;gap:clamp(8px,1.4vh,14px);border:1px solid rgba(255,255,255,.9);text-align:left;transition:transform .25s ease,box-shadow .25s ease;animation:rise .8s ease both}
.icard:nth-child(2){animation-delay:.12s}
.icard:hover{transform:translateY(-4px);box-shadow:0 30px 70px rgba(13,34,56,.22)}
.icard header{display:flex;align-items:center;gap:14px}
.sil{width:clamp(54px,8vh,84px);height:clamp(54px,8vh,84px);flex:none}
.sil path{fill:url(#gB);stroke:#fff;stroke-width:1.5}
.icard.k .sil path{fill:url(#gK)}
.icard h2{margin:0;font-size:clamp(22px,3.6vh,34px);font-weight:800;letter-spacing:-.02em;line-height:1}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;margin-top:6px}
.badge.b{background:#e6f5fa;color:var(--ocean)}.badge.k{background:#fff1e2;color:#b86a00}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--soft);border-radius:14px;padding:clamp(8px,1.2vh,12px)}
.stat b{display:block;font-family:var(--fm);font-size:clamp(18px,3vh,28px);font-weight:700;line-height:1.05;letter-spacing:-.02em}
.stat b small{font-size:.5em;font-weight:700;color:var(--mut);margin-left:3px}
.stat span{font-size:11.5px;color:var(--mut);font-weight:600;line-height:1.25;display:block;margin-top:3px}
.stat.hot b{color:var(--coral)}
.key{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:clamp(12.5px,1.7vh,14.5px)}
.key svg{color:var(--coral);margin-top:2px}
.cta{justify-self:start;border:0;border-radius:999px;padding:11px 18px;font-weight:800;display:flex;align-items:center;gap:8px;color:#fff;background:linear-gradient(135deg,var(--ocean),var(--navy));box-shadow:0 8px 20px rgba(14,124,155,.35)}
.icard.k .cta{background:linear-gradient(135deg,#f2a516,#e2711d);box-shadow:0 8px 20px rgba(226,113,29,.35)}
.strip{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;animation:rise .9s ease both;animation-delay:.2s}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:7px 14px;box-shadow:var(--sh);font-size:12.5px;font-weight:600}
.pill b{font-family:var(--fm)}
.pill svg{color:var(--ocean)}

/* island view */
.view{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,clamp(400px,40vw,620px));pointer-events:none;z-index:900}
.view>*{pointer-events:auto}
.mapspace{pointer-events:none;position:relative}
.mapspace>*{pointer-events:auto}
.panel{background:var(--card);border-left:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;box-shadow:-10px 0 30px rgba(13,34,56,.06)}
.tabs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 9px;font-size:11.5px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;border-radius:10px 10px 0 0}
.tab svg.i{width:20px;height:20px}
.tab:hover{color:var(--ink);background:var(--soft)}
.tab[aria-selected="true"]{color:var(--ocean);border-bottom-color:var(--ocean)}
.isl-k .tab[aria-selected="true"]{color:#c4700a;border-bottom-color:var(--sun)}
.body{min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:clamp(8px,1.4vh,14px);padding:clamp(12px,1.8vh,20px) clamp(14px,1.4vw,22px) clamp(10px,1.4vh,16px);overflow:hidden}
.hd{display:flex;gap:12px;align-items:flex-start}
.hd .ico{width:clamp(36px,5vh,46px);height:clamp(36px,5vh,46px);border-radius:12px;display:grid;place-items:center;background:#e6f5fa;color:var(--ocean);flex:none}
.isl-k .hd .ico{background:#fff1e2;color:#c4700a}
.hd .ico svg.i{width:55%;height:55%}
.hd small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.hd h2{margin:2px 0 0;font-size:clamp(16px,2.5vh,23px);font-weight:800;line-height:1.15;letter-spacing:-.015em;text-wrap:balance}
.kp{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:clamp(6px,.8vw,10px)}
.kpi{background:var(--soft);border-radius:14px;padding:clamp(8px,1.2vh,12px) clamp(8px,.8vw,12px);display:grid;gap:2px;position:relative;overflow:hidden;animation:pop .5s ease both}
.kpi:nth-child(2){animation-delay:.06s}.kpi:nth-child(3){animation-delay:.12s}.kpi:nth-child(4){animation-delay:.18s}
.kpi{border:2px solid transparent;text-align:left;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(13,34,56,.10)}
.kpi.on{border-color:var(--ocean);box-shadow:0 6px 18px rgba(14,124,155,.22)}
.isl-k .kpi.on{border-color:var(--sun)}
.kpi .qi-i{position:absolute;right:7px;top:7px;color:var(--mut);opacity:.55}
.kpi .qi-i svg.i{width:14px;height:14px}
.kpi:hover .qi-i{opacity:1;color:var(--ocean)}
.body{position:relative}
.exp{position:absolute;left:clamp(14px,1.4vw,22px);right:clamp(14px,1.4vw,22px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 44px rgba(13,34,56,.18);padding:clamp(12px,1.8vh,18px);display:grid;grid-template-rows:auto auto minmax(0,auto) auto;gap:clamp(6px,1.2vh,12px);z-index:5;animation:rise .3s ease both;overflow:hidden}
.exp header{display:flex;gap:12px;align-items:center}
.exp header .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#e6f5fa;color:var(--ocean);flex:none}
.isl-k .exp header .ico{background:#fff1e2;color:#c4700a}
.exp header small{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.exp h4{margin:0;font-size:clamp(15px,2.2vh,19px);font-weight:800}
.exp .xx{margin-left:auto;border:0;background:var(--soft);border-radius:999px;width:34px;height:34px;display:grid;place-items:center}
.exp .big{font-family:var(--fm);font-size:clamp(24px,4.4vh,40px);font-weight:700;letter-spacing:-.02em;line-height:1.05;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.exp .big small{font-size:.42em;color:var(--mut)}
.exp .big span{font-family:var(--f);font-size:13px;font-weight:600;color:var(--mut);letter-spacing:0;flex-basis:100%}
.exp .big.hot{color:var(--coral)}.exp .big.ok{color:var(--leaf)}.exp .big.sun{color:#c4700a}
.exp p{margin:0;font-size:clamp(13px,1.9vh,16px);line-height:1.55;font-weight:500;overflow:auto}
.exp footer{display:flex;justify-content:space-between;align-items:center;gap:10px}
.exp .go{border:0;background:#e6f5fa;color:var(--ocean);border-radius:999px;padding:8px 14px;font-weight:800;display:flex;gap:6px;align-items:center}
.isl-k .exp .go{background:#fff1e2;color:#c4700a}
.exp .hint2{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .t{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--mut);line-height:1.2}
.kpi .t svg{color:var(--ocean)}
.kpi b{font-family:var(--fm);font-size:clamp(17px,2.9vh,27px);font-weight:700;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.kpi b small{font-size:.5em;color:var(--mut);margin-left:3px}
.kpi .s{font-size:11px;color:var(--mut);line-height:1.25}
.kpi.hot{background:#fdeceb}.kpi.hot b,.kpi.hot .t svg{color:var(--coral)}
.kpi.ok{background:#e7f6ef}.kpi.ok .t svg,.kpi.ok b{color:var(--leaf)}
.kpi.sun{background:#fff5df}.kpi.sun .t svg{color:#c4700a}
.viz{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:linear-gradient(180deg,#fbfdfe,#f3f8fb);border:1px solid var(--line);border-radius:16px;padding:clamp(8px,1.2vh,12px) 12px}
.viz h3{margin:0;font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.viz h3 span{font-weight:600;text-transform:none;letter-spacing:0}
.cv{position:relative;min-height:0}
.cv>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cv text{font-family:var(--fm);font-size:10.5px;fill:var(--mut)}
.cv .lb{fill:var(--ink);font-weight:700}
.cv .gl{stroke:#dbe5ec;stroke-dasharray:3 4}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--mut);font-weight:600}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ins{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:clamp(6px,.8vw,10px)}
.in{display:flex;gap:8px;align-items:flex-start;font-size:clamp(11.5px,1.55vh,13.5px);font-weight:600;line-height:1.3;padding:8px 10px;border-radius:12px;background:var(--soft);animation:pop .5s ease both;animation-delay:.25s}
.in svg{flex:none;margin-top:1px;color:var(--ocean)}
.in.w{background:#fdeceb}.in.w svg{color:var(--coral)}
.in.g{background:#e7f6ef}.in.g svg{color:var(--leaf)}
.body.insm{grid-template-rows:auto minmax(0,1fr) auto auto}
.igrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:clamp(6px,1vh,10px);min-height:0}
.icd{border:1px solid var(--line);background:linear-gradient(180deg,#fff,#f6fafc);border-radius:16px;padding:clamp(8px,1.2vh,12px) 12px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:clamp(2px,.6vh,6px);text-align:left;min-height:0;overflow:hidden;position:relative;animation:pop .5s ease both;transition:transform .2s,box-shadow .2s}
.icd:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:#cfe3ec}
.icd .qq{display:flex;gap:8px;align-items:center;font-size:clamp(10.5px,1.35vh,12px);font-weight:800;color:var(--mut);line-height:1.2;text-transform:uppercase;letter-spacing:.03em}
.icd .qq span.n{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:#e6f5fa;color:var(--ocean);font-family:var(--fm);font-size:11px;flex:none}
.isl-k .icd .qq span.n{background:#fff1e2;color:#c4700a}
.icd b{font-family:var(--fm);font-size:clamp(18px,3vh,28px);font-weight:700;letter-spacing:-.02em;line-height:1.05;display:flex;align-items:baseline;gap:6px}
.icd b small{font-size:.48em;color:var(--mut)}
.icd p{margin:0;font-size:clamp(11px,1.45vh,13px);font-weight:600;line-height:1.35;color:var(--ink);overflow:hidden}
.icd.hot b{color:var(--coral)}.icd.ok b{color:var(--leaf)}.icd.sun b{color:#c4700a}
.icd .go{position:absolute;right:10px;top:10px;color:var(--mut)}
.inote{display:flex;gap:10px;align-items:flex-start;background:#fff7e6;border:1px solid #f6dfae;border-radius:14px;padding:8px 12px;font-size:clamp(11px,1.45vh,12.5px);font-weight:600;line-height:1.35}
.inote svg{color:#c4700a;margin-top:1px}
.stb{display:inline-block;font:800 9.5px/1.5 var(--f);letter-spacing:.05em;text-transform:uppercase;padding:0 6px;border-radius:999px;color:var(--sc);background:#fff;border:1.5px solid var(--sc);white-space:nowrap;vertical-align:1px;margin-right:2px}
.stb.st-R,.stb.st-K,.stb.st-F{border-style:dashed}.stb.st-M,.stb.st-P{border-style:dotted}
.icd b .stb{font-family:var(--f);letter-spacing:.05em;margin-left:4px;align-self:center}
.exp small .stb{margin-left:6px}
.src{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src b{font-weight:700}

/* map ui */
.mtitle{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:16px;background:rgba(255,255,255,.95);border-radius:16px;box-shadow:var(--sh);padding:10px 14px;display:flex;gap:12px;align-items:center;max-width:min(440px,70%)}
.mtitle .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--ocean),var(--navy));flex:none}
.isl-k .mtitle .ic{background:linear-gradient(135deg,#f2a516,#e2711d)}
.mtitle b{display:block;font-size:15px;font-weight:800}
.mtitle span{display:block;font-size:12px;color:var(--mut);font-weight:600;line-height:1.3}
.legend{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;background:rgba(255,255,255,.96);border-radius:16px;box-shadow:var(--sh);padding:8px 10px;width:min(250px,calc(100% - 32px));max-height:calc(100% - 160px);overflow:auto}
.legend header{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.legend header button{border:0;background:var(--soft);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;color:var(--mut)}
.legend.min .lrow,.legend.min .skey{display:none}
.sfil{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:84px;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.96);border-radius:999px;box-shadow:var(--sh);padding:4px}
.sfil span{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:0 8px 0 10px}
.sfil button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:6px}
.sfil button[aria-pressed="true"]{background:var(--ink);color:#fff}
.sfil .d1{width:10px;height:10px;border-radius:50%;background:var(--ocean)}
.sfil .d2{width:10px;height:10px;border-radius:50%;background:#fff;border:2px dashed #2b5fa8}
.lrw{display:grid;grid-template-columns:minmax(0,1fr) 22px;align-items:center}
.li{border:0;background:none;color:var(--mut);padding:2px;border-radius:6px;display:grid;place-items:center}
.li:hover{color:var(--ocean);background:var(--soft)}
.li svg.i{width:14px;height:14px}
.ldesc{background:#f3f8fb;border:1px solid #d6e7ef;border-radius:10px;padding:8px 10px;font-size:11.5px;line-height:1.45;font-weight:500;margin:2px 0 6px;animation:pop .25s ease both}
.ldesc b{display:block;font-size:12px;margin-bottom:2px}
.symk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 8px;font-size:10.5px;font-weight:700;color:var(--ink);padding:2px 4px 6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.symk span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.swi{width:18px;height:18px;display:inline-grid;place-items:center;flex:none;box-shadow:0 1px 3px rgba(13,34,56,.25)}
.swi svg{width:12px;height:12px}
.lrow .swi{width:20px;height:20px;justify-self:center}
.mini{display:inline-block;width:11px;height:11px;border-radius:50%}
.sk2{font-weight:600!important;color:var(--mut)}
.legend.min .symk{display:none}
.msym{background:none;border:0}
.skey{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;font-weight:700;color:var(--ink);padding:4px 4px 6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.skey span{display:flex;align-items:center;gap:5px}.skey svg{width:24px;height:10px}
.lrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;justify-items:start;align-items:center;gap:8px;width:100%;border:0;background:none;padding:3px 4px;border-radius:8px;text-align:left;font-size:12px;font-weight:600;line-height:1.25}
.lrow:hover{background:var(--soft)}
.lrow[aria-pressed="false"]{opacity:.38}
.lrow[aria-pressed="false"] .sw{filter:grayscale(1)}
.lrow em{font-style:normal;font-family:var(--fm);font-size:11px;color:var(--mut)}
.lrow small{display:none}
.sw{width:28px;height:16px}
.zoomb{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px}
.zoomb button{width:36px;height:36px;border-radius:10px;border:0;background:rgba(255,255,255,.96);box-shadow:var(--sh);font-weight:800;font-size:16px;display:grid;place-items:center}
.basebtn{padding:4px!important}
.bsw{display:inline-block;width:100%;height:100%;border-radius:7px;border:1px solid rgba(13,34,56,.15)}
.zoomb{align-items:flex-end}
.bmenu{position:absolute;right:46px;top:150px;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:8px;width:230px;display:grid;gap:2px;z-index:5}
.bmenu b{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:2px 6px 4px}
.bopt{display:grid!important;grid-template-columns:34px 1fr;gap:10px;align-items:center;width:auto!important;height:auto!important;border:0;background:none!important;box-shadow:none!important;border-radius:10px!important;padding:6px!important;text-align:left;font-size:13px!important;font-weight:700!important}
.bopt .bsw{width:34px;height:26px}
.bopt>span:last-child{text-align:left;justify-self:start}
.bopt small{display:block;font-size:10.5px;color:var(--mut);font-weight:600}
.bopt:hover{background:var(--soft)!important}.bopt[aria-pressed="true"]{background:#e6f5fa!important;color:var(--ocean)}
.hint{position:absolute;right:16px;bottom:16px;background:rgba(13,34,56,.85);color:#fff;border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:600;display:flex;gap:6px;align-items:center}

/* leaflet popups & labels */
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:var(--sh)}
.leaflet-popup-content{margin:12px 14px;min-width:220px;font-size:12.5px}
.pp h4{margin:0 0 2px;font-size:14px;font-weight:800;display:flex;gap:8px;align-items:center}
.pp .tg{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;margin-bottom:6px}
.pp dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:6px 0 0}
.pp dt{color:var(--mut);font-weight:600}.pp dd{margin:0;font-weight:600}
.ml{background:rgba(255,255,255,.92);border:0;border-radius:8px;box-shadow:0 2px 8px rgba(13,34,56,.15);padding:3px 8px;font:700 11.5px/1.2 var(--f);color:var(--ink);white-space:nowrap}
.ml::before{display:none}
.ml.hot{color:var(--coral)}
.ml.sun{color:#b86a00}
.ml.big{font-size:13px;padding:5px 10px}
.flow{stroke-dasharray:10 12;animation:dash 1.1s linear infinite}
.flow.slow{animation-duration:2.4s}
.ring{animation:ring 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.hit{cursor:pointer}

/* Q&A overlay */
.qa{position:fixed;inset:0;z-index:2000;background:rgba(13,34,56,.35);backdrop-filter:blur(3px);display:grid;place-items:center;padding:clamp(10px,3vh,32px) 16px}
.qa[hidden]{display:none}
.qbox{width:min(1120px,100%);height:100%;background:var(--card);border-radius:22px;box-shadow:0 30px 80px rgba(13,34,56,.3);display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden;animation:rise .35s ease both}
.qtop{display:flex;align-items:center;gap:12px;padding:16px 20px 10px}
.qtop h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.qtop h2 span{color:var(--mut);font-weight:600;font-size:14px;margin-left:6px}
.srch{flex:1;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:9px 14px;border:2px solid transparent}
.srch:focus-within{border-color:var(--ocean2);background:#fff}
.srch input{border:0;background:none;outline:none;flex:1;min-width:0;font-weight:600}
.xbtn{border:0;background:var(--soft);border-radius:999px;width:38px;height:38px;display:grid;place-items:center}
.qfil{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 12px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:6px}
.chip em{font-style:normal;font-family:var(--fm);font-size:11px;opacity:.7}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.isl[aria-pressed="true"]{background:var(--ocean)}
.chip.isl.k[aria-pressed="true"]{background:#d97a12;border-color:#d97a12}
.vsep{width:1px;background:var(--line);margin:0 4px}
.qgrid{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:0}
.qcats{border-right:1px solid var(--line);padding:12px;overflow:auto;display:grid;align-content:start;gap:4px}
.qcat{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:12px;padding:9px 10px;font-weight:700;font-size:13px;color:var(--mut);text-align:left}
.qcat em{margin-left:auto;font-style:normal;font-family:var(--fm);font-size:11.5px}
.qcat svg.i{width:18px;height:18px}
.qcat[aria-pressed="true"]{background:#e6f5fa;color:var(--ocean)}
.qlist{overflow:auto;padding:8px 20px 30px}
.qi{border-bottom:1px solid var(--line)}
.qi summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:12px 0;align-items:start}
.qi summary::-webkit-details-marker{display:none}
.qi summary{grid-template-columns:auto minmax(0,1fr) auto!important;align-items:center!important}
.qic{width:40px;height:40px;border-radius:12px;background:var(--cc);color:#fff;display:grid;place-items:center;position:relative;box-shadow:0 4px 10px rgba(13,34,56,.15);transition:transform .2s}
.qic svg.i{width:20px;height:20px}
.qic em{position:absolute;right:-6px;bottom:-6px;font:700 9.5px/1 var(--fm);background:#fff;color:var(--ink);border-radius:999px;padding:2px 4px;box-shadow:0 1px 3px rgba(0,0,0,.2);font-style:normal}
.qi:hover .qic{transform:scale(1.06)}
.sub2{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px}
.idot{width:8px;height:8px;border-radius:50%;display:inline-block}.idot.b{background:var(--ocean)}.idot.k{background:var(--sun)}.idot.u{background:#a9b6c3}
.tg svg.i{width:11px;height:11px;margin-right:3px;vertical-align:-1px}
.chev{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--mut);transition:transform .25s}
.chev svg.i{width:14px;height:14px}
.qi[open] .chev{transform:rotate(90deg);background:#e6f5fa;color:var(--ocean)}
.qi[open] summary{border-bottom:1px dashed var(--line)}
.qa-a>*{animation:rise .45s ease both;animation-delay:calc(var(--i,0)*.06s)}
.lead2{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,#eaf6fb,#f6fbfd);border:1px solid #d3e9f1;border-radius:14px;padding:12px 14px;font-size:14.5px;font-weight:600;line-height:1.45}
.lead2>svg.i{width:26px;height:26px;color:#d48a00;flex:none;margin-top:2px}
.lead2 small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ocean);margin-bottom:2px}
.kst{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kc{background:#fff;border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:12px;padding:8px 12px;display:grid;gap:2px;box-shadow:0 2px 8px rgba(13,34,56,.05);animation:pop .5s ease both;animation-delay:calc(var(--i)*.08s)}
.kc b{font:700 20px/1.1 var(--fm);color:var(--cc);letter-spacing:-.02em}
.kc b small{font-size:.55em;color:var(--mut);margin-left:3px;font-weight:700}
.kc span{font-size:11.5px;color:var(--mut);font-weight:600;line-height:1.3}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pts li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;padding:6px 10px;border-radius:10px;background:#f8fafc;animation:rise .45s ease both;animation-delay:calc(var(--i)*.06s)}
.pts li::before{display:none!important}
.pts li>svg.i{width:18px;height:18px;flex:none;margin-top:2px;color:var(--ocean)}
.pts li.w{background:#fdf1f0}.pts li.w>svg.i{color:var(--coral)}
.pts li.g{background:#eef8f3}.pts li.g>svg.i{color:var(--leaf)}
.pts li.s>svg.i{color:#d48a00}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips span{display:inline-flex;align-items:center;gap:6px;background:#eef6f2;color:#1d6b49;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.fchips svg.i{width:13px;height:13px}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qfoot .s{display:flex;gap:6px;align-items:center}.qfoot .s svg.i{width:13px;height:13px}
.qi .n{font-family:var(--fm);font-size:11.5px;color:var(--mut);padding-top:2px}
.qi .q{font-weight:700;font-size:14.5px;line-height:1.35}
.qi .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tg{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tg.b{background:#e6f5fa;color:var(--ocean)}.tg.k{background:#fff1e2;color:#b86a00}.tg.u{background:var(--soft);color:var(--mut)}
.tg.d{background:#e7f6ef;color:var(--leaf)}.tg.a{background:#f1ecff;color:var(--violet)}
.qi[open] .q{color:var(--ocean)}
.qa-a{padding:12px 0 18px 54px;display:grid;gap:10px;max-width:92ch;font-size:13.5px;line-height:1.55;font-weight:500}
.qa-a ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.qa-a li{display:flex;gap:8px;font-size:12.5px;color:var(--ink)}
.qa-a li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--ocean2);margin-top:.55em;flex:none}
.qa-a .s{font-size:11.5px;color:var(--mut)}
.qa-a .go{justify-self:start;border:0;background:#e6f5fa;color:var(--ocean);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center}
mark{background:#ffe7a8;color:inherit;border-radius:3px;padding:0 1px}
.none{padding:40px 0;color:var(--mut);text-align:center}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes ring{0%{stroke-opacity:.8;stroke-width:2;transform:scale(1)}100%{stroke-opacity:0;stroke-width:1;transform:scale(1.9)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.gb{transform-box:fill-box;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:left;animation:growx .8s cubic-bezier(.2,.8,.2,1) both}
.dl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s ease forwards}
.fd{animation:fade .6s ease both;animation-delay:.6s}

@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .top{flex-wrap:wrap;position:sticky;top:0}
  .stamp{display:none}
  .stage{height:auto}
  #map{position:relative;height:52vh}
  .land{position:relative;inset:auto;background:none;pointer-events:auto;display:grid;gap:16px}
  .cards{grid-template-columns:1fr}
  .view{position:relative;inset:auto;display:block}
  .mapspace{display:none}
  .panel{border-left:0}
  .body{overflow:visible}
  .cv{height:220px}
  .kp,.ins{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabs{grid-template-columns:repeat(4,minmax(0,1fr))}
  .qgrid{grid-template-columns:1fr}
  .qcats{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .qcat{white-space:nowrap}
  .qa-a{padding-left:0}
  .mtitle,.legend,.zoomb,.hint{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.dl{stroke-dashoffset:0}}
</style>

</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13a3c4"/><stop offset="1" stop-color="#14365c"/></linearGradient>
 <linearGradient id="gK" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7c14a"/><stop offset="1" stop-color="#e2711d"/></linearGradient>
</defs></svg>

<div class="app" id="app">
  <header class="top">
    <button class="logo" type="button" id="home" aria-label="Kembali ke halaman awal"><span class="mk" id="logoIc"></span><span><b>Kelistrikan Bintan &amp; Karimun</b><span>RUPTL 2025–2034 · data publik s.d. 25 Nov 2026</span></span></button>
    <div class="seg" id="seg" hidden><button type="button" data-isl="bintan" aria-pressed="false"><span class="dot" style="background:var(--ocean)"></span>Bintan</button><button type="button" data-isl="karimun" aria-pressed="false"><span class="dot" style="background:var(--sun)"></span>Karimun</button></div>
    <div class="sp"></div>
    <span class="stamp">Sumber: RUPTL PLN 2025–2034 · PLN Batam · ESDM · media</span>
    <button class="qa-open" type="button" id="qaOpen"><span id="qaIc"></span>Tanya-Jawab <kbd>100</kbd></button>
  </header>
  <div class="stage">
    <div id="map" role="region" aria-label="Peta kelistrikan Batam, Bintan dan Karimun"></div>
    <section class="land" id="land" aria-label="Pilih wilayah"></section>
    <section class="view" id="view" hidden>
      <div class="mapspace">
        <div class="mtitle" id="mtitle"></div>
        <div class="zoomb"><button type="button" id="zi" aria-label="Perbesar">+</button><button type="button" id="zo" aria-label="Perkecil">−</button><button type="button" id="zf" aria-label="Pas ke wilayah" title="Pas ke wilayah"></button><button type="button" class="basebtn" id="bb" aria-label="Ganti peta dasar" title="Ganti peta dasar">PETA</button></div>
        <div class="sfil" id="sfil" role="group" aria-label="Filter status"><span>Tampilkan</span><button type="button" data-f="all" aria-pressed="true">Semua</button><button type="button" data-f="ex" aria-pressed="false"><i class="d1"></i>Eksisting</button><button type="button" data-f="pl" aria-pressed="false"><i class="d2"></i>Rencana</button></div>
        <div class="legend" id="legend"></div>
        <div class="hint" id="hint"></div>
      </div>
      <aside class="panel" id="panel">
        <nav class="tabs" id="tabs" role="tablist" aria-label="Topik"></nav>
        <div class="body" id="body" aria-live="polite"></div>
      </aside>
    </section>
  </div>
</div>

<section class="qa" id="qa" hidden aria-label="Tanya-jawab">
  <div class="qbox">
    <div class="qtop"><h2>Tanya-Jawab<span id="qn">100 pertanyaan</span></h2>
      <label class="srch" for="qs"><span id="sIc"></span><input id="qs" type="search" placeholder="Ketik kata kunci: kabel, ISBB, tarif, PLTMG, SAIDI…" autocomplete="off"></label>
      <button class="xbtn" type="button" id="qaClose" aria-label="Tutup tanya-jawab"></button></div>
    <div class="qfil" id="qfil"></div>
    <div class="qgrid"><nav class="qcats" id="qcats" aria-label="Jenis pertanyaan"></nav><div class="qlist" id="qlist"></div></div>
  </div>
</section>
