<style>
/* required styles */

	}

<style>
/* LAYOUT: one screen, no page scroll. Landing = two island cards over the map (Karimun west, Bintan east).
   Island view = animated map left + infographic panel right with 7 topic tabs; Q&A opens from the top-right corner. */
:root{
  --bg:#f6f9fb; --card:#ffffff; --ink:#0d2238; --mut:#5d7084; --line:#e2e9ef; --soft:#eef4f8;
  --ocean:#0e7c9b; --ocean2:#13a3c4; --navy:#14365c; --sun:#f2a516; --coral:#ef5b4c; --leaf:#22a06b; --violet:#7a5af5; --gas:#3b82c4;
  --sea:#dbeef4; --sand:#fbf7ee; --coast:#b9cfd6;
  --sh:0 10px 30px rgba(13,34,56,.10),0 2px 6px rgba(13,34,56,.06);
  --r:16px;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 clamp(12px,1.5vh,15px)/1.45 var(--f);overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
svg.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:1px solid var(--line);z-index:1100;position:relative}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.logo .mk{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ocean),var(--navy));display:grid;place-items:center;color:#fff}
.logo b{display:block;font-weight:800;font-size:clamp(14px,1.9vh,17px);letter-spacing:-.01em}
.logo span{display:block;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.02em}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px;margin-left:8px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 16px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(13,34,56,.12)}
.seg button .dot{width:8px;height:8px;border-radius:50%}
.sp{flex:1}
.stamp{font-size:11.5px;color:var(--mut);font-weight:600}
.qa-open{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 16px 9px 12px;background:var(--ink);color:#fff;font-weight:700;box-shadow:var(--sh)}
.qa-open kbd{font-family:var(--fm);font-size:11px;background:rgba(255,255,255,.18);border-radius:5px;padding:1px 6px}

/* stage */
.stage{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{font:500 13px/1.4 var(--f);background:var(--sea)}

/* landing */
.land{position:absolute;inset:0;z-index:900;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(16px,3vh,36px) max(18px,env(safe-area-inset-right,0px)) clamp(14px,2.5vh,28px) max(18px,env(safe-area-inset-left,0px));pointer-events:none;background:radial-gradient(ellipse at 50% 30%,rgba(246,249,251,.0) 0%,rgba(246,249,251,.55) 70%)}
.land>*{pointer-events:auto}
.hero{text-align:center;max-width:860px;margin:0 auto;animation:rise .7s ease both}
.hero .k{display:inline-flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--ocean);box-shadow:var(--sh)}
.hero h1{margin:12px 0 4px;font-weight:800;font-size:clamp(26px,4.6vh,46px);line-height:1.05;letter-spacing:-.025em;text-wrap:balance}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--ocean),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 auto;color:var(--mut);font-size:clamp(13px,1.8vh,16px);max-width:60ch}
.cards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,6vw,140px);align-items:center;max-width:1180px;width:100%;margin:0 auto}
.icard{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:24px;box-shadow:0 24px 60px rgba(13,34,56,.16);padding:clamp(14px,2.4vh,26px);display:grid;gap:clamp(8px,1.4vh,14px);border:1px solid rgba(255,255,255,.9);text-align:left;transition:transform .25s ease,box-shadow .25s ease;animation:rise .8s ease both}
.icard:nth-child(2){animation-delay:.12s}
.icard:hover{transform:translateY(-4px);box-shadow:0 30px 70px rgba(13,34,56,.22)}
.icard header{display:flex;align-items:center;gap:14px}
.sil{width:clamp(54px,8vh,84px);height:clamp(54px,8vh,84px);flex:none}
.sil path{fill:url(#gB);stroke:#fff;stroke-width:1.5}
.icard.k .sil path{fill:url(#gK)}
.icard h2{margin:0;font-size:clamp(22px,3.6vh,34px);font-weight:800;letter-spacing:-.02em;line-height:1}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;margin-top:6px}
.badge.b{background:#e6f5fa;color:var(--ocean)}.badge.k{background:#fff1e2;color:#b86a00}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--soft);border-radius:14px;padding:clamp(8px,1.2vh,12px)}
.stat b{display:block;font-family:var(--fm);font-size:clamp(18px,3vh,28px);font-weight:700;line-height:1.05;letter-spacing:-.02em}
.stat b small{font-size:.5em;font-weight:700;color:var(--mut);margin-left:3px}
.stat span{font-size:11.5px;color:var(--mut);font-weight:600;line-height:1.25;display:block;margin-top:3px}
.stat.hot b{color:var(--coral)}
.key{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:clamp(12.5px,1.7vh,14.5px)}
.key svg{color:var(--coral);margin-top:2px}
.cta{justify-self:start;border:0;border-radius:999px;padding:11px 18px;font-weight:800;display:flex;align-items:center;gap:8px;color:#fff;background:linear-gradient(135deg,var(--ocean),var(--navy));box-shadow:0 8px 20px rgba(14,124,155,.35)}
.icard.k .cta{background:linear-gradient(135deg,#f2a516,#e2711d);box-shadow:0 8px 20px rgba(226,113,29,.35)}
.strip{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;animation:rise .9s ease both;animation-delay:.2s}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:7px 14px;box-shadow:var(--sh);font-size:12.5px;font-weight:600}
.pill b{font-family:var(--fm)}
.pill svg{color:var(--ocean)}

/* island view */
.view{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,clamp(400px,40vw,620px));pointer-events:none;z-index:900}
.view>*{pointer-events:auto}
.mapspace{pointer-events:none;position:relative}
.mapspace>*{pointer-events:auto}
.panel{background:var(--card);border-left:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;box-shadow:-10px 0 30px rgba(13,34,56,.06)}
.tabs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 9px;font-size:11.5px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;border-radius:10px 10px 0 0}
.tab svg.i{width:20px;height:20px}
.tab:hover{color:var(--ink);background:var(--soft)}
.tab[aria-selected="true"]{color:var(--ocean);border-bottom-color:var(--ocean)}
.isl-k .tab[aria-selected="true"]{color:#c4700a;border-bottom-color:var(--sun)}
.body{min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:clamp(8px,1.4vh,14px);padding:clamp(12px,1.8vh,20px) clamp(14px,1.4vw,22px) clamp(10px,1.4vh,16px);overflow:hidden}
.hd{display:flex;gap:12px;align-items:flex-start}
.hd .ico{width:clamp(36px,5vh,46px);height:clamp(36px,5vh,46px);border-radius:12px;display:grid;place-items:center;background:#e6f5fa;color:var(--ocean);flex:none}
.isl-k .hd .ico{background:#fff1e2;color:#c4700a}
.hd .ico svg.i{width:55%;height:55%}
.hd small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.hd h2{margin:2px 0 0;font-size:clamp(16px,2.5vh,23px);font-weight:800;line-height:1.15;letter-spacing:-.015em;text-wrap:balance}
.kp{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:clamp(6px,.8vw,10px)}
.kpi{background:var(--soft);border-radius:14px;padding:clamp(8px,1.2vh,12px) clamp(8px,.8vw,12px);display:grid;gap:2px;position:relative;overflow:hidden;animation:pop .5s ease both}
.kpi:nth-child(2){animation-delay:.06s}.kpi:nth-child(3){animation-delay:.12s}.kpi:nth-child(4){animation-delay:.18s}
.kpi{border:2px solid transparent;text-align:left;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(13,34,56,.10)}
.kpi.on{border-color:var(--ocean);box-shadow:0 6px 18px rgba(14,124,155,.22)}
.isl-k .kpi.on{border-color:var(--sun)}
.kpi .qi-i{position:absolute;right:7px;top:7px;color:var(--mut);opacity:.55}
.kpi .qi-i svg.i{width:14px;height:14px}
.kpi:hover .qi-i{opacity:1;color:var(--ocean)}
.body{position:relative}
.exp{position:absolute;left:clamp(14px,1.4vw,22px);right:clamp(14px,1.4vw,22px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 44px rgba(13,34,56,.18);padding:clamp(12px,1.8vh,18px);display:grid;grid-template-rows:auto auto minmax(0,auto) auto;gap:clamp(6px,1.2vh,12px);z-index:5;animation:rise .3s ease both;overflow:hidden}
.exp header{display:flex;gap:12px;align-items:center}
.exp header .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#e6f5fa;color:var(--ocean);flex:none}
.isl-k .exp header .ico{background:#fff1e2;color:#c4700a}
.exp header small{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.exp h4{margin:0;font-size:clamp(15px,2.2vh,19px);font-weight:800}
.exp .xx{margin-left:auto;border:0;background:var(--soft);border-radius:999px;width:34px;height:34px;display:grid;place-items:center}
.exp .big{font-family:var(--fm);font-size:clamp(24px,4.4vh,40px);font-weight:700;letter-spacing:-.02em;line-height:1.05;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.exp .big small{font-size:.42em;color:var(--mut)}
.exp .big span{font-family:var(--f);font-size:13px;font-weight:600;color:var(--mut);letter-spacing:0;flex-basis:100%}
.exp .big.hot{color:var(--coral)}.exp .big.ok{color:var(--leaf)}.exp .big.sun{color:#c4700a}
.exp p{margin:0;font-size:clamp(13px,1.9vh,16px);line-height:1.55;font-weight:500;overflow:auto}
.exp footer{display:flex;justify-content:space-between;align-items:center;gap:10px}
.exp .go{border:0;background:#e6f5fa;color:var(--ocean);border-radius:999px;padding:8px 14px;font-weight:800;display:flex;gap:6px;align-items:center}
.isl-k .exp .go{background:#fff1e2;color:#c4700a}
.exp .hint2{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .t{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--mut);line-height:1.2}
.kpi .t svg{color:var(--ocean)}
.kpi b{font-family:var(--fm);font-size:clamp(17px,2.9vh,27px);font-weight:700;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.kpi b small{font-size:.5em;color:var(--mut);margin-left:3px}
.kpi .s{font-size:11px;color:var(--mut);line-height:1.25}
.kpi.hot{background:#fdeceb}.kpi.hot b,.kpi.hot .t svg{color:var(--coral)}
.kpi.ok{background:#e7f6ef}.kpi.ok .t svg,.kpi.ok b{color:var(--leaf)}
.kpi.sun{background:#fff5df}.kpi.sun .t svg{color:#c4700a}
.viz{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:linear-gradient(180deg,#fbfdfe,#f3f8fb);border:1px solid var(--line);border-radius:16px;padding:clamp(8px,1.2vh,12px) 12px}
.viz h3{margin:0;font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.viz h3 span{font-weight:600;text-transform:none;letter-spacing:0}
.cv{position:relative;min-height:0}
.cv>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cv text{font-family:var(--fm);font-size:10.5px;fill:var(--mut)}
.cv .lb{fill:var(--ink);font-weight:700}
.cv .gl{stroke:#dbe5ec;stroke-dasharray:3 4}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--mut);font-weight:600}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ins{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:clamp(6px,.8vw,10px)}
.in{display:flex;gap:8px;align-items:flex-start;font-size:clamp(11.5px,1.55vh,13.5px);font-weight:600;line-height:1.3;padding:8px 10px;border-radius:12px;background:var(--soft);animation:pop .5s ease both;animation-delay:.25s}
.in svg{flex:none;margin-top:1px;color:var(--ocean)}
.in.w{background:#fdeceb}.in.w svg{color:var(--coral)}
.in.g{background:#e7f6ef}.in.g svg{color:var(--leaf)}
.body.insm{grid-template-rows:auto minmax(0,1fr) auto auto}
.igrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:clamp(6px,1vh,10px);min-height:0}
.icd{border:1px solid var(--line);background:linear-gradient(180deg,#fff,#f6fafc);border-radius:16px;padding:clamp(8px,1.2vh,12px) 12px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:clamp(2px,.6vh,6px);text-align:left;min-height:0;overflow:hidden;position:relative;animation:pop .5s ease both;transition:transform .2s,box-shadow .2s}
.icd:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:#cfe3ec}
.icd .qq{display:flex;gap:8px;align-items:center;font-size:clamp(10.5px,1.35vh,12px);font-weight:800;color:var(--mut);line-height:1.2;text-transform:uppercase;letter-spacing:.03em}
.icd .qq span.n{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:#e6f5fa;color:var(--ocean);font-family:var(--fm);font-size:11px;flex:none}
.isl-k .icd .qq span.n{background:#fff1e2;color:#c4700a}
.icd b{font-family:var(--fm);font-size:clamp(18px,3vh,28px);font-weight:700;letter-spacing:-.02em;line-height:1.05;display:flex;align-items:baseline;gap:6px}
.icd b small{font-size:.48em;color:var(--mut)}
.icd p{margin:0;font-size:clamp(11px,1.45vh,13px);font-weight:600;line-height:1.35;color:var(--ink);overflow:hidden}
.icd.hot b{color:var(--coral)}.icd.ok b{color:var(--leaf)}.icd.sun b{color:#c4700a}
.icd .go{position:absolute;right:10px;top:10px;color:var(--mut)}
.inote{display:flex;gap:10px;align-items:flex-start;background:#fff7e6;border:1px solid #f6dfae;border-radius:14px;padding:8px 12px;font-size:clamp(11px,1.45vh,12.5px);font-weight:600;line-height:1.35}
.inote svg{color:#c4700a;margin-top:1px}
.stb{display:inline-block;font:800 9.5px/1.5 var(--f);letter-spacing:.05em;text-transform:uppercase;padding:0 6px;border-radius:999px;color:var(--sc);background:#fff;border:1.5px solid var(--sc);white-space:nowrap;vertical-align:1px;margin-right:2px}
.stb.st-R,.stb.st-K,.stb.st-F{border-style:dashed}.stb.st-M,.stb.st-P{border-style:dotted}
.icd b .stb{font-family:var(--f);letter-spacing:.05em;margin-left:4px;align-self:center}
.exp small .stb{margin-left:6px}
.src{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src b{font-weight:700}

/* map ui */
.mtitle{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:16px;background:rgba(255,255,255,.95);border-radius:16px;box-shadow:var(--sh);padding:10px 14px;display:flex;gap:12px;align-items:center;max-width:min(440px,70%)}
.mtitle .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--ocean),var(--navy));flex:none}
.isl-k .mtitle .ic{background:linear-gradient(135deg,#f2a516,#e2711d)}
.mtitle b{display:block;font-size:15px;font-weight:800}
.mtitle span{display:block;font-size:12px;color:var(--mut);font-weight:600;line-height:1.3}
.legend{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;background:rgba(255,255,255,.96);border-radius:16px;box-shadow:var(--sh);padding:8px 10px;width:min(250px,calc(100% - 32px));max-height:calc(100% - 160px);overflow:auto}
.legend header{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.legend header button{border:0;background:var(--soft);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;color:var(--mut)}
.legend.min .lrow,.legend.min .skey{display:none}
.sfil{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:84px;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.96);border-radius:999px;box-shadow:var(--sh);padding:4px}
.sfil span{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:0 8px 0 10px}
.sfil button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:6px}
.sfil button[aria-pressed="true"]{background:var(--ink);color:#fff}
.sfil .d1{width:10px;height:10px;border-radius:50%;background:var(--ocean)}
.sfil .d3{width:10px;height:10px;border-radius:50%;background:#fff;border:2px dotted #22a06b}
.sfil .d2{width:10px;height:10px;border-radius:50%;background:#fff;border:2px dashed #2b5fa8}
.lrw{display:grid;grid-template-columns:minmax(0,1fr) 22px;align-items:center}
.li{border:0;background:none;color:var(--mut);padding:2px;border-radius:6px;display:grid;place-items:center}
.li:hover{color:var(--ocean);background:var(--soft)}
.li svg.i{width:14px;height:14px}
.ldesc{background:#f3f8fb;border:1px solid #d6e7ef;border-radius:10px;padding:8px 10px;font-size:11.5px;line-height:1.45;font-weight:500;margin:2px 0 6px;animation:pop .25s ease both}
.ldesc b{display:block;font-size:12px;margin-bottom:2px}
.symk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 8px;font-size:10.5px;font-weight:700;color:var(--ink);padding:2px 4px 6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.symk span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.swi{width:18px;height:18px;display:inline-grid;place-items:center;flex:none;box-shadow:0 1px 3px rgba(13,34,56,.25)}
.swi svg{width:12px;height:12px}
.lrow .swi{width:20px;height:20px;justify-self:center}
.mini{display:inline-block;width:11px;height:11px;border-radius:50%}
.sk2{font-weight:600!important;color:var(--mut)}
.legend.min .symk{display:none}
.msym{background:none;border:0}
.skey{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;font-weight:700;color:var(--ink);padding:4px 4px 6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.skey span{display:flex;align-items:center;gap:5px}.skey svg{width:24px;height:10px}
.lrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;justify-items:start;align-items:center;gap:8px;width:100%;border:0;background:none;padding:3px 4px;border-radius:8px;text-align:left;font-size:12px;font-weight:600;line-height:1.25}
.lrow:hover{background:var(--soft)}
.lrow[aria-pressed="false"]{opacity:.38}
.lrow[aria-pressed="false"] .sw{filter:grayscale(1)}
.lrow em{font-style:normal;font-family:var(--fm);font-size:11px;color:var(--mut)}
.lrow small{display:none}
.sw{width:28px;height:16px}
.zoomb{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px}
.zoomb button{width:36px;height:36px;border-radius:10px;border:0;background:rgba(255,255,255,.96);box-shadow:var(--sh);font-weight:800;font-size:16px;display:grid;place-items:center}
.basebtn{padding:4px!important}
.bsw{display:inline-block;width:100%;height:100%;border-radius:7px;border:1px solid rgba(13,34,56,.15)}
.zoomb{align-items:flex-end}
.bmenu{position:absolute;right:46px;top:150px;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:8px;width:230px;display:grid;gap:2px;z-index:5}
.bmenu b{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:2px 6px 4px}
.bopt{display:grid!important;grid-template-columns:34px 1fr;gap:10px;align-items:center;width:auto!important;height:auto!important;border:0;background:none!important;box-shadow:none!important;border-radius:10px!important;padding:6px!important;text-align:left;font-size:13px!important;font-weight:700!important}
.bopt .bsw{width:34px;height:26px}
.bopt>span:last-child{text-align:left;justify-self:start}
.bopt small{display:block;font-size:10.5px;color:var(--mut);font-weight:600}
.bopt:hover{background:var(--soft)!important}.bopt[aria-pressed="true"]{background:#e6f5fa!important;color:var(--ocean)}
.hint{position:absolute;right:16px;bottom:16px;background:rgba(13,34,56,.85);color:#fff;border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:600;display:flex;gap:6px;align-items:center}

/* leaflet popups & labels */
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:var(--sh)}
.leaflet-popup-content{margin:12px 14px;min-width:220px;font-size:12.5px}
.pp h4{margin:0 0 2px;font-size:14px;font-weight:800;display:flex;gap:8px;align-items:center}
.pp .tg{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;margin-bottom:6px}
.pp dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:6px 0 0}
.pp dt{color:var(--mut);font-weight:600}.pp dd{margin:0;font-weight:600}
.ml{background:rgba(255,255,255,.92);border:0;border-radius:8px;box-shadow:0 2px 8px rgba(13,34,56,.15);padding:3px 8px;font:700 11.5px/1.2 var(--f);color:var(--ink);white-space:nowrap}
.ml::before{display:none}
.ml.hot{color:var(--coral)}
.ml.sun{color:#b86a00}
.ml.big{font-size:13px;padding:5px 10px}
.flow{stroke-dasharray:10 12;animation:dash 1.1s linear infinite}
.flow.slow{animation-duration:2.4s}
.ring{animation:ring 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.hit{cursor:pointer}

/* Q&A overlay */
.qa{position:fixed;inset:0;z-index:2000;background:rgba(13,34,56,.35);backdrop-filter:blur(3px);display:grid;place-items:center;padding:clamp(10px,3vh,32px) 16px}
.qa[hidden]{display:none}
.qbox{width:min(1120px,100%);height:100%;background:var(--card);border-radius:22px;box-shadow:0 30px 80px rgba(13,34,56,.3);display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden;animation:rise .35s ease both}
.qtop{display:flex;align-items:center;gap:12px;padding:16px 20px 10px}
.qtop h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.qtop h2 span{color:var(--mut);font-weight:600;font-size:14px;margin-left:6px}
.srch{flex:1;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:9px 14px;border:2px solid transparent}
.srch:focus-within{border-color:var(--ocean2);background:#fff}
.srch input{border:0;background:none;outline:none;flex:1;min-width:0;font-weight:600}

@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

.trg li em{display:block;font-style:normal;font-size:11.5px;font-weight:700;color:#5b3fd6;margin-top:2px}
.mpb{border:0;background:#e6f5fa;color:var(--ocean);border-radius:999px;padding:3px 8px;font:800 11px var(--f);display:inline-flex;gap:3px;align-items:center;cursor:pointer;white-space:nowrap}.mpb svg.i{width:11px;height:11px}
.bas2{margin:8px 0 0!important;font-size:10.5px!important;color:var(--mut)!important;font-weight:600!important;display:flex;gap:4px;align-items:center}.bas2 svg.i{width:11px;height:11px;flex:none}
.pjc .pb.pr[data-pb]{fill-opacity:.62}.pleg{gap:3px 10px!important;font-size:10.5px!important}

.trg ul{grid-template-columns:1fr!important}
.trg li{display:grid!important;grid-template-columns:auto minmax(0,1fr) auto!important;background:#f7f8fb;font-size:12px}
.trg li.on{background:#f3efff!important}.trg li.w{background:#fdf1ef!important}
.trg li .stb{display:inline-block!important;width:auto!important;font-size:9px!important;line-height:1.5!important;padding:0 6px!important;margin-left:6px}
.exp p.gro,.ppop p.gro{font-size:12.5px!important;line-height:1.4!important;font-weight:600!important;margin:8px 0 0!important}

.systg{display:inline-flex;background:#eef3f7;border-radius:999px;padding:2px;gap:2px;margin-right:8px;flex:none}
.systg button{border:0;background:none;border-radius:999px;padding:4px 10px;font:800 11px var(--f);color:var(--mut);cursor:pointer;text-transform:none;letter-spacing:0}
.systg button.on{background:var(--ink);color:#fff}

/* outlook */
.okp .kpi{cursor:pointer}.okp .kpi .s{font-size:11px}
.olbot{display:grid;gap:6px}
.olr{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:5px;align-items:stretch}
.olr .mn{font-size:10.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;padding-right:4px}
.olr button{border:2px solid transparent;border-radius:10px;padding:4px;font:800 13px var(--fm);display:grid;justify-items:center;cursor:pointer}
.olr button small{font:700 9.5px var(--f);opacity:.75}
.olr button.g{background:#e3f6ea;color:#16804a}.olr button.w{background:#fde7e4;color:#c23a2b}.olr button.m{background:#fff1d6;color:#a86a00}
.olr button:hover{border-color:#c9bff7}
.olg{font-size:10.5px!important;gap:2px 10px!important}.olg .lh{font-weight:800;color:#2b5fa8;text-transform:uppercase;font-size:10px;letter-spacing:.05em}.olg .lh.d{color:#b8432f;margin-left:6px}
.olg i{width:9px!important;height:9px!important;margin-right:4px!important}
.cv .exr:hover rect:first-child{fill:rgba(122,90,245,.08)}.cv circle.sg{animation:dn 1.1s cubic-bezier(.2,.8,.2,1) both}.cv circle.sg:hover{stroke-width:34}
.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;color:var(--mut);text-decoration:none;margin-right:8px}.lang:hover{color:var(--ink)}</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13a3c4"/><stop offset="1" stop-color="#14365c"/></linearGradient>
 <linearGradient id="gK" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7c14a"/><stop offset="1" stop-color="#e2711d"/></linearGradient>
</defs></svg>

<div class="app" id="app">
  <header class="top">
    <button class="logo" type="button" id="home" aria-label="Back to start page"><span class="mk" id="logoIc"></span><span><b>Bintan &amp; Karimun Power Systems</b><span>RUPTL 2025–2034 · public data to 25 Nov 2026</span></span></button>
    <div class="seg" id="seg" hidden><button type="button" data-isl="bintan" aria-pressed="false"><span class="dot" style="background:var(--ocean)"></span>Bintan</button><button type="button" data-isl="karimun" aria-pressed="false"><span class="dot" style="background:var(--sun)"></span>Karimun</button></div>
    <div class="sp"></div>
    <span class="stamp">Source: RUPTL PLN 2025–2034 · PLN Batam · ESDM · media</span>
    <a class="lang" href="id.html" title="Versi Bahasa Indonesia">ID</a>
    <button class="qa-open" type="button" id="qaOpen"><span id="qaIc"></span>Q&amp;A <kbd>100</kbd></button>
  </header>
  <div class="stage">
    <div id="map" role="region" aria-label="Power map of Batam, Bintan and Karimun"></div>
    <section class="land" id="land" aria-label="Select region"></section>
    <section class="view" id="view" hidden>
      <div class="mapspace">
        <div class="mtitle" id="mtitle"></div>
        <div class="zoomb"><button type="button" id="zi" aria-label="Zoom in">+</button><button type="button" id="zo" aria-label="Zoom out">−</button><button type="button" id="zf" aria-label="Fit to region" title="Fit to region"></button><button type="button" class="basebtn" id="bb" aria-label="Change base map" title="Change base map">MAP</button></div>
        <div class="sfil" id="sfil" role="group" aria-label="Status filter"><span>Show</span><button type="button" data-f="all" aria-pressed="true">All</button><button type="button" data-f="ex" aria-pressed="false"><i class="d1"></i>Existing</button><button type="button" data-f="pl" aria-pressed="false"><i class="d2"></i>Planned</button><button type="button" data-f="pt" aria-pressed="false"><i class="d3"></i>Potential</button></div>
        <div class="legend" id="legend"></div>
        <div class="hint" id="hint"></div>
      </div>
      <aside class="panel" id="panel">
        <nav class="tabs" id="tabs" role="tablist" aria-label="Topics"></nav>
        <div class="body" id="body" aria-live="polite"></div>
      </aside>
    </section>
  </div>
</div>

<section class="qa" id="qa" hidden aria-label="Q&amp;A">
  <div class="qbox">
    <div class="qtop"><h2>Q&amp;A<span id="qn">100 questions</span></h2>
      <label class="srch" for="qs"><span id="sIc"></span><input id="qs" type="search" placeholder="Type a keyword: cable, ISBB, tariff, gas engine, SAIDI…" autocomplete="off"></label>
      <button class="xbtn" type="button" id="qaClose" aria-label="Close Q&amp;A"></button></div>
    <div class="qfil" id="qfil"></div>
    <div class="qgrid"><nav class="qcats" id="qcats" aria-label="Question categories"></nav><div class="qlist" id="qlist"></div></div>
  </div>
</section>

[1.0715,103.9723],[1.0709,103.9709],[1.07,103.9686],[1.0691,103.9663],[1.0678,103.9631],[1.0668,103.9605],[1.0655,103.9572],[1.0648,103.9554],[1.0632,103.9528],[1.0617,103.9503],[1.0603,103.9481],[1.0593,103.9466],[1.059,103.9437],[1.0588,103.942],[1.0586,103.94],[1.0583,103.9373],[1.0582,103.9356],[1.0577,103.9331]]}], QA=[{"c":"U","conf":"V","loc":"bin","q":"Who actually supplies electricity on Bintan and Karimun, and how does that differ from Batam?","a":"There are three layers. (1) Bintan (Tanjungpinang City + Bintan Regency) and Karimun Zone 3 are served by PLN (Persero) through UID Riau & Kepri, UP3 Tanjungpinang. RUPTL 2025–2034 defines PLN's Sumatra licence area as covering \"Riau Islands except Batam island\". (2) Batam is served by PT PLN Batam, a subsidiary with its own RUPTL and tariffs. (3) Certain estates have their own licence area or captive supply: Karimun Zone 1 (PT Soma Daya Utama) and Zone 2 (PT Karimun Power Plant), Galang Batang SEZ (captive coal plant), and Lagoi/Lobam. Physically, the Bintan grid is linked to Batam at 150 kV and operated as a single Batam–Bintan system.","f":["RUPTL 2025–2034 Ch. I: Sumatra licence area includes the Riau Islands except Batam Island, served by UID Riau and Kepri","Karimun has 3 zones: Zone 1 SDU, Zone 2 KPP, Zone 3 PLN (detik, 2019)","PLN Batam reports \"Batam–Bintan\" load as one system (~780 MW, Oct 2026)"],"src":"RUPTL 2025–2034 Ch. I; detik Finance 2019; PLN Batam/InfoPublik Oct 2026","isl":"U","v":["m","Three distinct players: PLN Batam (Batam–Bintan system), PLN Persero (retail on Bintan & Karimun Zone 3), and private/captive suppliers in estates."],"p":[["s","Bintan is retailed by PLN Persero, but its energy comes from the PLN Batam system (inter-licence-area)."],["s","Karimun Zone 3 is PLN Persero; Zones 1–2 are private (SDU, KPP)."],["w","Two PLN entities mean inter-licence-area negotiation for any large new connection."],["g","SEZs and estates may have their own supply (captive or licence area)."]],"k":[["3","supply holders"],["2","PLN entities"]],"r":"First map the licence-area holder at the site: it determines your counterparty, tariff and connection cost."},{"c":"U","conf":"V","loc":"karint","q":"Is Karimun connected to a larger grid yet?","a":"Not yet. The Tanjung Balai Karimun (TBK) system is still isolated, with ±40 MW of existing capacity (RUPTL Appendix E) from the TBK coal plant at Tanjung Sebatak (2×7 MW) and the Bukit Carok diesel plant. RUPTL plans a 150 kV interconnection Sumatra → Selat Panjang → Rangsang Island → TBK (6 kms subsea cable + 120 kms overhead line + 70 kms subsea cable + 14 kms to TBK substation), with a new 2×30 MVA 150/20 kV TBK substation, COD 2026, status Committed, and a 1×60 MVA extension in 2032. However, Section V.11.2 says the Selat Panjang–TBK segment is \"still at the planning stage\" and Appendix E gives 2028. A reasonable assumption: 2027–2028.","f":["TBK substation 2×30 MVA, COD 2026 (Committed) in the transmission table","V.11.2: \"still at the planning stage\"; Appendix E: 2028","Total ±210 kms, including ±76 km of subsea cable"],"src":"RUPTL 2025–2034 Appendix A4, V.11.2, Appendix E","isl":"K","v":["n","Not yet. Karimun is an isolated ±40 MW island; a 150 kV cable from Sumatra is realistic only by 2027–2028."],"p":[["w","Dependable capacity 40.6 MW vs peak load 36.1 MW."],["w","Without transmission, all reserve must sit on the island."],["g","RUPTL: Sumatra–Selat Panjang–Rangsang–TBK cable + new 2×30 MVA substation."],["w","RUPTL timelines are inconsistent (2026 vs 2028)."]],"k":[["40.6 MW","dependable capacity"],["2027–28","expected cable arrival"]],"r":"For large loads on Karimun, assume self-supply until the cable is actually energised."},{"c":"U","conf":"V","loc":"bin","q":"What are the main power subsystems in the Riau Islands to watch?","a":"First, the Batam–Bintan system: 150 kV interconnection, operated by PLN Batam, ±780 MW peak. Second, the Tanjung Balai Karimun system: isolated, ±40 MW, awaiting the cable from Sumatra. Third, small scattered systems: Kundur/Tanjung Batu, Dabo/Lingga, Natuna, Anambas, and hundreds of island diesel plants. One key caveat: all RUPTL provincial tables are labelled \"Riau Islands excluding Batam\" and do not split figures between the Bintan and Karimun systems. The Riau Islands excl. Batam figures (144.0 MW installed, 109.8 MW dependable, 293 units, 284 of them PLN diesel plants) already include Karimun, Natuna, Lingga and others.","f":["RUPTL Table A4.3: 144.0 MW installed / 109.8 MW dependable","284 PLN diesel units = 122.8 MW installed","UP3 Tanjungpinang manages >100 small power plants"],"src":"RUPTL Table A4.3; Ombudsman Kepri Jan 2026","isl":"U","v":["m","Three different worlds: Batam–Bintan (±930 MW, interconnected), Karimun (±40 MW, isolated), and hundreds of small-island diesel plants."],"p":[["g","Batam–Bintan is fairly large and has a gas-plant pipeline."],["w","Karimun is small and fragile."],["w","Small islands rely on >100 scattered diesel plants."],["s","RUPTL reports only \"Riau Islands excl. Batam\", not per island."]],"k":[["930 MW","Batam–Bintan"],["40 MW","Karimun"]],"r":"Don't use provincial figures; assess feasibility for the specific system where the site sits."},{"c":"U","conf":"V","loc":null,"q":"Which planning documents govern capacity additions on Bintan and Karimun?","a":"RUPTL PT PLN (Persero) 2025–2034 (ESDM Ministerial Decree, 26 May 2025), Appendix A4, Riau Islands Province. Batam has a separate document: RUPTL PT PLN Batam 2023–2032. Because Bintan is connected to Batam, most of Bintan's supply solutions actually sit in the PLN Batam RUPTL (CCGT/gas-engine plants in Batam). RUPTL progress must also be reported to the ESDM Minister every quarter.","f":["RUPTL 2025–2034 ratified by ESDM Ministerial Decree on 26 May 2025","Fifth Clause: progress report every 3 months (Apr, Jul, Oct, Jan)","RUPTL PLN Batam 2023–2032 ratified May 2023"],"src":"RUPTL 2025–2034 (Ministerial Decree); ESDM May 2023","isl":"U","v":["m","Two documents: RUPTL PLN Persero 2025–2034 (Bintan, Karimun) and RUPTL PLN Batam (Bintan's supply source)."],"p":[["s","Bintan's supply depends on projects in the PLN Batam RUPTL."],["g","RUPTL 2025–2034 already includes ISBB and the Karimun cable."],["w","National transmission delivery in 2025 was only ±37% of target."],["s","Progress is reported quarterly to the ESDM Ministry."]],"k":[["2","RUPTL documents"],["37%","2025 transmission delivery"]],"r":"Read both, and discount transmission timelines by 1–2 years."},{"c":"U","conf":"V","loc":null,"q":"What are the headline national figures in RUPTL 2025–2034?","a":"Average demand growth of 5.3%/yr. Generation additions of 69,512 MW: RE 42,569 MW, storage 10,256 MW, fossil 16,687 MW. RE mix target of 34.3% by end-2034. Transmission 47,758 kms, substations 107,950 MVA, distribution 197,998 kms, distribution substations 18,407 MVA. These are national figures; the Riau Islands share is in Appendix A4.","f":["Figures from the Second Clause of the RUPTL 2025–2034 Ministerial Decree"],"src":"RUPTL 2025–2034, Second Clause","isl":"U","v":["p","Major expansion: 69.5 GW added by 2034, 61% RE, plus 10.3 GW of storage."],"p":[["g","Demand growing 5.3%/yr: the market is expanding."],["g","RE 42.6 GW + storage 10.3 GW: a clear green direction."],["w","Fossil plants still come first (\"fossils first\")."],["s","RE mix target of 34.3% by 2034."]],"k":[["69.5 GW","capacity additions"],["34.3%","2034 RE mix"]],"r":"Treat this as a policy-direction signal, not a supply guarantee at your site."},{"c":"U","conf":"V","loc":null,"q":"How high is the Riau Islands electrification ratio, and how large is its distribution network?","a":"The Riau Islands electrification ratio is 99.99% (PLN ratio 99.49%), with a PLN target of 100% by 2027. Distribution assets in the Riau Islands excl. Batam (actuals through Oct 2024, RUPTL A4.5 & A4.22): MV lines 2,702 kms, LV lines 2,343 kms, distribution substations 355 MVA. Annual additions are very small: ±24–26 kms MV, ±26–28 kms LV, 4 MVA of substations, ±6k new customers. Access is solved; the issues are reliability and cost of supply.","f":["A4.5 & A4.22"],"src":"RUPTL Tables A4.5, A4.22","isl":"B","v":["m","Electricity access is solved (99.99% ratio); the issue is reliability, not reach."],"p":[["g","Riau Islands electrification ratio of 99.99%."],["s","MV lines 2,702 kms and distribution substations 355 MVA (Riau Islands excl. Batam)."],["w","Network additions are very small, ±25 kms per year."],["w","The distribution network is not built for large industrial loads."]],"k":[["99.99%","electrification ratio"],["355 MVA","distribution substations"]],"r":"Large loads need a high-voltage connection or dedicated substation; don't rely on the 20 kV network."},{"c":"U","conf":"V","loc":"kar","q":"Why does Karimun have three separate electricity licence areas?","a":"Under licence-area regulations and local-government recommendations, Karimun is split into three: Zone 1 (PT Soma Daya Utama), Zone 2 (PT Karimun Power Plant, licensed 2015, ±7,326 ha ≈75% of the island), and Zone 3 (PLN). The aim was to attract FTZ industrial-estate investment. The consequence is fragmentation: three small operators, no economies of scale, and PLN cannot serve another party's licence area. This is one of the root causes of Karimun's reliability problems.","f":["KPP: Zone II licence-area permit 2015, 7,326 ha","SDU planned a 2×25 MW coal plant (2019)","PLN cannot enter another party's industrial licence area (detik 2019)"],"src":"detik Finance 2019; Kontan 2015","isl":"K","v":["n","Fragmentation: three small operators with no reserve pooling, making supply costly and fragile."],"p":[["w","Zone 1 SDU, Zone 2 KPP (±75% of the island), Zone 3 PLN."],["w","PLN cannot serve private licence areas."],["g","Private zones can offer more flexible B2B supply."],["s","Your site location determines your supplier."]],"k":[["3","licence-area zones"],["75%","Zone 2 (KPP) land share"]],"r":"Engage the zone holder early; this could become a direct PPA opportunity."},{"c":"U","conf":"E","loc":null,"q":"In one minute, how do you assess the power situation on Bintan and Karimun?","a":"Bintan has enough power at system level (Batam–Bintan ±930 MW supply vs ±780 MW peak) but is topologically fragile. About two-thirds of Bintan's load comes through a single 150 kV corridor from Batam, and local generation is only 30–35 MW. The 12 Oct 2026 blackout proved it: a fault at one substation in Batam blacked out Bintan for 15–16 hours. Karimun is the opposite: no topology problem, but a shortage of firm capacity. Its ±4.5 MW reserve is smaller than the largest 7 MW unit, so a single trip triggers an outage, until the 150 kV cable from Sumatra (RUPTL: TBK substation 2026, realistically 2027–28) arrives. Industrial and data-center growth adds load on top of systems that are already thin.","f":["Bintan: est. load ±105 MW (last official 65.1 MW, 2016); local ±30–35 MW","Karimun: ±40 MW TBK system; reserve ±4.5 MW (Nov 2026)","12 Oct 2026 blackout: 15–16 hrs, >411k customers"],"src":"PLN Batam; ESDM Kepri Oct 2026; Tribun Batam Nov 2026","isl":"U","v":["m","Bintan: enough power at system level but fragile (one cable). Karimun: short and fragile until the Sumatra cable arrives."],"p":[["g","Batam–Bintan has a ±19% reserve and more gas plants coming."],["w","Bintan depends on one corridor; 15–16 hr blackout on 12 Oct 2026."],["w","Karimun: 4.5 MW reserve, smaller than one 7 MW coal unit."],["w","New data-center load will strain both."]],"k":[["±19%","Batam–Bintan reserve"],["4.5 MW","Karimun reserve"]],"r":"For critical loads such as data centers, plan dedicated supply + redundancy; don't rely on the grid alone."},{"c":"K","conf":"V","loc":"kar","q":"What are Karimun's installed capacity, dependable capacity and peak load today?","a":"Latest public data (17 Nov 2026): dependable capacity 40.6 MW vs peak load 36.1 MW, reserve 4.5 MW (≈12%). Throughout 2026 the numbers swung with the coal plant's status: May 2026 32 MW vs 34.5 MW (deficit), Oct 2026 42.6 MW vs ±33 MW, early Nov 2026 36.7 MW while the coal plant was under maintenance. Installed capacity exceeds dependable capacity because old diesel engines are derated.","f":["17 Nov 2026: 40.6 / 36.1 MW","May 2026: 32 / 34.5 MW","2019: 35 / 28.2 MW — load growing ±3.6%/yr"],"src":"Tribun Batam 17 Nov 2026; Kepri Headline May 2026; detik 2019","isl":"K","v":["n","Dependable capacity 40.6 MW vs load 36.1 MW: a reserve of only 4.5 MW (±12%)."],"p":[["w","Reserve is smaller than one coal unit (7 MW)."],["w","May 2026 saw a deficit (32 vs 34.5 MW)."],["s","Mix: coal 10.2 + old diesel ±17.4 + new diesel 6 + rented 7 MW."],["g","Extra diesel units and rented gensets restored dependable capacity by Nov 2026."]],"k":[["40.6 MW","dependable capacity"],["36.1 MW","peak load"],["4.5 MW","reserve"]],"r":"No headroom for new loads above 2–3 MW without additional generation."},{"c":"K","conf":"V","loc":"kar","q":"Does Karimun meet PLN's own reserve criteria?","a":"No. RUPTL 2025–2034 (II.2.2) requires isolated systems to be planned deterministically to a maximum N-2 criterion: reserve must exceed the first and second largest units, with a minimum 35% reserve margin. For a 36.1 MW load and a largest unit of 7 MW, N-2 requires dependable capacity ≥ 36.1 + 7 + 7 = 50.1 MW, and a 35% RM requires ≥ 48.7 MW. At 40.6 MW, the shortfall is ±8–10 MW. Even N-1 (≥ 43.1 MW) is not met.","f":["RUPTL II.2.2: \"maximum N-2 criterion … reserve margin … minimum 35%\"","Actual reserve 4.5 MW < largest unit 7 MW","N-1 gap: 2.5 MW; 35% RM gap: 8.1 MW; N-2 gap: 9.5 MW"],"src":"RUPTL 2025–2034 Ch. II.2.2; our calculation","isl":"K","v":["n","Not met. The RUPTL N-2 criterion requires ±50 MW; only 40.6 MW is available."],"p":[["w","Isolated-system criteria: N-2 and a minimum 35% reserve."],["w","Shortfall of ±9.5 MW."],["w","Even N-1 (43.1 MW) is not met."],["g","The Sumatra cable will end isolated status."]],"k":[["50.1 MW","N-2 requirement"],["9.5 MW","shortfall"]],"r":"Treat PLN supply on Karimun as unreliable for sensitive loads until ±2028."},{"c":"K","conf":"V","loc":"bin","q":"Which power plants are physically located on Bintan Island?","a":"Little is left for the PLN grid: the Air Raja and Suka Berenang diesel plants (UP3 Tanjungpinang), plus the 9 MW Kuala Lobam gas-engine plant running on CNG shipped from Panaran (Batam). ESDM Kepri (Oct 2026) puts local capacity at ±30–35 MW and has proposed new generation on Bintan. Outside PLN there is the Galang Batang captive coal plant (±180–200 MW, dedicated to the alumina SEZ) and the Lagoi/Lobam estate utilities. So large capacity exists on the island, but it is not available to the public grid and cannot support islanding when Batam has a fault.","f":["Kuala Lobam gas-engine plant 9 MW, CNG from Panaran","Jan 2023: reserve of only 12 MW, from the Air Raja diesel plant"],"src":"RUPTL/ESDM briefing 2018; IQPlus Oct 2026; Jawapos 2023","isl":"B","v":["n","Only ±30–35 MW of PLN generation on Bintan; the rest is imported from Batam."],"p":[["w","Air Raja/Suka Berenang diesel + 9 MW Kuala Lobam gas engine."],["w","Not enough to stand alone (islanding) when Batam has a fault."],["s","The ±200 MW Galang Batang coal plant is captive, not for the grid."],["g","A 100 MW gas-engine plant (2027) could change this if built on Bintan."]],"k":[["30–35 MW","local PLN generation"],["200 MW","Galang Batang captive"]],"r":"Ask where the 100 MW gas-engine plant will be sited: it decides Bintan's reliability."},{"c":"K","conf":"E","loc":"bin","q":"What is Bintan's peak load, and how much of it depends on Batam?","a":"The last public official figure: Bintan peak load of 65.1 MW (2016), when the interconnection delivered 20, then ±34 MW. RUPTL 2025–2034 does not break out Bintan's load. From first principles: 65.1 MW × 5%/yr growth over 10 years ≈ 106 MW, consistent with public estimates of ±100–110 MW. Remaining local generation is small (Air Raja/Suka Berenang diesel, the 9 MW Kuala Lobam gas engine on CNG from Panaran; ESDM Kepri cites ±30–35 MW), so two-thirds or more of Bintan's load comes from Batam.","f":["Setkab 2016: Bintan load 65.1 MW","Extrapolation at 5%/yr → ±106 MW (2026)"],"src":"Setkab 2016; ESDM Kepri Oct 2026; our estimate","isl":"B","v":["n","Load ±105 MW (estimate), over two-thirds supplied from Batam through a single corridor."],"p":[["s","Last official figure: 65.1 MW (2016)."],["w","±70 MW depends on the subsea cable."],["w","A cable cut means an instant deficit."],["s","RUPTL does not split load by island."]],"k":[["±105 MW","Bintan load (est.)"],["2/3","share imported from Batam"]],"r":"Request substation-level load data from PLN before sizing your connection."},{"c":"K","conf":"V","loc":"batam","q":"What does the power balance of the Batam–Bintan interconnected system look like?","a":"Three data points. Dec 2025 (Christmas/New Year standby, Ombudsman): dependable capacity 844.2 MW, reserve 79.2 MW, forecast peak 755 MW. Oct 2026 (PLN Batam): supply capacity ±930 MW vs peak ±780 MW, reserve ±19%, load growth >15%/yr. UI study (Purba & Garniwa, IJECBE 2025): 871 MW capacity vs 675 MW peak load. PLN Batam target: 1,200–1,300 MW of supply capacity by end-2027. The nominal reserve is almost 20%, but the Oct 2026 blackout showed that MW reserve is not the same as system security; protection and topology matter too.","f":["Dec 2025: 844.2 MW / reserve 79.2 MW","Oct 2026: 930 / 780 MW","UI 2025: 871 / 675 MW"],"src":"Ombudsman Kepri Dec 2025; InfoPublik Oct 2026; IJECBE 2025","isl":"B","v":["m","Adequate on paper (930 vs 780 MW, ±19% reserve), but data centers will erode it fast."],"p":[["g","Reserve of ±150 MW."],["w","Load growing more than 15% per year."],["w","DayOne alone is 511 MVA (±450 MW), phased 2026–2027."],["g","Supply target of 1,200–1,300 MW by end-2027."]],"k":[["930 MW","supply capacity"],["780 MW","peak load"],["511 MVA","DayOne contract"]],"r":"Much of the spare capacity is already booked by Batam data centers; a new DC on Bintan needs additional generation."},{"c":"K","conf":"V","loc":"batam","q":"What is the generation mix that supplies Bintan via Batam?","a":"Gas-dominated: Panaran CCGT (±164 MW, Mitra Energi Batam), Tanjung Uncang CCGT (Medco, 109 MW total after a 39 MW add-on, COD 8 Nov 2025), Batamindo gas turbine (±114 MW), Baloi gas-engine plant, Maxpower gas-engine plants at Sagulung 60 MW + Sekupang 40 MW (COD 6 Mar 2026), plus the Tanjung Kasam coal plant (±130 MW, TJK Power), which is also the starting point of the corridor to Bintan. Renewables are close to zero: Batam's supply is practically 100% fossil.","f":["Mongabay 2024: Batam supply is entirely fossil","Tanjung Kasam = Batam end of the cable corridor to Bintan"],"src":"OSM/power map; Medco; Petromindo; Mongabay Dec 2024","isl":"B","v":["n","Almost 100% fossil (gas and the Tanjung Kasam coal plant): not green power."],"p":[["s","Panaran and Tanjung Uncang CCGTs, Batamindo gas turbine, MaxPower gas engines."],["w","Tanjung Kasam coal plant, ±130 MW."],["w","Hard to meet hyperscaler RE100 targets."],["g","ISBB (2031) will bring renewable power from Sumatra."]],"k":[["~100%","fossil share"],["2031","RE via ISBB"]],"r":"Prepare your own green solution (solar PV + BESS, RECs) if the client has an RE100 target."},{"c":"K","conf":"V","loc":null,"q":"How does PLN define reserve margin, and what level is considered optimal?","a":"RUPTL defines RM as generation reserve relative to peak load (capacity/load − 1). Large systems use a probabilistic method (LOLP). PLN studies put the optimal RM at about 33–38% for Java–Bali, against international benchmarks of 15–40%. Isolated systems use deterministic N-2 with a minimum 35% RM. Intermittent renewables are not counted toward reserve unless they provide firm capacity (capacity credit).","f":["RUPTL Ch. II: optimal RM ±33–38%","International benchmark 15–40%","Intermittent RE not counted toward reserve without capacity credit"],"src":"RUPTL 2025–2034 Ch. II.2","isl":"U","v":["m","Reserve margin = (capacity − load) ÷ load; PLN considers ±35% optimal."],"p":[["s","Large systems are assessed with LOLP; isolated systems with N-2."],["s","International benchmark of 15–40%."],["w","Solar PV is not counted as reserve."],["w","Batam–Bintan (±19%) and Karimun (±12%) are below optimal."]],"k":[["35%","optimal RM"],["19%","Batam–Bintan"]],"r":"In due diligence, compute the reserve margin after your load is added."},{"c":"K","conf":"E","loc":"kar","q":"How much firm capacity does Karimun need through 2030?","a":"It depends on the Sumatra cable. Without the cable: load of ±44 MW (2030) × RUPTL isolated-system criteria (RM ≥35% / N-2) ≈ ±59–60 MW of dependable capacity, i.e. an extra ±18–20 MW of firm capacity. If the 150 kV cable (2×30 MVA TBK substation) arrives in 2027–28, Karimun is no longer isolated, and the local requirement becomes N-1 backup for that single cable: local generation covering priority load (±25–30 MW), which largely exists already. The implication: until the cable arrives, Karimun needs a 2–3 year bridge (rental + BESS). After that, local assets become reserve.","f":["The TBK cable is also a single line → N-1 is met only with local backup"],"src":"RUPTL II.2.2 & A4; our estimate","isl":"K","v":["n","Needs ±18–20 MW of additional firm capacity if the Sumatra cable is delayed."],"p":[["w","2030 load ±44 MW, requiring ±59–60 MW of dependable capacity."],["g","If the cable arrives in 2027–28, local generation is enough as reserve."],["w","Only ±13 MW of additions are confirmed."],["s","A 2–3 year bridge: rental + BESS."]],"k":[["±60 MW","2030 requirement"],["±13 MW","confirmed additions"]],"r":"A real opportunity for BESS providers and medium-term rental generation on Karimun."},{"c":"K","conf":"V","loc":"kar","q":"What happened to Karimun's power supply during 2026?","a":"2026 timeline: 26 Mar–13 Apr, coal unit 1 maintenance (18 days) with rolling blackouts. 2–4 May, coal unit 2 outage, 32 vs 34.5 MW. 20 Jul, unit 2 failed (travelling grate), back on 24 Jul (dependable capacity 32 MW), outages during peak hours 17:30–22:00. Jun–Aug, 6 MW of diesel added at Bukit Carok and a 7 MW genset contract (PEB × PLN Nusa Daya, 15 Jun). Oct, total blackout due to under-frequency. Nov, dependable capacity back at 40.6 MW.","f":["The same pattern occurred in 2022 (±25 days of outages) and Feb 2025 (2–3 MW deficit)"],"src":"Warta Kepri; Kepri Headline; Ulasan; Tribun Batam 2026","isl":"K","v":["n","A year of disruption: four major outage events during 2026."],"p":[["w","Mar–Apr: coal unit 1 under maintenance for 18 days."],["w","May and Jul: unit 2 outages, rolling blackouts."],["w","Oct: blackout due to frequency collapse."],["g","Nov: dependable capacity restored to 40.6 MW."]],"k":[["4","events in 2026"],["18 days","coal plant maintenance"]],"r":"High operational risk; a DC or precision industry on Karimun must have full backup."},{"c":"K","conf":"V","loc":"kar","q":"Why is a 2×7 MW coal plant a problem for a 36 MW system?","a":"From first principles: the largest unit, 7 MW, is ±19% of peak load. When one unit trips, the system loses almost a fifth of its power at once. A small system has low inertia, so frequency falls fast, under-frequency relays operate, and the result can be a total blackout (as in Oct 2026). Small coal plants burning low-rank coal also have low availability (travelling-grate and boiler problems) and ramp slowly. For a 36 MW system, the ideal unit size is ±3–5 MW modular (gas engine/diesel) plus grid-forming BESS for frequency response.","f":["UFR blackout Oct 2026","Unit 2 repeated outages in 2022, 2025, May & Jul 2026"],"src":"Our analysis; 2026 outage reports","isl":"U","v":["n","One unit ≈20% of load; a single trip blacks out part of the island immediately."],"p":[["w","Small-system inertia is low; frequency falls fast."],["w","Small coal plants have low availability."],["g","Quick fix: grid-forming BESS."],["s","Ideal unit size for a 36 MW system is 3–5 MW modular."]],"k":[["7 MW","largest unit"],["±19%","load share per unit"]],"r":"A 5–10 MW BESS delivers the biggest reliability gain per rupiah."},{"c":"K","conf":"E","loc":"bin","q":"What would \"secure\" supply to Bintan look like under the N-1 criterion?","a":"N-1 means Bintan survives the loss of its single largest element, i.e. the cable corridor or one circuit. There are two routes. (a) A second, full-capacity path. In this RUPTL it appears only in the long term via the 500 kV extension (2032, conditional). (b) Enough local firm generation to carry the load when the corridor is cut. The 100 MW gas-engine plant (2027) under the PLN Batam licence-area scheme, if built on Bintan Island, would practically meet that need for a ±100–110 MW load. So the key question is: where will that 100 MW plant be located? On Bintan, it solves Bintan's N-1. On Batam, it only adds system capacity.","f":["RUPTL II.3.1: transmission planned to static & dynamic N-1","Location of the licence-area gas-engine plant not yet published"],"src":"RUPTL II.3.1, p. A-52; our analysis","isl":"B","v":["m","Needs a second path or ±60–80 MW of firm generation on Bintan Island."],"p":[["w","Currently does not meet N-1."],["g","The 100 MW gas-engine plant (2027) could solve this if built on Bintan."],["w","A second 500 kV path only in 2032, and conditional."],["s","Plant location not yet published."]],"k":[["100 MW","gas-engine plant 2027"],["2032","second path"]],"r":"Make the location of the 100 MW gas-engine plant the main topic in talks with PLN/PLN Batam."},{"c":"K","conf":"V","loc":"batam","q":"What new capacity will enter the Batam–Bintan system in 2025–2030?","a":"Batam side: Medco Tanjung Uncang add-on +39 MW (COD Nov 2025). MaxPower lease amendment 50→150 MW (Sagulung 60 MW with free governor and black start, Sekupang 40 MW). Batam #1 CCGT 120 MW (EPC by a PP-led consortium, IDR 3.35 trillion, Oct 2025). PJBTL for Batam 3 & 4 CCGT, 2×150 MW (16 Jul 2026). Planned BESS. For Bintan (PLN Batam licence area): gas-engine plant 100 MW (2027) + 50 MW (2031), solar PV 25 MW (2028) + 25 MW (2030). Network: Tanjung Sauh substation (9 Nov 2026). After 2030: ISBB 1,200 MW from Sumatra (2031).","f":["MaxPower 50→150 MW","Batam #1 120 MW; Batam 3&4 300 MW"],"src":"Bisnis Oct 2025; RRI Jul 2026; RUPTL p. A-52; Listrik Indonesia Nov 2026","isl":"B","v":["p","A ±600 MW gas pipeline in Batam, 150 MW of gas engines and 50 MW of solar PV for Bintan, then ISBB 1,200 MW."],"p":[["g","Batam #1 CCGT 120 MW (2028)."],["g","Batam 3&4 CCGT 2×150 MW (PJBTL Jul 2026)."],["g","MaxPower lease up to 150 MW."],["w","Mostly fossil and dependent on gas supply."]],"k":[["±600 MW","Batam gas"],["1,200 MW","ISBB 2031"]],"r":"New capacity is coming, but Batam DCs are competing for most of it; secure contracts early."},{"c":"K","conf":"E","loc":"batam","q":"Will the Batam–Bintan reserve margin hold through 2030?","a":"Tight. With load growing 12%/yr (conservative versus >15% actual), the 2030 peak is ±1,230 MW. If every gas project is on time, supply is ±1,550 MW (RM ±26%). But a single delay (e.g. Batam 3&4) cuts RM to ±2–14%. Data centers can add hundreds of MW within 2–3 years (DayOne alone is 450 MW), faster than the gas-plant build cycle (3–4 years).","f":["DayOne PJBTL 511 MVA (17 Apr 2026)","Batam data-center pipeline 1.47 GW"],"src":"Our estimate; ESDM Oct 2026; PLN Batam","isl":"B","v":["n","Tight: safe only if every gas project finishes on time."],"p":[["g","If all are on time, reserve margin is ±26% in 2030."],["w","One delayed project (Batam 3 or 4) cuts reserve to ≈2–14%."],["w","DC load rises faster than plants get built."],["s","Load growth above 15% per year."]],"k":[["26%","base case 2030"],["2–14%","if delayed"]],"r":"Build a 1–2 year delay scenario into the investment decision."},{"c":"K","conf":"V","loc":"bin","q":"What does RUPTL 2025–2034 show about the Riau Islands power balance?","a":"RUPTL presents only \"Riau Islands excluding Batam\". Existing (Table A4.3): 293 units, 144.0 MW installed, 109.8 MW dependable. Breakdown: PLN diesel 284 units, 122.8/92.5 MW; PLN coal 2 units (TBK) 14/10.2 MW; PLN solar PV 0.8/0.7 MW; IPP biomass 0.9/0.9 MW; rented diesel 5.5/5.5 MW. Peak load (A4.8) rises from 189 MW in 2025 to 241 MW in 2030, then jumps to 980 MW in 2031. Because local dependable capacity (109.8 MW) is far below 189 MW, the gap is covered by imports from Batam (for Bintan). There is no Bintan vs Karimun split.","f":["Dependable 109.8 MW vs peak 189 MW → ±79 MW imported (implied)","Jump from 241 → 980 MW in 2031"],"src":"RUPTL Tables A4.3, A4.8","isl":"U","v":["n","Riau Islands excl. Batam: local dependable capacity 109.8 MW vs peak load 189 MW."],"p":[["w","284 of 293 units are diesel plants."],["w","The ±79 MW gap is covered by imports from Batam (for Bintan)."],["g","The jump to 980 MW in 2031 signals major plans."],["s","No per-island figures."]],"k":[["109.8 MW","local dependable capacity"],["189 MW","2025 peak"]],"r":"Use provincial figures only as context, not as a design basis."},{"c":"K","conf":"E","loc":"kar","q":"What does it cost to keep Karimun running on diesel?","a":"Diesel plants consume ±0.25–0.28 litres/kWh. At industrial diesel prices, fuel alone can cost IDR 3,000–4,000/kWh, far above the I-3 tariff of IDR 1,114.74/kWh (≈6.6 US¢). The difference is covered by government compensation to PLN. That is why RUPTL chose a Sumatra interconnection for Karimun (pattern-3 de-dieselisation): the cable is paid for by fuel savings. Every year of cable delay means Karimun's diesel stays and compensation costs rise. Official regional cost-of-supply figures are set by ESDM Ministerial Decree.","f":["Estimate; diesel specific consumption ±0.25–0.28 L/kWh","RUPTL II.2.5: pattern-3 de-dieselisation = interconnection"],"src":"Our estimate; RUPTL II.2.5","isl":"K","v":["n","Diesel at ±IDR 3,000–4,000/kWh, about 3× the tariff; PLN loses money on every kWh."],"p":[["w","PLN has weak incentives to build on Karimun."],["g","The Sumatra cable pays for itself through fuel savings."],["g","Opportunity for solar PV + BESS to replace diesel."],["s","Official cost-of-supply figures are set by ESDM Ministerial Decree."]],"k":[["IDR 3–4k","fuel cost per kWh"],["3×","vs tariff"]],"r":"Pitch solutions that cut PLN's fuel bill (de-dieselisation) as the business proposition."},{"c":"K","conf":"V","loc":"inc1","q":"What happened on Bintan during the October 2026 blackout?","a":"The fault began at 06:37 WIB on 12 Oct 2026 in the Batam system (initial indication: a wild animal, reportedly a bat, entering Sungai Harapan substation) and spread to Bintan and Tanjungpinang. The outage lasted 15–16 hours and hit more than 411k customers, including the water utility (PDAM), Hang Nadim Airport and data centers. Reports cite 578.2 MW of load affected. Bintan was restored in stages after Batam (PLN said Batam was 100% restored, \"Bintan to follow\"). Bintan could not hold because it has almost no local generation for islanding. ESDM had not issued a final conclusion as of 23 Oct 2026.","f":["06:37 WIB; Sungai Harapan substation; >411k customers","Compensation on Nov 2026 bills"],"src":"Bloomberg Technoz; Listrik Indonesia 23 Oct 2026; Jakarta Post; RCTI+","isl":"B","v":["n","A single fault at a Batam substation blacked out Bintan for 15–16 hours."],"p":[["w","More than 411k customers, the water utility, the airport and data centers affected."],["w","Bintan cannot stand alone (islanding)."],["s","Initial indication: an animal entered Sungai Harapan substation."],["g","Tanjung Sauh substation and BESS are being added."]],"k":[["15–16 hrs","outage duration"],["411k","customers affected"]],"r":"For DCs: provide full genset/UPS cover for 24–48 hours and design for two supply sources."},{"c":"K","conf":"E","loc":"kar","q":"Are Karimun's rolling blackouts a generation problem or a network problem?","a":"Almost entirely generation. Karimun has no transmission, and the major outages of 2022–2026 were always triggered by a coal unit trip/maintenance or derated diesel plants, leaving dependable capacity below load. Network issues (long 20 kV feeders, lightning, trees) cause local outages but not system-wide blackouts. The investment priority is therefore clear: firm capacity + BESS first, then distribution upgrades.","f":["Oct 2026 UFR blackout = frequency/generation problem"],"src":"Analysis of public outage logs 2022–2026","isl":"K","v":["n","A generation problem: a shortage of firm capacity, not cables."],"p":[["w","All major outages were triggered by coal/diesel plants."],["s","Network faults are only local."],["g","The fix is clear: firm capacity + BESS."],["s","Distribution upgrades can follow."]],"k":[["100%","major outages from generation"],["5–10 MW","BESS required"]],"r":"Prioritise firm capacity before network investment."},{"c":"D","conf":"E","loc":"bin","q":"What is the outlook for Bintan's electricity demand through 2030?","a":"RUPTL does not break out Bintan. The official figure is for the Riau Islands excl. Batam: 189 MW (2025) to 241 MW (2030), or ±5%/yr, then 980 MW in 2031 due to a large HV customer. For Bintan alone we use ±5–6%/yr organic growth: ±105 MW (2026) rising to ±128–135 MW (2030). That is the baseline. The upside is step-load: BAI/Bintan Data Center 1,500 MVA (low confidence, from 2032), the SOS MoU for ±500 MW at Galang Batang, the Bintan Resort Cakrawala HV customer (150 kV line, 2030), and DCI >1 GW. A single anchor load could multiply Bintan's demand.","f":["RUPTL A4.8: 189 → 241 → 980 MW","BAI/Bintan DC 1,500 MVA, low confidence, 2032"],"src":"RUPTL Table A4.8, Appendix E; our estimate","isl":"B","v":["m","Organic ±130 MW by 2030; a single anchor load could multiply it."],"p":[["s","Growing ±5.3% per year from ±105 MW."],["g","Large DC and SEZ pipeline."],["w","The grid is not ready to absorb a surge."],["s","High scenario ±300 MW."]],"k":[["±130 MW","2030 base"],["±300 MW","high scenario"]],"r":"The market is growing, but first movers will need to co-fund infrastructure."},{"c":"D","conf":"E","loc":"kar","q":"What is the outlook for Karimun's electricity demand through 2030?","a":"Organic ±4–6%/yr (historical 2019→2026: 28.2→36.1 MW ≈3.6%/yr, held back by supply constraints). Base case: ±44 MW (2030); high case ±48 MW. Hidden demand is significant: customers defer capacity upgrades and industry runs its own gensets because PLN is unreliable. Once reliability is restored, this suppressed demand will surface.","f":["2017: 25.4 MW; 2019: 28.2 MW; 2026: 36.1 MW"],"src":"detik 2017/2019; Tribun Nov 2026; estimate","isl":"K","v":["m","Base ±44 MW by 2030; current demand is held back by supply."],"p":[["s","Historical growth of ±3.6% per year."],["g","Suppressed demand will surface once reliability recovers."],["s","High scenario ±55 MW."],["w","Capacity is not yet sufficient."]],"k":[["±44 MW","2030 base"],["±55 MW","high scenario"]],"r":"Measure latent demand from industries now running on gensets."},{"c":"D","conf":"V","loc":"gb","q":"What are the main industrial anchor loads on Bintan?","a":"(1) Galang Batang SEZ: PT Bintan Alumina Indonesia (Nanshan), an alumina refinery with a captive coal plant. A PLN–BAI MoU (Sep 2022) covers supply to 2050; BAI cites an estate requirement of 2,850 MW for a planned aluminium smelter, and 2026 reports describe phases of 300→500→1,300 MW. On 15 Sep 2026, SOS signed a non-binding agreement for a ±500 MW AI data-center campus in Galang Batang SEZ. (2) Lobam (Bintan Inti Industrial Estate) and Lagoi (Bintan Resorts): PLN supplies 160 MVA (2017). (3) Tanjung Sauh SEZ (between Batam and Bintan), with its own 300 MW phase-1 coal plant.","f":["BAI: 2,850 MW requirement (2022 MoU)","SOS DC ±500 MW (15 Sep 2026, non-binding)","160 MVA to Lagoi/Lobam (detik 2017)"],"src":"VOI/Alcircle 2022; Petromindo Jan 2026; Bisnis 2026; detik 2017","isl":"B","v":["p","Galang Batang is the magnet: alumina, a planned smelter, and a ±500 MW AI DC."],"p":[["g","BAI alumina refinery + captive coal plant (±IDR 1.93 trillion)."],["g","SOS AI DC campus MoU, ±500 MW (Sep 2026)."],["s","Lagoi/Lobam supplied by PLN at 160 MVA."],["w","All of them need dedicated supply."]],"k":[["±500 MW","SOS AI DC"],["2,850 MW","BAI estate requirement"]],"r":"Consider co-locating with an anchor to share power-infrastructure costs."},{"c":"D","conf":"V","loc":"batam","q":"How big is the data-center wave, and does it reach Bintan and Karimun?","a":"Batam is already a hub: ±1.47 GW of data-center capacity available, committed or in development. Major PJBTLs: DayOne Kabil 511 MVA (±450 MW, 17 Apr 2026), Altiva Nongsa 690 MVA, Equator Gate Nongsa. On 19 Oct 2026, ESDM Minister Bahlil named Batam–Karimun–Bintan a new data-center hub and put national DC power demand at ±20 GW, with ±100 GWp of solar PV planned. The provincial government is preparing a 3,000 ha AI zone on Bintan, and the Bintan Digital SEZ is reportedly sold out. For Karimun, geopolitics (proximity to the Malacca Strait) and water are also in focus.","f":["20 GW national DC demand (Bahlil, 19 Oct 2026)","AI DC 100 MW–1 GW per facility vs cloud 10–30 MW","IDPRO: 5 requirements, including reliable power & water"],"src":"ESDM 19 Oct 2026; Katadata; Bisnis 21–22 Oct 2026; Jakarta Post Apr 2026","isl":"U","v":["p","The DC wave is real in Batam (±1.47 GW) and is now being pushed to Bintan/Karimun."],"p":[["g","ESDM Minister designated BBK a new DC hub (19 Oct 2026)."],["g","National DC power demand ±20 GW."],["w","Reliable power and water are the key requirements."],["w","The Oct 2026 blackout is a risk signal."]],"k":[["1.47 GW","Batam DC pipeline"],["20 GW","national demand"]],"r":"Good timing to enter, but settle your power-supply strategy first."},{"c":"D","conf":"E","loc":"gb","q":"Can Bintan's grid serve a 100–500 MW data center?","a":"Not with today's grid. Total substation transformer capacity on Bintan is 310 MVA (RUPTL A4.4), organic load is ±105 MW, and supply comes through a single corridor whose transfer capacity is not published. Hyperscale data centers need dual supply (N-1 or 2N) and high power quality. The options: (a) dedicated generation in or near the estate (gas/captive coal, solar PV + BESS) under a licence-area scheme or a dedicated PJBTL, (b) ISBB 1,200 MW (2031) + a 500 kV extension to a Bintan/HV-customer 500 kV substation (2032, conditional) — loads ≥30 MVA (I-4) effectively wait for this, or (c) reinforcing the Batam–Bintan corridor with a second circuit. Realistically, 100+ MW of new load on Bintan needs 3–5 years.","f":["Bintan substations total 300 MVA","Data centers require at least N-1 redundancy"],"src":"Our analysis; RUPTL substation table","isl":"B","v":["n","Not yet. Today's grid is insufficient; new generation or a new path is needed."],"p":[["w","Bintan substation transformers total 310 MVA against ±105 MW of load."],["w","Supply via a single corridor."],["w","A 100 MW IT DC ≈ 140 MW (PUE 1.4), more than all of Bintan's load."],["g","Options: dedicated generation, or 500 kV/ISBB (2031–32)."]],"k":[["140 MW","100 MW IT DC"],["3–5 yrs","time to readiness"]],"r":"Plan in phases: start below 30 MVA while building your own supply."},{"c":"D","conf":"V","loc":"kar","q":"What drives industrial electricity demand on Karimun?","a":"Karimun is an FTZ (BBK). Its industrial drivers are shipyards and offshore fabrication (including the Saipem yard), oil storage terminals, granite quarrying/processing, and maritime logistics. Much industrial load sits in Zones 1–2 (SDU, KPP) or runs on its own gensets, so it does not show up in PLN Zone 3 load. The government also names Karimun as part of the BBK data-center hub (Oct 2026), and GW-scale solar PV + BESS is being explored on Belat Island.","f":["Zone 1 SDU, Zone 2 KPP","Belat Island: Gotion × Oriens up to 2 GW (MoU Jan 2026)"],"src":"detik 2019; Bisnis Oct 2026; Belat reports 2026","isl":"K","v":["m","Shipyards, oil & gas and granite; mostly supplied by private zones or gensets."],"p":[["g","FTZ status (BBK)."],["s","PLN load does not reflect real demand."],["w","PLN supply is not yet reliable."],["g","Belat Island and the Karimun DC hub add upside."]],"k":[["FTZ","zone status"],["Zones 1–2","private suppliers"]],"r":"Survey industrial genset use as a potential market."},{"c":"D","conf":"V","loc":null,"q":"What share of total electricity demand on Bintan and Karimun is industrial?","a":"Very small on PLN's books. RUPTL Table A4.6: industrial sales in the Riau Islands excl. Batam are only 47 GWh (2025), rising to 58 GWh (2030). For comparison, 189 MW of peak load at a ±0.6 load factor ≈ ±1,000 GWh in total, so industry is only ±5%. Then there is a jump to 4,442 GWh in 2031, in a table labelled \"excluding low-confidence HV customers\". That equals an average load of ±500 MW from one or more unnamed HV customers. Real heavy industry (alumina, shipyards, Lagoi/Lobam, Karimun zones) is mostly captive or in its own licence area.","f":["A4.6: 47 → 58 → 4,442 GWh","4,442 GWh / 8,760 h ≈ 507 MW average"],"src":"RUPTL Table A4.6; our calculation","isl":"U","v":["m","Small on PLN's books (±5%), but jumping to 4,442 GWh in 2031."],"p":[["s","47 GWh (2025) to 58 GWh (2030)."],["g","The 2031 jump signals new large (HV) customers."],["s","Most heavy industry is captive."],["w","HV customer location not disclosed."]],"k":[["47 GWh","2025"],["4,442 GWh","2031"]],"r":"PLN is preparing supply for large 2031 loads; position your project on that track."},{"c":"D","conf":"V","loc":"gb","q":"Will Bintan Alumina switch from its captive coal plant to PLN?","a":"The intent exists, but the scheme is not final, and RUPTL itself is inconsistent. Appendix E: BAI requirement of 1,529 MVA with a 900 MW hydro quota + 600 MW CCGT. Table A4.10: 100 MW BESS + 161 MW hydro. RUPTL lists BAI/Bintan Data Center 1,500 MVA as a low-confidence HV customer from 2032, with supply requiring a 500 kV extension from ISBB to a 500 kV substation at the BAI site. The PLN–BAI MoU (Sep 2022) covers supply to 2050. Realistically a hybrid: captive keeps running, PLN comes in after ISBB (≥2031–32).","f":["Appendix E: 1,529 MVA; hydro quota 900 + CCGT 600","A4.10: BESS 100 MW + hydro 161 MW"],"src":"RUPTL Appendix E, Table A4.10; VOI/Alcircle 2022","isl":"B","v":["m","Possibly, but only once 500 kV/ISBB is available (2031–32 at the earliest)."],"p":[["g","PLN–BAI MoU for supply to 2050."],["w","RUPTL supply schemes are inconsistent."],["s","A 250k-tonne smelter ≈ 3.5 TWh/yr ≈ 400 MW of base load."],["w","Today's grid cannot handle it."]],"k":[["400 MW","smelter load"],["2032","at the earliest"]],"r":"Heavy industry will still need captive supply over the medium term."},{"c":"D","conf":"V","loc":"tsauh","q":"What about Tanjung Sauh SEZ?","a":"Tanjung Sauh SEZ (Government Regulation 24/2024, National Strategic Project, Panbil Group) sits between Batam and Bintan, right on the cable corridor route. Its focus is electronics and logistics. The estate plans its own ±300 MW phase-1 coal plant. PLN Batam's 150 kV Tanjung Sauh substation was energised on 9 Nov 2026, and a BP Batam–Panbil–PLN Batam MoU (Jul 2026) supports supply. This means the Batam–Bintan corridor now also serves a new industrial estate midway.","f":["Tanjung Sauh substation energised 9 Nov 2026","Estate coal plant ±300 MW (construction 2026)"],"src":"PP 24/2024; Listrik Indonesia 19 Nov 2026; MoU Jul 2026","isl":"B","v":["m","A new estate right on the cable corridor: it adds load but could also become a source."],"p":[["g","National Strategic Project, focused on electronics and logistics."],["g","Tanjung Sauh substation in operation since Nov 2026."],["s","Estate coal plant ±300 MW."],["w","Social and environmental issues (Suku Laut, mangroves)."]],"k":[["300 MW","estate coal plant"],["Nov 2026","substation online"]],"r":"An alternative site with better power readiness than east Bintan."},{"c":"D","conf":"E","loc":null,"q":"How should demand for these islands be projected from first principles?","a":"Split it into three blocks. (1) Organic: customers × consumption per customer, driven by GRDP, population and tourism (elasticity ±1.0–1.3 to GRDP). (2) Spot loads: a list of estate projects with probabilities (MoU 10–20%, PJBTL 70–90%, under construction ≥90%) and ramp profiles (data centers typically draw 20–30% of contracted load in year one). (3) Suppressed demand: additions once reliability recovers (customer gensets moving to PLN). Then convert energy to MW with load factors (data centers ±0.8–0.9, residential ±0.6). Never simply add up MoUs.","f":["Data centers: initial actual load ±20–30% of contract","High DC load factor (0.8–0.9)"],"src":"Standard PLN/consultant planning methodology","isl":"U","v":["m","Projection = organic growth + probability-weighted new loads + suppressed demand."],"p":[["s","Weights: MoU 10–20%, PJBTL 70–90%, construction ≥90%."],["s","DC ramp: 20–30% of contract in year one."],["w","Never simply add up MoUs."],["g","High DC load factor (0.8–0.9)."]],"k":[["10–20%","MoU weight"],["0.8–0.9","DC load factor"]],"r":"Ask for probability-weighted projections, not a sum of announcements."},{"c":"D","conf":"V","loc":"lagoi","q":"How is the Lagoi/Bintan Resorts area supplied?","a":"The Lagoi tourism zone (Bintan Resorts) and Lobam industrial estate have their own utilities and since 2017 have also received 160 MVA from PLN via substations and the 150 kV network of the interconnection. This adds load on the northern side of the corridor (Tanjung Uban–Sri Bintan). RUPTL schedules a 10 kms double-circuit 150 kV line from Sri Bintan → Bintan Resort Cakrawala HV customer + a 2-bay extension at Sri Bintan substation (2030). Resorts are premium, reliability-sensitive loads (B-3 tariff).","f":["detik 2017: PLN supplies 160 MVA to Bintan industrial & tourism estates"],"src":"detik Finance 2017","isl":"B","v":["p","Lagoi has its own utility plus PLN supply; RUPTL adds a 150 kV line in 2030."],"p":[["g","PLN supply of 160 MVA since 2017."],["g","Double-circuit line to Bintan Resort HV customer (2030)."],["s","B-3 tariff class."],["w","Premium, reliability-sensitive load."]],"k":[["160 MVA","PLN supply"],["2030","new 150 kV line"]],"r":"Well-managed estates can be a fast track for small-to-mid-size projects."},{"c":"D","conf":"E","loc":null,"q":"What is the biggest uncertainty in the demand outlook?","a":"Timing and conversion of anchor loads. Announcements (MoUs, >1 GW proposals) far outnumber those reaching PJBTL. Conversion barriers: certainty of power and water supply, land, permits, international connectivity, and the green energy hyperscalers demand. Then there is the reverse risk: once one hyperscaler commits, load can rise by hundreds of MW within 2–3 years, faster than generation and transmission can be built. So the uncertainty cuts both ways.","f":["IDPRO: 5 requirements for a Karimun/Bintan DC hub"],"src":"Bisnis 22 Oct 2026; our analysis","isl":"U","v":["m","MoU-to-contract conversion; if it happens, load arrives faster than the grid is built."],"p":[["w","Many MoUs have not become PJBTLs."],["w","Requirements: power, water, land, permits."],["g","If realised, the economic value is large."],["s","The uncertainty cuts both ways."]],"k":[["MoU","status of most"],["2–3 yrs","DC load ramp"]],"r":"Use phased contracts that can be adjusted."},{"c":"D","conf":"V","loc":"gb","q":"What explains the jump from 241 MW to 980 MW in 2031?","a":"Peak load in the Riau Islands excl. Batam rises from 241 MW (2030) to 980 MW (2031), and industrial sales from 58 to 4,442 GWh, even though Table A4.6 is labelled \"excluding low-confidence HV customers\". That implies a large, unnamed HV customer (±500 MW average) with higher confidence entering in 2031. BAI/Bintan Data Center 1,500 MVA, by contrast, is listed as low confidence from 2032. The timing coincides with the ISBB COD in 2031, which is designed to serve up to ±3 GW in Batam–Bintan. The identity of this HV customer will shape Bintan's network needs after 2031.","f":["A4.6 & A4.8","ISBB COD 2031, 1,200 MW transfer capacity"],"src":"RUPTL Tables A4.6, A4.8, V.11.2","isl":"B","v":["m","An unnamed large customer (±500 MW) enters in 2031, alongside ISBB."],"p":[["s","Riau Islands excl. Batam load: 241 → 980 MW."],["s","Industrial sales: 58 → 4,442 GWh."],["g","Signals PLN is ready to supply large loads via ISBB."],["w","Identity and location not disclosed."]],"k":[["980 MW","2031 peak"],["±500 MW","new HV customer"]],"r":"Find out who this HV customer is: it could be a competitor or an infrastructure partner."},{"c":"D","conf":"V","loc":null,"q":"Do regulations allow PLN to build specifically for industrial demand?","a":"Yes. The Third Clause of the RUPTL 2025–2034 Ministerial Decree: for downstream-processing industrial customers, regional development priorities or National Strategic Projects (PSN), PLN may build additional generation and transmission after approval by the ESDM Minister, with the projects then added to a RUPTL revision. This opens the way for dedicated supply to SEZs/PSNs such as Galang Batang or Tanjung Sauh without waiting for a full RUPTL revision. Alternatively, estates can use their own licence area or captive supply.","f":["Third Clause, RUPTL 2025–2034 Ministerial Decree"],"src":"RUPTL 2025–2034, Third Clause","isl":"B","v":["p","Yes. The RUPTL Third Clause allows dedicated supply for downstream processing, regional priorities and PSNs."],"p":[["g","Requires ESDM Minister approval, then inclusion in a RUPTL revision."],["g","Opens the way for SEZs/PSNs."],["s","Alternative: own licence area or captive supply."],["w","Bureaucratic process."]],"k":[["Clause III","legal basis"],["PSN/SEZ","priority"]],"r":"SEZ/PSN status speeds up dedicated supply; consider siting within an SEZ."},{"c":"D","conf":"E","loc":null,"q":"Is there suppressed electricity demand on Karimun and Bintan?","a":"Yes, especially on Karimun. The indicators: repeated rolling blackouts, industry and SMEs running gensets, and deferred requests for capacity upgrades. When PLN cannot ser
