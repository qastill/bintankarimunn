$('#sfil').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){SF=b.dataset.f;applySF()}});
function home(){isl=null;$('#land').hidden=false;$('#view').hidden=true;$('#seg').hidden=true;document.getElementById('app').className='app';
 Object.keys(LDEF).forEach(k=>setLayer(k,['corr','tx','sys','plan'].includes(k)));map.flyToBounds([[0.55,103.05],[1.32,104.85]],{duration:.8,paddingTopLeft:[0,120]});setHash('');}
function open(i,t){isl=i;topic=t||'ring';$('#land').hidden=true;$('#view').hidden=false;$('#seg').hidden=false;
 document.getElementById('app').className='app isl-'+ISL[i].cls;
 $('#seg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.isl===i));
 $('#tabs').innerHTML=TABS.map(([id,icn,n])=>`<button class="tab" role="tab" type="button" data-t="${id}" aria-selected="${id===topic}">${ic(icn)}${n}</button>`).join('');
 drawLegend();show(topic);}
function fitIsl(){const I=ISL[isl],T=I.T[topic];const b=T.wide?I.wide:I.bounds;const pad=[20,20];const pw=window.innerWidth>900?($('#panel').offsetWidth||0):0;map.flyToBounds(b,{duration:.8,paddingTopLeft:[20,90],paddingBottomRight:[pw+20,20]})}
$('#zf').onclick=()=>isl?fitIsl():home();
function show(t){topic=t;const I=ISL[isl],T=I.T[t];
 $('#tabs').querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
 Object.keys(LDEF).forEach(k=>setLayer(k,T.lay.includes(k)));
 const tabName=TABS.find(x=>x[0]===t);
 $('#mtitle').innerHTML=`<span class="ic">${ic(tabName[1])}</span><span><b>${esc(I.name)} · ${esc(tabName[2])}</b><span>${esc(I.tag)}</span></span>`;
 $('#hint').innerHTML=ic('info')+' Garis penuh = eksisting · putus-putus = rencana · klik untuk detail';
 const b=$('#body');b.classList.toggle('insm',!!T.cards);
 if(T.cards){b.innerHTML=`<div class="hd"><span class="ico">${ic(tabName[1])}</span><div><small>${esc(I.name)} · Insight</small><h2>${esc(T.h)}</h2></div></div>
  <div class="igrid">${T.cards.map((c,i)=>`<button type="button" class="icd ${c[6]}" data-go="${c[5]}" style="animation-delay:${i*.06}s"><span class="go">${ic('arrow')}</span><span class="qq"><span class="n">${i+1}</span>${ic(c[0])}${esc(c[1])}</span><b data-c="${esc(c[2])}">${esc(c[2])}<small>${esc(c[3])}</small>${stb((BADGE[isl+'.ins']||'')[i])}</b><p>${esc(c[4])}</p></button>`).join('')}</div>
  <div class="inote">${ic('info')}<span>${esc(T.note)}</span></div><div class="src"><b>Sumber:</b> ${esc(T.src)}</div>`;
  countUp(b);fitIsl();setHash(isl+'-'+t);return}
 b.innerHTML=`<div class="hd"><span class="ico">${ic(tabName[1])}</span><div><small>${esc(I.name)} · ${esc(tabName[2])}</small><h2>${esc(T.h)}</h2></div></div>
  <div class="kp" style="--n:${T.k.length}">${T.k.map((k,i)=>`<button type="button" class="kpi ${k[5]||''}" data-x="${i}" aria-label="Penjelasan ${esc(k[1])}"><span class="qi-i">${ic('info')}</span><span class="t">${ic(k[0])}${esc(k[1])}</span><b data-c="${esc(k[2])}">${esc(k[2])}${k[3]?`<small>${esc(k[3])}</small>`:''}</b><span class="s">${stb((BADGE[isl+'.'+t]||'')[i])} ${esc(k[4])}</span></button>`).join('')}</div>
  <div class="viz"><h3>${esc(T.v.t)}<span>${esc(T.v.s)}</span></h3><div class="cv">${T.v.f()}</div>${T.v.leg?legendHtml(T.v.leg):'<div></div>'}</div>
  <div class="ins" style="--n:${T.i.length}">${T.i.map(x=>`<div class="in ${x[1]}">${ic(x[0])}<span>${esc(x[2])}</span></div>`).join('')}</div>
  <div class="src"><b>Sumber:</b> ${esc(T.src)}</div><div class="exp" id="exp" hidden></div>`;
 countUp(b);fitIsl();setHash(isl+(t!=='ring'?'-'+t:''));}
function explain(i){const T=ISL[isl].T[topic],k=T.k[i],E=(EXPL[isl+'.'+topic]||[])[i];if(!k||!E)return;const b=$('#body'),ex=$('#exp'),viz=b.querySelector('.viz');
 b.querySelectorAll('.kpi').forEach((x,j)=>x.classList.toggle('on',j===i));
 ex.style.top=viz.offsetTop+'px';ex.style.maxHeight=(b.clientHeight-viz.offsetTop-12)+'px';ex.hidden=false;
 ex.innerHTML=`<header><span class="ico">${ic(k[0])}</span><div><small>Apa artinya? ${stb((BADGE[isl+'.'+topic]||'')[i])}</small><h4>${esc(k[1])}</h4></div><button type="button" class="xx" aria-label="Tutup penjelasan">${ic('x')}</button></header>
  <div class="big ${k[5]||''}">${esc(k[2])}<small>${esc(k[3]||'')}</small><span>${esc(k[4])}</span></div><p>${esc(E[0])}</p>
  <footer>${E[1]&&REG[E[1]]?`<button type="button" class="go" data-loc="${E[1]}">${ic('arrow')} Lihat di peta</button>`:'<span></span>'}<span class="hint2">Klik kotak angka lain untuk penjelasannya</span></footer>`;}
function unexplain(){const ex=$('#exp');if(ex)ex.hidden=true;$('#body').querySelectorAll('.kpi.on').forEach(x=>x.classList.remove('on'))}
function focusLoc(id){const r=REG[id];if(!r)return;setLayer(r.k,true);map.flyTo(r.ll,['isbb','karint','ext500'].includes(id)?8.6:11,{duration:.7});setTimeout(()=>{if(r.pop)r.pop();else if(r.l.openPopup)r.l.openPopup();else r.l.eachLayer&&r.l.eachLayer(x=>x.getPopup&&x.getPopup()&&x.openPopup())},800)}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)show(b.dataset.t)});
$('#body').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){show(b.dataset.go);return}const k=e.target.closest('.kpi[data-x]');if(k){if(k.classList.contains('on'))unexplain();else explain(+k.dataset.x);return}if(e.target.closest('.xx')){unexplain();return}const g=e.target.closest('.exp [data-loc]');if(g)focusLoc(g.dataset.loc)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#exp')&&!$('#exp').hidden&&$('#qa').hidden)unexplain()});
$('#seg').addEventListener('click',e=>{const b=e.target.closest('[data-isl]');if(b&&b.dataset.isl!==isl)open(b.dataset.isl,topic)});
$('#home').onclick=home;
function countUp(root){root.querySelectorAll('[data-c]').forEach(el=>{const raw=el.dataset.c,m=raw.match(/^([±~]?)([\d.]+)(,\d+)?$/);if(!m||/^(19|20)\d\d$/.test(raw)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const small=el.querySelector('small');const target=parseFloat(m[2].replace(/\./g,'')+(m[3]?'.'+m[3].slice(1):''));const dec=m[3]?m[3].length-1:0;const t0=performance.now();
 const step=n=>{const p=Math.min(1,(n-t0)/700),e=1-Math.pow(1-p,3);el.firstChild.nodeValue=m[1]+fmt(target*e,dec);if(p<1)requestAnimationFrame(step)};el.firstChild.nodeValue=m[1]+fmt(0,dec);requestAnimationFrame(step)})}
function setHash(h){try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){}}

/* landing */
function silPath(k){return `<svg class="sil" viewBox="0 0 100 100" aria-hidden="true"><path d="${SIL[k]}"/></svg>`}
$('#land').innerHTML=`<div class="hero"><span class="k">${ic('bolt')} Studi pembangkitan & distribusi listrik · Kepulauan Riau</span><h1>Dua pulau, <em>dua tantangan</em> berbeda</h1><p>Bintan bergantung pada satu kabel dari Batam. Karimun berdiri sendiri dengan cadangan tipis. Pilih pulau untuk melihat kapasitas, demand, EBT, tarif, keandalan, dan interkoneksinya.</p></div>
 <div class="cards">${['karimun','bintan'].map(k=>{const I=ISL[k];return `<button class="icard ${I.cls}" type="button" data-open="${k}"><header>${silPath(k)}<div><h2>${I.name}</h2><span class="badge ${I.cls}">${ic(k==='bintan'?'cable':'island')}${esc(I.badge)}</span></div></header>
  <div class="stats">${I.land.stats.map(s=>`<div class="stat ${s[3]?'hot':''}"><b data-c="${esc(s[0])}">${esc(s[0])}${s[1]?`<small>${esc(s[1])}</small>`:''}</b><span>${esc(s[2])}</span></div>`).join('')}</div>
  <div class="key">${ic('alert')}<span>${esc(I.land.key)}</span></div><span class="cta">Lihat ${I.name} ${ic('arrow')}</span></button>`}).join('')}</div>
 <div class="strip"><span class="pill">${ic('bolt')} Batam–Bintan <b>930/780 MW</b></span><span class="pill">${ic('plant')} Kepri tanpa Batam <b>109,8 MW</b> DMN</span><span class="pill">${ic('cable')} ISBB <b>1.200 MW</b> · 2031</span><span class="pill">${ic('tag')} I-3 <b>Rp1.114,74</b>/kWh</span></div>`;
$('#land').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)open(b.dataset.open,'ins')});
countUp($('#land'));

/* ---------- Q&A ---------- */
const CAT={U:['Struktur & pemain','grid'],K:['Kapasitas & cadangan','plant'],D:['Demand & industri','trend'],P:['Proyek & RUPTL','cal'],E:['Energi terbarukan','sun'],T:['Tarif','tag'],R:['Keandalan T&D','shield'],I:['Interkoneksi','cable']};
let qc='all',qisl='all';
const qa=$('#qa'),qs=$('#qs'),ql=$('#qlist');
function qaCounts(){const f=QA.filter(q=>qisl==='all'||q.isl===qisl||(qisl!=='U'&&q.isl==='U'&&false));return f}
function drawCats(){const inI=q=>qisl==='all'||q.isl===qisl||(qisl!=='U'&&q.isl==='U');const base=QA.filter(inI);const c={};base.forEach(q=>c[q.c]=(c[q.c]||0)+1);
 $('#qcats').innerHTML=`<button class="qcat" type="button" data-c="all" aria-pressed="${qc==='all'}">${ic('grid')}Semua jenis<em>${base.length}</em></button>`+Object.keys(CAT).map(k=>`<button class="qcat" type="button" data-c="${k}" aria-pressed="${qc===k}">${ic(CAT[k][1])}${CAT[k][0]}<em>${c[k]||0}</em></button>`).join('')}
function drawFil(){const c={B:0,K:0,U:0};QA.forEach(q=>c[q.isl]++);
 $('#qfil').innerHTML=[['all','Semua wilayah',100,''],['B','Bintan',c.B+c.U,'isl'],['K','Karimun',c.K+c.U,'isl k'],['U','Umum saja',c.U,'']].map(([v,n,k,cl])=>`<button class="chip ${cl}" type="button" data-i="${v}" aria-pressed="${qisl===v}">${n}<em>${k}</em></button>`).join('')}
const hl=(t,re)=>re?esc(t).replace(re,m=>`<mark>${m}</mark>`):esc(t);
/* --- Q&A visual helpers --- */
const ABB=[['s.d.','s․d․'],['Kab.','Kab․'],['hlm.','hlm․'],['No.','No․'],['dkk.','dkk․'],['Tbk.','Tbk․'],['dll.','dll․']];
function splitSent(a){let t=a;ABB.forEach(([x,y])=>t=t.split(x).join(y));return t.split(/(?<=[.!?])\s+(?=[A-ZÀ-Ý(“"0-9±])/).map(s=>{ABB.forEach(([x,y])=>s=s.split(y).join(x));return s.trim()}).filter(Boolean)}
const NRE=/(Rp\s?[\d.,]+(?:[–-][\d.,]+)?(?:\/kWh)?|[±~≈]?\d[\d.,]*(?:\s?[–-]\s?\d[\d.,]*)?\s?(?:GWh|TWh|GW|MVA|MW|kms|km|%|jam|ribu|hari|kali))(?![\w])/g;
const clean=t=>t.filter(w=>!/[\d()+→×=:–\/]/.test(w)&&!/^(yang|dari|ke|di|untuk|sebesar|hanya|sekitar|menjadi|naik|lalu|atau|dengan|pada|dan|vs|saat|lebih|kurang|hampir|menyebut|MW|MVA|km|kms|GW|GWh|kV)$/i.test(w));
function stats(a){const out=[],seen=new Set();for(const s of splitSent(a)){let m;NRE.lastIndex=0;while((m=NRE.exec(s))&&out.length<3){const v=m[1].replace(/\s+/g,' ').trim();if(seen.has(v))continue;
 const before=s.slice(0,m.index).split(/[,;:(+=]|\bvs\b|→/).pop().trim().split(/\s+/);let lab=clean(before).slice(-3).join(' ');
 const after=s.slice(m.index+m[0].length);const par=after.match(/^\s*\(([^)]{2,24})\)/);if(par)lab=(lab?lab+' · ':'')+par[1];
 if(!lab){lab=clean(after.split(/[,;.:]/)[0].trim().split(/\s+/)).slice(0,3).join(' ')}
 if(!lab)continue;seen.add(v);out.push([v,lab])}if(out.length>=3)break}return out}

const CATC={U:C.navy,K:C.ocean,D:C.violet,P:'#2b5fa8',E:'#d48a00',T:C.leaf,R:C.coral,I:C.ocean2};
function bIcon(t){const x=t.toLowerCase();
 if(/padam|blackout|gagal|kurang|defisit|risiko|rentan|rawan|tidak cukup|terganggu|single point|tunggal|rugi|tertahan|terlambat|meleset|inkonsisten|bertentangan/.test(x))return['alert','w'];
 if(/pulih|beroperasi|berhasil|cukup|memenuhi|solusi|menyelesaikan|hemat|turun tajam|membaik/.test(x))return['check','g'];
 if(/rp|tarif|biaya|harga|kompensasi|usd|investasi|pendanaan/.test(x))return['money',''];
 if(/kabel|interkoneksi|sutt|transmisi|koridor|hvdc|kv\b|gi |gardu/.test(x))return['cable',''];
 if(/plts|surya|ebt|terbarukan|biomassa|hijau/.test(x))return['sun','s'];
 if(/data center|kek|industri|smelter|kawasan|pabrik/.test(x))return['factory',''];
 if(/pltu|pltd|pltmg|pltgu|pembangkit|mesin|genset/.test(x))return['plant',''];
 if(/\b20[23]\d\b|cod|jadwal|tahun/.test(x))return['cal',''];
 return['info','']}
function qBody(q,re){const ss=splitSent(q.a),st=stats(q.a);const lead=ss[0],rest=ss.slice(1);
 return `<div class="qa-a"><div class="lead2" style="--i:0">${ic('bulb')}<div><small>Intinya</small>${hl(lead,re)}</div></div>
 ${st.length?`<div class="kst">${st.map((k,j)=>`<div class="kc" style="--i:${j+1};--cc:${CATC[q.c]}">${(()=>{const mm=k[0].match(/^(Rp\s?)?(.+?)\s?(MW|MVA|kms|km|GWh|GW|%|jam|ribu|hari|kali|\/kWh)?$/)||[0,'',k[0],''];return `<b data-c="${esc(mm[2])}">${esc((mm[1]||'')+mm[2])}<small>${esc(mm[3]||'')}</small></b>`})()}<span>${hl(k[1],re)}</span></div>`).join('')}</div>`:''}
 ${rest.length?`<ul class="pts">${rest.map((x,j)=>{const b=bIcon(x);return `<li class="${b[1]}" style="--i:${j+2}">${ic(b[0])}<span>${hl(x,re)}</span></li>`}).join('')}</ul>`:''}
 ${q.f&&q.f.length?`<div class="fchips" style="--i:${rest.length+2}">${q.f.map(f=>`<span>${ic('check')}${hl(f,re)}</span>`).join('')}</div>`:''}
 <div class="qfoot" style="--i:${rest.length+3}"><span class="s">${ic('info')}Sumber: ${esc(q.src)}</span>${q.loc&&REG[mapLoc(q.loc)]?`<button class="go" type="button" data-loc="${q.loc}" data-isl="${q.isl}">${ic('arrow')} Lihat di peta</button>`:''}</div></div>`}
function drawQ(openId){const term=qs.value.trim();const re=term?new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'):null;
 const it=QA.map((q,i)=>Object.assign({i:i+1},q)).filter(q=>(qisl==='all'||q.isl===qisl||(qisl!=='U'&&q.isl==='U'))&&(qc==='all'||q.c===qc)&&(!re||(re.lastIndex=0,re.test([q.q,q.a,(q.f||[]).join(' '),q.src].join(' ')))));
 $('#qn').textContent=it.length+' dari 100 pertanyaan';
 const IT={B:['b','Bintan'],K:['k','Karimun'],U:['u','Umum']};
 ql.innerHTML=it.length?it.map(q=>`<details class="qi" id="q${q.i}" ${openId===q.i||(re&&it.length<=5)?'open':''}><summary><span class="qic" style="--cc:${CATC[q.c]}">${ic(CAT[q.c][1])}<em>${String(q.i).padStart(2,'0')}</em></span><span class="q">${hl(q.q,re)}<span class="sub2"><i class="idot ${IT[q.isl][0]}"></i>${IT[q.isl][1]} · ${esc(CAT[q.c][0])}</span></span><span class="tags"><span class="tg ${q.conf==='V'?'d':'a'}">${ic(q.conf==='V'?'check':'bulb')}${q.conf==='V'?'Data':'Analisis'}</span><span class="chev">${ic('arrow')}</span></span></summary>
  ${qBody(q,re)}</details>`).join(''):`<div class="none">Tidak ada yang cocok dengan "${esc(term)}". Coba kata lain, misalnya "kabel", "PLTMG", atau "tarif".</div>`;
 if(openId){const el=document.getElementById('q'+openId);if(el)el.scrollIntoView({block:'center'})}}
function mapLoc(l){return ({bin:'sys_b',kar:'sys_k',batam:'sys_bt',inc1:'inc1',corr:'ce',karint:'karint',isbb:'isbb',tsauh:'tsauh',gb:'gb',lagoi:'lagoi',belat:'belat'})[l]||l}
qs.addEventListener('input',()=>drawQ());
ql.addEventListener('toggle',e=>{const d=e.target;if(d.open&&d.classList.contains('qi'))countUp(d.querySelector('.kst')||d)},true);
$('#qcats').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;qc=b.dataset.c;drawCats();drawQ()});
$('#qfil').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;qisl=b.dataset.i;drawFil();drawCats();drawQ()});
ql.addEventListener('click',e=>{const b=e.target.closest('[data-loc]');if(!b)return;const id=mapLoc(b.dataset.loc),r=REG[id];closeQA();
 const target=['karint','sys_k','belat','inc2'].includes(id)||b.dataset.isl==='K'?'karimun':'bintan';if(isl!==target)open(target,'ring');
 setLayer(r.k,true);setTimeout(()=>{map.flyTo(r.ll,['isbb','karint'].includes(id)?8.5:10.5,{duration:.7});setTimeout(()=>{if(r.pop)r.pop();else if(r.l.openPopup)r.l.openPopup();else r.l.eachLayer&&r.l.eachLayer(x=>x.getPopup&&x.getPopup()&&x.openPopup())},800)},300)});
function openQA(){qisl=isl==='bintan'?'B':isl==='karimun'?'K':'all';drawFil();drawCats();qa.hidden=false;drawQ();setTimeout(()=>qs.focus(),50)}
function closeQA(){qa.hidden=true;$('#qaOpen').focus()}
$('#qaOpen').onclick=openQA;$('#qaClose').onclick=closeQA;
qa.addEventListener('click',e=>{if(e.target===qa)closeQA()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!qa.hidden)closeQA();else if(e.key==='/'&&qa.hidden&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();openQA()}});

snapGroups();
/* boot */
const h=(location.hash||'').slice(1).split('-');
if(ISL[h[0]])open(h[0],ISL[h[0]].T[h[1]]?h[1]:'ring');else home();
setTimeout(()=>{map.invalidateSize();if(isl)fitIsl()},250);
window.addEventListener('resize',()=>map.invalidateSize());
})();
</script>
